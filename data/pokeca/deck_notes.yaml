# 環境デッキの読み方。
#
# 採用率・打点・事故率などの数字は自動で計算されるので、ここには書かない。
# ここに書くのは、数字からは出てこない「なぜ」だけ。
#
# 書き方の約束:
#
#   文体
#     - ですます調でそろえる。子どもが読んで自然な日本語にする
#     - 体言止めを続けない。「ここが本質。」ではなく「ここが本質です。」
#     - 「〜と読んだ」「教わった」「〜らしい」は書かない。
#       誰かから聞いた話として書くと、読む側には意味がない。分かったことだけ書く
#     - 専門用語は避ける。「非対称」ではなく「割に合う」
#
#   数字の書き方 (ここが混ざると読めなくなる)
#     - HPは必ず「HP320」と書く。数字だけにしない
#     - ワザのダメージは必ず「200ダメージ」と書く
#     - ダメカンは「ダメカン6個」。ダメージに直すときは「ダメカン6個(60ダメージ)」
#     - サイドは「サイド2枚」
#
#   中身
#     - 実際のカードテキストと採用率から言えることだけ書く
#     - Markdown は使えない。強調したいときは言葉の順番で強調する
#     - 「強い」で終わらせない。何がどう強いのかを書く
#     - 弱点も必ず書く。良いことしか書いていない解説は役に立たない
#     - 環境は動く。古くなったら直す

updated: "2026-08-13"
based_on: "直近1週 333件 / 中身つき3673デッキ"

decks:
  ドラパルトex:
    結論: >
      倒されない体と、殴らずに削る手段が、ひとつのデッキに入っています。
      強いカードが1枚あるのではなく、組み合わせ方が強いデッキです。
    節:
      - 見出し: まず、倒されない
        引用: "ドラパルトex   HP320   竜タイプ   弱点なし   にげる1"
        本文:
          - ポケモン1097枚のうち、弱点が無いのは64枚だけです。そのうち58枚が竜タイプで、
            ドラパルトexもその1枚です。
          - 弱点があると、そのタイプで攻撃されたときにダメージが2倍になります。
            つまり半分のダメージで倒されてしまいます。
            ドラパルトexにはその抜け道がありません。相手はまともに320ダメージを
            出さないと倒せません。
          - にげるが1なのも大きいです。大きなポケモンは、呼び出されると動けなくなって
            負けることがよくありますが、ドラパルトexはすぐ逃げられます。

      - 見出し: 殴らずに削る
        引用: |
          ファントムダイブ   炎エネルギー1個 + 超エネルギー1個 → 200ダメージ
            ダメカン6個を、相手のベンチポケモンに好きなようにのせる
        本文:
          - ふつうのポケモンは、目の前の1匹を殴るだけです。
            ドラパルトexは殴りながら、まだ出てきていない次の相手にもダメカンを置けます。
          - なぜ強いのか。相手のHPを見ると分かります。
            キチキギスexはHP210、ラティアスexもHP210、タケルライコexはHP240です。
            ここに先にダメカンを置いておけば、次のターンの200ダメージで倒せるようになります。
          - 2ターン後に必要なダメージを、今のターンのうちに先払いしているわけです。
            相手は、準備しているだけのベンチポケモンが勝手に減っていきます。

      - 見出し: ダメカンの置き方が自由
        本文:
          - ここがこのデッキで一番おもしろいところです。
            ダメカン6個は、1匹にまとめて置く必要がありません。
            1匹目に1個、2匹目に2個、3匹目に3個、というように配れます。
          - よく使うのは、相手のHPをちょうど200にする置き方です。
            キチキギスexやラティアスexのようなHP210のポケモンにダメカンを1個だけ置くと、
            残りHPが200になります。次のターンにボスの指令で呼び出せば、
            ファントムダイブの200ダメージでちょうど倒しきれます。
            ベンチに置いたぶんと合わせて、1ターンで2匹倒せることもあります。
          - 残りHPを130にする置き方もあります。残りHP130なら
            ヨノワールのカースドボム(ダメカン13個)がちょうど届くので、
            殴らずに倒せる状態になります。
          - メガゲッコウガexも特性でダメカン6個を置けますが、あちらは1匹にまとめてです。
            自由に配れるドラパルトexのほうが、ダメージを細かく調整できます。
          - ポケモンカードのHPとダメージは、とても細かく決められています。
            HP330とHP340では、ドラパルトexが多い今の環境では大違いです。
            HP330なら倒せて、HP340なら倒せない、ということが起きるからです。
            新しいカードのHPが10ちがうだけで、環境での立ち位置が変わります。

      - 見出し: ダメージとダメカンは、別のもの
        引用: |
          シェイミ 【はなのカーテン】自分のベンチポケモン(ルールを持つポケモンをのぞく)全員は、
                                  相手のワザのダメージを受けない
          ロック闘エネルギー  つけているポケモンは、相手のポケモンが使うワザの効果を受けない
        本文:
          - ポケモンカードでは、この2つをはっきり分けて考えます。
            ワザで与えるのが「ダメージ」、あとから置くのが「ダメカン」です。
            ダメカンを置くのは、ワザや特性の「効果」のあつかいになります。
          - だからシェイミがいても、ファントムダイブのダメカンは置けます。
            シェイミが防ぐのはダメージのほうだけだからです。
          - 逆にロック闘エネルギーをつけたポケモンには、ダメカンが置けません。
            こちらはワザの「効果」を受けないカードだからです。ダメージは通ります。
          - カードのテキストに「ダメージ」と書いてあるか「ダメカン」と書いてあるかで、
            通るか通らないかが変わります。読むときに気をつけたいところです。

      - 見出し: ダメカンを置く手段が、ほかにもある
        引用: |
          サマヨール 【カースドボム】自分をきぜつさせて、相手1匹にダメカン5個
          ヨノワール 【カースドボム】自分をきぜつさせて、相手1匹にダメカン13個
          マシマシラ 【アドレナブレイン】自分の場のダメカン3個を、相手にのせ替える
        本文:
          - ダメカンを置く手段が4種類もあります。採用率にも出ていて、
            マシマシラが93%、ヨマワル・サマヨール・ヨノワールが65%です。
          - ヨノワールのダメカン13個(130ダメージ)とファントムダイブのダメカン6個(60ダメージ)を
            合わせると、殴らずに190ダメージぶんを置けます。
            そこにファントムダイブの200ダメージが乗ります。
            HP320のポケモンでも届く計算になります。
          - しかも安く済みます。カースドボムは自分のポケモンがきぜつしますが、
            サマヨールもヨノワールもexではないので、相手に渡すサイドは1枚だけです。
            サイド1枚で130ダメージぶんを置けるので、かなり割に合います。
          - ダメージが無駄になりません。1発で倒しきれなくても、
            余ったぶんはベンチのポケモンに残ります。
            330ダメージ出せるデッキがHP240のポケモンを倒すと90ダメージぶんが消えますが、
            ドラパルトexは消えません。

      - 見出し: サイドの取られ方を決める
        引用: |
          非ルールのポケモン … 倒されると 相手はサイドを1枚とる
          ポケモンex        … サイド2枚
          メガシンカex      … サイド3枚
        本文:
          - 勝つにはサイドを6枚とります。だから「何をどの順で倒して6枚にするか」を
            先に考えます。これをサイドプランといいます。
          - 自分がどう取られるかも同じくらい大事です。exを1匹倒されると2枚、
            メガシンカexなら3枚も進んでしまいます。
            渡すなら、なるべく安いポケモンで渡したいところです。
          - ドラパルトexはここが上手です。カースドボムで自分からきぜつするサマヨールも
            ヨノワールも非ルールなので、渡すサイドは1枚だけで済みます。

      - 見出し: 「倒す」と「倒される」は別の話
        引用: |
          アンフェアスタンプ  前の相手の番に「自分の」ポケモンがきぜつしていないと使えない
          キチキギスex 【さかてにとる】「自分の」ポケモンがきぜつしていたら、山札を3枚引く
        本文:
          - どちらも「自分のポケモンが倒されたとき」に使えるカードです。
            相手を倒したかどうかは関係ありません。ここを読み違えると分からなくなります。
          - つまり、話が2つあります。
          - ひとつめ。相手を倒すと、相手のこれらが使えるようになってしまいます。
            だから、わざと倒さずに残しておくと、相手は立て直せません。
            ダメカンだけ置いておいて、終わりのほうでまとめて倒す、という戦い方ができます。
          - ふたつめ。自分が倒されると、自分のこれらが使えます。
            ドラパルトexは、スボミーを安く差し出すことで、これを自分から起こしています。
          - 採用率にはっきり出ています。アンフェアスタンプが81%、キチキギスexが98%です。
            倒されることを前提に組まれています。

      - 見出し: スボミーは、わざと倒させるカード
        引用: |
          スボミー   HP30   草タイプ   にげる0
          むずむずかふん   エネルギー0個 → 10ダメージ
            次の相手の番、相手は手札からグッズを出して使えない
        本文:
          - スボミーはHP30しかないので、前に出せばまず倒されます。
            でもそれでいいのです。倒されると、いいことが4つ同時に起きます。
          - 相手に渡すサイドは1枚だけです。exを渡すより安く済みます。
          - むずむずかふんの10ダメージが相手に残ります。これが後で効いてきます。
            ファントムダイブの200ダメージとカースドボムの130ダメージを足すと330ダメージで、
            ここが上限です。でも10ダメージを1回入れておけば340ダメージ、
            2回なら350ダメージになります。HP350のメガゲッコウガexにも届くようになります。
          - グッズを止めるので、相手を1ターン遅らせられます。
          - そして自分のポケモンが倒されたので、アンフェアスタンプが使えるようになります。
          - 倒されたあとも、夜のタンカでトラッシュから拾い直して、もう一度前に出せます。
            同じことを何度も繰り返せます。

      - 見出し: 攻撃する直前まで、ドロンチのままでいる
        本文:
          - このデッキは、すぐにドラパルトexへ進化しません。
            攻撃するターンになって、はじめて進化します。
          - ドロンチの【ていさつしれい】を使い続けたいからです。
            ベンチにドロンチを何匹も並べて、毎ターン手札を増やしながら準備します。
            進化してしまうと、その1匹はもう山札を見てくれません。
          - エネルギーも、1匹に集めずに何匹かのドロンチに分けてつけます。
            エネルギーが2個ついたドロンチをボスの指令で呼ばれて倒されると、
            エネルギーの進みぐあいが大きく遅れてしまうからです。
          - だから相手も、エネルギーのついたドロンチをねらってきます。
            倒せば【ていさつしれい】も止まり、エネルギーも遅れます。
            ここがこのデッキとの戦いの中心になります。
          - 相手がダメカンをばら撒くデッキのときは別です。
            HP90のドロンチでは耐えられないので、先に進化することもあります。

      - 見出し: サイドは、わざと先に取らせる
        本文:
          - サポートは1ターンに1枚しか使えません。
            エネルギーが足りなくてアカマツを使うと、そのターンはボスの指令が使えず、
            ただ殴るだけになってしまいます。
          - だから序盤は無理をしません。スボミーで相手を遅らせながら、
            ベンチにドロンチを並べて、余裕があるときにマシマシラやサマヨールを育てます。
          - このあいだ、サイドはかなり先に取られます。でもそれでいいのです。
            ドラパルトexは1ターンに何匹も倒せるので、後から一気にひっくり返せます。
            最初から逆転するつもりで組まれているデッキです。

      - 見出し: 2進化なのに、事故りにくい
        引用: |
          ドラメシヤ4枚(100%)   ドロンチ4枚(100%)   ポケパッド4枚(100%)
          リーリエの決心4枚(100%)   ふしぎなアメ(81%)
        本文:
          - 2進化のデッキは「進化が間に合わない」のが弱点ですが、
            それを消すカードが確定枠に並んでいます。
          - とくにドロンチです。【ていさつしれい】は自分の番に1回、山札の上2枚を見て
            1枚を手札に加えられます。
            ふつう1進化は「2進化になるまでの通り道」でしかありませんが、
            ドロンチは場にいるだけで毎ターン手札が増えます。
            1進化そのものがエンジンになっているところが、ほかの2進化デッキと違います。
          - ポケパッドもよく合っています。「ルールを持たないポケモン」しか持ってこられませんが、
            このデッキのドラメシヤもヨマワルもマシマシラも全部その条件を満たします。
            制限が制限になっていません。
          - エネルギーも軽いです。HP320のポケモンが、エネルギー2個で
            200ダメージ+ダメカン6個を出します。炎と超の2色が必要ですが、
            アカマツ1枚でその両方が用意できます。

    まとめ:
      - 倒されない ── HP320・弱点なし・にげる1
      - 削る手段が多い ── 200ダメージ + ダメカン6個 + カースドボム + のせ替え
      - 先回りできる ── 次のターンに倒すための準備を、今のターンにできる
      - サイドが安い ── 自分から倒れるのは非ルール。渡すのはサイド1枚
      - 事故りにくい ── ふしぎなアメ・ていさつしれい・ポケパッド・リーリエの決心
    しめ: >
      硬いから強いのでも、ダメージが大きいから強いのでもありません。
      硬さと先回りが同時にできるので、相手は「今の1匹を守ること」と
      「次の1匹を守ること」を一度に考えなければならなくなります。
      それが一番使われている理由です。

    弱点:
      - スボミーを98%も入れているのは、グッズを止められると困るデッキが
        それだけ多いということです。裏を返せば、ドラパルトex自身も
        ふしぎなアメやボールに強く頼っています。同じことをやり返されると苦しくなります。
      - ヨマワルはHP60、サマヨールはHP90しかありません。
        カースドボムを準備しているあいだは弱いので、ベンチをねらわれると計画が崩れます。
      - ドロンチは手札を増やす役と、エネルギーの置き場という2つの役をしています。
        エネルギーのついたドロンチをボスの指令で倒されると、
        【ていさつしれい】も止まり、エネルギーも遅れます。2つ同時に痛いです。
      - サポートは1ターンに1枚だけです。アカマツを使ったターンはボスの指令が使えず、
        ダメカンを置きたいところに置けません。
      - 事故率は低くありません。337件の平均で20.1%です。
        たねポケモンが8枚の構築だと34.6%になります。5回に1回は最初でつまずきます。
      - 弱点が無いことをひっくり返すカードが出てきています。
        リーリエのピッピexの【フェアリーゾーン】は、相手の場の竜ポケモン全員の弱点を
        超タイプにしてしまいます。ドラパルトexは竜タイプなので、弱点 超×2 になり、
        ダダリンの170ダメージが340ダメージになってHP320が一撃で倒れます。
        効くのは竜タイプだけなので、これはドラパルトexとタケルライコexを
        名指しで止めにきているカードです。
        こういうふうに、あるデッキを止めるために作られたカードをメタカードと呼びます。

    対面:
      - ベンチを広げすぎないようにします。ダメカンを置く先が減ると、
        ファントムダイブの値打ちが下がります。
      - HP210くらいのポケモンをベンチに並べると、ダメカンを1個置かれて残りHP200にされ、
        次のターンにまとめて倒されます。
      - スボミーなどでグッズを止めると、ふしぎなアメが使えなくなって育ちません。
      - エネルギーのついたドロンチをボスの指令で呼んで倒すのが一番効きます。
        【ていさつしれい】が止まり、エネルギーも遅れ、
        相手はアカマツなどエネルギーを増やすサポートしか使えなくなります。
      - ロック闘エネルギーをつけたポケモンは、相手のワザの効果を受けません。
        ファントムダイブでダメカンを置くのはワザの「効果」なので、
        そのポケモンにはダメカンが置けなくなります。
      - サイドを先に取れても油断できません。ドラパルトexは1ターンに何匹も倒せるので、
        最後にまとめて返されます。3枚差でも安心してはいけません。

  メガレックウザex:
    結論: >
      入れたエネルギーが、1枚残らずダメージになります。
      エネルギーが攻撃のための材料ではなく、ダメージそのものになっている珍しいデッキです。
    節:
      - 見出し: ダメージの正体
        引用: |
          メガレックウザex   HP280   たねポケモン   無タイプ   弱点 雷×2   にげる2

          【はしゃのほうこう】手札からベンチに出したとき、山札の上4枚を見て、
                             基本エネルギーを1枚このポケモンにつける
          ストームエメラルダ   エネルギー3個 (炎・雷・無)
            → 自分のポケモン全員についているエネルギーの数 × 50ダメージ
        本文:
          - 「全員」というところが全てです。攻撃するポケモンについている必要がありません。
            ベンチのどこに置いたエネルギーでも、タイプが何であっても、ダメージになります。
          - だからエネルギーを17.5枚も入れます。ドラパルトexは8.2枚で、
            ふつうのデッキは8〜12枚くらいです。この数字だけでデッキの性格が分かります。
          - ゼロの大空洞を74%が入れてベンチを8匹にするのも、
            エネルギーを置く場所を増やすためです。
            ヒビキのホウオウexが手札からエネルギー2枚を置けるのも、
            置いた先がどこであってもダメージになるからです。
          - そしてたねポケモンなので、2進化のドラパルトexが立つ前から攻撃できます。
            事故率も14.5%で、ドラパルトexの20.1%より低いです。

      - 見出し: ダメージが階段になっている
        引用: |
          エネルギー4個 → 200ダメージ   何も倒せない (キチキギスexのHP210に10足りない)
          エネルギー5個 → 250ダメージ   HP210〜240を一撃
          エネルギー6個 → 300ダメージ   HP280までを一撃
          エネルギー7個 → 350ダメージ   今の環境のアタッカーを全部一撃
        本文:
          - エネルギー7個が完成形です。ここまで来ると、
            今の環境で一撃で倒せない相手がいなくなります。
          - 逆にエネルギー4個以下では、何も倒せません。
            この立ち上がりの空白が、このデッキの弱いところです。
          - ダメージが50ずつしか上がらないのも大事な性質です。
            250ダメージでHP210のポケモンを倒すと、40ダメージぶんが消えてしまいます。
            ドラパルトexのように、余ったぶんをベンチに回すことができません。
            無駄が出るのは、このデッキの仕組み上どうしようもありません。
          - そのかわり上限がありません。HP320〜350を一撃で倒せるのは、
            今のところこのデッキだけです。
            効率は悪いけれど、届く高さと速さで押し切る形です。

      - 見出し: 心配なのは、最初の1回目の攻撃
        本文:
          - 序盤の攻撃が、特性【はしゃのほうこう】が当たるかどうかで決まります。
            山札の上4枚を見て基本エネルギーを探すので、外れることがあります。
            外したときの出遅れが痛いです。
          - 中盤から後はヒビキのホウオウexでエネルギーがどんどん増えるので、
            ダメージに困ることはなくなります。
            つまりこのデッキの心配は、最初の1回に集まっています。
          - だから、最初の攻撃をメガレックウザexに任せず、
            ファイアローex(82%が採用)から始める形のほうが安定します。
            【エキサイトダイブ】で手札からそのままベンチに出られて、
            エネルギー2個で150ダメージを出しながら山札から2枚持ってこられます。

      - 見出し: エネルギーが減ると、弱くなる
        引用: "エネルギーつけかえ 91%(平均3.4枚)   ガラスのラッパ 74%"
        本文:
          - ふつうのデッキは、ポケモンを倒されてもエネルギーさえ残っていれば戦えます。
            このデッキは違います。エネルギーのついたポケモンを倒されると、
            そのぶんダメージが50ずつ落ちていきます。
          - エネルギーつけかえは、倒されそうなポケモンからエネルギーを逃がすカードです。
            ガラスのラッパはトラッシュから拾い直すカードです。
            どちらもこの穴をふさぐために入っています。
            採用率がこれだけ高いのは、それだけ困るということです。

    まとめ:
      - 速い ── たねポケモン。事故率14.5%
      - 上限が高い ── エネルギー7個で350ダメージ。全アタッカーが射程内
      - 無駄は出る ── 50ずつしか上がらず、余りをベンチに回せない
      - 減ると弱る ── エネルギーを失うたびにダメージが50下がる
    しめ: >
      ドラパルトexが無駄なく削るデッキだとすれば、こちらは一気に届かせるデッキです。
      正反対の作りの2つが、同じ環境の上位に並んでいます。

    弱点:
      - ベンチを広げるほど、ドラパルトexにダメカンを置かれる相手が増えます。
        ラティアスexがHP210、キチキギスexがHP210、テラパゴスexがHP230、
        ヒビキのホウオウexがHP230です。この帯のexが横に並ぶ形は、
        ファントムダイブとカースドボムが一番効く形でもあります。
        強くするための行動が、そのまま弱点を広げてしまっています。
      - グッズに頼りすぎています。ハイパーボールが98%(平均3.9枚)、
        ぼうけんのランタンが93%、エネルギーつけかえが91%、ガラスのラッパが74%です。
        それなのにスボミーは入っていません。ドラパルトexは98%入れています。
      - 弱点は 雷×2 です。今のところ罰されていません。
        雷タイプのアタッカーはメガライボルトex(HP330)やメガシビルドンex(HP350)が
        いますが、どちらも上位のデッキに入っていません。眠っている弱点です。
        環境が雷に傾くと、140ダメージで倒れるようになります。
      - HP280は、今のメガシンカの中ではやや低いです。
        メガルカリオexがHP340、メガゲッコウガexがHP350、メガガルーラexがHP300です。
      - メガシンカexは倒されるとサイドを3枚も渡します。
        だから「展開に使った非ルールで1枚、exで2枚、最後にメガレックウザexで3枚」
        という順で、ちょうど6枚取られてしまいます。
        事故を許せる余裕が、ほかのデッキより1ターン短いということです。

    対面:
      - エネルギーのついたベンチをねらいます。1匹倒すごとに、相手のダメージが50下がります。
      - グッズを止めるのがよく効きます。相手はスボミーを入れていません。
      - 弱点は、攻撃するポケモンのタイプで決まります。
        メガレックウザexは無タイプなので、雷エネルギーを使っていても
        同じメガレックウザex同士で弱点2倍にはなりません。突けるのは雷タイプだけです。

  メガルカリオex:
    結論: >
      殴りながら、次のエネルギーを並べます。攻撃と準備が1つのワザにまとまっています。
    節:
      - 見出し: 2つのワザを交互に使う
        引用: |
          メガルカリオex   HP340   闘タイプ   弱点 超×2

          はどうづき   闘エネルギー1個 → 130ダメージ
            自分のトラッシュから基本エネルギーを3枚まで選び、ベンチに好きなようにつける
          メガブレイブ 闘エネルギー2個 → 270ダメージ
            次の自分の番、このポケモンはメガブレイブが使えない
        本文:
          - メガブレイブは270ダメージ出ますが、続けて撃てません。
            だから、はどうづきと交互に使う形になります。
          - そのはどうづきが優秀です。130ダメージを出しながら、
            トラッシュから基本エネルギー3枚をベンチに配れます。
            攻撃するターンが、そのまま次の準備のターンになっています。
          - パワープロテインを100%が入れています。その番の闘ポケモンのダメージが
            30増えるので、270ダメージが300ダメージになります。
            130ダメージのほうも160ダメージになります。

      - 見出し: 引くしくみが独特
        引用: |
          ルナトーン 【ルナサイクル】場にソルロックがいて、手札から基本エネルギーを
                                   1枚トラッシュするなら、山札を3枚引く
          ソルロック   コスモビーム 闘エネルギー1個 → 70ダメージ
                     ベンチにルナトーンがいないと失敗。弱点・抵抗力を計算しない
        本文:
          - ソルロックを99%が入れています。ルナトーンと2匹そろえると、
            手札のエネルギーを捨てて3枚引けるようになります。
          - 捨てたエネルギーは無駄になりません。はどうづきがトラッシュから拾ってくるからです。
            引くために捨てることと、エネルギーを増やすことがつながっています。
          - ファイトゴングを100%が入れています。闘タイプのたねポケモンか
            基本闘エネルギーを持ってこられるので、リオルもソルロックもルナトーンも
            この1枚で届きます。

    まとめ:
      - HP340は今の環境で最大級
      - 殴りながらエネルギーを並べられる
      - 引くしくみとエネルギーの流れがつながっている
      - 序盤から大きなダメージを出せる
    しめ: >
      派手ではありませんが、攻撃と準備と手札の補充が、たがいに支え合っています。
      1〜2か月前は4.4%でしたが、直近1週では7.5%まで増えています。
      序盤から大きなダメージを出せるので、立ち上がりの遅いデッキには
      先にサイドを取って押し切れます。

    弱点:
      - メガブレイブを撃った次の番は270ダメージが出せません。相手にとってはそこが攻め時です。
      - 弱点は 超×2 です。170ダメージで倒れます。HP340が実質170になってしまいます。
      - リオル(HP70)から育てる必要があります。育つ前をねらわれると遅れます。
      - メガシンカexなので、倒されるとサイドを3枚渡します。1匹で試合が決まりかねません。

    対面:
      - 超タイプで攻撃できるなら、HP340も170ダメージで倒せます。ここが一番はっきりした答えです。
      - メガブレイブを撃たれた次のターンに攻め返します。
      - リオル(HP70)のうちに倒せると、そもそも育ちません。
      - サイドを3枚渡すメガルカリオexは最後に残しておいて、
        先に非ルールとexで3枚取っておくと、一気に決められます。

  タケルライコex:
    結論: >
      エネルギーを捨てた枚数だけダメージが出ます。上限がないかわりに、
      毎ターン並べ直さなければなりません。
    節:
      - 見出し: 捨てるほど強い
        引用: |
          タケルライコex   HP240   竜タイプ   弱点なし

          きょくらいごう   エネルギー2個 (雷・闘) → 70ダメージ ×
            自分の場のポケモンについている基本エネルギーを好きなだけトラッシュし、
            その枚数 × 70ダメージ
          はじけるほうこう エネルギー1個 → 手札を全部トラッシュして、山札を6枚引く
        本文:
          - 3枚捨てれば210ダメージ、4枚で280ダメージ、5枚で350ダメージになります。
            上限がありません。
          - 竜タイプなので弱点がありません。HP240は特別高くありませんが、
            半分のダメージで倒される抜け道がないぶん、思ったより硬く感じます。
          - はじけるほうこうも独特です。手札を全部捨てて6枚引き直せるので、
            事故ったときの立て直しが強いです。

      - 見出し: エネルギーを補い続ける
        引用: |
          オーガポン みどりのめんex   HP210   草タイプ   弱点 炎×2
          【みどりのまい】自分の番に1回、手札から基本エネルギーを1枚このポケモンにつけて、
                        山札を1枚引く
        本文:
          - 99%が入れています。毎ターン、手札からエネルギーを1枚つけて1枚引けるので、
            捨てたぶんを補い続けられます。
          - アカマツも100%が入っています。ちがうタイプの基本エネルギー2枚を持ってきて、
            1枚を場につけられます。雷・闘・草の3色が必要ですが、この2枚で回っています。
          - ラティアスexを95%が入れています。たねポケモンのにげるが0になるので、
            攻撃する相手を選びやすくなります。

    まとめ:
      - 上限がない ── 5枚捨てて350ダメージ
      - 弱点がない ── 半分のダメージで倒される抜け道がない
      - 事故に強い ── 手札を全部捨てて引き直せる
    しめ: >
      1〜2か月前は2.8%でしたが、直近1週では7.2%まで増えています。
      上限の高さと事故への強さが、メガレックウザexの登場で速くなった環境に
      合ってきたのだと思います。

    弱点:
      - 大きく殴った次の番は、捨てたぶん場のエネルギーが減っています。ダメージが落ちます。
      - 毎ターン並べ直す必要があるので、エネルギーを引けないと止まります。
      - オーガポン みどりのめんexの弱点は 炎×2 です。
        エンジン役をここで折られると回らなくなります。
      - 非ルールのポケモンで攻撃してくる相手に弱いです。
        1ターンに1匹しか倒せないので、相手が非ルールばかりだと
        サイド6枚とるのに6ターンかかります。
        一方こちらのexは倒されるとサイド2枚渡すので、相手は3ターンで終わります。
        殴り合った回数は同じなのに、進み方が倍ちがいます。

    対面:
      - 大きく殴られた次のターンが攻め時です。相手のダメージが一番低い瞬間です。
      - オーガポン みどりのめんexを先に倒すと、エネルギーの補充が止まります。

  メガゲッコウガex:
    結論: >
      HP350の体と、毎ターン置けるダメカン6個。硬さとダメカンを両方持っています。
    節:
      - 見出し: 特性が本体
        引用: |
          メガゲッコウガex   HP350   水タイプ   弱点 雷×2   にげる1

          【ひっさつしゅりけん】バトル場にいて、手札から基本水エネルギーを1枚
                              トラッシュするなら、自分の番に1回使える。
                              相手のポケモン1匹に、ダメカンを6個のせる
          ニンジャスピナー   水エネルギー2個 → 120ダメージ
            のぞむなら、ついている水エネルギーを1個手札にもどして、80ダメージ追加
        本文:
          - 【ひっさつしゅりけん】が強力です。手札の水エネルギー1枚と引き換えに、
            毎ターン相手のどこかにダメカン6個(60ダメージ)を置けます。
            ワザとは別に使えるところが大きいです。
          - つまりドラパルトexと同じように、殴らずに削ることができます。
            しかもHP350は今の環境で一番高いHPです。
          - ニンジャスピナーは120ダメージですが、エネルギーを1個手札に戻せば
            200ダメージになります。戻したエネルギーは、
            次の【ひっさつしゅりけん】の燃料に回せます。
          - ただしダメカン6個は1匹にまとめて置きます。
            ドラパルトexのように何匹かに配ることはできません。
            そのぶん細かい調整はできません。

      - 見出し: もう1枚のアタッカー
        引用: |
          ゲッコウガex   HP310   闘タイプ   弱点 超×2
          しのびのやいば   水エネルギー1個 → 170ダメージ
            山札から好きなカードを1枚手札に加える
          ぶんしんれんだ   エネルギー3個 → エネルギー2個をトラッシュし、
                                        相手のポケモン2匹に それぞれ120ダメージ
        本文:
          - ぶんしんれんだは相手2匹に120ダメージずつ与えます。1ターンで2匹を削れます。
            【ひっさつしゅりけん】のダメカン6個(60ダメージ)を足せば180ダメージになり、
            HP170くらいまで届きます。
          - しのびのやいばは170ダメージを出しながら、山札から好きなカードを1枚
            持ってこられます。エネルギー1個でこれは軽いです。

      - 見出し: 相手を倒さずに残す
        引用: |
          スペシャルレッドカード  相手のサイドが3枚以下のとき、
                                相手の手札を山札の下にもどして3枚引かせる
          アンフェアスタンプ    前の相手の番に「自分の」ポケモンがきぜつしていないと使えない
        本文:
          - ワザを120ダメージと200ダメージから選べて、特性でダメカン6個を自由な場所に
            置けます。だから「あと少しで倒せるHP」で相手を残すことができます。
          - なぜそれがいいのか。アンフェアスタンプもキチキギスexの【さかてにとる】も、
            「自分のポケモンが倒されたとき」に使えるカードです。
            こちらが相手を倒さなければ、相手はそれを使えません。
          - ダメカンだけ置いて残しておき、終わりのほうでまとめて倒します。
            相手は立て直す時間がありません。
          - このデッキ自身は、アンフェアスタンプをほとんど入れていません(1%)。
            HP350で自分が倒されないので、使う場面が来ないからです。
            ドラパルトexが81%も入れているのは、スボミーがわざと倒されるデッキだからです。
            同じカードでも、デッキの戦い方によって入るか入らないかが変わります。

      - 見出し: それでも、ドラパルトexほど使われていない
        本文:
          - 書いてあることは強いのに、直近1週で3.6%です。ドラパルトexの14.7%には遠いです。
            理由は3つあります。
          - ひとつめ。エネルギーが重いです。特性を使うために毎ターン水エネルギーを
            1枚捨て続ける必要があり、ワザにも2個要ります。
          - ふたつめ。1進化が手札を増やしてくれません。
            ドラパルトexのドロンチは場にいるだけで毎ターン手札が増えますが、
            ゲコガシラにはそれがありません。
          - みっつめ。だから別に手札を増やすポケモンを入れる必要があります。
            でもボスの指令もミツルの思いやりも毎ターン使いたいので、
            ベンチもデッキの枠も足りません。
          - つまり、メガゲッコウガexの器用な動きを支えるカードが、
            今のカードプールに足りていません。
            カード1枚が強いことと、デッキとして組めることは別だという分かりやすい例です。

    まとめ:
      - 今の環境で一番高いHP350
      - 毎ターンダメカン6個を置ける。倒さずに残す戦い方ができる
      - 2匹同時に攻撃するワザもある
      - ただし支えるカードが足りず、組むのが難しい
    しめ: >
      ドラパルトexに近い戦い方を、もっと高いHPでやろうとしているデッキです。
      カード自体は強いのですが、それを支える周りのカードがそろっていません。
      強いカードが必ず強いデッキになるとはかぎらない、という例です。

    弱点:
      - ケロマツはHP60、ゲコガシラはHP90しかありません。育つ前がとても弱いです。
        ふしぎなアメを100%、なかよしポフィンを94%入れているのは、そこを急ぐためです。
      - 弱点が2種類あります。メガゲッコウガexは 雷×2、ゲッコウガexは 超×2 です。
        1つのデッキなのに、2方向から刺されます。
      - ふしぎなアメに頼りきりです。グッズを止められると育ちません。
      - 速いデッキに弱いです。メガルカリオexやタケルライコexに序盤サイドを詰められると、
        あとからメガゲッコウガexで攻撃を始めても間に合いません。
        特性はターンを重ねてこそ効くので、急かされる展開が一番苦しいです。
      - メガシンカexは倒されるとサイドを3枚渡します。
        序盤に展開で出したニャースexやキチキギスexで1枚と2枚、
        最後にメガゲッコウガexで3枚、という順で取り切られて終わります。
      - シェイミの【はなのカーテン】がいると、ベンチの非ルールポケモンは
        ワザのダメージを受けなくなります。ぶんしんれんだが通らなくなります。
        ただし【ひっさつしゅりけん】のダメカンは置けます。
        ダメージとダメカンは別のものだからです。

    対面:
      - ケロマツ・ゲコガシラのうちに倒します。育ってからでは硬いです。
      - グッズを止めるのが効きます。
      - 雷でも超でも、どちらかの弱点は必ず突けます。
      - シェイミをベンチに置いておくと、ぶんしんれんだで非ルールを2匹持っていかれずに済みます。

  マリィのオーロンゲex:
    結論: >
      進化した瞬間にエネルギーが5枚並びます。準備に何ターンもかけません。
    節:
      - 見出し: 1回で場が完成する
        引用: |
          マリィのオーロンゲex   HP320   悪タイプ   弱点 草×2

          【パンクアップ】手札から出して進化させたとき、山札から基本エネルギーを
                        5枚まで選び、自分のマリィのポケモンに好きなようにつける
          シャドーバレット   悪エネルギー2個 → 180ダメージ
            相手のベンチポケモン1匹にも、30ダメージ
        本文:
          - 【パンクアップ】が破格です。進化した瞬間に、山札からエネルギー5枚が場に並びます。
            ふつうは1ターンに1枚しかつけられないので、5ターンぶんを1回で飛ばしています。
          - シャドーバレットは180ダメージに加えて、ベンチにも30ダメージ入ります。
            ドラパルトexほどではありませんが、ダメージが無駄になりにくい形です。
          - スパイクタウンジムを100%が入れています。毎ターン、山札からマリィのポケモンを
            1枚手札に加えられるので、ボールを入れる枚数を減らせます。
            その空いた枠をほかのカードに使えます。

      - 見出し: 本当の主役はユキメノコとマシマシラ
        引用: |
          ユキメノコ 【いてつくとばり】このポケモンがいるかぎり、ポケモンチェックのたび、
                                    おたがいの特性を持つポケモン全員 (ユキメノコをのぞく) に
                                    ダメカンを1個ずつのせる
          マシマシラ 【アドレナブレイン】自分の場のダメカン3個までを、相手の場にのせ替える
        本文:
          - ユキメノコを89%、マシマシラを100%が入れています。この2匹がそろうと、
            おもしろいことが起きます。
          - 【いてつくとばり】は「おたがいの」場にダメカンを置きます。自分の場にも乗ります。
            ふつうなら損なだけですが、その自分側のダメカンをマシマシラが相手にのせ替えます。
            自分でダメカンを作って、相手に押しつける流れになります。
          - つまり、殴らずにダメージを作り、殴らずに相手へ運びます。
            ドラパルトexとはちがうやり方で、同じ「ばら撒いて削る」をしています。
          - これを支えているのが悪エネルギーです。【パンクアップ】で一気に並ぶうえ、
            マシマシラの【アドレナブレイン】はエネルギーがついていないと使えない特性なので、
            余った悪エネルギーをそのままマシマシラに回せます。無理なくかみ合っています。

    まとめ:
      - 準備が1回で終わる ── パンクアップでエネルギー5枚
      - 殴らずに削る ── ユキメノコで作って、マシマシラで押しつける
      - 枠が空く ── スパイクタウンジムでボールを減らせる
      - 弱点 草×2 ── 160ダメージで倒れる
    しめ: >
      速さでは環境でも上のほうです。ただし草タイプに弱いことがはっきりしているので、
      環境に草が増えると一気に苦しくなります。強さが環境に左右されるデッキです。

    弱点:
      - 弱点は 草×2 です。160ダメージで倒れます。
      - 【パンクアップ】は「進化したとき」の1回だけです。
        進化させる前に止められると、エネルギーが並びません。
      - マリィのベロバーはHP70しかありません。先に倒されると進化先がなくなります。
      - キチキギスexの採用率は7%しかありません。ドラパルトexは98%です。
        ベンチが5枠しかなく、マシマシラ2匹・ユキメノコ2匹・次のアタッカーのベロバーで
        埋まってしまうので、入れる場所がありません。
      - しかもユキメノコのダメカンは自分の場にも乗ります。
        マシマシラで相手に返せる量にはかぎりがあるので、
        キチキギスexにダメカンがたまると、ボスの指令で呼ばれてサイドを2枚持っていかれます。
        枠が空いていても入れにくいカードです。
      - ユキメノコが出てこないと、そもそもダメージが足りません。
        2匹のうち片方が欠けると、デッキの形が崩れます。

    対面:
      - 進化する前のベロバー(HP70)を倒すのが一番効きます。
      - 草タイプで攻撃できるなら、HP320も160ダメージで倒せます。
      - スパイクタウンジムを別のスタジアムで張り替えると、毎ターンのサーチが止まります。

  ドラパルトex＋バシャーモex:
    結論: >
      ドラパルトexの一番の困りごとだったエネルギーを、バシャーモexが解決した形です。
    節:
      - 見出し: 足りなかったものを足す
        引用: |
          バシャーモex   HP320   炎タイプ   弱点 水×2

          【たぎるとうし】自分の番に1回、自分のトラッシュから基本エネルギーを1枚選び、
                       自分のポケモンにつける
          バーニングソルト   エネルギー2個 (炎・無) → 200ダメージ
            次の自分の番、このポケモンはワザが使えない
        本文:
          - ドラパルトexは、ファントムダイブを打つまでのエネルギーの用意が大変です。
            アカマツを使ったターンはボスの指令が使えず、ダメカンを置きたい場所に置けません。
          - バシャーモexの【たぎるとうし】は、毎ターン、トラッシュからエネルギーを
            1枚つけられます。サポートを使わずにエネルギーが増えるので、
            サポートの枠をボスの指令に回せるようになります。
          - しかもバシャーモex自身がHP320で、200ダメージを出すアタッカーです。
            エネルギーを配る役と、殴る役を1匹で兼ねています。
          - 炎エネルギーはもともとファントムダイブに必要なので、
            炎タイプのバシャーモexとは無理なく同居できます。

      - 見出し: そのかわり弱点が増える
        本文:
          - ドラパルトexは弱点がありません。ここが最大の強みでした。
            ところがバシャーモexは 弱点 水×2 です。160ダメージで倒れます。
          - つまり、弱点で崩される道を自分から作っていることになります。
            水タイプの相手には、バシャーモexだけが狙われます。
          - デッキの枠も食います。バシャーモex用のホゲータを入れるぶん、
            ドロンチやサマヨールに使える枠が減ります。

    まとめ:
      - エネルギーの悩みが消える ── サポートを使わずに毎ターン1枚
      - アタッカーが2匹になる ── HP320が2種類
      - 弱点ができる ── バシャーモexは 水×2
      - 枠が減る ── ホゲータのぶん、ほかのカードが入らない
    しめ: >
      1〜2か月前は9.3%ありましたが、直近2週では5.3%まで減っています。
      素のドラパルトexのほうが11.3%と多く、いまは「エネルギーを足すより、
      弱点なしのまま戦ったほうがよい」と考える人が増えているようです。

    弱点:
      - バシャーモexの 弱点 水×2 が唯一のはっきりした穴です。
      - バーニングソルトは次のターン使えないので、続けて撃てません。
      - ドラパルトexの部分の弱点は、そのまま全部残っています。

    対面:
      - 水タイプで攻撃できるなら、バシャーモexだけをねらいます。
      - バーニングソルトを撃たれた次のターンが攻め時です。
      - ドラパルトex単体のときと同じで、エネルギーのついたドロンチをねらうのが効きます。

  Nのゾロアークex:
    結論: >
      ワザを借りるところが目立ちますが、本当に考えられているのは
      「借りても250ダメージまでしか出ない」という弱点をどう埋めるかです。
      自分から毒になるカードが入っているのは、そのためです。
    節:
      - 見出し: 借りたワザの色は関係ない
        引用: |
          Nのゾロアークex   HP280   悪タイプ   弱点 草×2   にげる2

          【とりひき】自分の番に1回、手札を1枚トラッシュして、山札を2枚引く
          ナイトジョーカー   悪エネルギー2個
            自分のベンチの「Nのポケモン」が持つワザを1つ選び、このワザとして使う
        本文:
          - このデッキのエネルギーを見ると、基本悪エネルギーが平均7.9枚で、
            炎エネルギーも雷エネルギーも1枚も入っていません。
          - ところがNのゼクロムのランページサンダーは炎1個・雷2個・無1個、
            Nのレシラムのパワーレイジは炎1個・雷1個が必要なワザです。
            入っていない色のエネルギーが要るはずのワザを、このデッキは毎ターン撃っています。
          - 理由はナイトジョーカーの書き方にあります。
            「このワザとして使う」なので、払うのはナイトジョーカーの悪エネルギー2個だけです。
            借りるワザのエネルギーは最初から要りません。
          - だからベンチのNのポケモンにはエネルギーを1個もつけません。
            ベンチに立っているだけで、ワザの見本になっています。

      - 見出し: 250ダメージの壁
        引用: |
          Nのゼクロム  ランページサンダー   250ダメージ (次の自分の番、このポケモンはワザが使えない)
          Nのレシラム  パワーレイジ        このポケモンにのっているダメカンの数 × 20ダメージ
          モモワロウex イライラバースト     相手がすでにとったサイドの枚数 × 60ダメージ
        本文:
          - 借りられるワザで一番大きいのがランページサンダーの250ダメージです。
            つまりこのデッキの素の上限が250ダメージだということです。
          - 今よく使われているポケモンのHPを並べると、
            ドラパルトexがHP320、メガルカリオexがHP340、メガドリュウズexがHP340、
            メガゲッコウガexがHP350です。250ダメージではどれにも届きません。
          - 中くらいのダメージしか出ないというのが、このデッキの一番の弱点です。
            強いカードが足りないのではなく、上限が決まっているのが問題です。
          - だから足りない80ダメージを、別のカードで作りにいきます。

      - 見出し: 自分から毒になる
        引用: |
          くさりもち        このカードをつけているどくのポケモンが使うワザの、
                          相手のバトルポケモンへのダメージは「+40」される
          アンズの秘技      自分の悪ポケモンを2匹まで選び、
                          自分の山札から「基本悪エネルギー」を1枚ずつつける。
                          バトルポケモンにつけた場合、そのポケモンをどくにする
          モモワロウex 【しはいのくさり】自分のベンチの悪ポケモンを1匹バトル場と入れ替え、
                          その新しいバトルポケモンをどくにする
        本文:
          - くさりもちを88%が入れています。ダメージが40上がる道具ですが、
            上がる条件は「つけているポケモンが毒であること」です。
            相手が毒なのではなく、自分が毒でないといけません。
          - ふつう、毒は受けたくないものです。このデッキはその逆で、
            自分のゾロアークexをわざと毒にしにいきます。
          - 毒にする手段が2つ入っています。アンズの秘技が64%、モモワロウexが95%です。
            どちらも自分のバトルポケモンを毒にする書き方をしています。
          - 毒になると、自分の番の終わりにダメカンが1個(10ダメージ)のっていきます。
            それを払って、ワザのダメージを40上げているわけです。
            250ダメージが290ダメージになります。
          - もう1枚、からておうの稽古を66%が入れています。
            この番、相手のバトル場のポケモンexへのダメージが40上がります。
            合わせると250＋40＋40で330ダメージです。
            ここでようやくドラパルトexのHP320に届きます。
          - 数字の作り方が細かいところが、このデッキの面白さです。
            大きな1枚で殴るのではなく、40ずつ足して届かせています。

      - 見出し: 削られた体が、そのまま攻撃力になる
        引用: |
          Nのレシラム  パワーレイジ   このポケモンにのっているダメカンの数 × 20ダメージ
          ヒーローマント (ACE SPEC)   このカードをつけているポケモンの最大HPは「＋100」される
        本文:
          - パワーレイジの「このポケモン」は、ワザを使っているポケモン、
            つまりゾロアークex自身のことです。ベンチのレシラムではありません。
          - だからゾロアークexが受けたダメージが、そのままダメージに変わります。
            ダメカン10個(100ダメージ)をのせられていれば200ダメージ、
            ダメカン13個(130ダメージ)なら260ダメージになります。
          - ここでヒーローマントが効いてきます。最大HPが100増えるので、
            HP280のゾロアークexがHP380になります。
          - 数えてみると差がはっきりします。
            メガレックウザexの350ダメージを受けたとき、
            マントが無いゾロアークex(HP280)はきぜつします。
            マントがあると(HP380)残りHP30で生き残り、ダメカン35個がのった状態になります。
            そのままパワーレイジを撃つと700ダメージです。
          - つまりこのマントは、HPを増やす道具ではなく、
            「一撃で倒されないようにして、受けたダメージを回収する」道具です。
            倒されなければ、殴られるほど強くなります。
          - ただしヒーローマントはACE SPECなので、デッキに1枚しか入れられません。
            採用率も10%です。まだ多くの人が試している段階の組み方です。

      - 見出し: 非ルールを2匹まとめて倒す
        引用: |
          Nのヒヒダルマ  ひだるまキャノン   90ダメージ
            このポケモンについているエネルギーをすべてトラッシュし、
            相手のベンチポケモン1匹にも、90ダメージ

          Nのポイントアップ   自分のトラッシュから基本エネルギーを1枚選び、
                           ベンチの「Nのポケモン」につける
        本文:
          - NのダルマッカとNのヒヒダルマが、どちらもちょうど57%です。
            同じデッキに一緒に入っている組です。
          - ひだるまキャノンを借りると、相手のバトル場に90ダメージ、
            さらに相手のベンチ1匹にも90ダメージが入ります。
          - 相手の非ルールのポケモンは、HP70から90くらいのものが多いです。
            そこを2匹同時に倒せます。1ターンでサイド2枚です。
          - 非ルールのポケモンは1匹倒してもサイド1枚しか取れません。
            そこが遅れる原因になりますが、まとめて2匹倒せば追いつけます。
          - ただし「このポケモンについているエネルギーをすべてトラッシュ」します。
            この「このポケモン」もゾロアークex自身なので、
            撃ったあとゾロアークexはエネルギー0個になります。
          - だからNのポイントアップが100%、平均3.0枚入っています。
            トラッシュから基本エネルギーを、ベンチのNのポケモンにつけ直せます。
            つけられるのはベンチだけなので、次に出すゾロアークexを準備するカードです。

      - 見出し: 撃てなくなった番を、逃げてしのぐ
        引用: |
          Nの城 (スタジアム)
            おたがいの場の「Nのポケモン」全員のにげるためのエネルギーは、すべてなくなる
        本文:
          - ランページサンダーには「次の自分の番、このポケモンはワザが使えない」と
            書いてあります。250ダメージを撃った次の番、そのゾロアークexは動けません。
          - ここでNの城です。Nのポケモンのにげるエネルギーが0になるので、
            動けなくなったゾロアークexを、ベンチのもう1匹とただで入れ替えられます。
          - ゾロアークexが平均4.0枚も入っているのは、このためです。
            1匹が休んでいる間に、もう1匹が殴ります。
          - Nの城は95%が入れていて、平均2.0枚です。
            相手にスタジアムを張り替えられても、すぐ張り直せるようにしてあります。

    まとめ:
      - 借りるワザのエネルギーは要らない ── 悪エネルギー2個だけで撃てる
      - 上限は250ダメージ ── 足りないぶんは毒と稽古で40ずつ足す
      - 受けたダメージがパワーレイジに変わる
      - ひだるまキャノンで非ルールを2匹まとめて倒せる
      - Nの城で、撃てない番を無かったことにする
    しめ: >
      借りたワザで戦うところが目立ちますが、
      本当に考えられているのは250ダメージの埋め方のほうです。
      毒もマントも稽古も、全部その40ダメージのために入っています。

    弱点:
      - 弱点は 草×2 です。140ダメージで倒れます。
      - ベンチにNのポケモンがいないと、ナイトジョーカーで選べるワザがありません。
        ベンチを先に倒されると、殴る手段そのものが消えます。
      - 自分から毒になるので、放っておくとこちらのHPも減っていきます。
        殴り合いが長引くほど、この10ダメージが効いてきます。
      - ゾロアークexは倒されるとサイドを2枚渡します。
        借りる元のポケモンも並べるので、ベンチが埋まりやすいです。

    対面:
      - 草タイプで攻撃できるなら、HP280も140ダメージで倒せます。
      - HP340以上のポケモンで前に立つと、250ダメージでも290ダメージでも倒されません。
        相手は稽古まで使わないと届かなくなります。
      - ベンチのNのゼクロムをボスの指令で呼んで倒すと、250ダメージが消えます。
        ワザの見本を減らすのが、このデッキへの一番の攻め方です。
      - サイドを一気に取りすぎると、イライラバーストのダメージが上がります。
        取る順番を考える必要があります。

  おまつりおんど:
    結論: >
      HP80の小さなポケモンが、1ターンで400ダメージを超えます。
      そのかわり、スタジアムを1枚外されると全部止まります。
    節:
      - 見出し: 2回攻撃には条件がある
        引用: |
          カミッチュ   HP80   草タイプ   弱点 炎×2
          【おまつりおんど】場に「お祭り会場」が出ているなら、このポケモンは、
                         持っているワザを2回連続で使える
          ともだちのわ   草エネルギー1個 → 自分のベンチポケモンの数 × 20ダメージ
        本文:
          - まず特性の文を最後まで読みます。「場に『お祭り会場』が出ているなら」
            という条件が先に書いてあります。
          - お祭り会場が場に無いあいだ、カミッチュはただのHP80のポケモンです。
            ワザは1回しか使えず、ダメージは半分になります。
          - スタジアムは場に1枚しか出せません。相手が別のスタジアムを出した瞬間に、
            このデッキの攻撃力は半分になります。
          - だからお祭り会場を100%が入れていて、しかも平均4.0枚です。
            4枚というのは入れられる上限です。張り替えられたら、その番のうちに張り直します。
          - このデッキで一番大事なカードはカミッチュではなく、
            お祭り会場のほうだと言えます。

      - 見出し: お祭り会場そのものも守ってくれる
        引用: |
          お祭り会場 (スタジアム)
            エネルギーがついているおたがいのポケモン全員は、特殊状態にならず、
            受けている特殊状態は、すべて回復する
        本文:
          - お祭り会場は名前を呼ばれるだけのカードではありません。
            それ自身にも効果があります。
          - エネルギーがついているポケモンは、どく・こんらん・ねむり・まひに
            ならなくなります。カミッチュは草エネルギー1個をつけて戦うので、
            この守りをいつも受けています。
          - 毒でじわじわ削ってくるデッキや、こんらんで止めてくるデッキに対して、
            スタジアムを置いているだけで防げているわけです。
          - おたがいに効くので、相手のポケモンも守られます。
            それでも、毒を使うのはたいてい相手のほうなので、得をするのはこちら側です。

      - 見出し: ベンチの1匹が、ダメージ2回ぶん
        引用: |
          ともだちのわ    自分のベンチポケモンの数 × 20ダメージ
          グラジオの決戦  自分の手札がこのカード1枚だけのときにしか使えない。
                        この番、自分のポケモン(ルールを持つポケモンをのぞく)が使うワザの、
                        相手のバトルポケモンへのダメージは「+80」される
          ブレイブバングル つけているポケモン(ルールを持つポケモンをのぞく)が使うワザの、
                        相手のバトル場の「ポケモンex」へのダメージは「+30」される
        本文:
          - ともだちのわは、ベンチが5匹なら100ダメージです。それが2回で200ダメージです。
          - ここにグラジオの決戦を86%が入れています。ダメージが80上がるサポートですが、
            2回攻撃なので、上がるのも2回ぶんで160ダメージです。
          - ブレイブバングルも99%が入れています。相手がポケモンexなら30上がり、
            これも2回ぶんで60ダメージです。
          - 全部そろうと、100＋80＋30が2回で420ダメージになります。
            HP80のポケモンが、草エネルギー1個で420ダメージを出す計算です。
          - ここが大事なところです。ダメージを上げるカードは、
            2回攻撃のデッキでは効き目が2倍になります。
            同じ「＋80」でも、このデッキでは160の価値があります。
          - ベンチの1匹も同じです。ふつうのデッキならベンチが1匹増えて20ダメージですが、
            このデッキでは40ダメージぶんになります。

      - 見出し: ベンチが、そのまま手札を探す力になる
        引用: |
          バチンキー 【ドンドンだいこ】自分のバトルポケモンが特性「おまつりおんど」を
                    持つポケモンなら、自分の番に1回使える。
                    自分の山札から好きなカードを1枚選び、手札に加える

          アズマオウ 【おまつりおんど】持ち   クイックドロー 無エネルギー1個
                    60ダメージ、自分の山札を2枚引く
        本文:
          - バチンキーが99%、平均3.7枚入っています。3枚以上入れているデッキが
            ほとんどだということです。
          - 特性の文をよく読むと、「別のドンドンだいこを使っていたなら使えない」という
            一文がありません。同じ名前の特性でも、この一文が無いものは何匹ぶんでも使えます。
            ベンチに3匹いれば1つの番に3回、山札から好きなカードを3枚持ってこられます。
          - ここでベンチの意味が2つになります。ベンチの数はともだちのわのダメージであり、
            同時にカードを探す回数でもあります。ベンチを1匹増やすと、
            ダメージが40上がって、探せる枚数も1枚増えることがあります。
          - アズマオウも【おまつりおんど】持ちです。クイックドローを2回撃つと
            120ダメージを与えながら山札を4枚引けます。
            殴るカードと引くカードが同じ1匹になっています。
          - グラジオの決戦は手札が1枚のときしか使えません。
            探して、出して、使い切って、最後にグラジオの決戦だけを残す。
            この順番でカードを使うデッキです。

      - 見出し: ドラパルトexを止めるカードが3種類入っている
        引用: |
          ベラカス 【スフィアシールド】このポケモンがいるかぎり、自分のベンチポケモン全員は、
                  相手のポケモンからワザのダメージや効果を受けない
          シェイミ 【はなのカーテン】このポケモンがいるかぎり、自分のベンチポケモン
                  (ルールを持つポケモンをのぞく)全員は、相手のワザのダメージを受けない
          コダック 【しめりけ】このポケモンがいるかぎり、おたがいのポケモン全員は、
                  そのポケモン自身をきぜつさせる効果の特性が、すべてなくなる
        本文:
          - この3枚を並べて読むと、書いてある言葉が少しずつ違います。
            違いがそのまま役割の違いになっています。
          - シェイミが防ぐのは「ワザのダメージ」だけです。
            ドラパルトexのファントムダイブがベンチに置くのはダメカンで、
            これはワザの効果のあつかいです。だからシェイミでは防げません。
          - ベラカスは「ワザのダメージや効果」と書いてあります。効果まで防ぐので、
            ファントムダイブのダメカンが置けなくなります。
            シガロコとベラカスがどちらも68%で、そろって入っているのはこのためです。
          - コダックは「自分自身をきぜつさせる効果の特性」を消します。
            サマヨールとヨノワールのカースドボムが、これに当てはまります。
            ドラパルトexのデッキは、殴らずにダメカンを置く手段を何種類も持っていますが、
            コダックはそのうちの1つを丸ごと止めます。
          - ベンチのポケモンがHP70前後ばかりのデッキなので、
            ベンチを削る攻め方が一番こわいです。そこを3枚がかりで防いでいます。

    まとめ:
      - 2回攻撃はお祭り会場が場にあるときだけ ── 無いと半分になる
      - ダメージを上げるカードは効き目が2倍 ── ＋80が160になる
      - ベンチの数は、ダメージであり、探せる枚数でもある
      - ベラカスとコダックで、ドラパルトexのダメカンを止める
    しめ: >
      HP80のポケモンが420ダメージを出せるのは、
      2回攻撃だからです。そしてその2回攻撃は、スタジアム1枚に乗っています。
      強さの全部が1枚のカードに乗っているデッキです。

    弱点:
      - お祭り会場を張り替えられると、ダメージが半分になります。ここが最大の弱点です。
      - カミッチュはHP80、弱点は 炎×2 です。40ダメージで倒れます。
      - グラジオの決戦は手札が1枚のときしか使えません。
        相手にジャッジマンなどで手札を配られると、その番は使えなくなります。
      - ベンチの数でダメージが決まるので、ベンチを減らされると弱くなります。

    対面:
      - スタジアムを張り替えるのが一番効きます。ダメージが半分になります。
      - 炎タイプなら、カミッチュもバチンキーも一撃で倒せます。
      - 手札を増やすカードを相手に使わせると、グラジオの決戦が止まります。
      - ベラカスがいるあいだは、こちらのワザでベンチにダメカンを置けません。
        先にベラカスをボスの指令で呼び出して倒すのが早道です。

  オーガポンバレット:
    結論: >
      アタッカーが8種類も入っているのに、エネルギーで困りません。
      「どんな色でも払える」「ただで入れ替えられる」「エネルギーを動かせる」の
      3つがそろっているからです。
    節:
      - 見出し: 色の問題が消えている
        引用: |
          プリズムエネルギー
            このカードは、エネルギー1個ぶんとしてはたらく。
            たねポケモンについているかぎり、すべてのタイプのエネルギー1個ぶんとしてはたらく
        本文:
          - このデッキのアタッカーを並べると、草・水・炎・雷・闘・悪と、
            タイプがばらばらです。ふつうなら、色ごとにエネルギーを入れることになり、
            必要な色が手札に来ないという事故が起きます。
          - プリズムエネルギーを97%が入れています。たねポケモンについているあいだ、
            どのタイプのエネルギーとしても使えるカードです。
          - ここで、このデッキのアタッカーをもう一度見ます。
            メガガルーラex、オーガポン、ラティアスex、リーリエのピッピex、
            ファイヤー、イーユイ、ナゲツケサル、カプ・コケコex。
            採用率の高いポケモンは、そろってたねポケモンです。
          - たねポケモンでそろえてあるのは、そのほうが早いからだけではありません。
            プリズムエネルギーを全員が使えるようにするためです。
            進化ポケモンを1匹入れるたびに、その1匹だけ色が合わなくなります。

      - 見出し: 入れ替えがただになる
        引用: |
          ラティアスex 【スカイライン】このポケモンがいるかぎり、
                     自分のたねポケモン全員のにげるためのエネルギーは、すべてなくなる

          エネルギーつけかえ  自分のポケモンの基本エネルギーを1個、自分の別のポケモンにつけ替える
          Nの筋書き          自分のベンチポケモンについているエネルギーを2個まで選び、
                           バトルポケモンにつけ替える
        本文:
          - ラティアスexが100%入っています。たねポケモン全員のにげるエネルギーが
            0になるので、毎ターンただで前のポケモンを替えられます。
            アタッカーが全員たねポケモンなので、全員が対象です。
          - 相手に合うアタッカーがベンチにいても、入れ替えに手間がかかるなら
            間に合いません。スカイラインはその手間を消しています。
          - 残るのは「そのアタッカーにエネルギーがついていない」という問題です。
            そこでエネルギーつけかえが100%・平均3.9枚、Nの筋書きが79%です。
          - この3つがそろって、初めて「相手に合わせて出す」ができます。
            色が合う、入れ替えられる、エネルギーが移せる。
            どれか1つ欠けても、ベンチのアタッカーは飾りになってしまいます。

      - 見出し: 相手ごとに専用の1匹がいる
        引用: |
          ファイヤー       とうしのつばさ  20＋ 相手のバトルポケモンが「ポケモンex」なら90追加
          パルデア ケンタロス きあいタックル  90＋ 相手のバトルポケモンが1進化ポケモンなら90追加
          イーユイ        グラウンドメルト 60＋ 場にスタジアムが出ているなら60追加、そのスタジアムをトラッシュ
          パオジアン    【ゆきにしずめる】手札からベンチに出したとき、場のスタジアムをトラッシュする
        本文:
          - ファイヤーはHP120の非ルールで、炎エネルギー1個で110ダメージを出します。
            ただし相手がポケモンexのときだけです。今はexだらけなので、ほぼ毎回110ダメージです。
          - パルデア ケンタロスは相手が1進化のときに180ダメージです。
            メガルカリオexもメガドリュウズexも1進化なので、ここに当たります。
          - イーユイとパオジアンは、どちらもスタジアムをトラッシュするカードです。
            おまつりおんどのお祭り会場、ヤドキングの夜のアカデミー、
            カミツオロチexの活力の森は、どれも1枚外れると動きが止まります。
            そこを狙って用意された枠です。
          - どれも採用率は20%から40%くらいです。全員が入れているわけではありません。
            大会でどのデッキが多いかを見て、その日に効く1匹を選んで入れる枠です。

      - 見出し: ベンチ8匹の本当の意味
        引用: |
          ゼロの大空洞 (スタジアム)
            自分の場に「テラスタル」のポケモンがいるプレイヤーが、
            ベンチに出せるポケモンの数は8匹になる

          リーリエのピッピex   HP190  超タイプ
          【フェアリーゾーン】このポケモンがいるかぎり、相手の場の竜ポケモン全員の弱点は、
                          すべて超タイプになる (弱点は「×2」で計算する)
          フルムーンロンド   超エネルギー1個+無エネルギー1個 → 20ダメージ +
                          おたがいのベンチポケモンの数 × 20ダメージ
        本文:
          - ゼロの大空洞は100%です。ベンチが8匹になるので、
            アタッカーを何種類も置いておけます。ここまでは分かりやすい話です。
          - もう1つ意味があります。フルムーンロンドは
            「おたがいのベンチポケモンの数×20ダメージ」です。
            自分のベンチ8匹と相手のベンチ5匹で13匹なら、20＋260で280ダメージになります。
          - そしてリーリエのピッピexは超タイプです。自分の特性で相手を超弱点にして、
            自分でそこを突く形になっています。280ダメージが2倍で560ダメージです。
          - つまりゼロの大空洞は、置ける場所を増やすカードであると同時に、
            ベンチ1匹あたり40ダメージを足すカードでもあります。
          - ただし特性の文をよく読むと、弱点が変わるのは「竜ポケモン」だけです。
            場の全員ではありません。
          - それでも99%が入れているのは、竜タイプに今の環境の中心がいるからです。
            ドラパルトexは竜タイプで弱点がありませんが、これがあると弱点 超×2 になり、
            HP320が160ダメージで倒れます。タケルライコexも竜タイプです。
          - あるデッキを止めるために作られたカードを、メタカードといいます。
            リーリエのピッピexは、ドラゴンだけを狙い撃ちにしたメタカードです。

    まとめ:
      - アタッカーが全員たねポケモン ── だからプリズムエネルギーが全員に使える
      - ラティアスexで入れ替えがただになる
      - エネルギーつけかえとNの筋書きで、エネルギーが後から追いつく
      - ゼロの大空洞は、置き場所であり、ダメージでもある
      - リーリエのピッピexで、竜タイプの相手に弱点を作る
    しめ: >
      1匹の強さで勝つデッキではありません。
      色・入れ替え・エネルギーの移動という3つの土台があって、
      その上に相手ごとの1匹を乗せていくデッキです。

    弱点:
      - アタッカーの多くがポケモンexです。倒されるとサイドを2枚渡します。
        非ルールで戦ってくる相手には、サイドの進み方で不利になります。
      - ベンチを8匹に広げるので、ドラパルトexがダメカンを置く相手が増えます。
      - ゼロの大空洞は、テラスタルのポケモンが場からいなくなるとベンチが5匹に戻ります。
        オーガポンを先に倒されると、ベンチが縮んでダメージも下がります。
      - オーガポン みどりのめんexの 弱点 炎×2 が、エネルギーを増やす役でもあります。
        ここを先に倒されると回らなくなります。

    対面:
      - こちらが竜タイプのデッキなら、リーリエのピッピexがいるあいだ 弱点 超×2 になります。
        まずこれを倒すか、超タイプが出てくる前に決めます。
        竜タイプがいないデッキなら、この特性は何も起きません。
      - テラスタルのポケモンを倒すとベンチが5匹に戻ります。
        ベンチが減れば、フルムーンロンドのダメージも下がります。
      - 非ルールのポケモンで殴り合うと、サイドの進み方で勝てます。

  ヤドキング:
    結論: >
      山札の一番上をめくって、そのポケモンのワザを使います。
      運まかせに見えますが、上を作るカードが7枚以上入っていて、
      本当は毎ターン狙ったワザを撃つデッキです。
    節:
      - 見出し: 山札の上を、自分で作る
        引用: |
          ヤドキング   HP120   超タイプ   弱点 悪×2   にげる3
          ひらめきチャレンジ   超エネルギー1個 + 無エネルギー1個
            自分の山札を上から1枚トラッシュし、そのカードがポケモン
            (「ルールを持つポケモン」をのぞく)なら、
            そのポケモンが持っているワザを1つ選び、このワザとして使う

          暗号マニアの解読   自分の山札から好きなカードを2枚選ぶ。残りの山札を切り、
                         選んだカードを好きな順番に入れ替えて、山札の上にもどす
          夜のアカデミー    おたがいのプレイヤーは、自分の番ごとに1回、
                         自分の手札を1枚選び、山札の上にもどしてよい
        本文:
          - ひらめきチャレンジだけを読むと、めくり運のワザに見えます。
            外れたら何も起きません。
          - ところが暗号マニアの解読が90%、平均2.8枚入っています。
            山札から好きなカードを2枚選んで、好きな順番で山札の上に置けるカードです。
          - 大事なのは2枚だということです。1枚目に今日使いたいワザ、
            2枚目に次の番に使いたいワザを置けます。2ターンぶんの予約ができます。
          - 夜のアカデミーは100%、平均3.9枚です。
            手札の1枚を山札の上にもどせるので、毎ターン上を作り直せます。
          - 4枚近く入れているのは、スタジアムが場に1枚しか置けないからです。
            相手に張り替えられても、その番のうちに張り直せるようにしてあります。
          - 気をつけるところが1つあります。リーリエの決心のように山札を切るカードを、
            上を作ったあとに使うと、せっかくの準備が消えます。
            引くカードを先に、上を作るカードを最後に使う。この順番が決まっているデッキです。

      - 見出し: 借りるときは、ヤドキングのエネルギーで考える
        引用: |
          メタグロス   メタリックハンマー   150＋
            のぞむなら、このポケモンについている鋼エネルギーを3個トラッシュし、150ダメージ追加
        本文:
          - ここがこのデッキで一番おもしろいところです。
          - 「このポケモン」は、ワザを使っているポケモンのことです。
            ヤドキングが借りて撃つので、「このポケモン」はヤドキングを指します。
          - ヤドキングについているのは超エネルギーだけで、鋼エネルギーは1個もありません。
            それでも「のぞむなら」を選べます。トラッシュする鋼エネルギーが無いので
            何も減らず、追加の150ダメージだけが乗ります。
          - 合わせて300ダメージです。しかも払ったのは、
            ひらめきチャレンジのエネルギー2個だけです。
          - 借りたワザの文は、借りたポケモンではなく、
            いま使っているポケモンのことを言っている。
            これが分かると、どのポケモンを山札に入れておくべきかが変わってきます。

      - 見出し: 相手によって、借りるものを変える
        引用: |
          キュレム   トライフロスト   本来はエネルギー5個
            このポケモンについているエネルギーをすべてトラッシュし、
            相手のポケモン3匹に、それぞれ110ダメージ (ベンチは弱点・抵抗力を計算しない)

          コノヨザル  みちづれファイト   おたがいのバトルポケモンをきぜつさせる
          ゼラオラ   サンダーブリッツ   相手のベンチの「ポケモンex」1匹に、210ダメージ
          レイスポス  ファントムビット   相手のポケモン1匹に、ダメカンを12個のせる
          ギラティナ  カオスクローラー   120ダメージ、次の相手の番、このポケモンはワザのダメージを受けない
          デスカーン  めいふのおきて    おたがいの特性を持つポケモン全員に、それぞれダメカンを6個のせる
        本文:
          - キュレムが100%です。トライフロストは本来エネルギー5個のワザで、
            相手のポケモン3匹に110ダメージずつ入ります。合計330ダメージぶんです。
            ベンチも巻き込むので、次の番にボスの指令で呼べば一気にサイドを取れます。
          - コノヨザルが74%です。みちづれファイトは、おたがいのバトルポケモンが
            きぜつするワザです。一見すると相打ちですが、
            ヤドキングは非ルールなので相手が取るサイドは1枚、
            こちらは相手のポケモンexを倒してサイド2枚、メガシンカexなら3枚です。
            サイドの取り合いで、確実に得をする交換になります。
          - レイスポスのファントムビットはダメカン12個(120ダメージ)です。
            ダメージではなくダメカンなので、
            「ワザのダメージを受けない」と書いてあるポケモンにも通ります。
          - デスカーンは特性を持つポケモン全員にダメカン6個(60ダメージ)です。
            特性持ちを何匹も並べるデッキに当たったときだけ入れる枠で、採用率は14%です。
          - 借りる相手を選べるということは、当たった相手ごとに別のデッキになれるということです。
            ただし、それは山札の上を作れているあいだだけです。

      - 見出し: 使ったエネルギーが、戻ってくる
        引用: |
          ブーメランエネルギー
            このカードをつけているポケモンが使うワザの効果で、このカードがトラッシュされたなら、
            ワザのダメージや効果のあとに、もとのポケモンにつけなおす

          ワンダーパッチ  自分のトラッシュから基本エネルギーを1枚選び、ベンチのポケモンにつける
          ムチュール   るんるんキッス   自分の山札から基本エネルギーを2枚まで選び、
                                    ベンチポケモン1匹につける
        本文:
          - トライフロストには「このポケモンについているエネルギーをすべてトラッシュし」と
            書いてあります。撃ったあと、ヤドキングはエネルギー0個になります。
            そのままでは次の番に何もできません。
          - ブーメランエネルギーを69%が入れています。
            ワザの効果でトラッシュされたとき、そのまま戻ってくるカードです。
          - つまりトライフロストを撃っても、ブーメランエネルギーは残ります。
            大きいワザの代金だけが消えるようにしてあるわけです。
          - ワンダーパッチが97%・平均3.0枚、ムチュールが62%入っています。
            どちらもベンチのポケモンにエネルギーをつけるカードで、
            次のヤドキングを裏で準備する役です。
          - 撃ったら壊れるワザを毎ターン撃つために、
            エネルギーが戻る仕組みが3種類も用意されています。

    まとめ:
      - 山札の上は作れる ── 暗号マニアの解読で2ターンぶん予約できる
      - 借りたワザの「このポケモン」はヤドキングのこと
      - 鋼エネルギーが無くても、のぞめば300ダメージが出る
      - みちづれファイトは、サイド1枚と2枚以上の交換になる
      - ブーメランエネルギーで、撃った代金が戻ってくる
    しめ: >
      めくり運のデッキに見えて、実は運の部分をほとんど消してあります。
      そして借りたワザの文を、自分のポケモンのこととして読み直せる人ほど、
      このデッキから引き出せるダメージが増えます。

    弱点:
      - 夜のアカデミーを張り替えられると、上を作る手段が減ります。
      - ヤドキングはHP120で 弱点 悪×2 です。60ダメージで倒れます。
      - 借りたいポケモンがサイドに落ちていると、そのワザは一生使えません。
      - にげるが3もあります。ボスの指令で呼び出されると動けません。
      - ヤドンから育てる必要があるので、立ち上がりは速くありません。

    対面:
      - スタジアムを張り替えるのが一番効きます。
      - 悪タイプならヤドキングを60ダメージで倒せます。
      - ベンチのヤドンを先に倒しておくと、後続が続きません。
      - こちらのベンチを減らしておくと、トライフロストの巻き込み先が減ります。

  フーディン:
    結論: >
      相手がエネルギーをつけるほどダメージが上がります。
      HP40から育てる細いデッキですが、ベンチを守るスタジアムを3枚積むことで
      成り立たせています。
    節:
      - 見出し: 相手のエネルギーがダメージになる
        引用: |
          フーディン   HP140   超タイプ   弱点 悪×2   にげる1
          サイコキネシス   超エネルギー1個 → 10ダメージ +
            相手のバトルポケモンについているエネルギーの数 × 50ダメージ
        本文:
          - エネルギー1個で撃てて、相手のエネルギーが4個なら210ダメージ、
            5個なら260ダメージ、6個なら310ダメージです。
          - 今の環境で一番エネルギーを並べるのはメガレックウザexです。
            エネルギー7個で350ダメージを出すデッキなので、
            並べ終わったころには360ダメージで倒せる相手になっています。
          - 相手が強くなるほどこちらのダメージも上がる、という珍しい形です。
            相手はエネルギーをつけないと勝てず、つけると倒される。
            どちらを選んでも損をする状態を作れます。
          - フーディンはHP140の非ルールです。倒されてもサイドは1枚しか渡しません。
            相手のexを倒せば2枚とれるので、サイドの取り合いでも得をします。

      - 見出し: HP40から育てるための守り
        引用: |
          バトルコロシアム (スタジアム)
            おたがいのベンチポケモン全員は、相手のワザや特性の効果で、ダメカンがのらない
            (ワザのダメージは受ける)

          コダック 【しめりけ】このポケモンがいるかぎり、おたがいのポケモン全員は、
                  そのポケモン自身をきぜつさせる効果の特性が、すべてなくなる
        本文:
          - このデッキはケーシィ(HP40)から2回進化させます。
            育つまでのあいだ、ベンチにHP40のポケモンが並んでいることになります。
          - ドラパルトexから見ると、これ以上ないカモです。
            ファントムダイブのダメカン6個は好きなように配れるので、
            ケーシィを2匹まとめて倒せてしまいます。
          - そこでバトルコロシアムを83%が、平均3.2枚も入れています。
            相手のワザや特性の効果では、ベンチにダメカンがのらなくなります。
          - この1枚で3つ止まります。ファントムダイブのダメカン、
            サマヨールとヨノワールのカースドボム、マシマシラのアドレナブレイン。
            ドラパルトexがベンチを削る手段は、ほぼこれで全部です。
          - さらにコダックを61%が入れています。カースドボムをもう一段止めるカードです。
            スタジアムを張り替えられたときの保険になっています。
          - スタジアムを3枚も入れているのは、張り替え合戦に勝つためです。
            相手が別のスタジアムを出したら、こちらもすぐ張り直します。

      - 見出し: 逃げられるHP40
        引用: |
          ケーシィ 【テレポーター】このポケモンがバトル場にいるなら、自分の番に1回使える。
                  このポケモンと、ついているすべてのカードを、自分の山札にもどして切る
          ノココッチ【にげあしドロー】自分の番に1回使える。自分の山札を3枚引く。その後、
                  このポケモンと、ついているすべてのカードを、山札にもどして切る
        本文:
          - ボスの指令でケーシィを呼び出されると、ふつうはそこで1匹取られます。
          - ところがケーシィは、バトル場にいるとき自分ごと山札にもどれます。
            サイドを渡さずに逃げられるということです。呼び出された意味が消えます。
          - ノココッチも同じ形です。3枚引いてから山札にもどるので、
            ベンチに残って狙われることがありません。96%が入れています。
          - 弱いポケモンを場に置かずに済ませる、という考え方でそろえられています。

      - 見出し: 相手のカードを減らして、時間を作る
        引用: |
          ビワ       相手の手札を見て、その中からグッズを2枚まで選び、トラッシュする
          改造ハンマー  相手の場のポケモンについている特殊エネルギーを、1個トラッシュする
          ヒカリ      自分の山札から「たねポケモン」「1進化ポケモン」「2進化ポケモン」を
                    1枚ずつ選び、手札に加える
        本文:
          - ヒカリが99%、平均3.4枚です。1枚でケーシィ・ユンゲラー・フーディンの
            3枚がそろいます。育てるのに一番大事なカードなので、3枚以上入っています。
          - ビワと改造ハンマーは、相手を遅らせるカードです。
            2進化が育つまでの1〜2ターンを買うために入っています。
          - 改造ハンマーには考えどころがあります。
            相手のエネルギーを減らすと、サイコキネシスのダメージも50下がります。
            それでも入れるのは、特殊エネルギーが無いと動けないデッキがあるからです。
            50ダメージを捨てて、相手の攻撃を1ターン止めるほうが得な場面があります。
          - どちらを取るかを自分で決める。こういうカードが入っているデッキは、
            使う人の判断で強さが変わります。

    まとめ:
      - 相手のエネルギー1個につき50ダメージ
      - バトルコロシアムで、ベンチにダメカンをのせられなくなる
      - ケーシィもノココッチも、狙われる前に山札へ逃げられる
      - ヒカリ1枚で進化の3枚がそろう
    しめ: >
      相手の強みをそのまま弱点に変えるデッキです。
      ただし自分のポケモンは細いので、
      ベンチを守るスタジアムが無いと、育つ前に終わってしまいます。

    弱点:
      - 相手がエネルギーをあまりつけないデッキだと、ダメージが出ません。
        ドラパルトexはエネルギー2個で戦うので、サイコキネシスは110ダメージにしかなりません。
      - フーディンはHP140、ケーシィはHP40です。
        弱点は 悪×2 なので、フーディンでも70ダメージで倒れます。
      - 2進化なので、育つまでに時間がかかります。
      - バトルコロシアムを張り替えられると、ベンチが守れなくなります。

    対面:
      - エネルギーをバトル場に集めないようにします。ベンチに分けてつければダメージが下がります。
      - 悪タイプならフーディンを70ダメージで倒せます。
      - スタジアムを張り替えてから、ベンチのケーシィを攻めます。
      - ワザのダメージはバトルコロシアムでも防げません。ベンチを直接殴れるワザは通ります。

  メガドリュウズex:
    結論: >
      330ダメージを毎ターン撃ち続けられます。
      そのためにデッキの4枚に1枚がエネルギーで、
      さらにエネルギーを山札とトラッシュの間で行き来させています。
    節:
      - 見出し: エネルギー5個が条件
        引用: |
          メガドリュウズex   HP340   鋼タイプ   弱点 炎×2   にげる4

          マキシマムドリル   鋼エネルギー3個 → 200ダメージ +
            このワザを使うためのエネルギーより2個多くエネルギーがついているなら、
            130ダメージ追加 (合計330ダメージ)
        本文:
          - 条件は「ワザに必要な3個より2個多い」なので、エネルギー5個です。
            1匹に5個も集めるのは、ふつうなら何ターンもかかります。
          - そのかわり、撃ってもエネルギーをトラッシュしません。
            一度5個そろえば、そのまま330ダメージを毎ターン撃ち続けられます。
          - タケルライコexは殴るたびにエネルギーを捨てるので毎ターン並べ直しですが、
            こちらは並べ直しが要りません。時間をかけた見返りがここにあります。

      - 見出し: デッキの4枚に1枚がエネルギー
        引用: |
          メタング 【メタルメーカー】自分の番に1回使える。自分の山札を上から4枚見て、
                  その中から基本エネルギーを好きなだけ選び、自分のポケモンに好きなようにつける。
                  残りのカードはすべてウラにして切り、山札の下にもどす
        本文:
          - このデッキは基本鋼エネルギーを平均15.6枚入れています。
            60枚のうち約26%、4枚に1枚がエネルギーという計算です。
            ふつうのデッキは8枚から10枚くらいなので、かなり多い部類です。
          - 多い理由は【メタルメーカー】にあります。山札の上4枚を見て、
            その中にあるエネルギーを場につけるので、
            山札にエネルギーが濃く入っているほど、当たる数が増えます。
          - 26%なら、上4枚に1枚もエネルギーが無い確率はおよそ30%です。
            逆に言えば7割の確率で1枚以上あり、平均すると1枚ちょっと当たります。
          - メタングは平均4.0枚、ダンバルも平均4.0枚入っています。
            ベンチにメタングを3匹並べれば、【メタルメーカー】が1つの番に3回使えます。
            手札からつける1個と合わせて、2ターンで5個に届きます。
          - つまりこのデッキのエネルギー15.6枚は、手札につけるためではなく、
            山札の上4枚に当てるための枚数です。
          - 終盤になると、この作りが裏目に出ます。
            エネルギーはどんどん場に出ていくので、山札に残るエネルギーが減り、
            【メタルメーカー】が当たらなくなります。
          - そこでエネルギーリサイクルを94%が入れています。
            トラッシュの基本エネルギーを5枚まとめて山札にもどすカードです。
            5枚というのは、メガドリュウズex1匹ぶんとちょうど同じ数です。
          - メガドリュウズexが倒されると、ついていたエネルギー5個はトラッシュに行きます。
            それを山札にもどして、また【メタルメーカー】で拾い直す。
            エネルギーが場とトラッシュと山札をぐるぐる回るようにできています。

      - 見出し: どのモグリューを選ぶか
        引用: |
          モグリュー (M5 044/081)   HP70   闘タイプ
          なかまをよぶ   無エネルギー1個
            自分の山札からたねポケモンを2枚まで選び、ベンチに出す。そして山札を切る
          ツメをたてる   無エネルギー3個 → 50ダメージ
        本文:
          - モグリューは100%、平均2.9枚入っています。
            メガドリュウズexはモグリューから進化するので、入っているのは当たり前です。
          - ここで気づいてほしいことがあります。
            モグリューという名前のカードは何種類も出ていて、
            ワザも特性もそれぞれ違います。
            調べてみると、178デッキの全部が同じ1枚を使っていました。
            メガドリュウズexと同じ弾に入っている、M5の044番です。
          - そのワザが「なかまをよぶ」です。エネルギー1個で、
            山札からたねポケモンを2枚ベンチに出します。
          - このデッキが最初に並べたいのは、ダンバル2匹とゲノセクトexです。
            ダンバルはメタングになってエネルギーを出す係で、
            ゲノセクトexは進化ポケモンを探す係です。
            なかまをよぶは、その3匹を山札から直接つれてきます。
          - なかよしポフィンは平均1.4枚しか入っていません。HP70以下しか出せないので、
            HP220のゲノセクトexは連れてこられないからです。
            プレシャスキャリーは強いカードですが平均1.0枚です。
            毎回使える並べ方は、実はなかまをよぶだけです。
          - もう1つ得があります。なかまをよぶのために
            モグリューにつけたエネルギーは、進化しても場に残ります。
            そのままメガドリュウズexのエネルギー5個の1個めになります。
            準備しながら殴っているようなものです。
          - 同じ名前のカードでも、どれを選ぶかで動きが変わります。
            デッキを組むときは、名前ではなく、
            カードの右下に書いてある番号まで見て選びます。

      - 見出し: 相手のHPを30下げる
        引用: |
          グラビティーマウンテン (スタジアム)
            おたがいの場の2進化ポケモン全員の最大HPは、それぞれ「-30」される
        本文:
          - 72%が入れています。おたがいの2進化ポケモンのHPが30下がるスタジアムです。
          - メガドリュウズexは1進化なので、自分は影響を受けません。
            片側だけが得をする形になっています。
          - 効く相手を並べると理由が分かります。
            ドラパルトexは2進化でHP320、メガゲッコウガexは2進化でHP350、
            メガリザードンexとメガサーナイトexは2進化でHP360です。
            30下がると、それぞれHP290・HP320・HP330になります。
          - マキシマムドリルは330ダメージなので、ここまで下がれば全部一撃で倒せます。
            このスタジアムは、HP350や360の相手を射程に入れるためのカードです。
          - 一方でメガルカリオexは1進化のHP340です。スタジアムが効かないので、
            330ダメージでは10だけ足りません。HP340とHP330の差がそのまま出ます。
          - カードのHPが10違うだけで倒せるかどうかが変わる。
            ポケモンカードの数字は、そこまで細かく決められています。

      - 見出し: 好きなトレーナーズを毎ターン持ってくる
        引用: |
          ロケット団のラムダ    自分の山札からトレーナーズを1枚選び、手札に加える
          ロケット団のレシーバー  自分の山札から、名前に「ロケット団」とつくサポートを1枚選び、
                             手札に加える
        本文:
          - ロケット団のラムダが99%・平均3.9枚、
            ロケット団のレシーバーが95%・平均3.8枚入っています。合わせて8枚近くです。
          - ラムダはトレーナーズなら何でも持ってこられます。
            レシーバーはそのラムダを持ってこられます。
          - つまりこの8枚は、全部が「好きなカード1枚」に化けます。
            エネルギーを大量に積んで手札が偏りやすいデッキなので、
            どこから引いても必要なカードにたどり着けるようにしてあります。

    まとめ:
      - エネルギー5個で330ダメージ、撃ってもエネルギーは減らない
      - エネルギー15.6枚は、メタルメーカーを当てるための枚数
      - モグリューのなかまをよぶで、1番めからベンチがそろう
      - グラビティーマウンテンで、HP350や360の相手を330の射程に入れる
      - ロケット団の8枚が、全部「好きなカード」になる
    しめ: >
      準備に時間がかかるかわり、そろってからは毎ターン同じ330ダメージが出ます。
      そして相手のHPを30下げるカードまで入れて、
      330で届く相手を自分から増やしにいっています。

    弱点:
      - 弱点は 炎×2 です。170ダメージで倒れます。HP340が実質HP170になってしまいます。
      - にげるが4もあります。エネルギーがそろう前にボスの指令で呼び出されると、
        前に立ったまま何もできません。
      - メガシンカexなので、倒されるとサイドを3枚渡します。
      - エネルギー5個をつけるまでに時間がかかります。育つ前が一番弱いです。
      - モグリューは 弱点 草×2 です。スボミーの10ダメージが20ダメージになります。

    対面:
      - 炎タイプで攻撃できるなら、HP340も170ダメージで倒せます。
      - ダンバル(HP70)やモグリュー(HP70)のうちに倒すと育ちません。
      - 育ちきる前に攻めるのが基本です。育ってからでは止まりません。
      - HP340以上で、しかも1進化か、たねポケモンで前に立つと、330ダメージで倒されません。

  カミツオロチex:
    結論: >
      エネルギー1枚が2個ぶんになる特性があります。
      だから見た目のエネルギーの数の2倍でダメージを計算します。
    節:
      - 見出し: エネルギーが2倍に数えられる
        引用: |
          メガニウム 【おいしげる】このポケモンがいるかぎり、自分のポケモン全員についている
                   「基本エネルギー」は、それぞれエネルギー2個ぶんとしてはたらく。
                   この特性の効果は重ならない

          カミツオロチex   HP330   草タイプ   弱点 炎×2
          みつあめストーム   エネルギー2個 (無・無) → 30ダメージ +
            自分のポケモン全員についているエネルギーの数 × 30ダメージ
        本文:
          - メガニウムが97%、平均2.0枚入っています。
            このデッキの本当の中心はカミツオロチexではなく、こちらかもしれません。
          - みつあめストームは自分の場のエネルギーの数でダメージが決まります。
            そこにメガニウムがいると、基本エネルギー1枚が2個ぶんとして数えられます。
          - 場に基本エネルギーが5枚あるとします。
            メガニウムがいなければ5個で150ダメージ追加、合計180ダメージです。
            メガニウムがいると10個で300ダメージ追加、合計330ダメージになります。
            同じ場でダメージが倍近く変わります。
          - 数えるのは自分のポケモン全員です。バトル場のカミツオロチexだけでなく、
            ベンチについているエネルギーも全部足されます。
          - この特性は「重ならない」と書いてあるので、
            メガニウムが2匹いても4倍にはなりません。2匹入っているのは、
            1匹目を倒されたときに続けられるようにするためです。

      - 見出し: 場にエネルギーを置く係が4匹いる
        引用: |
          オーガポン みどりのめんex 【みどりのまい】自分の番に1回使える。自分の手札から
                                基本エネルギーを1枚選び、このポケモンにつける。
                                その後、自分の山札を1枚引く

          カミツオロチex 【じゅくせいチャージ】自分の番に1回使える。自分の手札から
                       基本エネルギーを1枚選び、自分のポケモンにつける。
                       その後、つけたポケモンのHPを「30」回復する
        本文:
          - オーガポン みどりのめんexが100%、平均3.9枚入っています。
            アタッカーとしてではなく、エネルギーを置く係として4匹並べています。
          - 【みどりのまい】にも「別のみどりのまいを使っていたなら使えない」という
            一文がありません。ベンチに4匹いれば、1つの番に4回使えます。
          - ふつう、手札からエネルギーをつけられるのは1つの番に1回だけです。
            この特性はワザではなく特性なので、その決まりの外にあります。
            手札にエネルギーがあるだけ、場に置けてしまいます。
          - つけ先は「このポケモン」なので、オーガポン自身にしかつきません。
            でもみつあめストームは自分のポケモン全員を数えるので、
            ベンチにたまっていくエネルギーもそのままダメージになります。
          - カミツオロチexの【じゅくせいチャージ】は、つけた相手を30回復します。
            エネルギーを増やす動きが、そのまま回復にもなっています。
            HP330に毎ターン30の回復が乗るので、相手は思ったより削りきれません。

      - 見出し: 出したその番に、3段階めまで進化する
        引用: |
          活力の森 (スタジアム)
            おたがいのポケモン全員は、出したばかりの番(最初の自分の番をのぞく)でも
            ポケモンに進化できる

          セレビィ   ときをめぐる   自分の山札からポケモンとスタジアムを合計3枚まで選び、
                              手札に加える
          ヒカリ    自分の山札から「たねポケモン」「1進化ポケモン」「2進化ポケモン」を
                  1枚ずつ選び、手札に加える
        本文:
          - このデッキには2進化が2種類も入っています。
            カジッチュ→カミッチュ→カミツオロチexと、
            チコリータ→ベイリーフ→メガニウムです。
            ふつうに育てると、そろうのは4ターン目や5ターン目になります。
          - 活力の森が100%、平均3.3枚入っています。
            出したばかりのポケモンでもその番に進化できるスタジアムです。
          - これがあると、カジッチュを出した番のうちにカミツオロチexまで進化できます。
            2進化のデッキが2つ入っていても間に合うのは、このカードのおかげです。
          - ヒカリが91%です。1枚でたね・1進化・2進化がそろうので、
            活力の森と合わせれば、1つの番で1本の線が完成します。
          - セレビィが86%です。草ポケモンとスタジアムを合計3枚持ってこられるので、
            進化の材料と活力の森を同時に探せます。
          - おたがいに効くスタジアムなので、相手にも進化を許してしまいます。
            それでも入れているのは、得をする量がこちらのほうが大きいからです。

    まとめ:
      - メガニウムでエネルギーが2個ぶんに数えられる
      - オーガポンを4匹並べて、1つの番に何枚もエネルギーを置く
      - 数えるのは場のエネルギー全部 ── ベンチのぶんもダメージになる
      - 活力の森で、2進化が2種類あっても間に合う
      - つけながら30回復するので、削り合いに強い
    しめ: >
      メガレックウザexが一気に届かせるデッキだとすれば、
      こちらは数え方そのものを2倍に変えてしまうデッキです。
      同じ「エネルギーの数だけ強い」でも、作り方がまったく違います。

    弱点:
      - 弱点は 炎×2 です。165ダメージで倒れます。
      - メガニウムを倒されると、数える数が半分に戻ります。
        カミツオロチexより先に、こちらを狙われるのが一番つらいです。
      - 活力の森を張り替えられると、進化が1ターン以上遅れます。
      - カジッチュはHP40、チコリータはHP70しかありません。
        出したばかりの番に倒されると育ちません。

    対面:
      - 炎タイプで攻撃できるなら、HP330も165ダメージで倒せます。
      - ベンチのメガニウムをボスの指令で呼んで倒すと、ダメージが半分近くまで落ちます。
      - スタジアムを張り替えると、進化が遅れます。
      - 回復されるので、少しずつ削る戦い方は向きません。一撃で倒しきるほうが確実です。
