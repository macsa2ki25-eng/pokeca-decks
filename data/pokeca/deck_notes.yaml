# 環境デッキの読み方。
#
# 採用率・打点・事故率などの数字は自動で計算されるので、ここには書かない。
# ここに書くのは、数字からは出てこない「なぜ」だけ。
#
# 書き方の約束:
#
#   文体
#     - ですます調でそろえる。子どもが読んで自然な日本語にする
#     - 体言止めを続けない。「ここが本質。」ではなく「ここが本質です。」
#     - 「〜と読んだ」「教わった」「〜らしい」は書かない。
#       誰かから聞いた話として書くと、読む側には意味がない。分かったことだけ書く
#     - 専門用語は避ける。「非対称」ではなく「割に合う」
#
#   数字の書き方 (ここが混ざると読めなくなる)
#     - HPは必ず「HP320」と書く。数字だけにしない
#     - ワザのダメージは必ず「200ダメージ」と書く
#     - ダメカンは「ダメカン6個」。ダメージに直すときは「ダメカン6個(60ダメージ)」
#     - サイドは「サイド2枚」
#
#   中身
#     - 実際のカードテキストと採用率から言えることだけ書く
#     - Markdown は使えない。強調したいときは言葉の順番で強調する
#     - 「強い」で終わらせない。何がどう強いのかを書く
#     - 弱点も必ず書く。良いことしか書いていない解説は役に立たない
#     - 環境は動く。古くなったら直す

updated: "2026-08-13"
based_on: "直近1週 333件 / 中身つき3673デッキ"

decks:
  ドラパルトex:
    結論: >
      倒されない体と、殴らずに削る手段が、ひとつのデッキに入っています。
      強いカードが1枚あるのではなく、組み合わせ方が強いデッキです。
    節:
      - 見出し: まず、倒されない
        引用: "ドラパルトex   HP320   竜タイプ   弱点なし   にげる1"
        本文:
          - ポケモン1097枚のうち、弱点が無いのは64枚だけです。そのうち58枚が竜タイプで、
            ドラパルトexもその1枚です。
          - 弱点があると、そのタイプで攻撃されたときにダメージが2倍になります。
            つまり半分のダメージで倒されてしまいます。
            ドラパルトexにはその抜け道がありません。相手はまともに320ダメージを
            出さないと倒せません。
          - にげるが1なのも大きいです。大きなポケモンは、呼び出されると動けなくなって
            負けることがよくありますが、ドラパルトexはすぐ逃げられます。

      - 見出し: 殴らずに削る
        引用: |
          ファントムダイブ   炎エネルギー1個 + 超エネルギー1個 → 200ダメージ
            ダメカン6個を、相手のベンチポケモンに好きなようにのせる
        本文:
          - ふつうのポケモンは、目の前の1匹を殴るだけです。
            ドラパルトexは殴りながら、まだ出てきていない次の相手にもダメカンを置けます。
          - なぜ強いのか。相手のHPを見ると分かります。
            キチキギスexはHP210、ラティアスexもHP210、タケルライコexはHP240です。
            ここに先にダメカンを置いておけば、次のターンの200ダメージで倒せるようになります。
          - 2ターン後に必要なダメージを、今のターンのうちに先払いしているわけです。
            相手は、準備しているだけのベンチポケモンが勝手に減っていきます。

      - 見出し: ダメカンの置き方が自由
        本文:
          - ここがこのデッキで一番おもしろいところです。
            ダメカン6個は、1匹にまとめて置く必要がありません。
            1匹目に1個、2匹目に2個、3匹目に3個、というように配れます。
          - よく使うのは、相手のHPをちょうど200にする置き方です。
            キチキギスexやラティアスexのようなHP210のポケモンにダメカンを1個だけ置くと、
            残りHPが200になります。次のターンにボスの指令で呼び出せば、
            ファントムダイブの200ダメージでちょうど倒しきれます。
            ベンチに置いたぶんと合わせて、1ターンで2匹倒せることもあります。
          - 残りHPを130にする置き方もあります。残りHP130なら
            ヨノワールのカースドボム(ダメカン13個)がちょうど届くので、
            殴らずに倒せる状態になります。
          - メガゲッコウガexも特性でダメカン6個を置けますが、あちらは1匹にまとめてです。
            自由に配れるドラパルトexのほうが、ダメージを細かく調整できます。
          - ポケモンカードのHPとダメージは、とても細かく決められています。
            HP330とHP340では、ドラパルトexが多い今の環境では大違いです。
            HP330なら倒せて、HP340なら倒せない、ということが起きるからです。
            新しいカードのHPが10ちがうだけで、環境での立ち位置が変わります。

      - 見出し: ダメージとダメカンは、別のもの
        引用: |
          シェイミ 【はなのカーテン】自分のベンチポケモン(ルールを持つポケモンをのぞく)全員は、
                                  相手のワザのダメージを受けない
          ロック闘エネルギー  つけているポケモンは、相手のポケモンが使うワザの効果を受けない
        本文:
          - ポケモンカードでは、この2つをはっきり分けて考えます。
            ワザで与えるのが「ダメージ」、あとから置くのが「ダメカン」です。
            ダメカンを置くのは、ワザや特性の「効果」のあつかいになります。
          - だからシェイミがいても、ファントムダイブのダメカンは置けます。
            シェイミが防ぐのはダメージのほうだけだからです。
          - 逆にロック闘エネルギーをつけたポケモンには、ダメカンが置けません。
            こちらはワザの「効果」を受けないカードだからです。ダメージは通ります。
          - カードのテキストに「ダメージ」と書いてあるか「ダメカン」と書いてあるかで、
            通るか通らないかが変わります。読むときに気をつけたいところです。

      - 見出し: ダメカンを置く手段が、ほかにもある
        引用: |
          サマヨール 【カースドボム】自分をきぜつさせて、相手1匹にダメカン5個
          ヨノワール 【カースドボム】自分をきぜつさせて、相手1匹にダメカン13個
          マシマシラ 【アドレナブレイン】自分の場のダメカン3個を、相手にのせ替える
        本文:
          - ダメカンを置く手段が4種類もあります。採用率にも出ていて、
            マシマシラが93%、ヨマワル・サマヨール・ヨノワールが65%です。
          - ヨノワールのダメカン13個(130ダメージ)とファントムダイブのダメカン6個(60ダメージ)を
            合わせると、殴らずに190ダメージぶんを置けます。
            そこにファントムダイブの200ダメージが乗ります。
            HP320のポケモンでも届く計算になります。
          - しかも安く済みます。カースドボムは自分のポケモンがきぜつしますが、
            サマヨールもヨノワールもexではないので、相手に渡すサイドは1枚だけです。
            サイド1枚で130ダメージぶんを置けるので、かなり割に合います。
          - ダメージが無駄になりません。1発で倒しきれなくても、
            余ったぶんはベンチのポケモンに残ります。
            330ダメージ出せるデッキがHP240のポケモンを倒すと90ダメージぶんが消えますが、
            ドラパルトexは消えません。

      - 見出し: サイドの取られ方を決める
        引用: |
          非ルールのポケモン … 倒されると 相手はサイドを1枚とる
          ポケモンex        … サイド2枚
          メガシンカex      … サイド3枚
        本文:
          - 勝つにはサイドを6枚とります。だから「何をどの順で倒して6枚にするか」を
            先に考えます。これをサイドプランといいます。
          - 自分がどう取られるかも同じくらい大事です。exを1匹倒されると2枚、
            メガシンカexなら3枚も進んでしまいます。
            渡すなら、なるべく安いポケモンで渡したいところです。
          - ドラパルトexはここが上手です。カースドボムで自分からきぜつするサマヨールも
            ヨノワールも非ルールなので、渡すサイドは1枚だけで済みます。

      - 見出し: 「倒す」と「倒される」は別の話
        引用: |
          アンフェアスタンプ  前の相手の番に「自分の」ポケモンがきぜつしていないと使えない
          キチキギスex 【さかてにとる】「自分の」ポケモンがきぜつしていたら、山札を3枚引く
        本文:
          - どちらも「自分のポケモンが倒されたとき」に使えるカードです。
            相手を倒したかどうかは関係ありません。ここを読み違えると分からなくなります。
          - つまり、話が2つあります。
          - ひとつめ。相手を倒すと、相手のこれらが使えるようになってしまいます。
            だから、わざと倒さずに残しておくと、相手は立て直せません。
            ダメカンだけ置いておいて、終わりのほうでまとめて倒す、という戦い方ができます。
          - ふたつめ。自分が倒されると、自分のこれらが使えます。
            ドラパルトexは、スボミーを安く差し出すことで、これを自分から起こしています。
          - 採用率にはっきり出ています。アンフェアスタンプが81%、キチキギスexが98%です。
            倒されることを前提に組まれています。

      - 見出し: スボミーは、わざと倒させるカード
        引用: |
          スボミー   HP30   草タイプ   にげる0
          むずむずかふん   エネルギー0個 → 10ダメージ
            次の相手の番、相手は手札からグッズを出して使えない
        本文:
          - スボミーはHP30しかないので、前に出せばまず倒されます。
            でもそれでいいのです。倒されると、いいことが4つ同時に起きます。
          - 相手に渡すサイドは1枚だけです。exを渡すより安く済みます。
          - むずむずかふんの10ダメージが相手に残ります。これが後で効いてきます。
            ファントムダイブの200ダメージとカースドボムの130ダメージを足すと330ダメージで、
            ここが上限です。でも10ダメージを1回入れておけば340ダメージ、
            2回なら350ダメージになります。HP350のメガゲッコウガexにも届くようになります。
          - グッズを止めるので、相手を1ターン遅らせられます。
          - そして自分のポケモンが倒されたので、アンフェアスタンプが使えるようになります。
          - 倒されたあとも、夜のタンカでトラッシュから拾い直して、もう一度前に出せます。
            同じことを何度も繰り返せます。

      - 見出し: 攻撃する直前まで、ドロンチのままでいる
        本文:
          - このデッキは、すぐにドラパルトexへ進化しません。
            攻撃するターンになって、はじめて進化します。
          - ドロンチの【ていさつしれい】を使い続けたいからです。
            ベンチにドロンチを何匹も並べて、毎ターン手札を増やしながら準備します。
            進化してしまうと、その1匹はもう山札を見てくれません。
          - エネルギーも、1匹に集めずに何匹かのドロンチに分けてつけます。
            エネルギーが2個ついたドロンチをボスの指令で呼ばれて倒されると、
            エネルギーの進みぐあいが大きく遅れてしまうからです。
          - だから相手も、エネルギーのついたドロンチをねらってきます。
            倒せば【ていさつしれい】も止まり、エネルギーも遅れます。
            ここがこのデッキとの戦いの中心になります。
          - 相手がダメカンをばら撒くデッキのときは別です。
            HP90のドロンチでは耐えられないので、先に進化することもあります。

      - 見出し: サイドは、わざと先に取らせる
        本文:
          - サポートは1ターンに1枚しか使えません。
            エネルギーが足りなくてアカマツを使うと、そのターンはボスの指令が使えず、
            ただ殴るだけになってしまいます。
          - だから序盤は無理をしません。スボミーで相手を遅らせながら、
            ベンチにドロンチを並べて、余裕があるときにマシマシラやサマヨールを育てます。
          - このあいだ、サイドはかなり先に取られます。でもそれでいいのです。
            ドラパルトexは1ターンに何匹も倒せるので、後から一気にひっくり返せます。
            最初から逆転するつもりで組まれているデッキです。

      - 見出し: 2進化なのに、事故りにくい
        引用: |
          ドラメシヤ4枚(100%)   ドロンチ4枚(100%)   ポケパッド4枚(100%)
          リーリエの決心4枚(100%)   ふしぎなアメ(81%)
        本文:
          - 2進化のデッキは「進化が間に合わない」のが弱点ですが、
            それを消すカードが確定枠に並んでいます。
          - とくにドロンチです。【ていさつしれい】は自分の番に1回、山札の上2枚を見て
            1枚を手札に加えられます。
            ふつう1進化は「2進化になるまでの通り道」でしかありませんが、
            ドロンチは場にいるだけで毎ターン手札が増えます。
            1進化そのものがエンジンになっているところが、ほかの2進化デッキと違います。
          - ポケパッドもよく合っています。「ルールを持たないポケモン」しか持ってこられませんが、
            このデッキのドラメシヤもヨマワルもマシマシラも全部その条件を満たします。
            制限が制限になっていません。
          - エネルギーも軽いです。HP320のポケモンが、エネルギー2個で
            200ダメージ+ダメカン6個を出します。炎と超の2色が必要ですが、
            アカマツ1枚でその両方が用意できます。

    まとめ:
      - 倒されない ── HP320・弱点なし・にげる1
      - 削る手段が多い ── 200ダメージ + ダメカン6個 + カースドボム + のせ替え
      - 先回りできる ── 次のターンに倒すための準備を、今のターンにできる
      - サイドが安い ── 自分から倒れるのは非ルール。渡すのはサイド1枚
      - 事故りにくい ── ふしぎなアメ・ていさつしれい・ポケパッド・リーリエの決心
    しめ: >
      硬いから強いのでも、ダメージが大きいから強いのでもありません。
      硬さと先回りが同時にできるので、相手は「今の1匹を守ること」と
      「次の1匹を守ること」を一度に考えなければならなくなります。
      それが一番使われている理由です。

    弱点:
      - スボミーを98%も入れているのは、グッズを止められると困るデッキが
        それだけ多いということです。裏を返せば、ドラパルトex自身も
        ふしぎなアメやボールに強く頼っています。同じことをやり返されると苦しくなります。
      - ヨマワルはHP60、サマヨールはHP90しかありません。
        カースドボムを準備しているあいだは弱いので、ベンチをねらわれると計画が崩れます。
      - ドロンチは手札を増やす役と、エネルギーの置き場という2つの役をしています。
        エネルギーのついたドロンチをボスの指令で倒されると、
        【ていさつしれい】も止まり、エネルギーも遅れます。2つ同時に痛いです。
      - サポートは1ターンに1枚だけです。アカマツを使ったターンはボスの指令が使えず、
        ダメカンを置きたいところに置けません。
      - 事故率は低くありません。337件の平均で20.1%です。
        たねポケモンが8枚の構築だと34.6%になります。5回に1回は最初でつまずきます。
      - 弱点が無いことをひっくり返すカードが出てきています。
        リーリエのピッピexの【フェアリーゾーン】は、相手の場のポケモン全員の弱点を
        超タイプにしてしまいます。ドラパルトexも弱点 超×2 になるので、
        ダダリンの170ダメージが340ダメージになり、HP320が一撃で倒れます。
        こういうカードを、そのデッキを止めるために作られたカードという意味で
        メタカードと呼びます。

    対面:
      - ベンチを広げすぎないようにします。ダメカンを置く先が減ると、
        ファントムダイブの値打ちが下がります。
      - HP210くらいのポケモンをベンチに並べると、ダメカンを1個置かれて残りHP200にされ、
        次のターンにまとめて倒されます。
      - スボミーなどでグッズを止めると、ふしぎなアメが使えなくなって育ちません。
      - エネルギーのついたドロンチをボスの指令で呼んで倒すのが一番効きます。
        【ていさつしれい】が止まり、エネルギーも遅れ、
        相手はアカマツなどエネルギーを増やすサポートしか使えなくなります。
      - ロック闘エネルギーをつけたポケモンは、相手のワザの効果を受けません。
        ファントムダイブでダメカンを置くのはワザの「効果」なので、
        そのポケモンにはダメカンが置けなくなります。
      - サイドを先に取れても油断できません。ドラパルトexは1ターンに何匹も倒せるので、
        最後にまとめて返されます。3枚差でも安心してはいけません。

  メガレックウザex:
    結論: >
      入れたエネルギーが、1枚残らずダメージになります。
      エネルギーが攻撃のための材料ではなく、ダメージそのものになっている珍しいデッキです。
    節:
      - 見出し: ダメージの正体
        引用: |
          メガレックウザex   HP280   たねポケモン   無タイプ   弱点 雷×2   にげる2

          【はしゃのほうこう】手札からベンチに出したとき、山札の上4枚を見て、
                             基本エネルギーを1枚このポケモンにつける
          ストームエメラルダ   エネルギー3個 (炎・雷・無)
            → 自分のポケモン全員についているエネルギーの数 × 50ダメージ
        本文:
          - 「全員」というところが全てです。攻撃するポケモンについている必要がありません。
            ベンチのどこに置いたエネルギーでも、タイプが何であっても、ダメージになります。
          - だからエネルギーを17.5枚も入れます。ドラパルトexは8.2枚で、
            ふつうのデッキは8〜12枚くらいです。この数字だけでデッキの性格が分かります。
          - ゼロの大空洞を74%が入れてベンチを8匹にするのも、
            エネルギーを置く場所を増やすためです。
            ヒビキのホウオウexが手札からエネルギー2枚を置けるのも、
            置いた先がどこであってもダメージになるからです。
          - そしてたねポケモンなので、2進化のドラパルトexが立つ前から攻撃できます。
            事故率も14.5%で、ドラパルトexの20.1%より低いです。

      - 見出し: ダメージが階段になっている
        引用: |
          エネルギー4個 → 200ダメージ   何も倒せない (キチキギスexのHP210に10足りない)
          エネルギー5個 → 250ダメージ   HP210〜240を一撃
          エネルギー6個 → 300ダメージ   HP280までを一撃
          エネルギー7個 → 350ダメージ   今の環境のアタッカーを全部一撃
        本文:
          - エネルギー7個が完成形です。ここまで来ると、
            今の環境で一撃で倒せない相手がいなくなります。
          - 逆にエネルギー4個以下では、何も倒せません。
            この立ち上がりの空白が、このデッキの弱いところです。
          - ダメージが50ずつしか上がらないのも大事な性質です。
            250ダメージでHP210のポケモンを倒すと、40ダメージぶんが消えてしまいます。
            ドラパルトexのように、余ったぶんをベンチに回すことができません。
            無駄が出るのは、このデッキの仕組み上どうしようもありません。
          - そのかわり上限がありません。HP320〜350を一撃で倒せるのは、
            今のところこのデッキだけです。
            効率は悪いけれど、届く高さと速さで押し切る形です。

      - 見出し: 心配なのは、最初の1回目の攻撃
        本文:
          - 序盤の攻撃が、特性【はしゃのほうこう】が当たるかどうかで決まります。
            山札の上4枚を見て基本エネルギーを探すので、外れることがあります。
            外したときの出遅れが痛いです。
          - 中盤から後はヒビキのホウオウexでエネルギーがどんどん増えるので、
            ダメージに困ることはなくなります。
            つまりこのデッキの心配は、最初の1回に集まっています。
          - だから、最初の攻撃をメガレックウザexに任せず、
            ファイアローex(82%が採用)から始める形のほうが安定します。
            【エキサイトダイブ】で手札からそのままベンチに出られて、
            エネルギー2個で150ダメージを出しながら山札から2枚持ってこられます。

      - 見出し: エネルギーが減ると、弱くなる
        引用: "エネルギーつけかえ 91%(平均3.4枚)   ガラスのラッパ 74%"
        本文:
          - ふつうのデッキは、ポケモンを倒されてもエネルギーさえ残っていれば戦えます。
            このデッキは違います。エネルギーのついたポケモンを倒されると、
            そのぶんダメージが50ずつ落ちていきます。
          - エネルギーつけかえは、倒されそうなポケモンからエネルギーを逃がすカードです。
            ガラスのラッパはトラッシュから拾い直すカードです。
            どちらもこの穴をふさぐために入っています。
            採用率がこれだけ高いのは、それだけ困るということです。

    まとめ:
      - 速い ── たねポケモン。事故率14.5%
      - 上限が高い ── エネルギー7個で350ダメージ。全アタッカーが射程内
      - 無駄は出る ── 50ずつしか上がらず、余りをベンチに回せない
      - 減ると弱る ── エネルギーを失うたびにダメージが50下がる
    しめ: >
      ドラパルトexが無駄なく削るデッキだとすれば、こちらは一気に届かせるデッキです。
      正反対の作りの2つが、同じ環境の上位に並んでいます。

    弱点:
      - ベンチを広げるほど、ドラパルトexにダメカンを置かれる相手が増えます。
        ラティアスexがHP210、キチキギスexがHP210、テラパゴスexがHP230、
        ヒビキのホウオウexがHP230です。この帯のexが横に並ぶ形は、
        ファントムダイブとカースドボムが一番効く形でもあります。
        強くするための行動が、そのまま弱点を広げてしまっています。
      - グッズに頼りすぎています。ハイパーボールが98%(平均3.9枚)、
        ぼうけんのランタンが93%、エネルギーつけかえが91%、ガラスのラッパが74%です。
        それなのにスボミーは入っていません。ドラパルトexは98%入れています。
      - 弱点は 雷×2 です。今のところ罰されていません。
        雷タイプのアタッカーはメガライボルトex(HP330)やメガシビルドンex(HP350)が
        いますが、どちらも上位のデッキに入っていません。眠っている弱点です。
        環境が雷に傾くと、140ダメージで倒れるようになります。
      - HP280は、今のメガシンカの中ではやや低いです。
        メガルカリオexがHP340、メガゲッコウガexがHP350、メガガルーラexがHP300です。
      - メガシンカexは倒されるとサイドを3枚も渡します。
        だから「展開に使った非ルールで1枚、exで2枚、最後にメガレックウザexで3枚」
        という順で、ちょうど6枚取られてしまいます。
        事故を許せる余裕が、ほかのデッキより1ターン短いということです。

    対面:
      - エネルギーのついたベンチをねらいます。1匹倒すごとに、相手のダメージが50下がります。
      - グッズを止めるのがよく効きます。相手はスボミーを入れていません。
      - 弱点は、攻撃するポケモンのタイプで決まります。
        メガレックウザexは無タイプなので、雷エネルギーを使っていても
        同じメガレックウザex同士で弱点2倍にはなりません。突けるのは雷タイプだけです。

  メガルカリオex:
    結論: >
      殴りながら、次のエネルギーを並べます。攻撃と準備が1つのワザにまとまっています。
    節:
      - 見出し: 2つのワザを交互に使う
        引用: |
          メガルカリオex   HP340   闘タイプ   弱点 超×2

          はどうづき   闘エネルギー1個 → 130ダメージ
            自分のトラッシュから基本エネルギーを3枚まで選び、ベンチに好きなようにつける
          メガブレイブ 闘エネルギー2個 → 270ダメージ
            次の自分の番、このポケモンはメガブレイブが使えない
        本文:
          - メガブレイブは270ダメージ出ますが、続けて撃てません。
            だから、はどうづきと交互に使う形になります。
          - そのはどうづきが優秀です。130ダメージを出しながら、
            トラッシュから基本エネルギー3枚をベンチに配れます。
            攻撃するターンが、そのまま次の準備のターンになっています。
          - パワープロテインを100%が入れています。その番の闘ポケモンのダメージが
            30増えるので、270ダメージが300ダメージになります。
            130ダメージのほうも160ダメージになります。

      - 見出し: 引くしくみが独特
        引用: |
          ルナトーン 【ルナサイクル】場にソルロックがいて、手札から基本エネルギーを
                                   1枚トラッシュするなら、山札を3枚引く
          ソルロック   コスモビーム 闘エネルギー1個 → 70ダメージ
                     ベンチにルナトーンがいないと失敗。弱点・抵抗力を計算しない
        本文:
          - ソルロックを99%が入れています。ルナトーンと2匹そろえると、
            手札のエネルギーを捨てて3枚引けるようになります。
          - 捨てたエネルギーは無駄になりません。はどうづきがトラッシュから拾ってくるからです。
            引くために捨てることと、エネルギーを増やすことがつながっています。
          - ファイトゴングを100%が入れています。闘タイプのたねポケモンか
            基本闘エネルギーを持ってこられるので、リオルもソルロックもルナトーンも
            この1枚で届きます。

    まとめ:
      - HP340は今の環境で最大級
      - 殴りながらエネルギーを並べられる
      - 引くしくみとエネルギーの流れがつながっている
      - 序盤から大きなダメージを出せる
    しめ: >
      派手ではありませんが、攻撃と準備と手札の補充が、たがいに支え合っています。
      1〜2か月前は4.4%でしたが、直近1週では7.5%まで増えています。
      序盤から大きなダメージを出せるので、立ち上がりの遅いデッキには
      先にサイドを取って押し切れます。

    弱点:
      - メガブレイブを撃った次の番は270ダメージが出せません。相手にとってはそこが攻め時です。
      - 弱点は 超×2 です。170ダメージで倒れます。HP340が実質170になってしまいます。
      - リオル(HP70)から育てる必要があります。育つ前をねらわれると遅れます。
      - メガシンカexなので、倒されるとサイドを3枚渡します。1匹で試合が決まりかねません。

    対面:
      - 超タイプで攻撃できるなら、HP340も170ダメージで倒せます。ここが一番はっきりした答えです。
      - メガブレイブを撃たれた次のターンに攻め返します。
      - リオル(HP70)のうちに倒せると、そもそも育ちません。
      - サイドを3枚渡すメガルカリオexは最後に残しておいて、
        先に非ルールとexで3枚取っておくと、一気に決められます。

  タケルライコex:
    結論: >
      エネルギーを捨てた枚数だけダメージが出ます。上限がないかわりに、
      毎ターン並べ直さなければなりません。
    節:
      - 見出し: 捨てるほど強い
        引用: |
          タケルライコex   HP240   竜タイプ   弱点なし

          きょくらいごう   エネルギー2個 (雷・闘) → 70ダメージ ×
            自分の場のポケモンについている基本エネルギーを好きなだけトラッシュし、
            その枚数 × 70ダメージ
          はじけるほうこう エネルギー1個 → 手札を全部トラッシュして、山札を6枚引く
        本文:
          - 3枚捨てれば210ダメージ、4枚で280ダメージ、5枚で350ダメージになります。
            上限がありません。
          - 竜タイプなので弱点がありません。HP240は特別高くありませんが、
            半分のダメージで倒される抜け道がないぶん、思ったより硬く感じます。
          - はじけるほうこうも独特です。手札を全部捨てて6枚引き直せるので、
            事故ったときの立て直しが強いです。

      - 見出し: エネルギーを補い続ける
        引用: |
          オーガポン みどりのめんex   HP210   草タイプ   弱点 炎×2
          【みどりのまい】自分の番に1回、手札から基本エネルギーを1枚このポケモンにつけて、
                        山札を1枚引く
        本文:
          - 99%が入れています。毎ターン、手札からエネルギーを1枚つけて1枚引けるので、
            捨てたぶんを補い続けられます。
          - アカマツも100%が入っています。ちがうタイプの基本エネルギー2枚を持ってきて、
            1枚を場につけられます。雷・闘・草の3色が必要ですが、この2枚で回っています。
          - ラティアスexを95%が入れています。たねポケモンのにげるが0になるので、
            攻撃する相手を選びやすくなります。

    まとめ:
      - 上限がない ── 5枚捨てて350ダメージ
      - 弱点がない ── 半分のダメージで倒される抜け道がない
      - 事故に強い ── 手札を全部捨てて引き直せる
    しめ: >
      1〜2か月前は2.8%でしたが、直近1週では7.2%まで増えています。
      上限の高さと事故への強さが、メガレックウザexの登場で速くなった環境に
      合ってきたのだと思います。

    弱点:
      - 大きく殴った次の番は、捨てたぶん場のエネルギーが減っています。ダメージが落ちます。
      - 毎ターン並べ直す必要があるので、エネルギーを引けないと止まります。
      - オーガポン みどりのめんexの弱点は 炎×2 です。
        エンジン役をここで折られると回らなくなります。
      - 非ルールのポケモンで攻撃してくる相手に弱いです。
        1ターンに1匹しか倒せないので、相手が非ルールばかりだと
        サイド6枚とるのに6ターンかかります。
        一方こちらのexは倒されるとサイド2枚渡すので、相手は3ターンで終わります。
        殴り合った回数は同じなのに、進み方が倍ちがいます。

    対面:
      - 大きく殴られた次のターンが攻め時です。相手のダメージが一番低い瞬間です。
      - オーガポン みどりのめんexを先に倒すと、エネルギーの補充が止まります。

  メガゲッコウガex:
    結論: >
      HP350の体と、毎ターン置けるダメカン6個。硬さとダメカンを両方持っています。
    節:
      - 見出し: 特性が本体
        引用: |
          メガゲッコウガex   HP350   水タイプ   弱点 雷×2   にげる1

          【ひっさつしゅりけん】バトル場にいて、手札から基本水エネルギーを1枚
                              トラッシュするなら、自分の番に1回使える。
                              相手のポケモン1匹に、ダメカンを6個のせる
          ニンジャスピナー   水エネルギー2個 → 120ダメージ
            のぞむなら、ついている水エネルギーを1個手札にもどして、80ダメージ追加
        本文:
          - 【ひっさつしゅりけん】が強力です。手札の水エネルギー1枚と引き換えに、
            毎ターン相手のどこかにダメカン6個(60ダメージ)を置けます。
            ワザとは別に使えるところが大きいです。
          - つまりドラパルトexと同じように、殴らずに削ることができます。
            しかもHP350は今の環境で一番高いHPです。
          - ニンジャスピナーは120ダメージですが、エネルギーを1個手札に戻せば
            200ダメージになります。戻したエネルギーは、
            次の【ひっさつしゅりけん】の燃料に回せます。
          - ただしダメカン6個は1匹にまとめて置きます。
            ドラパルトexのように何匹かに配ることはできません。
            そのぶん細かい調整はできません。

      - 見出し: もう1枚のアタッカー
        引用: |
          ゲッコウガex   HP310   闘タイプ   弱点 超×2
          しのびのやいば   水エネルギー1個 → 170ダメージ
            山札から好きなカードを1枚手札に加える
          ぶんしんれんだ   エネルギー3個 → エネルギー2個をトラッシュし、
                                        相手のポケモン2匹に それぞれ120ダメージ
        本文:
          - ぶんしんれんだは相手2匹に120ダメージずつ与えます。1ターンで2匹を削れます。
            【ひっさつしゅりけん】のダメカン6個(60ダメージ)を足せば180ダメージになり、
            HP170くらいまで届きます。
          - しのびのやいばは170ダメージを出しながら、山札から好きなカードを1枚
            持ってこられます。エネルギー1個でこれは軽いです。

      - 見出し: 相手を倒さずに残す
        引用: |
          スペシャルレッドカード  相手のサイドが3枚以下のとき、
                                相手の手札を山札の下にもどして3枚引かせる
          アンフェアスタンプ    前の相手の番に「自分の」ポケモンがきぜつしていないと使えない
        本文:
          - ワザを120ダメージと200ダメージから選べて、特性でダメカン6個を自由な場所に
            置けます。だから「あと少しで倒せるHP」で相手を残すことができます。
          - なぜそれがいいのか。アンフェアスタンプもキチキギスexの【さかてにとる】も、
            「自分のポケモンが倒されたとき」に使えるカードです。
            こちらが相手を倒さなければ、相手はそれを使えません。
          - ダメカンだけ置いて残しておき、終わりのほうでまとめて倒します。
            相手は立て直す時間がありません。
          - このデッキ自身は、アンフェアスタンプをほとんど入れていません(1%)。
            HP350で自分が倒されないので、使う場面が来ないからです。
            ドラパルトexが81%も入れているのは、スボミーがわざと倒されるデッキだからです。
            同じカードでも、デッキの戦い方によって入るか入らないかが変わります。

      - 見出し: それでも、ドラパルトexほど使われていない
        本文:
          - 書いてあることは強いのに、直近1週で3.6%です。ドラパルトexの14.7%には遠いです。
            理由は3つあります。
          - ひとつめ。エネルギーが重いです。特性を使うために毎ターン水エネルギーを
            1枚捨て続ける必要があり、ワザにも2個要ります。
          - ふたつめ。1進化が手札を増やしてくれません。
            ドラパルトexのドロンチは場にいるだけで毎ターン手札が増えますが、
            ゲコガシラにはそれがありません。
          - みっつめ。だから別に手札を増やすポケモンを入れる必要があります。
            でもボスの指令もミツルの思いやりも毎ターン使いたいので、
            ベンチもデッキの枠も足りません。
          - つまり、メガゲッコウガexの器用な動きを支えるカードが、
            今のカードプールに足りていません。
            カード1枚が強いことと、デッキとして組めることは別だという分かりやすい例です。

    まとめ:
      - 今の環境で一番高いHP350
      - 毎ターンダメカン6個を置ける。倒さずに残す戦い方ができる
      - 2匹同時に攻撃するワザもある
      - ただし支えるカードが足りず、組むのが難しい
    しめ: >
      ドラパルトexに近い戦い方を、もっと高いHPでやろうとしているデッキです。
      カード自体は強いのですが、それを支える周りのカードがそろっていません。
      強いカードが必ず強いデッキになるとはかぎらない、という例です。

    弱点:
      - ケロマツはHP60、ゲコガシラはHP90しかありません。育つ前がとても弱いです。
        ふしぎなアメを100%、なかよしポフィンを94%入れているのは、そこを急ぐためです。
      - 弱点が2種類あります。メガゲッコウガexは 雷×2、ゲッコウガexは 超×2 です。
        1つのデッキなのに、2方向から刺されます。
      - ふしぎなアメに頼りきりです。グッズを止められると育ちません。
      - 速いデッキに弱いです。メガルカリオexやタケルライコexに序盤サイドを詰められると、
        あとからメガゲッコウガexで攻撃を始めても間に合いません。
        特性はターンを重ねてこそ効くので、急かされる展開が一番苦しいです。
      - メガシンカexは倒されるとサイドを3枚渡します。
        序盤に展開で出したニャースexやキチキギスexで1枚と2枚、
        最後にメガゲッコウガexで3枚、という順で取り切られて終わります。
      - シェイミの【はなのカーテン】がいると、ベンチの非ルールポケモンは
        ワザのダメージを受けなくなります。ぶんしんれんだが通らなくなります。
        ただし【ひっさつしゅりけん】のダメカンは置けます。
        ダメージとダメカンは別のものだからです。

    対面:
      - ケロマツ・ゲコガシラのうちに倒します。育ってからでは硬いです。
      - グッズを止めるのが効きます。
      - 雷でも超でも、どちらかの弱点は必ず突けます。
      - シェイミをベンチに置いておくと、ぶんしんれんだで非ルールを2匹持っていかれずに済みます。

  マリィのオーロンゲex:
    結論: >
      進化した瞬間にエネルギーが5枚並びます。準備に何ターンもかけません。
    節:
      - 見出し: 1回で場が完成する
        引用: |
          マリィのオーロンゲex   HP320   悪タイプ   弱点 草×2

          【パンクアップ】手札から出して進化させたとき、山札から基本エネルギーを
                        5枚まで選び、自分のマリィのポケモンに好きなようにつける
          シャドーバレット   悪エネルギー2個 → 180ダメージ
            相手のベンチポケモン1匹にも、30ダメージ
        本文:
          - 【パンクアップ】が破格です。進化した瞬間に、山札からエネルギー5枚が場に並びます。
            ふつうは1ターンに1枚しかつけられないので、5ターンぶんを1回で飛ばしています。
          - シャドーバレットは180ダメージに加えて、ベンチにも30ダメージ入ります。
            ドラパルトexほどではありませんが、ダメージが無駄になりにくい形です。
          - スパイクタウンジムを100%が入れています。毎ターン、山札からマリィのポケモンを
            1枚手札に加えられるので、ボールを入れる枚数を減らせます。
            その空いた枠をほかのカードに使えます。

      - 見出し: 本当の主役はユキメノコとマシマシラ
        引用: |
          ユキメノコ 【いてつくとばり】このポケモンがいるかぎり、ポケモンチェックのたび、
                                    おたがいの特性を持つポケモン全員 (ユキメノコをのぞく) に
                                    ダメカンを1個ずつのせる
          マシマシラ 【アドレナブレイン】自分の場のダメカン3個までを、相手の場にのせ替える
        本文:
          - ユキメノコを89%、マシマシラを100%が入れています。この2匹がそろうと、
            おもしろいことが起きます。
          - 【いてつくとばり】は「おたがいの」場にダメカンを置きます。自分の場にも乗ります。
            ふつうなら損なだけですが、その自分側のダメカンをマシマシラが相手にのせ替えます。
            自分でダメカンを作って、相手に押しつける流れになります。
          - つまり、殴らずにダメージを作り、殴らずに相手へ運びます。
            ドラパルトexとはちがうやり方で、同じ「ばら撒いて削る」をしています。
          - これを支えているのが悪エネルギーです。【パンクアップ】で一気に並ぶうえ、
            マシマシラの【アドレナブレイン】はエネルギーがついていないと使えない特性なので、
            余った悪エネルギーをそのままマシマシラに回せます。無理なくかみ合っています。

    まとめ:
      - 準備が1回で終わる ── パンクアップでエネルギー5枚
      - 殴らずに削る ── ユキメノコで作って、マシマシラで押しつける
      - 枠が空く ── スパイクタウンジムでボールを減らせる
      - 弱点 草×2 ── 160ダメージで倒れる
    しめ: >
      速さでは環境でも上のほうです。ただし草タイプに弱いことがはっきりしているので、
      環境に草が増えると一気に苦しくなります。強さが環境に左右されるデッキです。

    弱点:
      - 弱点は 草×2 です。160ダメージで倒れます。
      - 【パンクアップ】は「進化したとき」の1回だけです。
        進化させる前に止められると、エネルギーが並びません。
      - マリィのベロバーはHP70しかありません。先に倒されると進化先がなくなります。
      - キチキギスexの採用率は7%しかありません。ドラパルトexは98%です。
        ベンチが5枠しかなく、マシマシラ2匹・ユキメノコ2匹・次のアタッカーのベロバーで
        埋まってしまうので、入れる場所がありません。
      - しかもユキメノコのダメカンは自分の場にも乗ります。
        マシマシラで相手に返せる量にはかぎりがあるので、
        キチキギスexにダメカンがたまると、ボスの指令で呼ばれてサイドを2枚持っていかれます。
        枠が空いていても入れにくいカードです。
      - ユキメノコが出てこないと、そもそもダメージが足りません。
        2匹のうち片方が欠けると、デッキの形が崩れます。

    対面:
      - 進化する前のベロバー(HP70)を倒すのが一番効きます。
      - 草タイプで攻撃できるなら、HP320も160ダメージで倒せます。
      - スパイクタウンジムを別のスタジアムで張り替えると、毎ターンのサーチが止まります。

  ドラパルトex＋バシャーモex:
    結論: >
      ドラパルトexの一番の困りごとだったエネルギーを、バシャーモexが解決した形です。
    節:
      - 見出し: 足りなかったものを足す
        引用: |
          バシャーモex   HP320   炎タイプ   弱点 水×2

          【たぎるとうし】自分の番に1回、自分のトラッシュから基本エネルギーを1枚選び、
                       自分のポケモンにつける
          バーニングソルト   エネルギー2個 (炎・無) → 200ダメージ
            次の自分の番、このポケモンはワザが使えない
        本文:
          - ドラパルトexは、ファントムダイブを打つまでのエネルギーの用意が大変です。
            アカマツを使ったターンはボスの指令が使えず、ダメカンを置きたい場所に置けません。
          - バシャーモexの【たぎるとうし】は、毎ターン、トラッシュからエネルギーを
            1枚つけられます。サポートを使わずにエネルギーが増えるので、
            サポートの枠をボスの指令に回せるようになります。
          - しかもバシャーモex自身がHP320で、200ダメージを出すアタッカーです。
            エネルギーを配る役と、殴る役を1匹で兼ねています。
          - 炎エネルギーはもともとファントムダイブに必要なので、
            炎タイプのバシャーモexとは無理なく同居できます。

      - 見出し: そのかわり弱点が増える
        本文:
          - ドラパルトexは弱点がありません。ここが最大の強みでした。
            ところがバシャーモexは 弱点 水×2 です。160ダメージで倒れます。
          - つまり、弱点で崩される道を自分から作っていることになります。
            水タイプの相手には、バシャーモexだけが狙われます。
          - デッキの枠も食います。バシャーモex用のホゲータを入れるぶん、
            ドロンチやサマヨールに使える枠が減ります。

    まとめ:
      - エネルギーの悩みが消える ── サポートを使わずに毎ターン1枚
      - アタッカーが2匹になる ── HP320が2種類
      - 弱点ができる ── バシャーモexは 水×2
      - 枠が減る ── ホゲータのぶん、ほかのカードが入らない
    しめ: >
      1〜2か月前は9.3%ありましたが、直近2週では5.3%まで減っています。
      素のドラパルトexのほうが11.3%と多く、いまは「エネルギーを足すより、
      弱点なしのまま戦ったほうがよい」と考える人が増えているようです。

    弱点:
      - バシャーモexの 弱点 水×2 が唯一のはっきりした穴です。
      - バーニングソルトは次のターン使えないので、続けて撃てません。
      - ドラパルトexの部分の弱点は、そのまま全部残っています。

    対面:
      - 水タイプで攻撃できるなら、バシャーモexだけをねらいます。
      - バーニングソルトを撃たれた次のターンが攻め時です。
      - ドラパルトex単体のときと同じで、エネルギーのついたドロンチをねらうのが効きます。

  Nのゾロアークex:
    結論: >
      ベンチのポケモンのワザを、自分のワザとして使えます。
      その場に一番合う攻撃を、毎ターン選べるデッキです。
    節:
      - 見出し: ワザを借りて使う
        引用: |
          Nのゾロアークex   HP280   悪タイプ   弱点 草×2

          【とりひき】自分の番に1回、手札を1枚トラッシュして、山札を2枚引く
          ナイトジョーカー   悪エネルギー2個
            自分のベンチの「Nのポケモン」が持つワザを1つ選び、このワザとして使う
        本文:
          - ここが仕組みの中心です。ベンチに置いた「Nのポケモン」のワザを、
            ゾロアークexが使えます。
          - 大事なのは、借りるワザのエネルギーは要らないということです。
            ナイトジョーカーは悪エネルギー2個で撃てます。
            借りる相手がどんなに重いワザを持っていても、悪エネルギー2個で撃てます。
          - たとえばNのゼクロムの「ランページサンダー」は、
            本来ならエネルギー4個(炎・雷・雷・無)必要で250ダメージ出ます。
            それを悪エネルギー2個で撃てるわけです。
          - だからデッキに入れるエネルギーは悪だけで済みます。
            重いワザをたくさん積んでも、エネルギーの色で困りません。

      - 見出し: 相手に合わせて選ぶ
        引用: |
          Nのゼクロム   ランページサンダー → 250ダメージ (次の番は使えない)
          Nのレシラム   パワーレイジ → このポケモンのダメカンの数 × 20ダメージ
          モモワロウex  イライラバースト → 相手がすでにとったサイドの枚数 × 60ダメージ
        本文:
          - 3つの性格がちがうワザを、その場で選べます。
          - 大きく倒したいときはランページサンダーで250ダメージです。
          - 負けていてサイドを先に取られているときは、イライラバーストが効きます。
            相手がサイドを4枚取っていれば240ダメージになります。
            追い込まれているほど強くなるワザです。
          - 自分がダメカンを乗せられているときはパワーレイジです。
            削られた状態が、そのまま攻撃力になります。
          - つまり、不利な状況ほど選べる手が増えます。
            ふつうのデッキは負けているときに手が細りますが、このデッキは逆です。

    まとめ:
      - ワザを借りられる ── 重いワザも悪エネルギー2個で撃てる
      - エネルギーが1色で済む ── 借りるワザの色は関係ない
      - 不利なほど強くなるワザがある ── イライラバースト・パワーレイジ
      - 【とりひき】で手札が回る
    しめ: >
      ふつうは、強いワザを使うには重いエネルギーが必要です。
      その決まりごとを飛ばしているところが、このデッキの面白さです。

    弱点:
      - 弱点は 草×2 です。140ダメージで倒れます。
      - ベンチにNのポケモンがいないとナイトジョーカーが使えません。
        ベンチをねらわれると、攻撃そのものができなくなります。
      - ゾロアークexは倒されるとサイドを2枚渡します。
        借りる元のポケモンも並べるので、ベンチが埋まりやすいです。

    対面:
      - 草タイプで攻撃できるなら、HP280も140ダメージで倒せます。
      - ベンチのNのポケモンをボスの指令で呼んで倒すと、使えるワザが減ります。
      - サイドを一気に取りすぎると、イライラバーストのダメージが上がります。
        取る順番を考える必要があります。

  おまつりおんど:
    結論: >
      非ルールのポケモンで戦うので、倒されてもサイドを1枚しか渡しません。
      同じ回数殴り合うほど得をするデッキです。
    節:
      - 見出し: スタジアムがワザを2回にする
        引用: |
          カミッチュ   HP80   草タイプ   弱点 炎×2
          【おまつりおんど】場に「お祭り会場」が出ているなら、
                         このポケモンは持っているワザを2回連続で使える
          ともだちのわ   草エネルギー1個 → 自分のベンチポケモンの数 × 20ダメージ

          お祭り会場 (スタジアム)  お祭り会場が場に出ている必要がある
        本文:
          - カミッチュはHP80の非ルールポケモンです。
            それが「お祭り会場」と組み合わさると、ワザを2回続けて使えます。
          - ともだちのわは、自分のベンチポケモンの数×20ダメージです。
            ベンチが5匹なら100ダメージ、それが2回で200ダメージになります。
          - ブレイブバングルを99%が入れています。非ルールポケモンのワザが、
            相手のバトル場のポケモンexへ30ダメージ増えます。
            2回攻撃なので、増えるのも2回ぶんです。合わせて260ダメージになります。
          - エネルギーは草1個だけです。用意がとても軽く、早い番から攻撃できます。

      - 見出し: サイドの取り合いで勝つ
        本文:
          - カミッチュは非ルールなので、倒されても相手に渡すサイドは1枚だけです。
          - 相手がポケモンexなら、こちらが倒せばサイドを2枚とれます。
            メガシンカexなら3枚です。
          - つまり、1匹ずつ倒し合っているだけで、こちらだけサイドが早く進みます。
            殴り合った回数が同じでも、勝つのはこちら側です。
          - バチンキーの【ドンドンだいこ】は、バトル場が「おまつりおんど」持ちのときに
            山札から好きなカードを1枚持ってこられます。
            必要なカードを毎ターン探せるので、動きが安定します。

    まとめ:
      - ワザが2回撃てる ── お祭り会場が出ているとき
      - エネルギーが軽い ── 草1個だけ
      - サイドで得をする ── 倒されても1枚しか渡さない
      - 探すのが得意 ── ドンドンだいこで毎ターン1枚
    しめ: >
      大きなダメージは出ませんが、サイドの取り合いで最初から得をしています。
      ポケモンexが並ぶ今の環境では、この作りがそのまま強みになります。

    弱点:
      - お祭り会場を別のスタジアムに張り替えられると、ワザが1回になります。
        ダメージが半分になるので、これが一番の弱点です。
      - カミッチュはHP80しかありません。少しのダメージで倒れます。
      - 弱点は 炎×2 です。40ダメージで倒れてしまいます。
      - ベンチの数でダメージが決まるので、ベンチが減ると弱くなります。

    対面:
      - スタジアムを張り替えるのが一番効きます。ワザが1回に戻ります。
      - 炎タイプなら、カミッチュもサルノリもすぐ倒せます。
      - ベンチを減らす手段があれば、ともだちのわのダメージが下がります。

  オーガポンバレット:
    結論: >
      性格のちがうアタッカーを何匹も並べて、相手に合うものを出していくデッキです。
    節:
      - 見出し: 1匹に頼らない
        引用: |
          オーガポン みどりのめんex  HP210  草  【みどりのまい】手札からエネルギー1枚を
                                              つけて、山札を1枚引く
          オーガポン いどのめんex    HP210  水  げきりゅうポンプ → 100ダメージ
          リーリエのピッピex        HP190  超  【フェアリーゾーン】相手の場のポケモン
                                              全員の弱点が 超×2 になる
          メガガルーラex          HP300  無  マシンガンコンボ → 200ダメージ以上
        本文:
          - バレットというのは、いろいろなアタッカーを撃ち分けるという意味です。
            相手のタイプや残りHPを見て、その場で一番よく効くポケモンを出します。
          - エネルギーつけかえを100%が入れています。
            オーガポンたちの間でエネルギーを移せるので、アタッカーを替えても
            エネルギーが無駄になりません。
          - ゼロの大空洞も100%です。ベンチが8匹になるので、
            アタッカーを何種類も並べておけます。

      - 見出し: ドラパルト対策が最初から入っている
        引用: |
          リーリエのピッピex 【フェアリーゾーン】
            このポケモンがいるかぎり、相手の場のポケモン全員の弱点は、
            すべて超タイプになる。［弱点は「×2」で計算する。］
        本文:
          - これは今の環境をよく表しているカードです。
          - ドラパルトexは弱点がないので倒しにくい相手ですが、
            【フェアリーゾーン】が場にあると 弱点 超×2 になります。
          - 超タイプのポケモンで攻撃すれば、HP320のドラパルトexが
            160ダメージで倒せる計算になります。
          - 一番使われているデッキを止めるために作られたカードを、メタカードといいます。
            リーリエのピッピexは、その分かりやすい例です。
            このデッキが99%も入れているのは、ドラパルトexが多いからです。

    まとめ:
      - 相手に合わせて選べる ── アタッカーが何種類もいる
      - エネルギーが無駄にならない ── つけかえで移せる
      - ドラパルト対策が入っている ── フェアリーゾーン
      - ベンチが広い ── ゼロの大空洞で8匹
    しめ: >
      1匹の強さで勝つのではなく、選べることで勝つデッキです。
      どのアタッカーを出すかを毎回考える必要があるので、慣れが要ります。

    弱点:
      - アタッカーがほとんどポケモンexです。倒されるとサイドを2枚渡します。
        非ルールで戦ってくる相手には、サイドの進み方で不利になります。
      - ベンチを8匹に広げるので、ドラパルトexのダメカンを置く相手が増えます。
      - オーガポン みどりのめんexの 弱点 炎×2 が、エネルギーを増やす役でもあります。
        ここを先に倒されると回らなくなります。

    対面:
      - リーリエのピッピexがいるうちは、こちらのポケモンの弱点が全部 超×2 になります。
        まずこれを倒すか、超タイプのアタッカーが出てこないうちに攻めます。
      - オーガポン みどりのめんexを炎タイプで倒すと、エネルギーの用意が止まります。
      - 非ルールのポケモンで殴り合うと、サイドの進み方で勝てます。

  ヤドキング:
    結論: >
      山札のポケモンのワザを借りて戦います。運まかせに見えますが、
      山札の一番上を自分で決められるので、実はねらって撃てます。
    節:
      - 見出し: 山札からワザを借りる
        引用: |
          ヤドキング   HP120   超タイプ   弱点 悪×2
          ひらめきチャレンジ   エネルギー2個 (超・無)
            自分の山札を上から1枚トラッシュし、そのカードが非ルールのポケモンなら、
            そのポケモンが持っているワザを使う

          夜のアカデミー (スタジアム)
            おたがいのプレイヤーは、自分の番ごとに1回、自分の手札を1枚選び、
            山札の上にもどしてよい
        本文:
          - ひらめきチャレンジは、山札の一番上をめくって、
            それが非ルールのポケモンならワザを借りられます。
            そのままだと、何が出るか分からない運まかせのワザです。
          - ところが夜のアカデミーを100%が入れています。
            自分の手札を1枚、山札の上にもどせるカードです。
          - つまり、借りたいポケモンを手札から山札の上に置いてから、
            ひらめきチャレンジを撃てばいいわけです。運の要素がほとんど消えます。
          - この2枚がそろって初めて成り立つデッキです。
            どちらか片方だけでは何もできません。

      - 見出し: 借りるワザが重いほど得をする
        引用: |
          キュレム   HP130   竜タイプ   弱点なし
          トライフロスト   本来はエネルギー5個
            このポケモンについているエネルギーをすべてトラッシュし、
            相手のポケモン3匹に、それぞれ110ダメージ

          メタグロス   ラスターブラスト   本来はエネルギー4個 → 200ダメージ
        本文:
          - 借りるワザのエネルギーは要りません。ひらめきチャレンジのエネルギー2個だけで撃てます。
          - だから、本来なら重すぎて使えないワザほど得をします。
            トライフロストは本来エネルギー5個必要ですが、
            相手のポケモン3匹に110ダメージずつ与えます。合計330ダメージぶんです。
          - 3匹まとめて削れるので、次のターンにボスの指令で呼び出せば、
            一気にサイドを取れる状態が作れます。
          - ヤドキング自身はHP120の非ルールです。倒されてもサイドは1枚しか渡しません。

    まとめ:
      - 重いワザをエネルギー2個で撃てる
      - 山札の上を自分で決められるので、運まかせではない
      - 非ルールなので、倒されてもサイド1枚
      - 3匹同時に削れるワザも借りられる
    しめ: >
      夜のアカデミーで山札の上を作り、ヤドキングでそれを撃つ。
      2枚のカードで1つの動きになっているところが、このデッキの面白さです。

    弱点:
      - 夜のアカデミーを別のスタジアムに張り替えられると、ねらったワザが撃てなくなります。
        運まかせのデッキに戻ってしまいます。
      - ヤドキングはHP120しかありません。弱点は 悪×2 なので60ダメージで倒れます。
      - 借りたいポケモンがサイドに落ちていると、その動きができなくなります。
      - ヤドンから育てる必要があるので、立ち上がりは速くありません。

    対面:
      - スタジアムを張り替えるのが一番効きます。
      - 悪タイプならヤドキングを60ダメージで倒せます。
      - ベンチのヤドンを先に倒しておくと、後続が続きません。

  フーディン:
    結論: >
      相手がエネルギーをたくさんつけているほど、ダメージが上がります。
      今の環境で一番エネルギーを並べるデッキに、そのまま刺さります。
    節:
      - 見出し: 相手のエネルギーがダメージになる
        引用: |
          フーディン   HP140   超タイプ   弱点 悪×2
          サイコキネシス   超エネルギー1個 → 10ダメージ +
            相手のバトルポケモンについているエネルギーの数 × 50ダメージ
        本文:
          - エネルギー1個で撃てるのに、相手のエネルギーが4個なら210ダメージになります。
            5個なら260ダメージです。
          - 今の環境で一番エネルギーを並べるのはメガレックウザexです。
            エネルギー7個で350ダメージを出すデッキなので、
            そのバトル場のポケモンにはエネルギーが集まっています。
          - タケルライコexも、殴る前にエネルギーを並べます。
            エネルギーを増やすことが強さになっているデッキほど、このワザに弱くなります。
          - フーディンはHP140の非ルールです。倒されてもサイドは1枚しか渡しません。
            相手のexを倒せば2枚とれるので、サイドの取り合いでも得をします。

      - 見出し: ダメカンを動かせる
        引用: |
          ストレンジハック   超エネルギー1個
            相手のバトルポケモンをこんらんにする。相手の場のポケモンにのっている
            ダメカンを好きなだけ選び、相手の場のポケモンに好きなようにのせる
        本文:
          - 相手の場に散らばっているダメカンを、1匹に集められます。
          - 相手のベンチに少しずつダメカンが乗っている状態なら、
            それを1匹に集めて倒しきれることがあります。
          - ケーシィの【テレポーター】も独特です。バトル場にいるとき、
            自分とついているカードを山札にもどせます。
            倒されそうな時に逃がせるので、サイドを渡さずに済みます。
          - ユンゲラーの【サイコドロー】は、進化させたときに2枚引けます。
            育てる動きが、そのまま手札を増やす動きになっています。

    まとめ:
      - 相手のエネルギーが多いほど強い
      - エネルギー1個で撃てる
      - 非ルールなので、倒されてもサイド1枚
      - ダメカンを1匹に集められる
    しめ: >
      相手の強みをそのまま弱点に変えるデッキです。
      エネルギーを並べるデッキが増えるほど、このデッキの立ち位置が良くなります。

    弱点:
      - 相手がエネルギーをあまりつけないデッキだと、ダメージが出ません。
        ドラパルトexはエネルギー2個で戦うので、サイコキネシスは110ダメージにしかなりません。
      - フーディンはHP140、ケーシィはHP40しかありません。
        弱点は 悪×2 なので、70ダメージで倒れます。
      - 2進化なので、育つまでに時間がかかります。

    対面:
      - エネルギーをバトル場に集めないようにします。ベンチに分けてつければダメージが下がります。
      - 悪タイプならフーディンを70ダメージで倒せます。
      - ケーシィ(HP40)のうちに倒すと育ちません。

  メガドリュウズex:
    結論: >
      一度育ってしまえば、エネルギーを減らさずに330ダメージを撃ち続けられます。
      ドラパルトexを一撃で倒せる数少ないデッキです。
    節:
      - 見出し: エネルギーが減らない
        引用: |
          メガドリュウズex   HP340   鋼タイプ   弱点 炎×2

          マキシマムドリル   鋼エネルギー3個 → 200ダメージ +
            このワザを使うためのエネルギーより2個多くエネルギーがついているなら、
            130ダメージ追加 (合計330ダメージ)
        本文:
          - ここが大事なところです。攻撃してもエネルギーをトラッシュしません。
            タケルライコexは捨てて殴るので毎ターン並べ直しが必要ですが、
            こちらは一度エネルギー5個をつければ、そのまま330ダメージを撃ち続けられます。
          - 330ダメージはHP320のドラパルトexを一撃で倒せます。
            しかも次のターンも同じダメージが出ます。
            ドラパルトexを2匹続けて倒せるデッキは多くありません。
          - メタングの【メタルメーカー】が、山札の上4枚から基本エネルギーを
            好きなだけ場につけられます。エネルギーを一気に並べる役です。
          - ゲノセクトexの【メタルシグナル】は、山札から鋼タイプの進化ポケモンを
            2枚持ってこられます。メタングもメガドリュウズexもこれで届きます。

    まとめ:
      - エネルギーを減らさずに330ダメージ
      - HP340で、ドラパルトexの330ダメージでも倒れない
      - 育てる手段がそろっている
    しめ: >
      ドラパルトexが多い環境では、それを一撃で倒せることに大きな意味があります。
      5月に出たカードなので、今は新しいデッキを試す人が多くて数が減っていますが、
      環境が落ち着けば戻ってくる可能性があります。

    弱点:
      - 弱点は 炎×2 です。170ダメージで倒れます。HP340が実質170になってしまいます。
      - モグリューは 弱点 草×2 です。だからスボミーの10ダメージが2倍の20ダメージになります。
        ドラパルトex側から見ると、スボミー+カースドボム+ファントムダイブで
        340ダメージまで届くようになります。
      - メガシンカexなので、倒されるとサイドを3枚渡します。
      - エネルギー5個をつけるまでに時間がかかります。育つ前が弱いです。

    対面:
      - 炎タイプで攻撃できるなら、HP340も170ダメージで倒せます。
      - ダンバル(HP70)やモグリュー(HP70)のうちに倒すと育ちません。
      - 育ちきる前に攻めるのが基本です。育ってからでは止まりません。

  カミツオロチex:
    結論: >
      エネルギーの数でダメージが決まり、しかも回復もできます。
      メガレックウザexと似た作りですが、耐えることに寄っています。
    節:
      - 見出し: つけながら回復する
        引用: |
          カミツオロチex   HP330   草タイプ   弱点 炎×2

          【じゅくせいチャージ】自分の番に1回、手札から基本エネルギーを1枚選んで
                             自分のポケモンにつけ、そのポケモンのHPを30回復する
          みつあめストーム   エネルギー2個 (無・無) → 30ダメージ +
            自分のポケモン全員についている草エネルギーの数 × 30ダメージ
        本文:
          - みつあめストームは、自分の場全体の草エネルギーの数でダメージが決まります。
            メガレックウザexと同じ考え方ですが、こちらは草エネルギーだけを数えます。
          - 草エネルギー6個なら210ダメージ、8個なら270ダメージです。
            メガレックウザexの50ずつに比べると上がり方はゆるやかです。
          - そのかわり【じゅくせいチャージ】でHPを30回復できます。
            エネルギーをつけながら回復するので、殴り合いに強くなります。
            HP330に毎ターン30回復が乗ると、相手は思ったより削りきれません。

      - 見出し: すぐに進化できる
        引用: |
          活力の森 (スタジアム)
            おたがいのポケモン全員は、出したばかりの番でも進化できる
            (最初の自分の番をのぞく)
        本文:
          - ふつう、ベンチに出したばかりのポケモンはその番に進化できません。
            活力の森があると、それができるようになります。
          - カジッチュ(HP40)を出して、その番のうちにカミツオロチexにできます。
            2進化のデッキにとっては、これで丸1ターン早くなります。
          - オーガポン みどりのめんexも100%入っています。
            毎ターン手札からエネルギーを1枚つけて1枚引けるので、
            草エネルギーの数を増やす役をしています。

    まとめ:
      - エネルギーの数でダメージが決まる ── 草エネルギー × 30ダメージ
      - 毎ターン30回復できる
      - 活力の森で1ターン早く育つ
    しめ: >
      メガレックウザexが一気に届かせるデッキだとすれば、
      こちらは回復しながら押し合うデッキです。同じ仕組みでも性格が違います。

    弱点:
      - 弱点は 炎×2 です。165ダメージで倒れます。
      - 草エネルギーだけを数えるので、ほかのタイプのエネルギーを入れられません。
      - 活力の森を張り替えられると、進化が1ターン遅れます。
      - カジッチュはHP40しかありません。出したばかりの番に倒されると育ちません。

    対面:
      - 炎タイプで攻撃できるなら、HP330も165ダメージで倒せます。
      - スタジアムを張り替えると、進化が遅れます。
      - 回復されるので、少しずつ削る戦い方は向きません。一撃で倒しきるほうが確実です。
