# 環境デッキの「読み方」。
#
# 採用率・打点・事故率などの数字は自動で計算されるので、ここには書かない。
# ここに書くのは **数字からは出てこない「なぜ」** だけ。
#
# 書くときの約束:
#   - 実際のカードテキストと採用率から言えることだけ書く。印象で書かない
#   - 「強い」で終わらせない。何がどう強いのかを書く
#   - 弱点も必ず書く。良いことしか書いていない解説は役に立たない
#   - 環境は動く。古くなったら直す (updated を見て判断する)

updated: "2026-08-13"
based_on: "直近1週 333件 / 中身つき3673デッキ"

decks:
  ドラパルトex:
    ひとこと: かたくて、なぐらずに けずれる
    つよいところ:
      - HP320で よわ点が ない。1097まいの ポケモンのうち よわ点なしは 64まいだけ。
        あいては まともに 320を けずるしか ない
      - ファントムダイブは 200ダメージ＋ダメカン6こを ベンチに ばらまける。
        つまり つぎの ターンに たおす じゅんびを いまの ターンに できる
      - サマヨール・ヨノワールの カースドボム、マシマシラの のせかえで、
        ダメージを 1こ たんいで ちょうせつできる。だから ムダうちが ほとんど ない
      - ドロンチの ていさつしれいが つよい。1しんかが 「2しんかまでの とおり道」では
        なく、ばに いるだけで まいターン てふだが ふえる エンジンに なっている
    きをつけること:
      - 2しんかなので、そろうまでに 時間が かかる。じっさい 事故率は 20.1%で、
        メガレックウザ(14.5%)より たかい
      - ヨマワル(HP60)・サマヨール(HP90)は かみ。ベンチを ねらわれると じゅんびが くずれる
      - じぶんも グッズだのみ。ふしぎなアメを 止められると つらい
    あいてにするとき:
      - ベンチを ひろげすぎない。ばらまく さきが へると ファントムダイブの ねうちが さがる
      - HP210ぐらいの ポケモンを ベンチに ならべると、60ばらまき＋つぎの200で
        まとめて とられる
      - スボミーなどで グッズを 止めると、ふしぎなアメが つかえず そだたない

  メガレックウザex:
    ひとこと: エネルギーが そのまま ダメージに なる
    つよいところ:
      - ストームエメラルダは 「じぶんの ポケモン ぜんいんに ついている エネルギーの
        かず×50」。タイプは 何でも いいし、ベンチの どこに おいた エネでも
        そのまま ダメージに なる
      - だから エネルギーを 17.5まいも 入れる (ドラパルトは 8.2まい)。
        入れた エネルギーが 1まいのこらず 打点に なる デッキ
      - ゼロの大空洞で ベンチを 8ひきに するのも、エネを おく場所を ふやすため
      - エネ7こで 350。いまの かんきょうの アタッカーは ぜんぶ 1げきで とれる
      - たねポケモンなので はやい。事故率 14.5%は ドラパルト(20.1%)より ひくい
    きをつけること:
      - エネ4こでは 200しか でず、キチキギスex(210)すら たおせない。
        たちあがりに 「なにも たおせない」時間が ある
      - ダメージが 50きざみでしか 上がらない。250で HP210を たおすと 40が むだになる。
        ドラパルトのように あまりを ベンチへ まわせない
      - エネを のせた ポケモンを たおされると ダメージが 50ずつ さがる。
        エネルギーつけかえ(91%)・ガラスのラッパ(74%)は この あなを うめる ためのカード
      - ベンチを ひろげるほど、ドラパルトの ばらまきの まとが ふえる。
        つよくする ための こうどうが、そのまま よわ点に なっている
      - よわ点は かみなり×2。いまは かみなりデッキが 少ないので めだたないが、
        ふえたら 140ダメージで おちる
    あいてにするとき:
      - エネの のった ベンチを ねらう。1ひき たおすごとに あいての ダメージが さがる
      - グッズを 止めるのが よく きく。ハイパーボール98%・ぼうけんのランタン93%と
        グッズだのみが つよいのに、スボミーは 入れていない
      - かみなりタイプで なぐれるなら、HP280が じつしつ 140に なる

  メガルカリオex:
    ひとこと: じぶんで エネを ならべて、270で なぐる
    つよいところ:
      - HP340は かんきょう最大きゅう。メガブレイブは 闘2こで 270
      - はどうづきは 130を あたえながら、トラッシュから 基本エネ3まいを
        ベンチに つけられる。なぐりながら つぎの じゅんびが できる
      - パワープロテイン(100%採用)で +30。300ラインに とどく
    きをつけること:
      - メガブレイブは つかった つぎの ターン つかえない。れんぞくで うてない
      - よわ点は 超×2。170ダメージで おちる
      - リオル(HP70)から そだてる ひつようが ある

    あいてにするとき:
      - よわ点は 超×2。170で おちるので、超タイプで なぐれると 一気に かたづく
      - メガブレイブは れんぞくで うてない。うたれた つぎの ターンが せめどき
      - リオル(HP70)の うちに たおせると、そもそも そだたない
  タケルライコex:
    ひとこと: エネを すてた ぶんだけ ダメージが 出る
    つよいところ:
      - きょくらいごうは 「トラッシュした 基本エネの かず×70」。
        4まい すてれば 280、5まいで 350。じょうげんが ない
      - はじけるほうこうで てふだを ぜんぶ すてて 6まい ひける。
        事故った ときの たてなおしが つよい
      - オーガポン みどりのめんexが 手ばりで エネを つけて 1まい ひく。
        よわ点なしの タケルライコと あわせて くずれにくい
    きをつけること:
      - エネを すてて なぐるので、まいターン エネを ならべなおす ひつようが ある
      - 大きく なぐった つぎの ターンは 火力が おちやすい
      - オーガポンの よわ点は ほのお×2

    あいてにするとき:
      - 大きく なぐった あとは エネを すてているので、火力が おちている。
        その ターンに せめかえす
      - オーガポン みどりのめんex(よわ点 ほのお×2)が エンジン。ここを 止めると まわらない
  メガゲッコウガex:
    ひとこと: 2しんかを アメで とばして 350
    つよいところ:
      - HP350は かんきょう最大。ゲッコウガex(HP310)も つよい
      - ケロマツの むれるで 山ふだから ケロマツを 2ひき ならべられる。
        なかよしポフィン(94%)も あわせて たねが そろいやすい
    きをつけること:
      - ケロマツ(HP60)・ゲコガシラ(HP90)が かみ。そだつ前に ねらわれると つらい
      - メガゲッコウガex は よわ点 かみなり×2、ゲッコウガex は 超×2。
        1つの デッキに ちがう よわ点が 2つ ある
      - ふしぎなアメ だのみ。グッズを 止められると そだたない

    あいてにするとき:
      - ケロマツ(HP60)・ゲコガシラ(HP90)を さきに たおすと そだたない
      - ふしぎなアメだのみ。グッズを 止めるのが きく
      - かみなりでも 超でも どちらかの よわ点を つける
  マリィのオーロンゲex:
    ひとこと: しんかした しゅんかんに エネが 5まい ならぶ
    つよいところ:
      - パンクアップは 「しんかした とき、山ふだから 基本エネを 5まいまで
        マリィのポケモンに つける」。1回で ばが かんせいする
      - シャドーバレットは 180＋ベンチにも 30。ドラパルトほどでは ないが
        ばらまきが ある
      - スパイクタウンジムで まいターン マリィのポケモンを 1まい もってこられる
      - HP320、マシマシラも 100%入っている
    きをつけること:
      - よわ点は くさ×2。160で おちる
      - パンクアップは 「しんかした とき」だけ。しんかを 止められると
        エネが ならばない
      - ふしぎなアメ だのみ
    あいてにするとき:
      - よわ点は くさ×2。160で おちる
      - パンクアップは 「しんかした とき」だけ。しんかさせる前に ベロバー(HP70)を たおす
      - スパイクタウンジムを べつの スタジアムで はりかえると、まいターンの サーチが 止まる
