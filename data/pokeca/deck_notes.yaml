# 環境デッキの読み方。
#
# 採用率・打点・事故率などの数字は自動で計算されるので、ここには書かない。
# ここに書くのは **数字からは出てこない「なぜ」** だけ。
#
# 書くときの約束:
#   - 実際のカードテキストと採用率から言えることだけ書く。印象で書かない
#   - 「強い」で終わらせない。何がどう強いのかを書く
#   - 弱点も必ず書く。良いことしか書いていない解説は役に立たない
#   - 子ども向けだからといって中身を薄めない。難しい漢字はルビで解決する
#     (ルビは data/pokeca/ruby.yaml。ここでは普通に漢字で書く)
#   - 専門用語は避ける。「非対称」ではなく「割に合う」と書く
#   - 環境は動く。古くなったら直す

updated: "2026-08-13"
based_on: "直近1週 333件 / 中身つき3673デッキ"

decks:
  ドラパルトex:
    結論: >
      「落ちない体」と「殴らずに削る手段」が、同じデッキに同居している。
      1枚のカードが強いのではなく、組み合わせ方が強い。
    節:
      - 見出し: まず、落ちない
        引用: "ドラパルトex   HP320  竜タイプ  弱点なし  にげる1"
        本文:
          - ポケモン1097枚のうち、弱点がないのは64枚だけ。そのうち58枚が竜タイプ。
            ドラパルトexはその1枚。
          - 弱点があるポケモンには「刺さるタイプを当てれば半分の打点で倒せる」という
            抜け道がある。ドラパルトexにはそれが無い。相手は素の打点だけで320を
            削り切るしかない。
          - しかも にげるが1。重いアタッカーの典型的な負け方(呼び出されて動けない)も薄い。

      - 見出し: そして、殴らずに削る
        引用: |
          ファントムダイブ  炎超(2個) → 200
            ダメカン6個を、相手のベンチポケモンに好きなようにのせる。
        本文:
          - ここが本質。普通のアタッカーは目の前を殴るだけ。ドラパルトは殴りながら、
            まだ出てきていない次の相手を60削る。
          - なぜ強いか。相手のHPを見ると分かる。キチキギスex 210、オーガポン各種 210、
            タケルライコex 240、テラパゴスex 230。この帯に先に60を置いておけば、
            次のターンの200が届く。
          - つまり「2ターン後に必要な打点を、今のターンに前払いしている」。
            相手は準備中のベンチが勝手に減っていく。

      - 見出し: ダメカンを置く手段が、もっとある
        引用: |
          サマヨール【カースドボム】自分をきぜつさせて、相手1匹にダメカン5個 (50)
          ヨノワール【カースドボム】同じく13個 (130)
          マシマシラ【アドレナブレイン】自分の場のダメカン3個を、相手にのせ替え
        本文:
          - ダメージを置く手段が4種類ある。採用率がそれを裏づけている。
            マシマシラ93%、ヨマワル・サマヨール・ヨノワール65%。
          - ヨノワールの130 + ファントムダイブの60 = 190を、一度も殴らずに置ける。
            そこに200が乗る。相手のHP320クラスすら射程に入る。
          - しかも割に合う。カースドボムは自分がきぜつするが、サマヨールもヨノワールも
            exではないのでサイドは1枚しか渡さない。サイド1枚で130ダメージ。
            相手がexを1匹倒すには2枚渡す。この差が積み重なる。
          - そして無駄が出ない。1発で倒しきれなくても、余った打点はベンチに残る。
            330出せるデッキがHP240を倒すと90が消えるが、ドラパルトは消えない。

      - 見出し: 2進化なのに、事故りにくい
        引用: |
          ドラメシヤ4枚(100%)  ドロンチ4枚(100%)  ポケパッド4枚(100%)
          リーリエの決心4枚(100%)  ふしぎなアメ(81%)
        本文:
          - 2進化デッキの宿命は「進化が間に合わない」こと。それを潰す札が確定枠に並ぶ。
          - 特にドロンチ。【ていさつしれい】は自分の番に1回、山札の上2枚から1枚を手札に
            加える。普通、1進化は「2進化になるまでの通過点」でしかない。
            でもドロンチは場に居るだけで毎ターン手札が増える。
            進化したあともベンチのドロンチが働き続ける。1進化そのものがエンジンになっている。
            他の2進化デッキと決定的に違うのはここだと思う。
          - ポケパッドも噛み合っている。「ルールを持たないポケモン」しか持ってこられないが、
            このデッキのドラメシヤ・ヨマワル・マシマシラは全部その条件を満たす。
            制限が制限になっていない。
          - エネルギーも軽い。HP320のアタッカーが2個で260出す。炎と超の2色が要るが、
            アカマツ1枚(違うタイプの基本エネルギー2枚を持ってきて、1枚は場につける)が
            確定枠でそこを埋めている。

    まとめ:
      - 落ちない ── HP320・弱点なし・にげる1
      - 削る手段が多い ── 200 + ばら撒き60 + カースドボム190 + のせ替え
      - 先回りできる ── 次のターンの詰みを、今のターンに作る
      - 事故りにくい ── アメ・ていさつしれい・ポケパッド・リーリエ
    しめ: >
      「硬いから強い」でも「火力が高いから強い」でもない。硬さと先回りが同居しているから、
      相手は「今の1匹を守る」と「次の1匹を守る」を同時に迫られる。それが一強の理由だと読んだ。

    弱点:
      - スボミーの採用率98%が手がかりになる。【むずむずかふん】は次の相手の番、
        相手はグッズを使えない。これを積んでいるのは「グッズを止められると困るデッキが
        それだけ多い」という認識の表れ。裏を返せばドラパルト自身も
        ふしぎなアメ・ボール系に強く依存している。同じことをやり返されると鈍る。
      - ヨマワルHP60、サマヨールHP90。カースドボムの準備段階は紙。
        ベンチを狙われると計画が崩れる。
      - 事故率は決して低くない。337件の平均で20.1%。たね8枚の構築では34.6%。
        5回に1回は初手でつまずく。

    対面:
      - ベンチを広げすぎない。ばら撒く先が減ると、ファントムダイブの値打ちが下がる。
      - HP210前後のポケモンをベンチに並べると、60のばら撒き+次の200でまとめて取られる。
      - スボミーなどでグッズを止めると、ふしぎなアメが使えず育たない。

  メガレックウザex:
    結論: >
      入れたエネルギーが、1枚残らず打点になる。エネルギーがコストではなく、
      そのまま火力そのものになっている珍しいデッキ。
    節:
      - 見出し: 打点の正体
        引用: |
          メガレックウザex  HP280  たね(!)  無タイプ  弱点雷×2  にげる2

          【はしゃのほうこう】手札からベンチに出したとき、山札の上4枚から
                             基本エネルギーを1枚選んで、このポケモンにつける
          ストームエメラルダ  炎雷無(3個)
            → 自分のポケモン全員についているエネルギーの数 × 50ダメージ
        本文:
          - 「全員」が全て。攻撃するポケモンに乗っている必要がない。
            ベンチのどこに置いたエネルギーでも、タイプが何でも、そのまま打点になる。
          - だからエネルギーを17.5枚も入れる。ドラパルトは8.2枚。普通のデッキは8〜12枚。
            この数字だけでデッキの性格が分かる。
          - ゼロの大空洞(74%)でベンチを8匹にするのも、エネルギーを置く場所を増やすため。
            ヒビキのホウオウex(86%)が手札からエネルギー2枚を置けるのも、
            置いた先が何であれ打点になるから。
          - そして たねポケモン。2進化のドラパルトが立つ前に殴り始められる。
            事故率も14.5%で、ドラパルトの20.1%より低い。

      - 見出し: 打点の階段
        引用: |
          エネ4個 → 200   何も倒せない (キチキギスex210に10足りない)
          エネ5個 → 250   210〜240帯を一撃
          エネ6個 → 300   280帯を一撃
          エネ7個 → 350   環境の全アタッカーを一撃 (最大はメガゲッコウガex350)
        本文:
          - 7個が完成形。ここに乗ると、今の環境で1発で取れない相手がいなくなる。
          - 逆に4個以下では何も倒せない。この「立ち上がりの空白」がこのデッキの
            付き合い方を決めている。
          - 打点が50刻みでしか動かないのも大事な性質。250でHP210を倒すと40が消える。
            ドラパルトのように余りをベンチへ回せない。無駄が出るのは構造上避けられない。
          - その代わり上限がない。HP320〜350を1発で取れるのは今このデッキだけ。
            効率は悪いが、届く高さと速さで殴り勝つ形。

      - 見出し: エネルギーが減ると、弱くなる
        引用: "エネルギーつけかえ 91%(平均3.4枚)   ガラスのラッパ 74%"
        本文:
          - 普通のデッキはポケモンを取られてもエネルギーさえ残れば戦える。
            このデッキは違う。エネルギーの乗ったポケモンを倒されると、打点が50ずつ落ちる。
          - エネルギーつけかえは、倒されそうなポケモンからエネルギーを逃がすカード。
            ガラスのラッパはトラッシュから回収するカード。どちらもこの穴を埋めている。
            これだけ高い採用率になっているのは、それだけ致命的だという裏返し。

    まとめ:
      - 速い ── たねポケモン。事故率14.5%
      - 上限が高い ── エネ7個で350。全アタッカーが射程内
      - 無駄は出る ── 50刻み。余りをベンチに回せない
      - 減ると弱る ── エネルギーを失うたびに打点が50下がる
    しめ: >
      ドラパルトが「無駄なく削る」デッキなら、こちらは「一気に届かせる」デッキ。
      正反対の設計で、同じ環境の上位2つになっている。

    弱点:
      - ベンチを広げるほど、ドラパルトのばら撒きの的が増える。
        ラティアスex 210、キチキギスex 210、ニャースex 170、テラパゴスex 230、
        ヒビキのホウオウex 230。HP210前後のexが横並びになる形は、
        ファントムダイブ60 + カースドボム130 が最も効く。
        強くするための行動が、そのまま弱点を広げている。
      - グッズ依存が極端。ハイパーボール98%(平均3.9枚)、ぼうけんのランタン93%、
        エネルギーつけかえ91%、ガラスのラッパ74%。それなのにスボミーは入っていない。
        ドラパルト側は98%積んでいる。
      - 弱点は雷×2。ただし今は罰されていない。雷のアタッカーはメガライボルトex(330)や
        メガシビルドンex(350)がいるが、どちらも上位8デッキに入っていない。
        眠っている弱点。環境が雷に振れたら140ダメージで落ちる。

    対面:
      - エネルギーの乗ったベンチを狙う。1匹倒すごとに相手の打点が50下がる。
      - グッズを止めるのがよく効く。相手はスボミーを持っていない。
      - 弱点は攻撃するポケモンのタイプで決まる。メガレックウザexは無タイプなので、
        雷エネルギーを使っていてもミラーで弱点2倍にはならない。
        突けるのは雷タイプのポケモンだけ。

  メガルカリオex:
    結論: >
      殴りながら次のエネルギーを並べる。攻撃と準備が1つのワザにまとまっている。
    節:
      - 見出し: 2つのワザを交互に使う
        引用: |
          メガルカリオex  HP340  闘タイプ  弱点超×2

          はどうづき   闘(1個) → 130
            自分のトラッシュから基本エネルギーを3枚まで選び、ベンチに好きなようにつける
          メガブレイブ 闘闘(2個) → 270
            次の自分の番、このポケモンはメガブレイブが使えない
        本文:
          - メガブレイブは270だが連続で撃てない。だから はどうづき と交互に使う形になる。
          - その はどうづき が優秀で、130を与えながらトラッシュから基本エネルギー3枚を
            ベンチに配れる。殴るターンが、そのまま次の準備のターンになっている。
          - パワープロテイン(100%採用)は、その番の闘ポケモンの打点を+30する。
            270+30 = 300。HP300のラインに届く。130も160になる。

      - 見出し: 引く手段が独特
        引用: |
          ルナトーン【ルナサイクル】場にソルロックがいて、手札から基本エネルギーを
                                  1枚トラッシュするなら、山札を3枚引く
          ソルロック  コスモビーム 闘(1個) → 70
                     ベンチにルナトーンがいないと失敗。弱点・抵抗力を計算しない
        本文:
          - ソルロック99%採用。ルナトーンと2匹セットで、手札のエネルギーを捨てて
            3枚引くエンジンになる。
          - 捨てたエネルギーは無駄にならない。はどうづきがトラッシュから拾ってくるから。
            引くための消費と、エネルギーの供給が噛み合っている。
          - ファイトゴング(100%)は闘タイプのたねポケモンか基本闘エネルギーを持ってくる。
            リオルもソルロックもルナトーンも、これ1枚で届く。

    まとめ:
      - HP340は環境最大級
      - 殴りながらエネルギーを並べられる
      - 引く手段が、エネルギーの循環と噛み合っている
    しめ: >
      派手さは無いが、攻撃・準備・ドローが互いに支え合っている。1-2か月前の4.4%から
      直近7.5%へ伸びているのは、この安定感が評価されてきたからだと読んだ。

    弱点:
      - メガブレイブを撃った次の番は270が出せない。相手にとってはそこが攻め時になる。
      - 弱点は超×2。170ダメージで落ちる。HP340が実質170になる相手には脆い。
      - リオル(HP70)から育てる必要がある。育つ前を狙われると遅れる。

    対面:
      - 超タイプで殴れるなら、HP340は170で落ちる。ここが一番はっきりした答え。
      - メガブレイブを撃たれた次のターンに攻め返す。
      - リオルのうちに倒せると、そもそも育たない。

  タケルライコex:
    結論: >
      エネルギーを捨てた枚数だけ打点が出る。上限が無い代わりに、毎ターン並べ直す必要がある。
    節:
      - 見出し: 捨てるほど強い
        引用: |
          タケルライコex  HP240  竜タイプ  弱点なし

          きょくらいごう 雷闘(2個) → 70×
            自分の場のポケモンについている基本エネルギーを好きなだけトラッシュし、
            その枚数×70ダメージ
          はじけるほうこう 無(1個) → 手札を全部トラッシュして、山札を6枚引く
        本文:
          - 3枚捨てれば210、4枚で280、5枚で350。上限がない。
          - しかも竜タイプなので弱点がない。HP240は特別高くはないが、
            半分で落とされる抜け道が無い。
          - はじけるほうこうが独特で、手札を全部捨てて6枚引き直す。
            事故ったときの立て直しが強い。撃ちながら仕切り直せる。

      - 見出し: エネルギーを供給し続ける
        引用: |
          オーガポン みどりのめんex  HP210  草タイプ  弱点炎×2
          【みどりのまい】自分の番に1回、手札から基本エネルギーを1枚このポケモンにつけて、
                        山札を1枚引く
        本文:
          - 99%採用。毎ターン、手札からエネルギーを1枚つけて1枚引く。
            捨てた分を補い続けるエンジン。
          - アカマツ100%も、違うタイプの基本エネルギー2枚を持ってきて1枚を場につける。
            雷・闘・草の3色を要求されるが、この2枚で回っている。
          - ラティアスex(95%)でたねポケモンのにげるが0になるので、
            殴る相手を選びやすい。

    まとめ:
      - 上限がない ── 5枚捨てて350
      - 弱点がない ── 半分で落とされる抜け道が無い
      - 事故に強い ── 手札を全部捨てて引き直せる
    しめ: >
      1-2か月前の2.8%から直近7.2%へ。上限の高さと事故への強さが、
      メガレックウザの登場で速くなった環境に合ってきたのだと思う。

    弱点:
      - 大きく殴った次の番は、捨てた分だけ場のエネルギーが減っている。火力が落ちる。
      - 毎ターン並べ直す必要があるので、エネルギーを引けないと止まる。
      - オーガポン みどりのめんexの弱点は炎×2。エンジン役をここで折られると回らない。

    対面:
      - 大きく殴られた次のターンが攻め時。相手の火力が一番低い瞬間。
      - オーガポン みどりのめんexを先に落とすと、エネルギーの供給が止まる。

  メガゲッコウガex:
    結論: >
      HP350の体と、毎ターン撃てるダメカン6個。硬さとばら撒きを両方持っている。
    節:
      - 見出し: 特性が本体
        引用: |
          メガゲッコウガex  HP350  水タイプ  弱点雷×2  にげる1

          【ひっさつしゅりけん】バトル場にいて、手札から基本水エネルギーを1枚
                              トラッシュするなら、自分の番に1回使える。
                              相手のポケモン1匹に、ダメカンを6個 (60) のせる
          ニンジャスピナー 水水(2個) → 120＋
            のぞむなら、ついている水エネルギーを1個手札にもどして、80ダメージ追加
        本文:
          - ひっさつしゅりけんが強い。手札の水エネルギー1枚と引き換えに、
            毎ターン相手のどこかに60を置ける。ワザとは別枠で動く。
          - つまりドラパルトと同じ「殴らずに削る」ことができる。
            しかもHP350はこの環境の最大値。
          - ニンジャスピナーは120。エネルギーを1個手札に戻せば200。
            戻したエネルギーはひっさつしゅりけんの燃料に回せる。

      - 見出し: もう1枚のアタッカー
        引用: |
          ゲッコウガex  HP310  闘タイプ  弱点超×2
          しのびのやいば  水(1個) → 170  山札から好きなカードを1枚手札に加える
          ぶんしんれんだ  水無無(3個) → エネルギー2個をトラッシュし、
                                     相手のポケモン2匹に それぞれ120ダメージ
        本文:
          - ぶんしんれんだは相手2匹に120ずつ。1ターンで2匹を削れる。
            ひっさつしゅりけんの60を足せば180になり、HP170前後まで届く。
          - しのびのやいばは170を出しながら山札から好きなカードを1枚持ってくる。
            エネルギー1個でこれは軽い。

    まとめ:
      - 環境最大のHP350
      - 毎ターン60を置ける特性
      - 2匹同時に殴るワザもある
    しめ: >
      ドラパルトに近い「削って複数取る」形を、より高いHPでやろうとしているデッキ。
      ただしそのぶん立ち上がりが重い。

    弱点:
      - ケロマツHP60、ゲコガシラHP90。育つ前が非常に脆い。
        ふしぎなアメ100%・なかよしポフィン94%はそこを急ぐためのカード。
      - 弱点が2種類ある。メガゲッコウガexは雷×2、ゲッコウガexは超×2。
        1つのデッキで2方向から刺される。
      - ふしぎなアメへの依存が強い。グッズを止められると育たない。

    対面:
      - ケロマツ・ゲコガシラのうちに倒す。育ってからでは硬い。
      - グッズを止めるのが効く。
      - 雷でも超でも、どちらかの弱点は必ず突ける。

  マリィのオーロンゲex:
    結論: >
      進化した瞬間にエネルギーが5枚並ぶ。準備に何ターンもかけない。
    節:
      - 見出し: 1回で場が完成する
        引用: |
          マリィのオーロンゲex  HP320  悪タイプ  弱点草×2

          【パンクアップ】手札から出して進化させたとき、山札から基本エネルギーを
                        5枚まで選び、自分のマリィのポケモンに好きなようにつける
          シャドーバレット 悪悪(2個) → 180
            相手のベンチポケモン1匹にも、30ダメージ
        本文:
          - パンクアップが異常。進化した瞬間に山札からエネルギー5枚が場に並ぶ。
            普通は1ターンに1枚しかつけられないので、5ターン分を1回で飛ばしている。
          - シャドーバレットは180 + ベンチに30。ドラパルトほどではないが、
            ばら撒きの性質を持っている。無駄が出にくい。
          - スパイクタウンジム(100%)で毎ターン、山札からマリィのポケモンを1枚
            手札に加えられる。マシマシラも100%入っていて、ダメカンののせ替えができる。

    まとめ:
      - 準備が1回で終わる
      - HP320で殴りながら、ベンチにも30
      - マシマシラでダメージの微調整ができる
    しめ: >
      速さで言えば環境でも上位。ただしパンクアップが「進化したとき」の1回きりなので、
      そこを止められるかどうかで評価が変わる。

    弱点:
      - パンクアップは「進化したとき」だけ。進化させる前に止められると、
        エネルギーが並ばず、ただのHP320になる。
      - 弱点は草×2。160ダメージで落ちる。
      - マリィのベロバーHP70。ここを先に倒されると進化先が無くなる。

    対面:
      - 進化する前のベロバー(HP70)を倒すのが最も効く。
      - 草タイプで殴れるならHP320が実質160になる。
      - スパイクタウンジムを別のスタジアムで張り替えると、毎ターンのサーチが止まる。
