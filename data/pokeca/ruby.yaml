# ルビ。読みにくい漢字にだけ振る。
#
# 全部ひらがなにすると、かえって読みにくいうえに中身も薄くなる。
# 漢字のまま書いて、難しいものだけルビで解決する。
#
# 決め方:
#   - 小学校2〜3年で習わない漢語には振る
#   - カード名・ワザ名には振らない (原文のまま出したい)
#   - 長い語を先に置く。「事故率」が「事故」に食われないように、
#     表示するときは長いほうから当てる
#
# 増やすときは、この下に足すだけでよい。

words:
  # よく出るもの
  相手: あいて
  弱点: じゃくてん
  進化: しんか
  打点: だてん
  手札: てふだ
  山札: やまふだ
  基本: きほん
  環境: かんきょう
  手段: しゅだん
  無駄: むだ
  上限: じょうげん
  普通: ふつう
  必要: ひつよう

  # 数字まわり
  事故率: じこりつ
  採用率: さいようりつ
  事故: じこ
  採用: さいよう
  平均: へいきん
  枚数: まいすう
  種類: しゅるい
  前後: ぜんご
  直近: ちょっきん
  上位: じょうい
  実質: じっしつ

