# デッキの見た目 (色・絵文字) と表記ゆれの統合ルール。
#
# ここに無いデッキも、デッキ名から自動で色が決まるので動作に支障はない。
# 子どもが「このデッキはこの色」と覚えられるよう、よく出るデッキだけ
# 手で足していくのがおすすめ。
#
#   decks:   デッキ名 → 色と絵文字
#   aliases: ゆれた表記 → 正式なデッキ名 (ランキングの分裂を防ぐ)

decks:
  ドラパルトex:
    color: "#7209B7"
    emoji: "👻"
  リザードンex:
    color: "#E63946"
    emoji: "🔥"
  サーナイトex:
    color: "#EF476F"
    emoji: "💗"
  パオジアンex:
    color: "#118AB2"
    emoji: "❄️"
  ミライドンex:
    color: "#FCBF49"
    emoji: "⚡"
  コライドン:
    color: "#E76F51"
    emoji: "🦖"
  ロストバレット:
    color: "#2A9D8F"
    emoji: "🌀"
  リグレー:
    color: "#4361EE"
    emoji: "🌟"
  ピジョットex:
    color: "#F77F00"
    emoji: "🕊️"
  タケルライコex:
    color: "#FFD166"
    emoji: "🌩️"

# 例: 「ドラパルト」「ドラパルトexバレット」を「ドラパルトex」に寄せる
