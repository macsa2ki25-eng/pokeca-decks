# 「実質何枚か」を数えるための表。
#
# ポケカは確率のゲームです。
# 「ロケット団のラムダを最初の手札で引ける確率は?」と聞かれたら、
# ふつうは 4枚 ÷ 60枚 で考えます。でもそれは正しくありません。
#
#   ロケット団のレシーバー を引けば、ラムダを持ってこられる
#   ニャースex を引けば、特性でラムダを持ってこられる
#   ハイパーボール を引けば、ニャースex を持ってこられる
#
# つまりラムダ4枚・レシーバー4枚・ニャースex4枚・ハイパーボール4枚なら、
# 「実質16枚」入っているのと同じです。確率はまるで変わります。
#
# この表は、どのカードがどのカードにたどりつけるかを書いたものです。
# ここから「実質枚数」を数えて、確率を出します。
#
# 書き方:
#   使い方: グッズ / サポート / 特性 / スタジアム
#           サポートは1つの番に1枚しか使えないので、
#           1本のつながりの中で通れるのは1回まで
#   出す先: 手札 / ベンチ
#           ベンチに出すカードは、そこから先につなげられない。
#           ニャースexは「手札からベンチに出したとき」に特性を使うので、
#           山札から直接ベンチに出されると特性が使えないから
#   区分:   持ってこられるカードの区分 (ポケモン/グッズ/サポート/…)
#   たね:   true なら たねポケモン だけ
#   進化:   true なら 進化ポケモン だけ
#   HP上限: この数字以下のポケモンだけ
#   非ルール: true なら「ルールを持つポケモン」は選べない
#   ex:     true なら「ポケモンex」だけ
#   名前に: この文字を名前に含むカードだけ
#   タイプ: このタイプのポケモンだけ
#   最初だけ: true なら、最初の自分の番にしか使えない
#
# ここに書いていないカードは「つながらない」とみなします。

探す:
  # --- 手札から使うグッズ ---
  ハイパーボール:
    使い方: グッズ
    出す先: 手札
    区分: [ポケモン]
  ポケパッド:
    使い方: グッズ
    出す先: 手札
    区分: [ポケモン]
    非ルール: true
  なかよしポフィン:
    使い方: グッズ
    出す先: ベンチ
    区分: [ポケモン]
    たね: true
    HP上限: 70
  プレシャスキャリー:
    使い方: グッズ
    出す先: ベンチ
    区分: [ポケモン]
    たね: true
  シークレットボックス:
    使い方: グッズ
    出す先: 手札
    区分: [グッズ, ポケモンのどうぐ, サポート, スタジアム]
  ロケット団のレシーバー:
    使い方: グッズ
    出す先: 手札
    区分: [サポート]
    名前に: ロケット団
  ファイトゴング:
    使い方: グッズ
    出す先: 手札
    区分: [ポケモン]
    たね: true
    タイプ: 闘
  テラスタルオーブ:
    使い方: グッズ
    出す先: 手札
    区分: [ポケモン]
    名前に: テラスタル

  # --- 手札から出して、その番のうちに特性が使えるポケモン ---
  ニャースex:
    使い方: 特性
    出す先: 手札
    区分: [サポート]
  ゲノセクトex:
    使い方: 特性
    出す先: 手札
    区分: [ポケモン]
    進化: true
    タイプ: 鋼
  スピンロトム:
    使い方: 特性
    出す先: 手札
    区分: [ポケモン]
    HP上限: 100
    タイプ: 無
    最初だけ: true

  # --- 出したその番から使えるスタジアム ---
  スパイクタウンジム:
    使い方: スタジアム
    出す先: 手札
    区分: [ポケモン]
    名前に: マリィの

  # --- サポート (1つの番に1枚だけ。先攻の1番めには使えない) ---
  ロケット団のラムダ:
    使い方: サポート
    出す先: 手札
    区分: [グッズ, ポケモンのどうぐ, サポート, スタジアム]
  ヒカリ:
    使い方: サポート
    出す先: 手札
    区分: [ポケモン]
  タケシのスカウト:
    使い方: サポート
    出す先: 手札
    区分: [ポケモン]
  シアノ:
    使い方: サポート
    出す先: 手札
    区分: [ポケモン]
    ex: true
  トウコ:
    使い方: サポート
    出す先: 手札
    区分: [ポケモン]
    進化: true
  アクロマの執念:
    使い方: サポート
    出す先: 手札
    区分: [スタジアム]

# たどりつく道に入れていないもの:
#   ワザで探すカード (モグリューのなかまをよぶ、カジッチュのともだちをさがす など)
#     → 1番めには間に合わないので、最初の手札の話には数えません
#   バトル場や盤面の条件がいる特性 (シャリタツ、バチンキー)
#     → 出したその番には使えないので数えません
#   ポケギア3.0 のように、山札の上7枚を見るだけのカード
#     → 必ず当たるとはかぎらないので数えません
#   どれも実際には役に立ちます。数字を低めに見積もっている、と思ってください。

# 各デッキが「1番めにこれを引きたい」カード。
# ここに書いたものについて、実質枚数と確率をページに出します。
始動:
  メガドリュウズex:
    - カード: プレシャスキャリー
      ねらい: 1番めにベンチを5匹そろえる
    - カード: ゲノセクトex
      ねらい: 進化ポケモンを2枚持ってくる
  ドラパルトex:
    - カード: ドラメシヤ
      ねらい: 2進化の1匹めを置く
    - カード: ふしぎなアメ
      ねらい: ドロンチをとばして進化する
  メガレックウザex:
    - カード: メガレックウザex
      ねらい: たねのまま殴りはじめる
    - カード: ぼうけんのランタン
      ねらい: 炎と雷を1枚ずつそろえる
  メガルカリオex:
    - カード: リオル
      ねらい: 進化のもとを置く
    - カード: ファイトゴング
      ねらい: 闘のたねか闘エネルギーを持ってくる
  タケルライコex:
    - カード: タケルライコex
      ねらい: たねのまま殴りはじめる
    - カード: アカマツ
      ねらい: ちがう色を2枚そろえる
  メガゲッコウガex:
    - カード: ケロマツ
      ねらい: 2進化の1匹めを置く
    - カード: ふしぎなアメ
      ねらい: ゲコガシラをとばして進化する
  マリィのオーロンゲex:
    - カード: マリィのベロバー
      ねらい: 進化のもとを置く
    - カード: ふしぎなアメ
      ねらい: ギモーをとばして進化する
  ドラパルトex＋バシャーモex:
    - カード: ドラメシヤ
      ねらい: 2進化の1匹めを置く
    - カード: ふしぎなアメ
      ねらい: 進化を1番早める
  Nのゾロアークex:
    - カード: Nのゾロア
      ねらい: 進化のもとを置く
    - カード: Nのポイントアップ
      ねらい: エネルギーをベンチにつけ直す
  おまつりおんど:
    - カード: お祭り会場
      ねらい: これが無いと2回攻撃できない
    - カード: サルノリ
      ねらい: バチンキーのもとを置く
  オーガポンバレット:
    - カード: ラティアスex
      ねらい: 入れ替えをただにする
    - カード: オーガポン みどりのめんex
      ねらい: エネルギーをつけはじめる
  ヤドキング:
    - カード: ヤドン
      ねらい: 進化のもとを置く
    - カード: 夜のアカデミー
      ねらい: 山札の上を作る
  フーディン:
    - カード: ケーシィ
      ねらい: 2進化の1匹めを置く
    - カード: ふしぎなアメ
      ねらい: ユンゲラーをとばして進化する
  カミツオロチex:
    - カード: 活力の森
      ねらい: 出したその番に進化する
    - カード: チコリータ
      ねらい: メガニウムのもとを置く
