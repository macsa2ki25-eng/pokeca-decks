<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#FFB703">
<title>きょうのポケカ</title>
</head>
<body>

<div class="wrap">
  <h1>きょうのポケカ</h1>
  <p class="updated" id="updated"></p>

  <div class="sample" id="sample" style="display:none">
    ⚠️ いまは練習用のサンプルデータです。
    本物の結果になるまで待ってね。
  </div>

  <div class="hero">
    <p class="cap" id="heroCap"></p>
    <p class="name" id="heroName"></p>
    <p class="note" id="heroNote"></p>
  </div>

  <div class="note-box" id="noNames" style="display:none">
    デッキの名前はまだ読みこめていません。
    カードをタップすると、本物のレシピ（60枚）が見られます。
  </div>

  <div class="section-title" id="eventTitle" style="display:none">どの大会？</div>
  <div class="grid3" id="eventRow" style="display:none">
    <button class="seg" data-value="all" aria-pressed="true">ぜんぶ</button>
    <button class="seg" data-value="city" aria-pressed="false">シティリーグ</button>
    <button class="seg" data-value="gym" aria-pressed="false">ジムバトル</button>
  </div>

  <div class="section-title" id="viewTitle">何を見る？</div>
  <div class="grid2" id="viewRow">
    <button class="seg" data-value="new" aria-pressed="true">新しい順</button>
    <button class="seg blue" data-value="rank" aria-pressed="false">強い順</button>
    <button class="seg span2" id="insideBtn" data-value="inside" aria-pressed="false"
            style="display:none">デッキの中身を調べる</button>
  </div>

  <div class="grid2" id="rankRow" style="margin-top:10px">
    <button class="seg" data-value="1" aria-pressed="false">優勝</button>
    <button class="seg blue" data-value="2" aria-pressed="false">準優勝</button>
    <button class="seg span2" data-value="all" aria-pressed="true">ぜんぶ見る</button>
  </div>

  <div class="grid3" id="periodRow" style="margin-top:10px;display:none">
    <button class="seg" data-value="7d" aria-pressed="true">1週間</button>
    <button class="seg" data-value="30d" aria-pressed="false">1か月</button>
    <button class="seg" data-value="all" aria-pressed="false">ぜんぶ</button>
  </div>

  <div class="section-title" id="deckTitle">デッキでさがす</div>
  <div class="chips" id="deckRow"></div>

  <div id="list"></div>

  <footer>
    データの もとは
    <a href="https://pokecabook.com/" target="_blank" rel="noopener">ポケカブック</a> と
    <a href="https://players.pokemon-card.com/" target="_blank" rel="noopener">ポケモンカードゲーム プレイヤーズクラブ</a>
    です。デッキの中身はタップして元のページで見てね。<br>
    このページは家族用の個人的なまとめです。記事や画像の転載はしていません。
  </footer>
</div>

<style>
:root{
  --bg:#FFF7EC; --card:#FFFFFF; --ink:#2B2118; --muted:#7A6A5A;
  --gold:#FFB703; --blue:#3A86FF; --line:#EFE1CE; --shadow:0 3px 0 #E8D6BE;
}
*{box-sizing:border-box}
/* 埋め込み表示のときに下の地色が透けないよう html にも背景を敷く */
html{background:var(--bg)}
body{
  margin:0; background:var(--bg); color:var(--ink);
  font-family:"Hiragino Maru Gothic ProN","ヒラギノ丸ゴ ProN","Yu Gothic",
    "Meiryo",system-ui,sans-serif;
  font-size:18px; line-height:1.7; -webkit-text-size-adjust:100%;
}
.wrap{max-width:760px;margin:0 auto;padding:16px 14px 64px}
h1{font-size:28px;margin:8px 0 2px;letter-spacing:.02em}
.updated{color:var(--muted);font-size:14px;margin:0 0 14px}
.sample{
  background:#FFE8E8;border:3px dashed #E63946;border-radius:14px;
  padding:12px 14px;margin:0 0 16px;font-size:16px;color:#B3242F;font-weight:700;
}
.note-box{
  background:#EAF2FF;border:3px solid #BBD4FF;border-radius:14px;
  padding:12px 14px;margin:0 0 16px;font-size:16px;color:#1F4E9C;
}
.hero{
  background:linear-gradient(135deg,#FFD166,#FFB703);
  border-radius:22px;padding:14px 18px;margin-bottom:14px;box-shadow:var(--shadow);
}
.hero .cap{font-size:16px;font-weight:700;margin:0 0 6px}
.hero .name{font-size:30px;font-weight:800;margin:0;line-height:1.3;word-break:break-word}
.hero .note{font-size:15px;margin:6px 0 0}
.section-title{font-size:15px;color:var(--muted);margin:16px 0 6px;font-weight:700}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.span2{grid-column:1 / -1}
button{font-family:inherit;font-size:19px;font-weight:700;cursor:pointer}
.seg{
  min-height:60px;padding:6px 4px;border-radius:16px;
  border:3px solid var(--line);background:var(--card);color:var(--ink);
  box-shadow:var(--shadow);line-height:1.3;
  /* ひらがなが単語の途中で折り返されると読みにくいので、
     文節の空白でだけ改行させる */
  word-break:keep-all;overflow-wrap:normal;
}
.grid3 .seg{font-size:17px}
.seg[aria-pressed="true"]{background:var(--gold);border-color:#E09B00}
.seg.blue[aria-pressed="true"]{background:var(--blue);border-color:#2668D8;color:#fff}
.chips{display:flex;gap:8px;overflow-x:auto;padding:4px 0 10px;-webkit-overflow-scrolling:touch}
.chip{
  flex:0 0 auto;min-height:52px;padding:0 18px;border-radius:26px;
  border:3px solid var(--line);background:var(--card);color:var(--ink);font-size:17px;
}
.chip[aria-pressed="true"]{background:var(--ink);color:#fff;border-color:var(--ink)}
.card{
  display:block;background:var(--card);border:3px solid var(--line);
  border-radius:20px;padding:14px 16px;margin-bottom:12px;
  text-decoration:none;color:inherit;box-shadow:var(--shadow);
}
.card:active{transform:translateY(2px);box-shadow:none}
.badge{
  display:inline-block;border-radius:999px;padding:3px 14px;font-size:15px;
  font-weight:800;color:#fff;margin-bottom:6px;
}
.badge.r1{background:var(--gold);color:#4A3200}
.badge.r2{background:var(--blue)}
/* keep-all は「ゆうしょう」が途中で折り返されるのを防ぐためだが、
   それだけだと「ナンジャモのハラバリーex」のような長いデッキ名が
   はみ出して横スクロールが出る。anywhere を足して、収まらないときだけ折る。 */
.deck{
  font-size:25px;font-weight:800;line-height:1.35;margin:2px 0 6px;
  word-break:keep-all;overflow-wrap:anywhere;
}
.meta{font-size:15px;color:var(--muted);word-break:keep-all;overflow-wrap:anywhere}
.go{margin-top:8px;font-size:16px;font-weight:700;color:#1F6FEB}
/* デッキ画像。タップしなくても中身が見えるように一覧へ並べる。
   loading=lazy なので、画面に入ったぶんだけ読み込む。 */
.shot{
  display:block;width:100%;height:auto;margin:10px 0 4px;
  border-radius:12px;border:2px solid var(--line);background:#fff;
}
.rankrow{display:flex;align-items:center;gap:14px}
.num{
  flex:0 0 auto;width:52px;height:52px;border-radius:50%;display:grid;place-items:center;
  font-size:22px;font-weight:800;color:#fff;background:var(--muted);
}
.num.n1{background:var(--gold);color:#4A3200}
.num.n2{background:#B8C0CC;color:#2B2118}
.num.n3{background:#D9A066}
.count{font-size:16px;color:var(--muted);word-break:keep-all;overflow-wrap:anywhere}
.count span{display:inline-block;margin-right:12px}
/* flex の子は既定で内容より縮まないので、明示的に縮められるようにする */
.rankrow > div:last-child{min-width:0}
.empty{text-align:center;color:var(--muted);padding:36px 10px;font-size:17px;line-height:2}
/* ---- デッキの なかみ ---- */
.groupbar{
  display:flex;align-items:baseline;gap:10px;margin:20px 0 8px;
  font-size:20px;font-weight:800;
}
.groupbar .howmany{font-size:14px;color:var(--muted);font-weight:700}
/* ---- 確率のはなし ---- */
.odds{
  background:#EEF4FF;border:3px solid #BFD4FF;border-radius:16px;
  padding:12px 14px;margin-bottom:9px;
}
.odds .head{font-size:18px;font-weight:800;margin-bottom:2px}
.odds .why{font-size:14px;color:var(--muted);margin-bottom:8px}
.odds .pair{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:8px}
.odds .box{
  flex:1 1 130px;min-width:0;background:#fff;border:2px solid #BFD4FF;
  border-radius:12px;padding:8px 10px;
}
.odds .box.hi{border-color:var(--blue);background:#F4F8FF}
.odds .box .lbl{font-size:13px;color:var(--muted);line-height:1.5}
/* .num は順位バッジ (丸い背景) に使っているので、別の名前にする */
.odds .box .pc{font-size:26px;font-weight:800;line-height:1.2}
.odds .box.hi .pc{color:var(--blue)}
.odds .how{font-size:14px;line-height:1.9;margin:0;padding-left:1.1em}
.odds .how li{word-break:keep-all;overflow-wrap:anywhere}
/* じぶんのデッキをしらべる計算機 */
.calc{
  background:var(--card);border:3px solid var(--line);border-radius:16px;
  padding:12px 14px;margin-bottom:9px;box-shadow:var(--shadow);
}
.calc label{display:block;font-size:15px;font-weight:700;margin:8px 0 3px}
.calc input{
  width:100%;box-sizing:border-box;font-size:19px;font-weight:800;
  padding:7px 10px;border:3px solid var(--line);border-radius:10px;
  background:#fff;color:var(--ink);font-family:inherit;
}
.calc .out{
  margin-top:12px;padding:10px 12px;border-radius:12px;background:#EEF4FF;
  border:2px solid #BFD4FF;font-size:17px;line-height:1.8;
}
.calc .out b{font-size:28px;color:var(--blue)}
/* カード1枚ぶん。押すと「このカードを つかう デッキ」が下に開く。 */
.cardline{
  display:flex;align-items:center;gap:12px;width:100%;text-align:left;
  background:var(--card);border:3px solid var(--line);border-radius:16px;
  padding:8px 12px;margin-bottom:8px;box-shadow:var(--shadow);color:inherit;
}
.cardline:active{transform:translateY(2px);box-shadow:none}
.thumb{
  flex:0 0 auto;width:52px;aspect-ratio:63/88;object-fit:cover;
  border-radius:6px;background:#EFE1CE;border:1px solid var(--line);
}
/* 中央だけ伸び縮みさせる。枚数の枠まで伸ばすと、画像が読めなかったときに
   枚数がやたら横長になってしまう。 */
.cbody{min-width:0;flex:1}
.cname{font-size:19px;font-weight:800;line-height:1.35;word-break:keep-all;overflow-wrap:anywhere}
.cmeta{font-size:14px;color:var(--muted);word-break:keep-all;overflow-wrap:anywhere}
/* 何枚入れるかが一番大事なので、右端に大きく置く */
.copies{
  flex:0 0 auto;width:62px;text-align:center;font-size:22px;font-weight:800;
  color:#B26A00;background:#FFF1D0;border-radius:12px;padding:4px 6px;line-height:1.2;
}
.copies small{display:block;font-size:12px;color:var(--muted);font-weight:700}
/* 押したときに開く「このカードを つかう デッキ」 */
.usedby{
  background:#F5FAFF;border:3px solid #CFE4FF;border-radius:14px;
  padding:10px 14px;margin:-4px 0 10px;font-size:16px;line-height:1.9;
}
.usedby b{font-size:17px}
.usedby ul{margin:6px 0 0;padding-left:1.2em}
/* 型の一覧 */
.variant{
  display:flex;align-items:center;gap:12px;background:var(--card);
  border:3px solid var(--line);border-radius:16px;padding:10px 14px;
  margin-bottom:8px;box-shadow:var(--shadow);
}
.variant .bar{flex:1;min-width:0}
.variant .vname{font-size:18px;font-weight:800;word-break:keep-all;overflow-wrap:anywhere}
.variant .track{height:10px;border-radius:6px;background:#F0E4D2;margin-top:6px;overflow:hidden}
.variant .fill{height:100%;background:var(--blue);border-radius:6px}
.variant .pct{flex:0 0 auto;font-size:19px;font-weight:800;min-width:56px;text-align:right}
.lead{
  background:#FFF3D6;border:3px solid #FFD98A;border-radius:14px;
  padding:12px 14px;margin:0 0 4px;font-size:16px;line-height:1.8;
}
/* デッキの読み方。数字の並びに埋もれないよう、色で役割を分ける。
   ヒーロー部分が .note を使っているので、別の名前にする。 */
.deckNote{margin:12px 0 4px}
.deckNote .oneline{
  font-size:20px;font-weight:800;line-height:1.65;margin:0 0 10px;
  padding:12px 15px;border-radius:14px;background:var(--ink);color:#fff;
}
.deckNote > div{border-radius:14px;padding:11px 15px;margin-bottom:9px;font-size:17px;line-height:1.95}
.deckNote b{display:block;font-size:18px;margin-bottom:4px}
.deckNote p{margin:0 0 8px}
.deckNote p:last-child{margin-bottom:0}
.deckNote ul{margin:4px 0 0;padding-left:1.15em}
.deckNote li{margin-bottom:5px}
/* ルビ。行間を広めに取っておかないと上の行と重なる */
ruby{ruby-align:center}
rt{font-size:.5em;font-weight:400;opacity:.75;letter-spacing:0}
/* カードの原文。ここはルビを振らず、書いてあるとおりに見せる */
.cardtext{
  margin:6px 0 10px;padding:10px 12px;border-radius:10px;
  background:#FBF6EE;border:2px solid var(--line);
  font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  font-size:13.5px;line-height:1.7;white-space:pre-wrap;overflow-x:auto;
}
.sec{background:var(--card);border:3px solid var(--line)}
.sec b{color:var(--ink)}
.sec-sum{background:#FFF8E6;border:3px solid #FFD98A}
.sec-sum b{color:#8A5A00}
.sec-warn{background:#FFF1EC;border:3px solid #FFC9B5}
.sec-warn b{color:#B3441E}
.sec-vs{background:#EEF2FF;border:3px solid #C6D2FF}
.sec-vs b{color:#3A4FB5}
footer{margin-top:28px;font-size:13px;color:var(--muted);line-height:1.8}
footer a{color:var(--muted)}
</style>

ーンの200ダメージで倒せるようになります。", "2ターン後に必要なダメージを、今のターンのうちに先払いしているわけです。相手は、準備しているだけのベンチポケモンが勝手に減っていきます。"]}, {"見出し": "ダメカンの置き方が自由", "本文": ["ここがこのデッキで一番おもしろいところです。ダメカン6個は、1匹にまとめて置く必要がありません。 1匹目に1個、2匹目に2個、3匹目に3個、というように配れます。", "よく使うのは、相手のHPをちょうど200にする置き方です。キチキギスexやラティアスexのようなHP210のポケモンにダメカンを1個だけ置くと、残りHPが200になります。次のターンにボスの指令で呼び出せば、ファントムダイブの200ダメージでちょうど倒しきれます。ベンチに置いたぶんと合わせて、1ターンで2匹倒せることもあります。", "残りHPを130にする置き方もあります。残りHP130ならヨノワールのカースドボム(ダメカン13個)がちょうど届くので、殴らずに倒せる状態になります。", "メガゲッコウガexも特性でダメカン6個を置けますが、あちらは1匹にまとめてです。自由に配れるドラパルトexのほうが、ダメージを細かく調整できます。", "ポケモンカードのHPとダメージは、とても細かく決められています。 HP330とHP340では、ドラパルトexが多い今の環境では大違いです。 HP330なら倒せて、HP340なら倒せない、ということが起きるからです。新しいカードのHPが10ちがうだけで、環境での立ち位置が変わります。"]}, {"見出し": "ダメージとダメカンは、別のもの", "引用": "シェイミ 【はなのカーテン】自分のベンチポケモン(ルールを持つポケモンをのぞく)全員は、\n                        相手のワザのダメージを受けない\nロック闘エネルギー  つけているポケモンは、相手のポケモンが使うワザの効果を受けない\n", "本文": ["ポケモンカードでは、この2つをはっきり分けて考えます。ワザで与えるのが「ダメージ」、あとから置くのが「ダメカン」です。ダメカンを置くのは、ワザや特性の「効果」のあつかいになります。", "だからシェイミがいても、ファントムダイブのダメカンは置けます。シェイミが防ぐのはダメージのほうだけだからです。", "逆にロック闘エネルギーをつけたポケモンには、ダメカンが置けません。こちらはワザの「効果」を受けないカードだからです。ダメージは通ります。", "カードのテキストに「ダメージ」と書いてあるか「ダメカン」と書いてあるかで、通るか通らないかが変わります。読むときに気をつけたいところです。"]}, {"見出し": "ダメカンを置く手段が、ほかにもある", "引用": "サマヨール 【カースドボム】自分をきぜつさせて、相手1匹にダメカン5個\nヨノワール 【カースドボム】自分をきぜつさせて、相手1匹にダメカン13個\nマシマシラ 【アドレナブレイン】自分の場のダメカン3個を、相手にのせ替える\n", "本文": ["ダメカンを置く手段が4種類もあります。採用率にも出ていて、マシマシラが93%、ヨマワル・サマヨール・ヨノワールが65%です。", "ヨノワールのダメカン13個(130ダメージ)とファントムダイブのダメカン6個(60ダメージ)を合わせると、殴らずに190ダメージぶんを置けます。そこにファントムダイブの200ダメージが乗ります。 HP320のポケモンでも届く計算になります。", "しかも安く済みます。カースドボムは自分のポケモンがきぜつしますが、サマヨールもヨノワールもexではないので、相手に渡すサイドは1枚だけです。サイド1枚で130ダメージぶんを置けるので、かなり割に合います。", "ダメージが無駄になりません。1発で倒しきれなくても、余ったぶんはベンチのポケモンに残ります。 330ダメージ出せるデッキがHP240のポケモンを倒すと90ダメージぶんが消えますが、ドラパルトexは消えません。"]}, {"見出し": "サイドの取られ方を決める", "引用": "非ルールのポケモン … 倒されると 相手はサイドを1枚とる\nポケモンex        … サイド2枚\nメガシンカex      … サイド3枚\n", "本文": ["勝つにはサイドを6枚とります。だから「何をどの順で倒して6枚にするか」を先に考えます。これをサイドプランといいます。", "自分がどう取られるかも同じくらい大事です。exを1匹倒されると2枚、メガシンカexなら3枚も進んでしまいます。渡すなら、なるべく安いポケモンで渡したいところです。", "ドラパルトexはここが上手です。カースドボムで自分からきぜつするサマヨールもヨノワールも非ルールなので、渡すサイドは1枚だけで済みます。"]}, {"見出し": "「倒す」と「倒される」は別の話", "引用": "アンフェアスタンプ  前の相手の番に「自分の」ポケモンがきぜつしていないと使えない\nキチキギスex 【さかてにとる】「自分の」ポケモンがきぜつしていたら、山札を3枚引く\n", "本文": ["どちらも「自分のポケモンが倒されたとき」に使えるカードです。相手を倒したかどうかは関係ありません。ここを読み違えると分からなくなります。", "つまり、話が2つあります。", "ひとつめ。相手を倒すと、相手のこれらが使えるようになってしまいます。だから、わざと倒さずに残しておくと、相手は立て直せません。ダメカンだけ置いておいて、終わりのほうでまとめて倒す、という戦い方ができます。", "ふたつめ。自分が倒されると、自分のこれらが使えます。ドラパルトexは、スボミーを安く差し出すことで、これを自分から起こしています。", "採用率にはっきり出ています。アンフェアスタンプが81%、キチキギスexが98%です。倒されることを前提に組まれています。"]}, {"見出し": "スボミーは、わざと倒させるカード", "引用": "スボミー   HP30   草タイプ   にげる0\nむずむずかふん   エネルギー0個 → 10ダメージ\n  次の相手の番、相手は手札からグッズを出して使えない\n", "本文": ["スボミーはHP30しかないので、前に出せばまず倒されます。でもそれでいいのです。倒されると、いいことが4つ同時に起きます。", "相手に渡すサイドは1枚だけです。exを渡すより安く済みます。", "むずむずかふんの10ダメージが相手に残ります。これが後で効いてきます。ファントムダイブの200ダメージとカースドボムの130ダメージを足すと330ダメージで、ここが上限です。でも10ダメージを1回入れておけば340ダメージ、 2回なら350ダメージになります。HP350のメガゲッコウガexにも届くようになります。", "グッズを止めるので、相手を1ターン遅らせられます。", "そして自分のポケモンが倒されたので、アンフェアスタンプが使えるようになります。", "倒されたあとも、夜のタンカでトラッシュから拾い直して、もう一度前に出せます。同じことを何度も繰り返せます。"]}, {"見出し": "攻撃する直前まで、ドロンチのままでいる", "本文": ["このデッキは、すぐにドラパルトexへ進化しません。攻撃するターンになって、はじめて進化します。", "ドロンチの【ていさつしれい】を使い続けたいからです。ベンチにドロンチを何匹も並べて、毎ターン手札を増やしながら準備します。進化してしまうと、その1匹はもう山札を見てくれません。", "エネルギーも、1匹に集めずに何匹かのドロンチに分けてつけます。エネルギーが2個ついたドロンチをボスの指令で呼ばれて倒されると、エネルギーの進みぐあいが大きく遅れてしまうからです。", "だから相手も、エネルギーのついたドロンチをねらってきます。倒せば【ていさつしれい】も止まり、エネルギーも遅れます。ここがこのデッキとの戦いの中心になります。", "相手がダメカンをばら撒くデッキのときは別です。 HP90のドロンチでは耐えられないので、先に進化することもあります。"]}, {"見出し": "サイドは、わざと先に取らせる", "本文": ["サポートは1ターンに1枚しか使えません。エネルギーが足りなくてアカマツを使うと、そのターンはボスの指令が使えず、ただ殴るだけになってしまいます。", "だから序盤は無理をしません。スボミーで相手を遅らせながら、ベンチにドロンチを並べて、余裕があるときにマシマシラやサマヨールを育てます。", "このあいだ、サイドはかなり先に取られます。でもそれでいいのです。ドラパルトexは1ターンに何匹も倒せるので、後から一気にひっくり返せます。最初から逆転するつもりで組まれているデッキです。"]}, {"見出し": "2進化なのに、事故りにくい", "引用": "ドラメシヤ4枚(100%)   ドロンチ4枚(100%)   ポケパッド4枚(100%)\nリーリエの決心4枚(100%)   ふしぎなアメ(81%)\n", "本文": ["2進化のデッキは「進化が間に合わない」のが弱点ですが、それを消すカードが確定枠に並んでいます。", "とくにドロンチです。【ていさつしれい】は自分の番に1回、山札の上2枚を見て 1枚を手札に加えられます。ふつう1進化は「2進化になるまでの通り道」でしかありませんが、ドロンチは場にいるだけで毎ターン手札が増えます。 1進化そのものがエンジンになっているところが、ほかの2進化デッキと違います。", "ポケパッドもよく合っています。「ルールを持たないポケモン」しか持ってこられませんが、このデッキのドラメシヤもヨマワルもマシマシラも全部その条件を満たします。制限が制限になっていません。", "エネルギーも軽いです。HP320のポケモンが、エネルギー2個で 200ダメージ+ダメカン6個を出します。炎と超の2色が必要ですが、アカマツ1枚でその両方が用意できます。"]}, {"見出し": "山札の下は、あとで使うカードの置き場所", "引用": "ドロンチ 【ていさつしれい】自分の番に1回使える。自分の山札を上から2枚見て、\n       どちらか1枚を選び、手札に加える。残りのカードは、山札の下にもどす\n", "本文": ["この特性は、1枚引けるカードとして見られがちです。でも大事なのは、選ばなかった1枚をどうするかのほうです。", "「山札の下にもどす」と書いてあります。切り直すのではなく、下です。つまり置き場所を自分で決められます。", "いま使わないけれど後で使うカードが出てきたら、下に置きます。それを毎ターンくり返すと、山札の下のほうに「後で使いたかったカード」が積み上がっていきます。", "山札は減っていくので、終盤にはその下の部分を引くことになります。つまり終盤の山札が、自分で選んだ当たりだらけになります。引き運がだんだん良くなっていく、という作りです。", "同じことができるカードはほかにもあります。ブルンゲルの【しんかいドロー】は1枚引いてから手札の1枚を下にもどせますし、ハイダイは手札2枚を好きな順番で下にもどして4枚引きます。推理セットは上3枚を見て、そのまま上に置くか、まとめて下に送るかを選べます。どれも「今と後で分ける」ためのカードです。"]}, {"見出し": "いらないカードを、先に使ってしまう", "引用": "なかよしポフィン  自分の山札から、HPが「70」以下のたねポケモンを2枚まで選び、\n              ベンチに出す\nリーリエの決心   自分の手札をすべて山札にもどして切る。その後、山札を6枚引く\n", "本文": ["なかよしポフィンは序盤にしか使いません。ベンチがそろったあとに引いても、ただの紙です。", "ここでリーリエの決心を見ます。手札を全部山札にもどして引き直すカードです。つまり、いらないカードを手札に持ったままこれを使うと、そのいらないカードを自分で山札に戻してしまいます。また引く可能性が出てきます。", "だから使ってしまいます。ベンチがもう埋まっていても、なかよしポフィンを使って「出すポケモンはいません」と言えます。「2枚まで」なので0枚でもいいからです。ハイパーボールも同じように使えます。", "こうすると、そのカードは山札に戻らずトラッシュに行きます。山札から1枚減り、いらないカードも1枚減ります。そのうえ山札の中身も見られるので、ほしいカードがまだ残っているかどうかまで分かります。", "使わないカードを使う、という変な動きに見えます。でも山札を薄くして、いらないものを外に出すためだと分かれば、とても理屈が通った動きです。"]}], "まとめ": ["倒されない── HP320・弱点なし・にげる1", "削る手段が多い── 200ダメージ + ダメカン6個 + カースドボム + のせ替え", "先回りできる──次のターンに倒すための準備を、今のターンにできる", "サイドが安い──自分から倒れるのは非ルール。渡すのはサイド1枚", "事故りにくい──ふしぎなアメ・ていさつしれい・ポケパッド・リーリエの決心", "山札の下に、あとで使うカードをためていける"], "しめ": "硬いから強いのでも、ダメージが大きいから強いのでもありません。硬さと先回りが同時にできるので、相手は「今の1匹を守ること」と「次の1匹を守ること」を一度に考えなければならなくなります。それが一番使われている理由です。", "弱点": ["スボミーを98%も入れているのは、グッズを止められると困るデッキがそれだけ多いということです。裏を返せば、ドラパルトex自身もふしぎなアメやボールに強く頼っています。同じことをやり返されると苦しくなります。", "ヨマワルはHP60、サマヨールはHP90しかありません。カースドボムを準備しているあいだは弱いので、ベンチをねらわれると計画が崩れます。", "ドロンチは手札を増やす役と、エネルギーの置き場という2つの役をしています。エネルギーのついたドロンチをボスの指令で倒されると、【ていさつしれい】も止まり、エネルギーも遅れます。2つ同時に痛いです。", "サポートは1ターンに1枚だけです。アカマツを使ったターンはボスの指令が使えず、ダメカンを置きたいところに置けません。", "事故率は低くありません。337件の平均で20.1%です。たねポケモンが8枚の構築だと34.6%になります。5回に1回は最初でつまずきます。", "弱点が無いことをひっくり返すカードが出てきています。リーリエのピッピexの【フェアリーゾーン】は、相手の場の竜ポケモン全員の弱点を超タイプにしてしまいます。ドラパルトexは竜タイプなので、弱点超×2 になり、ダダリンの170ダメージが340ダメージになってHP320が一撃で倒れます。効くのは竜タイプだけなので、これはドラパルトexとタケルライコexを名指しで止めにきているカードです。こういうふうに、あるデッキを止めるために作られたカードをメタカードと呼びます。"], "対面": ["ベンチを広げすぎないようにします。ダメカンを置く先が減ると、ファントムダイブの値打ちが下がります。", "HP210くらいのポケモンをベンチに並べると、ダメカンを1個置かれて残りHP200にされ、次のターンにまとめて倒されます。", "スボミーなどでグッズを止めると、ふしぎなアメが使えなくなって育ちません。", "エネルギーのついたドロンチをボスの指令で呼んで倒すのが一番効きます。【ていさつしれい】が止まり、エネルギーも遅れ、相手はアカマツなどエネルギーを増やすサポートしか使えなくなります。", "ロック闘エネルギーをつけたポケモンは、相手のワザの効果を受けません。ファントムダイブでダメカンを置くのはワザの「効果」なので、そのポケモンにはダメカンが置けなくなります。", "サイドを先に取れても油断できません。ドラパルトexは1ターンに何匹も倒せるので、最後にまとめて返されます。3枚差でも安心してはいけません。"]}, "groups": [{"label": "かならず入っている", "cards": [{"name": "ドラメシヤ", "n": 4, "avg": 4.0, "decks": 378, "total": 378, "img": "SV6/045770_P_DORAMESHIYA.jpg"}, {"name": "ポケパッド", "n": 4, "avg": 4.0, "decks": 378, "total": 378, "img": "M3/049703_T_POKEPADDO.jpg"}, {"name": "ドロンチ", "n": 4, "avg": 4.0, "decks": 378, "total": 378, "img": "SV6/045771_P_DORONCHI.jpg"}, {"name": "基本超エネルギー", "n": 3, "avg": 3.1, "decks": 378, "total": 378, "img": "ENE/042783_E_KIHONCHIXYOUENERUGI.jpg"}, {"name": "基本炎エネルギー", "n": 3, "avg": 3.1, "decks": 378, "total": 378, "img": "ENE/042780_E_KIHONHONOOENERUGI.jpg"}, {"name": "ボスの指令", "n": 3, "avg": 2.8, "decks": 378, "total": 378, "img": "SVHM/045387_T_BOSUNOSHIREI.jpg"}, {"name": "ドラパルトex", "n": 3, "avg": 2.8, "decks": 378, "total": 378, "img": "SV6/045772_P_DORAPARUTOEX.jpg"}, {"name": "アカマツ", "n": 2, "avg": 2.1, "decks": 377, "total": 378, "img": "SVK/046101_T_AKAMATSU.jpg"}, {"name": "リーリエの決心", "n": 4, "avg": 4.0, "decks": 376, "total": 378, "img": "MA/047900_T_RIRIENOKESSHIN.jpg"}, {"name": "ハイパーボール", "n": 4, "avg": 3.8, "decks": 376, "total": 378, "img": "SVHM/045369_T_HAIPABORU.jpg"}, {"name": "夜のタンカ", "n": 2, "avg": 2.0, "decks": 375, "total": 3 ": [], "decks": 45, "share": 0.12}, {"cards": ["ファイヤー"], "decks": 37, "share": 0.1}], "other": 0}, "ドラパルトex+バシャーモex": {"name": "ドラパルトex＋バシャーモex", "decks": 238, "odds": [{"card": "ドラメシヤ", "why": "2進化の1匹めを置く", "copies": 4, "effective": 18, "decks": 238, "p_plain": 44, "p_reach": 95, "draws": 8, "how": ["なかよしポフィン 4枚→ドラメシヤ", "ドラメシヤ 4枚", "ハイパーボール 4枚→ドラメシヤ", "ポケパッド 4枚→ドラメシヤ", "ニャースex 1枚→ヒカリ→ドラメシヤ"]}, {"card": "ふしぎなアメ", "why": "進化を1番早める", "copies": 2, "effective": 2, "decks": 238, "p_plain": 25, "p_reach": 25, "draws": 8, "how": ["ふしぎなアメ 2枚"]}], "note": {"結論": "ドラパルトexの一番の困りごとだったエネルギーを、バシャーモexが解決した形です。", "節": [{"見出し": "足りなかったものを足す", "引用": "バシャーモex   HP320   炎タイプ   弱点 水×2\n\n【たぎるとうし】自分の番に1回、自分のトラッシュから基本エネルギーを1枚選び、\n             自分のポケモンにつける\nバーニングソルト   エネルギー2個 (炎・無) → 200ダメージ\n  次の自分の番、このポケモンはワザが使えない\n", "本文": ["ドラパルトexは、ファントムダイブを打つまでのエネルギーの用意が大変です。アカマツを使ったターンはボスの指令が使えず、ダメカンを置きたい場所に置けません。", "バシャーモexの【たぎるとうし】は、毎ターン、トラッシュからエネルギーを 1枚つけられます。サポートを使わずにエネルギーが増えるので、サポートの枠をボスの指令に回せるようになります。", "しかもバシャーモex自身がHP320で、200ダメージを出すアタッカーです。エネルギーを配る役と、殴る役を1匹で兼ねています。", "炎エネルギーはもともとファントムダイブに必要なので、炎タイプのバシャーモexとは無理なく同居できます。"]}, {"見出し": "悪エネルギーが2枚だけ入っている理由", "引用": "マシマシラ 【アドレナブレイン】このポケモンに悪エネルギーがついているなら、\n         自分の番に1回使える。自分の場のポケモン1匹にのっているダメカンを\n         3個まで選び、相手の場のポケモン1匹にのせ替える\n", "本文": ["このデッキのエネルギーは、基本炎3.0枚・基本超3.0枚・基本悪2.1枚です。炎と超はファントムダイブの分だとして、悪はどこで使うのでしょうか。", "悪エネルギーが要るワザは、このデッキに1つもありません。キチキギスexは悪タイプですが、そのワザは無エネルギー3個です。この2枚は、マシマシラの特性を動かすためだけに入っています。", "【アドレナブレイン】には「このポケモンに悪エネルギーがついているなら」と書いてあります。マシマシラは超タイプのポケモンなのに、動かすのに要るのは悪エネルギーです。カードの文をよく読まないと気づけません。", "悪エネルギーは殴るのには1ミリも使いません。それでも100%のデッキが 2枚だけ入れています。ダメカンを3個動かせることに、エネルギー2枚ぶんの価値があるということです。", "【たぎるとうし】はトラッシュから「基本エネルギー」を1枚つけるので、この悪エネルギーも拾い直せます。 2枚しか入っていなくても、使い回せる形になっています。"]}, {"見出し": "相手の特性を、タイプごと消すスタジアム", "引用": "ロケット団の監視塔 (スタジアム)\n  おたがいの場の無ポケモン全員の特性は、すべてなくなる\n", "本文": ["55%が入れています。特性を消すスタジアムですが、消えるのは無タイプだけです。", "このデッキで無タイプなのはニャースexくらいです。ニャースexの特性はベンチに出したときに1回使うものなので、使ったあとに張れば、こちらはほとんど困りません。", "消したい相手ははっきりしています。メガガルーラexの【おつかいダッシュ】、ファイアローexの【エキサイトダイブ】、ノココッチの【にげあしドロー】。どれも無タイプのポケモンの特性です。", "メガレックウザexのデッキは、ほとんどのポケモンが無タイプです。このスタジアム1枚で、相手の動きがまとめて止まります。", "タイプで区切って効くカードは、当たる相手と当たらない相手がはっきり分かれます。どのデッキが多いかを見て入れる枠です。"]}, {"見出し": "そのかわり弱点が増える", "本文": ["ドラパルトexは弱点がありません。ここが最大の強みでした。ところがバシャーモexは弱点水×2 です。160ダメージで倒れます。", "つまり、弱点で崩される道を自分から作っていることになります。水タイプの相手には、バシャーモexだけが狙われます。", "デッキの枠も食います。アチャモとバシャーモexで4枚ぶん使うので、ドロンチやサマヨールに回せる枠が減ります。ふしぎなアメを2.3枚入れて、ワカシャモを1枚に減らしているのは、少しでも枠を空けるためです。"]}], "まとめ": ["エネルギーの悩みが消える──サポートを使わずに毎ターン1枚", "アタッカーが2匹になる── HP320が2種類", "悪エネルギー2枚は、マシマシラを動かすためだけに入っている", "ロケット団の監視塔で、無タイプの特性をまとめて消せる", "弱点ができる──バシャーモexは水×2"], "しめ": "1〜2か月前は9.3%ありましたが、直近2週では5.3%まで減っています。素のドラパルトexのほうが11.3%と多く、いまは「エネルギーを足すより、弱点なしのまま戦ったほうがよい」と考える人が増えているようです。", "弱点": ["バシャーモexの弱点水×2 が唯一のはっきりした穴です。", "バーニングソルトは次のターン使えないので、続けて撃てません。", "ドラパルトexの部分の弱点は、そのまま全部残っています。"], "対面": ["水タイプで攻撃できるなら、バシャーモexだけをねらいます。", "バーニングソルトを撃たれた次のターンが攻め時です。", "ドラパルトex単体のときと同じで、エネルギーのついたドロンチをねらうのが効きます。"]}, "groups": [{"label": "かならず入っている", "cards": [{"name": "なかよしポフィン", "n": 4, "avg": 4.0, "decks": 238, "total": 238, "img": "SV5K/045209_T_NAKAYOSHIPOFUIN.jpg"}, {"name": "ドラメシヤ", "n": 4, "avg": 4.0, "decks": 238, "total": 238, "img": "SV6/045770_P_DORAMESHIYA.jpg"}, {"name": "リーリエの決心", "n": 4, "avg": 3.9, "decks": 238, "total": 238, "img": "MA/047900_T_RIRIENOKESSHIN.jpg"}, {"name": "ドロンチ", "n": 4, "avg": 3.9, "decks": 238, "total": 238, "img": "SV6/045771_P_DORONCHI.jpg"}, {"name": "ハイパーボール", "n": 4, "avg": 3.8, "decks": 238, "total": 238, "img": "SVHM/045369_T_HAIPABORU.jpg"}, {"name": "ポケパッド", "n": 4, "avg": 3.6, "decks": 238, "total": 238, "img": "M3/049703_T_POKEPADDO.jpg"}, {"name": "基本炎エネルギー", "n": 3, "avg": 3.0, "decks": 238, "total": 238, "img": "ENE/042780_E_KIHONHONOOENERUGI.jpg"}, {"name": "基本超エネルギー", "n": 3, "avg": 3.0, "decks": 238, "total": 238, "img": "ENE/042783_E_KIHONCHIXYOUENERUGI.jpg"}, {"name": "ボスの指令", "n": 3, "avg": 2.9, "decks": 238, "total": 238, "img": "SVHM/045387_T_BOSUNOSHIREI.jpg"}, {"name": "ふしぎなアメ", "n": 2, "avg": 2.3, "dec 85, "draws": 8, "how": ["ロケット団のラムダ 4枚→ハイパーボール→ゲノセクトex", "ロケット団のレシーバー 4枚→ロケット団のラムダ→ハイパーボール→ゲノセクトex", "ゲノセクトex 2枚", "ハイパーボール 1枚→ゲノセクトex", "プレシャスキャリー 1枚→ゲノセクトex"]}], "note": {"結論": "330ダメージを毎ターン撃ち続けられます。そのためにデッキの4枚に1枚がエネルギーで、さらにエネルギーを山札とトラッシュの間で行き来させています。", "節": [{"見出し": "エネルギー5個が条件", "引用": "メガドリュウズex   HP340   鋼タイプ   弱点 炎×2   にげる4\n\nマキシマムドリル   鋼エネルギー3個 → 200ダメージ +\n  このワザを使うためのエネルギーより2個多くエネルギーがついているなら、\n  130ダメージ追加 (合計330ダメージ)\n", "本文": ["条件は「ワザに必要な3個より2個多い」なので、エネルギー5個です。 1匹に5個も集めるのは、ふつうなら何ターンもかかります。", "そのかわり、撃ってもエネルギーをトラッシュしません。一度5個そろえば、そのまま330ダメージを毎ターン撃ち続けられます。", "タケルライコexは殴るたびにエネルギーを捨てるので毎ターン並べ直しですが、こちらは並べ直しが要りません。時間をかけた見返りがここにあります。"]}, {"見出し": "デッキの4枚に1枚がエネルギー", "引用": "メタング 【メタルメーカー】自分の番に1回使える。自分の山札を上から4枚見て、\n        その中から基本エネルギーを好きなだけ選び、自分のポケモンに好きなようにつける。\n        残りのカードはすべてウラにして切り、山札の下にもどす\n", "本文": ["このデッキは基本鋼エネルギーを平均15.6枚入れています。 60枚のうち約26%、4枚に1枚がエネルギーという計算です。ふつうのデッキは8枚から10枚くらいなので、かなり多い部類です。", "多い理由は【メタルメーカー】にあります。山札の上4枚を見て、その中にあるエネルギーを場につけるので、山札にエネルギーが濃く入っているほど、当たる数が増えます。", "26%なら、上4枚に1枚もエネルギーが無い確率はおよそ30%です。逆に言えば7割の確率で1枚以上あり、平均すると1枚ちょっと当たります。", "メタングは平均4.0枚、ダンバルも平均4.0枚入っています。ベンチにメタングを3匹並べれば、【メタルメーカー】が1つの番に3回使えます。手札からつける1個と合わせて、2ターンで5個に届きます。", "つまりこのデッキのエネルギー15.6枚は、手札につけるためではなく、山札の上4枚に当てるための枚数です。", "終盤になると、この作りが裏目に出ます。エネルギーはどんどん場に出ていくので、山札に残るエネルギーが減り、【メタルメーカー】が当たらなくなります。", "そこでエネルギーリサイクルを94%が入れています。トラッシュの基本エネルギーを5枚まとめて山札にもどすカードです。 5枚というのは、メガドリュウズex1匹ぶんとちょうど同じ数です。", "メガドリュウズexが倒されると、ついていたエネルギー5個はトラッシュに行きます。それを山札にもどして、また【メタルメーカー】で拾い直す。エネルギーが場とトラッシュと山札をぐるぐる回るようにできています。"]}, {"見出し": "1枚しか入れられないカード", "引用": "プレシャスキャリー (ACE SPEC)\n  自分の山札からたねポケモンを好きなだけ選び、ベンチに出す。そして山札を切る\n", "本文": ["同じ名前のカードは、ふつうデッキに4枚まで入れられます (エネルギーは別です)。でもカードのすみに「ACE SPEC」と書いてあるものは、デッキに1枚までしか入れられません。", "そのかわり、1枚で試合が動くくらい強く作られています。プレシャスキャリーもその1枚です。たねポケモンを好きなだけ、山札からベンチに出せます。ベンチは5匹までなので、1枚で5匹まとめて並ぶということです。", "ACE SPECは1枚までなので、デッキはその1枚に何を選ぶかを決めます。そして何を選んだかを見ると、そのデッキが何に困っているかが分かります。ドラパルトexは81%がアンフェアスタンプ、おまつりおんどは85%がシークレットボックス、ヤドキングは50%がプライムキャッチャーです。", "メガドリュウズexは85%がプレシャスキャリーを選びました。つまりこのデッキが一番ほしいのは、ダメージでも回復でもなく、「1番めに盤面がそろうこと」だということです。"]}, {"見出し": "1枚のカードを、実質13枚にする", "引用": "ロケット団のラムダ (サポート)   自分の山札からトレーナーズを1枚選び、手札に加える\nロケット団のレシーバー (グッズ)  自分の山札から、名前に「ロケット団」とつく\n                           サポートを1枚選び、手札に加える\nニャースex 【おくのてキャッチ】このカードを手札からベンチに出したとき、\n                        自分の山札からサポートを1枚選び、手札に加える\nハイパーボール (グッズ)       自分の山札からポケモンを1枚選び、手札に加える\n", "本文": ["ここが、このデッキで一番おもしろいところです。", "プレシャスキャリーは1枚しか入れられません。 60枚の山札から最初の8枚を引いたとき、その1枚が入っている確率は13%です。 8回に1回くらいしか来ません。それでは作戦になりません。", "ところが実際はちがいます。ロケット団のラムダはトレーナーズなら何でも持ってこられるので、ラムダを引けばプレシャスキャリーが手に入ります。ラムダは4枚入っています。", "ロケット団のレシーバーを引けば、ラムダが手に入ります。これも4枚です。", "ニャースexを引けば、ベンチに出したときの特性でラムダが手に入ります。", "ハイパーボールを引けば、ニャースexが手に入ります。", "つまり「プレシャスキャリーになれるカード」は、プレシャスキャリー1枚だけではありません。実際の優勝デッキを数えると、まん中あたりの形で9枚、一番多い形では13枚ありました。", "最初の8枚で引ける確率は、9枚なら75%、13枚なら87%です。 13%が75%や87%になります。", "これがポケモンカードの本当の数え方です。「何枚入れたか」ではなく「何枚が、そのカードになれるか」で考えます。上に出ている「1番めに引けるかな？」の数字も、この数え方で出しています。"]}, {"見出し": "だからじゃんけんに勝ったら後攻を選ぶ", "本文": ["先攻の1番めは、サポートが使えない決まりです。ロケット団のラムダはサポートなので、先攻だと1番めに使えません。", "ラムダが使えないと、レシーバーもニャースexもラムダにつながらないので意味がなくなります。さっきの実質9枚や13枚が、いきなり1枚に戻ります。確率も75%から12%まで落ちます。", "後攻なら1番めからサポートが使えます。そのうえ後攻は最初に1枚多く引けるので、見られるカードは8枚です。", "だからこのデッキは、じゃんけんに勝ったら後攻を選びます。先に殴れることより、1番めに盤面をそろえることのほうが大事だからです。", "どちらを選ぶかはデッキによって変わります。自分のデッキが1番めに何をしたいのかで決まります。"]}, {"見出し": "モグリューのワザは保険", "引用": "モグリュー (M5 044/081)   HP70   闘タイプ\nなかまをよぶ   無エネルギー1個\n  自分の山札からたねポケモンを2枚まで選び、ベンチに出す。そして山札を切る\n", "本文": ["モグリューは100%、平均2.9枚入っています。メガドリュウズexはモグリューから進化するので、入っているのは当たり前です。", "ただ、モグリューという名前のカードは何種類も出ていて、ワザも特性もそれぞれちがいます。調べてみると、178デッキの全部が同じ1枚を使っていました。メガドリュウズexと同じ弾に入っている、M5の044番です。", "選ばれている理由は「なかまをよぶ」です。エネルギー1個で、山札からたねポケモンを2枚ベンチに出せます。", "ただしこれは、プレシャスキャリーにたどりつけなかったときの保険です。ワザなので、撃つには1つの番をまるごと使います。プレシャスキャリーなら1番めに5匹並ぶところを、こちらは2匹ずつしか並びません。", "それでも入れておく意味はあります。 13%を87%にしても、10回に1回は失敗するからです。失敗した番に何もできないデッキと、2匹並べられるデッキでは、立て直せるかどうかが変わります。", "おまけもあります。なかまをよぶのためにモグリューにつけたエネルギーは、進化しても場に残ります。そのままメガドリュウズexのエネルギー5個の1個めになります。"]}, {"見出し": "1枚で何枚ぶん動くか", "本文": ["終盤になると、山札は薄くなります。薄いほうが、ほしいカードを引く確率は上がります。 30枚の山札から4枚のカードを引くほうが、 60枚から引くよりずっと当たりやすいからです。", "だから強いデッキは、序盤にわざと山札を減らします。", "ここで「1枚で何枚ぶん動くか」が効いてきます。プレシャスキャリー1枚で山札が5枚減ります。なかよしポフィン1枚なら2枚減ります。ふつうのカードは1枚で1枚です。", "山札が減れば、残りの山札は「まだ使っていない、必要なカード」の割合が上がっていきます。よく回るデッキというのは、こうやって後半になるほど当たりが濃くなるデッキのことです。"]}, {"見出し": "相手のHPを30下げる", "引用": "グラビティーマウンテン (スタジアム)\n  おたがいの場の2進化ポケモン全員の最大HPは、それぞれ「-30」される\n", "本文": ["72%が入れています。おたがいの2進化ポケモンのHPが30下がるスタジアムです。", "メガドリュウズexは1進化なので、自分は影響を受けません。片側だけが得をする形になっています。", "効く相手を並べると理由が分かります。ドラパルトexは2進化でHP320、メガゲッコウガexは2進化でHP350、メガリザードンexとメガサーナイトexは2進化でHP360です。 30下がると、それぞれHP290・HP320・HP330になります。", "マキシマムドリルは330ダメージなので、ここまで下がれば全部一撃で倒せます。このスタジアムは、HP350や360の相手を射程に入れるためのカードです。", "一方でメガルカリオexは1進化のHP340です。スタジアムが効かないので、 330ダメージでは10だけ足りません。HP340とHP330の差がそのまま出ます。", "カードのHPが10違うだけで倒せるかどうかが変わる。ポケモンカードの数字は、そこまで細かく決められています。"]}, {"見出し": "好きなトレーナーズを毎ターン持ってくる", "引用": "ロケット団のラムダ    自分の山札からトレーナーズを1枚選び、手札に加える\nロケット団のレシーバー  自分の山札から、名前に「ロケット団」とつくサポートを1枚選び、\n                   手札に加える\n", "本文": ["ロケット団のラムダが99%・平均3.9枚、ロケット団のレシーバーが95%・平均3.8枚入っています。合わせて8枚近くです。", "ラムダはトレーナーズなら何でも持ってこられます。レシーバーはそのラムダを持ってこられます。", "つまりこの8枚は、全部が「好きなカード1枚」に化けます。エネルギーを大量に積んで手札が偏りやすいデッキなので、どこから引いても必要なカードにたどり着けるようにしてあります。"]}], "まとめ": ["エネルギー5個で330ダメージ、撃ってもエネルギーは減らない", "エネルギー15.6枚は、メタルメーカーを当てるための枚数", "ACE SPECの1枚にプレシャスキャリーを選んでいる", "実質9枚から13枚にして、1番めに75%から87%でたどりつく", "じゃんけんに勝ったら後攻を選ぶ──先攻はサポートが使えないから", "グラビティーマウンテンで、HP350や360の相手を330の射程に入れる", "ロケット団の8枚が、全部「好きなカード」になる"], "しめ": "準備に時間がかかるかわり、そろってからは毎ターン同じ330ダメージが出ます。そして相手のHPを30下げるカードまで入れて、 330で届く相手を自分から増やしにいっています。", "弱点": ["弱点は炎×2 です。170ダメージで倒れます。HP340が実質HP170になってしまいます。", "にげるが4もあります。エネルギーがそろう前にボスの指令で呼び出されると、前に立ったまま何もできません。", "メガシンカexなので、倒されるとサイドを3枚渡します。", "エネルギー5個をつけるまでに時間がかかります。育つ前が一番弱いです。", "モグリューは弱点草×2 です。スボミーの10ダメージが20ダメージになります。"], "対面": ["炎タイプで攻撃できるなら、HP340も170ダメージで倒せます。", "ダンバル(HP70)やモグリュー(HP70)のうちに倒すと育ちません。", "育ちきる前に攻めるのが基本です。育ってからでは止まりません。", "HP340以上で、しかも1進化か、たねポケモンで前に立つと、330ダメージで倒されません。"]}, "groups": [{"label": "かならず入っている", "cards": [{"name": "基本鋼エネルギー", "n": 15, "avg": 15.6, "decks": 180, "total": 180, "img": "/0 す。「場に『お祭り会場』が出ているなら」という条件が先に書いてあります。", "お祭り会場が場に無いあいだ、カミッチュはただのHP80のポケモンです。ワザは1回しか使えず、ダメージは半分になります。", "スタジアムは場に1枚しか出せません。相手が別のスタジアムを出した瞬間に、このデッキの攻撃力は半分になります。", "だからお祭り会場を100%が入れていて、しかも平均4.0枚です。 4枚というのは入れられる上限です。張り替えられたら、その番のうちに張り直します。", "このデッキで一番大事なカードはカミッチュではなく、お祭り会場のほうだと言えます。"]}, {"見出し": "お祭り会場そのものも守ってくれる", "引用": "お祭り会場 (スタジアム)\n  エネルギーがついているおたがいのポケモン全員は、特殊状態にならず、\n  受けている特殊状態は、すべて回復する\n", "本文": ["お祭り会場は名前を呼ばれるだけのカードではありません。それ自身にも効果があります。", "エネルギーがついているポケモンは、どく・こんらん・ねむり・まひにならなくなります。カミッチュは草エネルギー1個をつけて戦うので、この守りをいつも受けています。", "毒でじわじわ削ってくるデッキや、こんらんで止めてくるデッキに対して、スタジアムを置いているだけで防げているわけです。", "おたがいに効くので、相手のポケモンも守られます。それでも、毒を使うのはたいてい相手のほうなので、得をするのはこちら側です。"]}, {"見出し": "ベンチの1匹が、ダメージ2回ぶん", "引用": "ともだちのわ    自分のベンチポケモンの数 × 20ダメージ\nグラジオの決戦  自分の手札がこのカード1枚だけのときにしか使えない。\n              この番、自分のポケモン(ルールを持つポケモンをのぞく)が使うワザの、\n              相手のバトルポケモンへのダメージは「+80」される\nブレイブバングル つけているポケモン(ルールを持つポケモンをのぞく)が使うワザの、\n              相手のバトル場の「ポケモンex」へのダメージは「+30」される\n", "本文": ["ともだちのわは、ベンチが5匹なら100ダメージです。それが2回で200ダメージです。", "ここにグラジオの決戦を86%が入れています。ダメージが80上がるサポートですが、 2回攻撃なので、上がるのも2回ぶんで160ダメージです。", "ブレイブバングルも99%が入れています。相手がポケモンexなら30上がり、これも2回ぶんで60ダメージです。", "全部そろうと、100＋80＋30が2回で420ダメージになります。 HP80のポケモンが、草エネルギー1個で420ダメージを出す計算です。", "ここが大事なところです。ダメージを上げるカードは、 2回攻撃のデッキでは効き目が2倍になります。同じ「＋80」でも、このデッキでは160の価値があります。", "ベンチの1匹も同じです。ふつうのデッキならベンチが1匹増えて20ダメージですが、このデッキでは40ダメージぶんになります。"]}, {"見出し": "ベンチが、そのまま手札を探す力になる", "引用": "バチンキー 【ドンドンだいこ】自分のバトルポケモンが特性「おまつりおんど」を\n          持つポケモンなら、自分の番に1回使える。\n          自分の山札から好きなカードを1枚選び、手札に加える\n\nアズマオウ 【おまつりおんど】持ち   クイックドロー 無エネルギー1個\n          60ダメージ、自分の山札を2枚引く\n", "本文": ["バチンキーが99%、平均3.7枚入っています。3枚以上入れているデッキがほとんどだということです。", "特性の文をよく読むと、「別のドンドンだいこを使っていたなら使えない」という一文がありません。同じ名前の特性でも、この一文が無いものは何匹ぶんでも使えます。ベンチに3匹いれば1つの番に3回、山札から好きなカードを3枚持ってこられます。", "ここでベンチの意味が2つになります。ベンチの数はともだちのわのダメージであり、同時にカードを探す回数でもあります。ベンチを1匹増やすと、ダメージが40上がって、探せる枚数も1枚増えることがあります。", "アズマオウも【おまつりおんど】持ちです。クイックドローを2回撃つと 120ダメージを与えながら山札を4枚引けます。殴るカードと引くカードが同じ1匹になっています。", "グラジオの決戦は手札が1枚のときしか使えません。探して、出して、使い切って、最後にグラジオの決戦だけを残す。この順番でカードを使うデッキです。"]}, {"見出し": "ドラパルトexを止めるカードが3種類入っている", "引用": "ベラカス 【スフィアシールド】このポケモンがいるかぎり、自分のベンチポケモン全員は、\n        相手のポケモンからワザのダメージや効果を受けない\nシェイミ 【はなのカーテン】このポケモンがいるかぎり、自分のベンチポケモン\n        (ルールを持つポケモンをのぞく)全員は、相手のワザのダメージを受けない\nコダック 【しめりけ】このポケモンがいるかぎり、おたがいのポケモン全員は、\n        そのポケモン自身をきぜつさせる効果の特性が、すべてなくなる\n", "本文": ["この3枚を並べて読むと、書いてある言葉が少しずつ違います。違いがそのまま役割の違いになっています。", "シェイミが防ぐのは「ワザのダメージ」だけです。ドラパルトexのファントムダイブがベンチに置くのはダメカンで、これはワザの効果のあつかいです。だからシェイミでは防げません。", "ベラカスは「ワザのダメージや効果」と書いてあります。効果まで防ぐので、ファントムダイブのダメカンが置けなくなります。シガロコとベラカスがどちらも68%で、そろって入っているのはこのためです。", "コダックは「自分自身をきぜつさせる効果の特性」を消します。サマヨールとヨノワールのカースドボムが、これに当てはまります。ドラパルトexのデッキは、殴らずにダメカンを置く手段を何種類も持っていますが、コダックはそのうちの1つを丸ごと止めます。", "ベンチのポケモンがHP70前後ばかりのデッキなので、ベンチを削る攻め方が一番こわいです。そこを3枚がかりで防いでいます。"]}], "まとめ": ["2回攻撃はお祭り会場が場にあるときだけ──無いと半分になる", "ダメージを上げるカードは効き目が2倍──＋80が160になる", "ベンチの数は、ダメージであり、探せる枚数でもある", "ベラカスとコダックで、ドラパルトexのダメカンを止める"], "しめ": "HP80のポケモンが420ダメージを出せるのは、 2回攻撃だからです。そしてその2回攻撃は、スタジアム1枚に乗っています。強さの全部が1枚のカードに乗っているデッキです。", "弱点": ["お祭り会場を張り替えられると、ダメージが半分になります。ここが最大の弱点です。", "カミッチュはHP80、弱点は炎×2 です。40ダメージで倒れます。", "グラジオの決戦は手札が1枚のときしか使えません。相手にジャッジマンなどで手札を配られると、その番は使えなくなります。", "ベンチの数でダメージが決まるので、ベンチを減らされると弱くなります。"], "対面": ["スタジアムを張り替えるのが一番効きます。ダメージが半分になります。", "炎タイプなら、カミッチュもバチンキーも一撃で倒せます。", "手札を増やすカードを相手に使わせると、グラジオの決戦が止まります。", "ベラカスがいるあいだは、こちらのワザでベンチにダメカンを置けません。先にベラカスをボスの指令で呼び出して倒すのが早道です。"]}, "groups": [{"label": "かならず入っている", "cards": [{"name": "お祭り会場", "n": 4, "avg": 4.0, "decks": 174, "total": 174, "img": "SV6/045790_T_OMATSURIKAIJIXYOU.jpg"}, {"name": "リーリエの決心", "n": 4, "avg": 3.9, "decks": 174, "total": 174, "img": "MBD/048304_T_RIRIENOKESSHIN.jpg"}, {"name": "なかよしポフィン", "n": 4, "avg": 4.0, "decks": 173, "total": 174, "img": "SV5K/045209_T_NAKAYOSHIPOFUIN.jpg"}, {"name": "ポケパッド", "n": 4, "avg": 3.9, "decks": 173, "total": 174, "img": "M-P/049601_T_POKEPADDO.jpg"}, {"name": "サルノリ", "n": 4, "avg": 3.9, "decks": 173, "total": 174, "img": "SV6/045699_P_SARUNORI.jpg"}, {"name": "バチンキー", "n": 4, "avg": 3.8, "decks": 173, "total": 174, "img": "SV 手札にもどすカードです。 HP340がまるごと戻るうえ、エネルギーもトラッシュではなく手札に帰ってきます。手札から1枚つけ直し、残りははどうづきで配る、という流れになります。"]}, {"見出し": "270ダメージを、どこまで伸ばせるか", "引用": "パワープロテイン (グッズ)  この番、自分の闘ポケモンが使うワザの、\n                       相手のバトルポケモンへのダメージは「+30」される\nマキシマムベルト (どうぐ)  このカードをつけているポケモンが使うワザの、\n                       相手のバトル場の「ポケモンex」へのダメージは「+50」される\nグラビティーマウンテン     おたがいの場の2進化ポケモン全員の最大HPは「-30」される\n", "本文": ["パワープロテインは100%、平均3.9枚入っています。サポートではなくグッズなので、 1つの番に何枚でも使えます。2枚使えば270ダメージが330ダメージです。", "マキシマムベルトを42%が入れています。相手のバトル場がポケモンexなら50上がるので、 270＋50＋30で350ダメージになります。", "グラビティーマウンテンを78%が入れています。 2進化ポケモンのHPを30下げるスタジアムです。メガルカリオexは1進化なので、自分は下がりません。", "下がる相手を並べると意味が分かります。ドラパルトexはHP320からHP290、メガゲッコウガexはHP350からHP320、メガリザードンexはHP360からHP330です。 270ダメージにパワープロテイン2枚を足せば、ここまで全部届きます。", "自分のダメージを上げるだけでなく、相手のHPを下げてすり合わせる。この2方向から数字を寄せていくのが、このデッキの考え方です。"]}, {"見出し": "相手のワザの効果を、まるごと無効にするエネルギー", "引用": "ロック闘エネルギー\n  このカードは、ポケモンについているかぎり、闘エネルギー1個ぶんとしてはたらく。\n  このカードをつけている闘ポケモンは、相手のポケモンが使うワザの効果を受けない\n", "本文": ["47%が入れています。エネルギーとしても数えられて、そのうえワザの効果を受けなくなるカードです。", "ここでダメージと効果のちがいが効いてきます。ドラパルトexのファントムダイブは、200ダメージのあとにダメカン6個を相手のベンチに置きます。このダメカンはワザの「効果」です。", "ロック闘エネルギーをつけたメガルカリオexには、そのダメカンが置けません。どくにもなりませんし、「にげられない」も効きません。通るのはダメージだけになります。", "守れるのは闘ポケモンだけなので、どのデッキでも使えるカードではありません。闘タイプで組んでいるこのデッキだけが受け取れる特典です。"]}, {"見出し": "引くしくみと、呼び出すしくみ", "引用": "ルナトーン 【ルナサイクル】自分の場に「ソルロック」がいて、自分の番に、\n         自分の手札から「基本闘エネルギー」を1枚トラッシュするなら、1回使える。\n         自分の山札を3枚引く\nハリテヤマ 【どすこいキャッチャー】自分の番に、このカードを手札から出して\n         進化させたとき、1回使える。\n         相手のベンチポケモンを1匹選び、バトルポケモンと入れ替える\n", "本文": ["ソルロックが99%、ルナトーンも99%です。ルナサイクルはソルロックが場にいないと使えないので、 2匹そろって初めて1つの特性になります。", "手札の闘エネルギーを捨てて3枚引きます。捨てたエネルギーは無駄になりません。はどうづきがトラッシュから拾ってくるからです。引くために捨てる動きと、エネルギーを並べる動きが同じ場所でつながっています。", "ハリテヤマを51%、平均1.8枚が入れています。マクノシタを手札から進化させたとき、相手のベンチポケモンを引きずり出せます。", "ボスの指令と同じことができて、しかもサポートを使いません。サポートは1つの番に1枚だけなので、ハリテヤマで呼び出した番は、サポートをリーリエの決心に回せます。 1つの番にできることが1つ増える、という重い意味を持っています。", "ファイトゴングを100%、平均4.0枚が入れています。闘タイプのたねポケモンか基本闘エネルギーのどちらかを持ってこられるので、リオルもソルロックもルナトーンもマクノシタも、この1枚で届きます。"]}], "まとめ": ["止まるのはメガブレイブだけ──次の番も130ダメージが出る", "はどうづきがつけるのはベンチ──次の1匹を裏で育てている", "パワープロテインはグッズなので何枚でも重ねられる", "グラビティーマウンテンで、相手のHPのほうを下げにいく", "ロック闘エネルギーで、ファントムダイブのダメカンが乗らなくなる", "ハリテヤマは、サポートを使わないボスの指令"], "しめ": "派手ではありませんが、攻撃と準備と手札の補充が、たがいに支え合っています。 1〜2か月前は4.4%でしたが、直近1週では7.5%まで増えています。序盤から大きなダメージを出せるので、立ち上がりの遅いデッキには先にサイドを取って押し切れます。", "弱点": ["弱点は超×2 です。170ダメージで倒れます。HP340が実質HP170になってしまいます。 HP340という数字は今の環境でも上のほうですが、超タイプの前では何の意味も持ちません。", "メガブレイブを撃った次の番は130ダメージしか出ません。 130ダメージで倒せる相手がいないと、その番はダメージが無駄になります。", "リオル(HP70)から育てる必要があります。育つ前をねらわれると遅れます。", "メガシンカexなので、倒されるとサイドを3枚渡します。1匹で試合が決まりかねません。", "ソルロックとルナトーンは2匹そろわないと働きません。片方だけベンチに残ると、引く手段がまるごと消えます。"], "対面": ["超タイプで攻撃できるなら、HP340も170ダメージで倒せます。ここが一番はっきりした答えです。", "メガブレイブを撃たれた次の番に攻め返します。130ダメージなら耐えられるHPで前に立っておくと、その番をまるごと無駄にできます。", "リオル(HP70)のうちに倒せると、そもそも育ちません。", "ベンチのソルロックかルナトーンを1匹倒すと、手札が増えなくなります。", "サイドを3枚渡すメガルカリオexは最後に残しておいて、先に非ルールとexで3枚取っておくと、一気に決められます。"]}, "groups": [{"label": "かならず入っている", "cards": [{"name": "基本闘エネルギー", "n": 10, "avg": 10.0, "decks": 155, "total": 155, "img": "ENE/047908_E_KIHONTOUENERUGI.jpg"}, {"name": "ファイトゴング", "n": 4, "avg": 4.0, "decks": 155, "total": 155, "img": "M1L/047792_T_FUAITOGONGU.jpg"}, {"name": "パワープロテイン", "n": 4, "avg": 3.9, "decks": 155, "total": 155, "img": "M1L/047791_T_PAWAPUROTEIN.jpg"}, {"name": "リーリエの決心", "n": 4, "avg": 3.9, "decks": 155, "total": 155, "img": "MA/047900_T_RIRIENOKESSHIN.jpg"}, {"name": "リオル", "n": 4, "avg": 3.5, "decks": 155, "total": 155, "img": "SVM/046518_P_RIORU.jpg"}, {"name": "メガルカリオex", "n": 3, "avg": 3.0, "decks": 155, "total": 155, "img": "M1L/047762_P_MRUKARIOEX.jpg"}, {"name": "ボスの指令", "n": 3, "avg": 2.6, "decks": 155, "total": 155, "img": "MA/047898_T_BOSUNOSHIREI.jpg"}, {"name": "ハイパーボール", "n": 3, "avg": 3.3, "decks": 154, "total": 155, "img": "MEM/050461_T_HAIPABORU.jpg"}, {"name": "ソルロック", "n": 2, "avg": 2.5, "decks": 154, "total": 155, "img": "M1L/047760_P_SORUROKKU.jpg"}, {"name": "ルナトーン", "n": 2, "avg": 2.0, "decks": 154, "total": 155, "img": "M1L/047759_P_RUNATON.jpg"}, {"name": "ポケパッド", "n": 4, "avg": "other": 0}, "フーディン": {"name": "フーディン", "decks": 150, "odds": [{"card": "ケーシィ", "why": "2進化の1匹めを置く", "copies": 4, "effective": 15, "decks": 150, "p_plain": 44, "p_reach": 92, "draws": 8, "how": ["なかよしポフィン 4枚→ケーシィ", "ケーシィ 4枚", "ポケパッド 4枚→ケーシィ", "ヒカリ 3枚→ケーシィ"]}, {"card": "ふしぎなアメ", "why": "ユンゲラーをとばして進化する", "copies": 4, "effective": 4, "decks": 142, "p_plain": 44, "p_reach": 44, "draws": 8, "how": ["ふしぎなアメ 4枚"]}], "note": {"結論": "相手がエネルギーをつけるほどダメージが上がります。 HP40から育てる細いデッキですが、ベンチを守るスタジアムを3枚積むことで成り立たせています。", "節": [{"見出し": "相手のエネルギーがダメージになる", "引用": "フーディン   HP140   超タイプ   弱点 悪×2   にげる1\nサイコキネシス   超エネルギー1個 → 10ダメージ +\n  相手のバトルポケモンについているエネルギーの数 × 50ダメージ\n", "本文": ["エネルギー1個で撃てて、相手のエネルギーが4個なら210ダメージ、 5個なら260ダメージ、6個なら310ダメージです。", "今の環境で一番エネルギーを並べるのはメガレックウザexです。エネルギー7個で350ダメージを出すデッキなので、並べ終わったころには360ダメージで倒せる相手になっています。", "相手が強くなるほどこちらのダメージも上がる、という珍しい形です。相手はエネルギーをつけないと勝てず、つけると倒される。どちらを選んでも損をする状態を作れます。", "フーディンはHP140の非ルールです。倒されてもサイドは1枚しか渡しません。相手のexを倒せば2枚とれるので、サイドの取り合いでも得をします。"]}, {"見出し": "HP40から育てるための守り", "引用": "バトルコロシアム (スタジアム)\n  おたがいのベンチポケモン全員は、相手のワザや特性の効果で、ダメカンがのらない\n  (ワザのダメージは受ける)\n\nコダック 【しめりけ】このポケモンがいるかぎり、おたがいのポケモン全員は、\n        そのポケモン自身をきぜつさせる効果の特性が、すべてなくなる\n", "本文": ["このデッキはケーシィ(HP40)から2回進化させます。育つまでのあいだ、ベンチにHP40のポケモンが並んでいることになります。", "ドラパルトexから見ると、これ以上ないカモです。ファントムダイブのダメカン6個は好きなように配れるので、ケーシィを2匹まとめて倒せてしまいます。", "そこでバトルコロシアムを83%が、平均3.2枚も入れています。相手のワザや特性の効果では、ベンチにダメカンがのらなくなります。", "この1枚で3つ止まります。ファントムダイブのダメカン、サマヨールとヨノワールのカースドボム、マシマシラのアドレナブレイン。ドラパルトexがベンチを削る手段は、ほぼこれで全部です。", "さらにコダックを61%が入れています。カースドボムをもう一段止めるカードです。スタジアムを張り替えられたときの保険になっています。", "スタジアムを3枚も入れているのは、張り替え合戦に勝つためです。相手が別のスタジアムを出したら、こちらもすぐ張り直します。"]}, {"見出し": "逃げられるHP40", "引用": "ケーシィ 【テレポーター】このポケモンがバトル場にいるなら、自分の番に1回使える。\n        このポケモンと、ついているすべてのカードを、自分の山札にもどして切る\nノココッチ【にげあしドロー】自分の番に1回使える。自分の山札を3枚引く。その後、\n        このポケモンと、ついているすべてのカードを、山札にもどして切る\n", "本文": ["ボスの指令でケーシィを呼び出されると、ふつうはそこで1匹取られます。", "ところがケーシィは、バトル場にいるとき自分ごと山札にもどれます。サイドを渡さずに逃げられるということです。呼び出された意味が消えます。", "ノココッチも同じ形です。3枚引いてから山札にもどるので、ベンチに残って狙われることがありません。96%が入れています。", "弱いポケモンを場に置かずに済ませる、という考え方でそろえられています。"]}, {"見出し": "相手のカードを減らして、時間を作る", "引用": "ビワ       相手の手札を見て、その中からグッズを2枚まで選び、トラッシュする\n改造ハンマー  相手の場のポケモンについている特殊エネルギーを、1個トラッシュする\nヒカリ      自分の山札から「たねポケモン」「1進化ポケモン」「2進化ポケモン」を\n          1枚ずつ選び、手札に加える\n", "本文": ["ヒカリが99%、平均3.4枚です。1枚でケーシィ・ユンゲラー・フーディンの 3枚がそろいます。育てるのに一番大事なカードなので、3枚以上入っています。", "ビワと改造ハンマーは、相手を遅らせるカードです。 2進化が育つまでの1〜2ターンを買うために入っています。", "改造ハンマーには考えどころがあります。相手のエネルギーを減らすと、サイコキネシスのダメージも50下がります。それでも入れるのは、特殊エネルギーが無いと動けないデッキがあるからです。 50ダメージを捨てて、相手の攻撃を1ターン止めるほうが得な場面があります。", "どちらを取るかを自分で決める。こういうカードが入っているデッキは、使う人の判断で強さが変わります。"]}], "まとめ": ["相手のエネルギー1個につき50ダメージ", "バトルコロシアムで、ベンチにダメカンをのせられなくなる", "ケーシィもノココッチも、狙われる前に山札へ逃げられる", "ヒカリ1枚で進化の3枚がそろう"], "しめ": "相手の強みをそのまま弱点に変えるデッキです。ただし自分のポケモンは細いので、ベンチを守るスタジアムが無いと、育つ前に終わってしまいます。", "弱点": ["相手がエネルギーをあまりつけないデッキだと、ダメージが出ません。ドラパルトexはエネルギー2個で戦うので、サイコキネシスは110ダメージにしかなりません。", "フーディンはHP140、ケーシィはHP40です。弱点は悪×2 なので、フーディンでも70ダメージで倒れます。", "2進化なので、育つまでに時間がかかります。", "バトルコロシアムを張り替えられると、ベンチが守れなくなります。"], "対面": ["エネルギーをバトル場に集めないようにします。ベンチに分けてつければダメージが下がります。", "悪タイプならフーディンを70ダメージで倒せます。", "スタジアムを張り替えてから、ベンチのケーシィを攻めます。", "ワザのダメージはバトルコロシアムでも防げません。ベンチを直接殴れるワザは通ります。"]}, "groups": [{"label": "かならず入っている", "cards": [{"name": "ポケパッド", "n": 4, "avg": 4.0, "decks": 150, "total": 150, "img": "M-P/049601_T_POKEPADDO.jpg"}, {"name": "ケーシィ", "n": 4, "avg": 3.9, "decks": 150, "total": 150, "img": "M1S/047832_P_KESHII.jpg"}, {"name": "ユンゲラー", "n": 4, "avg": 3.8, "decks": 150, "total": 150, "img": "M1S/047833_P_YUNGERA.jpg"}, {"name": "フーディン", "n": 3, "avg": 3.2, "decks": 150, "total": 150, "img": "M1S/047834_P_FUDEIN.jpg"}, {"name": "基本超エネルギー", "n": 2, "avg": 2.2, "decks": 149, "total": 150, "img": "ENE/042783_E_KIHONCHIXYOUENERUGI.jpg"}, {"name": "なかよしポフィン", "n": 4, "avg": 3.9, "decks": 148, "total": 150, "img": "SV5K/045209_T_NAKAYOSHIPOFUIN.jpg"}, {"name": "ヒカリ", "n": 4, "avg": 3.4, "decks": 148, "total": 150, "img": "M2/048417_T_HIKARI.jpg"}, {"name": "ボスの指令", "n": 3, "avg": 2.8, "decks": 148, "total": 150, "img": "SVHM/045387_T_BOSUNOSHIREI. ": ["ツツケラ", "ドデカバシ"], "decks": 47, "share": 0.31}, {"cards": ["ワンダーパッチ"], "decks": 45, "share": 0.3}, {"cards": [], "decks": 32, "share": 0.21}, {"cards": ["ツツケラ", "ドデカバシ", "ワンダーパッチ"], "decks": 26, "share": 0.17}], "other": 0}, "nのゾロアークex": {"name": "Nのゾロアークex", "decks": 144, "odds": [{"card": "Nのゾロア", "why": "進化のもとを置く", "copies": 4, "effective": 15, "decks": 144, "p_plain": 44, "p_reach": 92, "draws": 8, "how": ["Nのゾロア 4枚", "なかよしポフィン 4枚→Nのゾロア", "ポケパッド 4枚→Nのゾロア", "ハイパーボール 2枚→Nのゾロア", "シークレットボックス 1枚→なかよしポフィン→Nのゾロア"]}, {"card": "Nのポイントアップ", "why": "エネルギーをベンチにつけ直す", "copies": 3, "effective": 3, "decks": 144, "p_plain": 35, "p_reach": 35, "draws": 8, "how": ["Nのポイントアップ 3枚"]}], "note": {"結論": "ワザを借りるところが目立ちますが、本当に考えられているのは「借りても250ダメージまでしか出ない」という弱点をどう埋めるかです。自分から毒になるカードが入っているのは、そのためです。", "節": [{"見出し": "借りたワザの色は関係ない", "引用": "Nのゾロアークex   HP280   悪タイプ   弱点 草×2   にげる2\n\n【とりひき】自分の番に1回、手札を1枚トラッシュして、山札を2枚引く\nナイトジョーカー   悪エネルギー2個\n  自分のベンチの「Nのポケモン」が持つワザを1つ選び、このワザとして使う\n", "本文": ["このデッキのエネルギーを見ると、基本悪エネルギーが平均7.9枚で、炎エネルギーも雷エネルギーも1枚も入っていません。", "ところがNのゼクロムのランページサンダーは炎1個・雷2個・無1個、 Nのレシラムのパワーレイジは炎1個・雷1個が必要なワザです。入っていない色のエネルギーが要るはずのワザを、このデッキは毎ターン撃っています。", "理由はナイトジョーカーの書き方にあります。「このワザとして使う」なので、払うのはナイトジョーカーの悪エネルギー2個だけです。借りるワザのエネルギーは最初から要りません。", "だからベンチのNのポケモンにはエネルギーを1個もつけません。ベンチに立っているだけで、ワザの見本になっています。"]}, {"見出し": "250ダメージの壁", "引用": "Nのゼクロム  ランページサンダー   250ダメージ (次の自分の番、このポケモンはワザが使えない)\nNのレシラム  パワーレイジ        このポケモンにのっているダメカンの数 × 20ダメージ\nモモワロウex イライラバースト     相手がすでにとったサイドの枚数 × 60ダメージ\n", "本文": ["借りられるワザで一番大きいのがランページサンダーの250ダメージです。つまりこのデッキの素の上限が250ダメージだということです。", "今よく使われているポケモンのHPを並べると、ドラパルトexがHP320、メガルカリオexがHP340、メガドリュウズexがHP340、メガゲッコウガexがHP350です。250ダメージではどれにも届きません。", "中くらいのダメージしか出ないというのが、このデッキの一番の弱点です。強いカードが足りないのではなく、上限が決まっているのが問題です。", "だから足りない80ダメージを、別のカードで作りにいきます。"]}, {"見出し": "自分から毒になる", "引用": "くさりもち        このカードをつけているどくのポケモンが使うワザの、\n                相手のバトルポケモンへのダメージは「+40」される\nアンズの秘技      自分の悪ポケモンを2匹まで選び、\n                自分の山札から「基本悪エネルギー」を1枚ずつつける。\n                バトルポケモンにつけた場合、そのポケモンをどくにする\nモモワロウex 【しはいのくさり】自分のベンチの悪ポケモンを1匹バトル場と入れ替え、\n                その新しいバトルポケモンをどくにする\n", "本文": ["くさりもちを88%が入れています。ダメージが40上がる道具ですが、上がる条件は「つけているポケモンが毒であること」です。相手が毒なのではなく、自分が毒でないといけません。", "ふつう、毒は受けたくないものです。このデッキはその逆で、自分のゾロアークexをわざと毒にしにいきます。", "毒にする手段が2つ入っています。アンズの秘技が64%、モモワロウexが95%です。どちらも自分のバトルポケモンを毒にする書き方をしています。", "毒になると、自分の番の終わりにダメカンが1個(10ダメージ)のっていきます。それを払って、ワザのダメージを40上げているわけです。 250ダメージが290ダメージになります。", "もう1枚、からておうの稽古を66%が入れています。この番、相手のバトル場のポケモンexへのダメージが40上がります。合わせると250＋40＋40で330ダメージです。ここでようやくドラパルトexのHP320に届きます。", "数字の作り方が細かいところが、このデッキの面白さです。大きな1枚で殴るのではなく、40ずつ足して届かせています。"]}, {"見出し": "削られた体が、そのまま攻撃力になる", "引用": "Nのレシラム  パワーレイジ   このポケモンにのっているダメカンの数 × 20ダメージ\nヒーローマント (ACE SPEC)   このカードをつけているポケモンの最大HPは「＋100」される\n", "本文": ["パワーレイジの「このポケモン」は、ワザを使っているポケモン、つまりゾロアークex自身のことです。ベンチのレシラムではありません。", "だからゾロアークexが受けたダメージが、そのままダメージに変わります。ダメカン10個(100ダメージ)をのせられていれば200ダメージ、ダメカン13個(130ダメージ)なら260ダメージになります。", "ここでヒーローマントが効いてきます。最大HPが100増えるので、 HP280のゾロアークexがHP380になります。", "数えてみると差がはっきりします。メガレックウザexの350ダメージを受けたとき、マントが無いゾロアークex(HP280)はきぜつします。マントがあると(HP380)残りHP30で生き残り、ダメカン35個がのった状態になります。そのままパワーレイジを撃つと700ダメージです。", "つまりこのマントは、HPを増やす道具ではなく、「一撃で倒されないようにして、受けたダメージを回収する」道具です。倒されなければ、殴られるほど強くなります。", "ただしヒーローマントはACE SPECなので、デッキに1枚しか入れられません。採用率も10%です。まだ多くの人が試している段階の組み方です。"]}, {"見出し": "非ルールを2匹まとめて倒す", "引用": "Nのヒヒダルマ  ひだるまキャノン   90ダメージ\n  このポケモンについているエネルギーをすべてトラッシュし、\n  相手のベンチポケモン1匹にも、90ダメージ\n\nNのポイントアップ   自分のトラッシュから基本エネルギーを1枚選び、\n                 ベンチの「Nのポケモン」につける\n", "本文": ["NのダルマッカとNのヒヒダルマが、どちらもちょうど57%です。同じデッキに一緒に入っている組です。", "ひだるまキャノンを借りると、相手のバトル場に90ダメージ、さらに相手のベンチ1匹にも90ダメージが入ります。", "相手の非ルールのポケモンは、HP70から90くらいのものが多いです。そこを2匹同時に倒せます。1ターンでサイド2枚です。", "非ルールのポケモンは1匹倒してもサイド1枚しか取れません。そこが遅れる原因になりますが、まとめて2匹倒せば追いつけます。", "ただし「このポケモンについているエネルギーをすべてトラッシュ」します。この「このポケモン」もゾロアークex自身なので、撃ったあとゾロアークexはエネルギー0個になります。", "だからNのポイントアップが100%、平均3.0枚入っています。トラッシュから基本エネルギーを、ベンチのNのポケモンにつけ直せます。つけられるのはベンチだけなので、次に出すゾロアークexを準備するカードです。"]}, {"見出し": "撃てなくなった番を、逃げてしのぐ", "引用": "Nの城 (スタジアム)\n  おたがいの場の「Nのポケモン」全員のにげるためのエネルギーは、すべてなくなる\n", "本文": ["ランページサンダーには「次の自分の番、このポケモンはワザが使えない」と書いてあります。250ダメージを撃った次の番、そのゾロアークexは動けません。", "ここでNの城です。Nのポケモンのにげるエネルギーが0になるので、動けなくなったゾロアークexを、ベンチのもう1匹とただで入れ替えられます。", "ゾロアークexが平均4.0枚も入っているのは、このためです。 1匹が休んでいる間に、もう1匹が殴ります。", "Nの城は95%が入れていて、平均2.0枚です。相手にスタジアムを張り替えられても、すぐ張り直せるようにしてあります。"]}], "まとめ": ["借りるワザのエネルギーは要らない──悪エネルギー2個だけで撃てる", "上限は250ダメージ──足りないぶんは毒と稽古で40ずつ足す", "受けたダメージがパワーレイジに変わる", "ひだるまキャノンで非ルールを2匹まとめて倒せる", "Nの城で、撃てない番を無かったことにする"], "しめ": "借りたワザで戦うところが目立ちますが、本当に考えられているのは250ダメージの埋め方のほうです。毒もマントも稽古も、全部その40ダメージのために入っています。", "弱点": ["弱点は草×2 です。140ダメージで倒れます。", "ベンチにNのポケモンがいないと、ナイトジョーカーで選べるワザがありません。ベンチを先に倒されると、殴る手段そのものが消えます。", "自分から毒になるので、放っておくとこちらのHPも減っていきます。殴り合いが長引くほど、この10ダメージが効いてきます。", "ゾロアークexは倒されるとサイドを2枚渡します。借りる元のポケモンも並べるので、ベンチが埋まりやすいです。"], "対面": ["草タイプで攻撃できるなら、HP280も140ダメージで倒せます。", "HP340以上のポケモンで前に立つと、250ダメージでも290ダメージでも倒されません。相手は稽古まで使わないと届かなくなります。", "ベンチのNのゼクロムをボスの指令で呼んで倒すと、250ダメージが消えます。ワザの見本を減らすのが、このデッキへの一番の攻め方です。", "サイドを一気に取りすぎると、イライラバーストのダメージが上がります。取る順番を考える必要があります。"]}, "groups": [{"label": "かならず入っている", "cards": [{"name": "基本悪エネルギー", "n": 8, "avg": 7.9, "decks": 144, "total": 144, "img": "ENE/046122_E_KIHONAKUENERUGI.jpg"}, {"name": "Nのゾロア", "n": 4, "avg": 4.0, "decks": 144, "total": 144, "img": "SV9/047068_P_NNOZOROA.jpg"}, {"name": "Nのゾロアークex", "n": 4, "avg": 4.0, "decks": 144, "total": 144, "img": "SV9/047069_P_NNOZOROAKUEX.jpg"}, {"name": "リーリエの決心", "n": 4, "avg": 3.9, "decks": 144, "total": 144, "img": "MA/047900_T_RIRIENOKESSHIN.jpg"}, {"name": "なかよしポフィン", "n": 4, "avg": 3.9, "decks": 144, "total": 144, "img": "SV8a/046808_T_NAKAYOSHIPOFUIN.jpg"}, {"name": "ボスの指令", "n": 3, "avg": 3.4, "decks": 144, "total": 144, "img": "SVM/046626_T_BOSUNOSHIREI.jpg"}, {"name": "Nのポイントアップ", "n": 3, "avg": 3.1, "decks": 144, "total": 144, "img": "SV9/047097_T_NNOPOINTOAPPU.jpg"}, {"name": "夜のタンカ", "n": 2, "avg": 1.9, "decks": 144, "total": 144, "img": "SVN/047198_T_YORUNOTANKA.jpg"}, {"name": "Nのゼクロム", "n": 2, "avg": 1.9, "decks": 144, "total": 144, "img": "M2a/048651_P_NNOZEKUROMU.jpg"}, {"name": "ポケパッド" ありません。", "このデッキ自身は、アンフェアスタンプをほとんど入れていません(1%)。 HP350で自分が倒されないので、使う場面が来ないからです。ドラパルトexが81%も入れているのは、スボミーがわざと倒されるデッキだからです。同じカードでも、デッキの戦い方によって入るか入らないかが変わります。"]}, {"見出し": "進化したその番に殴るための、2種類のエネルギー", "引用": "イグニッションエネルギー\n  ポケモンについているこのカードは、自分の番の終わりにトラッシュする。\n  無エネルギー1個ぶんとしてはたらく。\n  進化ポケモンについているなら、無エネルギー3個ぶんとしてはたらく\n\nネオアッパーエネルギー\n  無エネルギー1個ぶんとしてはたらく。\n  2進化ポケモンについているなら、すべてのタイプのエネルギー2個ぶんとしてはたらく\n", "本文": ["このデッキの主役は2匹とも2進化です。 2進化は育つまでに時間がかかるので、育った番にすぐ殴れるかどうかが分かれ目になります。", "イグニッションエネルギーを84%が入れています。進化ポケモンにつけると、たった1枚でエネルギー3個ぶんになります。ぶんしんれんだはエネルギー3個のワザなので、水エネルギー1個とこれ1枚で、進化したその番に撃てます。", "ネオアッパーエネルギーは48%です。2進化ポケモンにつけると、どのタイプにもなるエネルギー2個ぶんになります。ニンジャスピナーは水エネルギー2個なので、これ1枚だけで撃てます。", "どちらも、ふつうなら2番かかる準備を1枚で終わらせるカードです。イグニッションエネルギーは番の終わりに消えてしまいますが、「その番だけ間に合えばいい」という使い方なので、消えても困りません。", "偉大な大樹を40%が入れています。山札から1進化を出して進化させ、続けて2進化まで進化させられるスタジアムです。手札を1枚も使わずに2段階すすめます。", "なみのりビーチを56%が入れています。バトル場の水ポケモンをベンチの水ポケモンと入れ替えられます。【ひっさつしゅりけん】はバトル場にいないと使えないので、傷ついた1匹を下げて、元気な1匹で特性を続けるための入れ替えです。"]}, {"見出し": "それでも、ドラパルトexほど使われていない", "本文": ["書いてあることは強いのに、直近1週で3.6%です。ドラパルトexの14.7%には遠いです。", "エネルギーの重さは、上に書いた2種類のエネルギーでかなり解決しています。残っている本当の問題は、手札のほうです。", "ドラパルトexのドロンチは、場にいるだけで毎ターン手札が増えます。ゲコガシラにはそれがありません。同じ2進化でも、途中の1匹が働くかどうかで、必要なカードの数が変わります。", "だから別に手札を増やすポケモンを入れることになります。でもボスの指令もミツルの思いやりも毎ターン使いたいので、ベンチもデッキの枠も足りません。", "つまり、メガゲッコウガexの器用な動きを支えるカードが、今のカードプールに足りていません。カード1枚が強いことと、デッキとして組めることは別だという分かりやすい例です。"]}], "まとめ": ["今の環境で一番高いHP350", "毎ターンダメカン6個を置ける。倒さずに残す戦い方ができる", "2匹同時に攻撃するワザもある", "エネルギー1枚で進化したその番に殴れる──イグニッション、ネオアッパー", "ただし手札を増やす手段が足りず、組むのが難しい"], "しめ": "ドラパルトexに近い戦い方を、もっと高いHPでやろうとしているデッキです。カード自体は強いのですが、それを支える周りのカードがそろっていません。強いカードが必ず強いデッキになるとはかぎらない、という例です。", "弱点": ["ケロマツはHP60、ゲコガシラはHP90しかありません。育つ前がとても弱いです。ふしぎなアメを100%、なかよしポフィンを94%入れているのは、そこを急ぐためです。", "弱点が2種類あります。メガゲッコウガexは雷×2、ゲッコウガexは超×2 です。 1つのデッキなのに、2方向から刺されます。", "ふしぎなアメに頼りきりです。グッズを止められると育ちません。", "速いデッキに弱いです。メガルカリオexやタケルライコexに序盤サイドを詰められると、あとからメガゲッコウガexで攻撃を始めても間に合いません。特性はターンを重ねてこそ効くので、急かされる展開が一番苦しいです。", "メガシンカexは倒されるとサイドを3枚渡します。序盤に展開で出したニャースexやキチキギスexで1枚と2枚、最後にメガゲッコウガexで3枚、という順で取り切られて終わります。", "シェイミの【はなのカーテン】がいると、ベンチの非ルールポケモンはワザのダメージを受けなくなります。ぶんしんれんだが通らなくなります。ただし【ひっさつしゅりけん】のダメカンは置けます。ダメージとダメカンは別のものだからです。"], "対面": ["ケロマツ・ゲコガシラのうちに倒します。育ってからでは硬いです。", "グッズを止めるのが効きます。", "雷でも超でも、どちらかの弱点は必ず突けます。", "シェイミをベンチに置いておくと、ぶんしんれんだで非ルールを2匹持っていかれずに済みます。"]}, "groups": [{"label": "かならず入っている", "cards": [{"name": "基本水エネルギー", "n": 7, "avg": 6.8, "decks": 144, "total": 144, "img": "ENE/042781_E_KIHONMIZUENERUGI.jpg"}, {"name": "ケロマツ", "n": 4, "avg": 3.7, "decks": 144, "total": 144, "img": "M4/050104_P_KEROMATSU.jpg"}, {"name": "ふしぎなアメ", "n": 3, "avg": 2.7, "decks": 144, "total": 144, "img": "SVHM/045371_T_FUSHIGINAAME.jpg"}, {"name": "ゲコガシラ", "n": 2, "avg": 2.4, "decks": 144, "total": 144, "img": "M4/050105_P_GEKOGASHIRA.jpg"}, {"name": "ボスの指令", "n": 2, "avg": 2.0, "decks": 144, "total": 144, "img": "MBG/048281_T_BOSUNOSHIREI.jpg"}, {"name": "ハイパーボール", "n": 4, "avg": 3.3, "decks": 143, "total": 144, "img": "SVHM/045369_T_HAIPABORU.jpg"}, {"name": "ポケパッド", "n": 4, "avg": 3.3, "decks": 140, "total": 144, "img": "M3/049703_T_POKEPADDO.jpg"}, {"name": "リーリエの決心", "n": 4, "avg": 3.8, "decks": 138, "total": 144, "img": "MBD/048304_T_RIRIENOKESSHIN.jpg"}, {"name": "ゲッコウガex", "n": 2, "avg": 1.7, "decks": 136, "total": 144, "img": "SV5a/045621_P_GEKKOUGAEX.jpg"}, {"name": "なかよしポフィン", "n": 4, "avg": 3.9, "decks": 131, "total": 144, "img": "SV5K/045209_T_NAKAYOSHIPOFUIN.jpg"}, {"name": "ニャースex", "n": 1, "avg": 1.2, "decks": 130, "total": 144, "img": "M3/049694_P_NIXYASUEX.jpg"}]}, {"label": "よく入っている", "cards": [{"name": "メガゲッコウガex", "n": 2, "avg": 2.1, "decks": 122, "total": 144, "img": "M4/050106_P_MGEKKOUGAEX.jpg"}, {"name": "イグニッションエネルギー", "n": 2, "avg": 2.0, "decks": 122, "total": 144, "img": "SV11W/047708_E_IGUNISSHIXYONENERUGI.jpg"}, {"name": "キチキギスex", "n": 1, "avg": 1.0, "decks": 120, "total": 144, "img": "SVN/047177_P_KICHIKIGISUEX.jpg"}, {"name": "トウコ", "n": 3, "avg": 2.4, "decks": 118, "total": 144, "img": "SV11W/047707_T_TOUKO.jpg"}, {"name": "スペシャルレッドカード", "n": plain": 25, "p_reach": 25, "draws": 8, "how": ["ぼうけんのランタン 2枚"]}], "note": {"結論": "入れたエネルギーが、1枚残らずダメージになります。エネルギーが攻撃のための材料ではなく、ダメージそのものになっている珍しいデッキです。", "節": [{"見出し": "ダメージの正体", "引用": "メガレックウザex   HP280   たねポケモン   無タイプ   弱点 雷×2   にげる2\n\n【はしゃのほうこう】手札からベンチに出したとき、山札の上4枚を見て、\n                   基本エネルギーを1枚このポケモンにつける\nストームエメラルダ   エネルギー3個 (炎・雷・無)\n  → 自分のポケモン全員についている炎と雷エネルギーの数 × 50ダメージ\n", "本文": ["数えるところが2つあります。「全員」と「炎と雷」です。", "「全員」なので、攻撃するポケモンについている必要がありません。ベンチのどこに置いたエネルギーでもダメージになります。", "「炎と雷」なので、数えるのはこの2色だけです。ほかの色は0として数えられます。実際、このデッキのエネルギーは平均14.1枚で、そのうち13.4枚が炎か雷です。色を混ぜていないのではなく、混ぜたら弱くなるデッキです。", "ぼうけんのランタンを93%が入れています。「基本炎エネルギーと基本雷エネルギーを1枚ずつ持ってくる」カードで、数える2色をそのまま名指ししています。このデッキのために作られたようなカードです。", "エネルギー14.1枚はかなり多い数です。ドラパルトexは8.2枚で、ふつうのデッキは8〜12枚くらいです。この数字だけで性格が分かります。", "ゼロの大空洞を74%が入れてベンチを8匹にするのも、エネルギーを置く場所を増やすためです。ヒビキのホウオウexが手札から炎エネルギー2枚を置けるのも、置いた先がどこであってもダメージになるからです。", "そしてたねポケモンなので、2進化のドラパルトexが立つ前から攻撃できます。事故率も14.5%で、ドラパルトexの20.1%より低いです。"]}, {"見出し": "ダメージが階段になっている", "引用": "エネルギー4個 → 200ダメージ   何も倒せない (キチキギスexのHP210に10足りない)\nエネルギー5個 → 250ダメージ   HP210〜240を一撃\nエネルギー6個 → 300ダメージ   HP280までを一撃\nエネルギー7個 → 350ダメージ   今の環境のアタッカーを全部一撃\n", "本文": ["エネルギー7個が完成形です。ここまで来ると、今の環境で一撃で倒せない相手がいなくなります。", "逆にエネルギー4個以下では、何も倒せません。この立ち上がりの空白が、このデッキの弱いところです。", "ダメージが50ずつしか上がらないのも大事な性質です。 250ダメージでHP210のポケモンを倒すと、40ダメージぶんが消えてしまいます。ドラパルトexのように、余ったぶんをベンチに回すことができません。無駄が出るのは、このデッキの仕組み上どうしようもありません。", "そのかわり上限がありません。HP320〜350を一撃で倒せるのは、今のところこのデッキだけです。効率は悪いけれど、届く高さと速さで押し切る形です。"]}, {"見出し": "心配なのは、最初の1回目の攻撃", "本文": ["序盤の攻撃が、特性【はしゃのほうこう】が当たるかどうかで決まります。山札の上4枚を見て基本エネルギーを探すので、外れることがあります。外したときの出遅れが痛いです。", "中盤から後はヒビキのホウオウexでエネルギーがどんどん増えるので、ダメージに困ることはなくなります。つまりこのデッキの心配は、最初の1回に集まっています。", "その最初の1回を引き受けるカードが、別に用意されています。"]}, {"見出し": "手札からそのままベンチに出る2進化", "引用": "ファイアローex   HP280   無タイプ   2進化\n【エキサイトダイブ】自分の番に、このカードが手札にあり、\n                自分の場に無タイプの「メガシンカex」がいるなら、1回使える。\n                このカードをベンチに出す\nかぎづめハント   無エネルギー2個 → 150ダメージ\n  のぞむなら、自分の山札から好きなカードを2枚まで選び、手札に加える\n", "本文": ["82%が入れています。2進化ポケモンなのに、たねポケモンから育てません。手札からそのままベンチに出てきます。", "条件は「自分の場に無タイプのメガシンカexがいる」ことです。メガレックウザexは無タイプのメガシンカexなので、そこにいるだけで条件がそろいます。", "つまりこのカードは、無タイプのメガシンカexを使うデッキだけが受け取れる特典です。ほかのデッキに入れても、ただの重い2進化になります。", "HP280のポケモンが1枚から出てきて、エネルギー2個で150ダメージを出しながら山札から2枚持ってこられます。立ち上がりが不安なこのデッキにとって、最初の1回を任せられる相手になっています。"]}, {"見出し": "1つの番に2枚つけられる", "引用": "ヒビキのホウオウex   HP230   炎タイプ\n【こんじきのほのお】自分の番に1回使える。自分の手札から「基本炎エネルギー」を\n                2枚まで選び、ベンチの「ヒビキのポケモン」1匹につける\nシャイニングフェザー   炎エネルギー4個 → 160ダメージ\n  自分のポケモン全員のHPを、それぞれ「50」回復する\n", "本文": ["86%が入れていて、平均2.0枚です。2枚というのが大事です。", "【こんじきのほのお】がつけられる先は「ベンチのヒビキのポケモン」だけです。自分自身にはつけられないので、ベンチにもう1匹ヒビキのホウオウexが要ります。だから2枚なのです。1枚では働きません。", "つけられるのは1つの番に2枚です。手札からのエネルギーづけはふつう1つの番に1回だけなので、この特性だけで3倍近い速さになります。", "そしてつけた先はベンチです。ストームエメラルダは場の炎と雷を全部数えるので、ベンチにたまった炎エネルギーは、そのままダメージになります。", "エネルギー4個で200ダメージのところが、この特性1回で300ダメージまで届きます。立ち上がりの空白を、2番ぶんも縮めていることになります。"]}, {"見出し": "エネルギーが減ると、弱くなる", "引用": "エネルギーつけかえ  自分のポケモンの基本エネルギーを1個、自分の別のポケモンにつけ替える\n                 (91%・平均3.4枚)\nガラスのラッパ     自分の場に「テラスタル」のポケモンがいるときにしか使えない。\n                 自分のベンチの無ポケモンを2匹まで選び、\n                 トラッシュから基本エネルギーを1枚ずつつける (74%)\n", "本文": ["ふつうのデッキは、ポケモンを倒されてもエネルギーさえ残っていれば戦えます。このデッキは違います。エネルギーのついたポケモンを倒されると、そのぶんダメージが50ずつ落ちていきます。", "エネルギーつけかえは、倒されそうなポケモンからエネルギーを逃がすカードです。ガラスのラッパはトラッシュから拾い直すカードです。採用率がこれだけ高いのは、それだけ困るということです。", "ここでガラスのラッパの文を読み直してみます。つけられるのは「ベンチの無ポケモン」だけです。", "このデッキのポケモンを見ると、メガレックウザex、メガガルーラex、ニャースex、ファイアローex、テラパゴスexが無タイプです。ほとんど全員が対象になります。", "たまたま無タイプが多いのではなく、ガラスのラッパが使えるように無タイプでそろえてあると考えたほうが自然です。", "もう1つ条件があります。ガラスのラッパもゼロの大空洞も、自分の場に「テラスタル」のポケモンがいないと働きません。テラパゴスexを60%が入れているのは、その条件をみたす役だからです。"]}], "まとめ": ["速い──たねポケモン。事故率14.5%", "上限が高い──エネルギー7個で350ダメージ。全アタッカーが射程内", "無駄は出る── 50ずつしか上がらず、余りをベンチに回せない", "減ると弱る──エネルギーを失うたびにダメージが50下がる"], "しめ": "ドラパルトexが無駄なく削るデッキだとすれば、こちらは一気に届かせるデッキです。正反対の作りの2つが、同じ環境の上位に並んでいます。", "弱点": ["ベンチを広げるほど、ドラパルトexにダメカンを置かれる相手が増えます。ラティアスexがHP210、キチキギスexがHP210、テラパゴスexがHP230、ヒビキのホウオウexがHP230です。この帯のexが横に並ぶ形は、ファントムダイブとカースドボムが一番効く形でもあります。強くするための行動が、そのまま弱点を広げてしまっています。", "グッズに頼りすぎています。ハイパーボールが98%(平均3.9枚)、ぼうけんのランタンが93%、エネルギーつけかえが91%、ガラスのラッパが74%です。それなのにスボミーは入っていません。ドラパルトexは98%入れています。", "弱点は雷×2 です。今のところ罰されていません。雷タイプのアタッカーはメガライボルトex(HP330)やメガシビルドンex(HP350)がいますが、どちらも上位のデッキに入っていません。眠っている弱点です。環境が雷に傾くと、140ダメージで倒れるようになります。", "HP280は、今のメガシンカの中ではやや低いです。メガルカリオexがHP340、メガゲッコウガexがHP350、メガガルーラexがHP300です。", "メガシンカexは倒されるとサイドを3枚も渡します。だから「展開に使った非ルールで1枚、exで2枚、最後にメガレックウザexで3枚」という順で、ちょうど6枚取られてしまいます。事故を許せる余裕が、ほかのデッキより1ターン短いということです。"], "対面": ["エネルギーのついたベンチをねらいます。1匹倒すごとに、相手のダメージが50下がります。", "グッズを止めるのがよく効きます。相手はスボミーを入れていません。", "弱点は、攻撃するポケモンのタイプで決まります。メガレックウザexは無タイプなので、雷エネルギーを使っていても同じメガレックウザex同士で弱点2倍にはなりません。突けるのは雷タイプだけです。"]}, "groups": [{"label": "かならず入っている", "cards": [{"name": "ボスの指令", "n": 2, "avg": 2.3, "decks": 134, "total": 135, "img": "SVLN/046227_T_BOSUNOSHIREI.jpg"}, {"name": "基本炎エネルギー", "n": 9, "avg": 8.6, "decks": 133, "total": 135, "img": "ENE/046117_E_KIHONHONOOENERUGI.jpg"}, {"name": "基本雷エネルギー", "n": 5, "avg": 4.9, "decks": 133, "total": 135, "img": "ENE/046119_E_KIHONKAMINARIENERUGI.jpg"}, {"name": "メガレックウザex", "n": 2, "avg": 2.3, "decks": 133, "total": 135, "img": "M6/050396_P_MREKKUUZAIEKKUSU.jpg"}, {"name": "ハイパーボール", "n": 4, "avg": 3.9, "decks": 132, "total": 135, "img": "SVLN/046219_T_HAIPABORU.jpg"}, {"name": "ラティアスex", "n": 2, "avg": 1.9, "decks": 129, "total": 135, "img": "SV7a/046248_P_RATEIASUEX.jpg"}, {"name": "エネルギーつけかえ", "n": 4, "avg": 3.4, "decks": 125, "total": 135, "img": "SVHM/045360_T_ENERUGITSUKEKAE.jpg"}, {"name": "ぼうけんのランタン", "n": 2, "avg": 2.2, "decks": 125, "total": 135, "img": "M6/050402_T_BOUKENNORANTAN.jpg"}, {"name": "メガガルーラex", "n": 3, "avg": 2.7, "decks": 123, "total": 135, "img": "M1S/047847_P_MGARURAEX.jpg"}]}, {"label": "よく入っている", "cards": [{"name": "アカマツ", "n": 2, "avg": 2.5, "decks": 120, "total": 135, "img": "MC/049412_T_AKAMATSU.jpg"}, {"name": "ニャースex", "n": 2, "avg": 1.7, "decks": 119, "total": 135, "img": "M3/049694_P_NIXYASUEX.jpg"}, {"name": "シアノ", "n": 2, "avg": 2.6, "decks": 117, "total": 135, "img": "SV8/046442_T_SHIANO.jpg"}, {"name": "キチキギスex", "n": 1, "avg": 1枚・基本雷3.0枚の3色です。ふつう、色を増やすと必要な色が来ない事故が増えます。", "ところがアカマツの文には「それぞれちがうタイプの」と書いてあります。 2色以上入っていないと、そもそも2枚選べません。つまり3色なのは事故のもとではなく、アカマツを働かせるための形です。", "色の役割もはっきり分かれています。きょくらいごうを撃つのに要るのは雷1個と闘1個だけです。だから雷と闘は3枚ずつで足ります。", "草が8.3枚も入っているのは、オーガポンみどりのめんexの【みどりのまい】が「基本草エネルギー」しかつけられないからです。毎ターン確実に1枚つけるために、草だけ厚くしてあります。", "ラティアスexを95%が入れています。たねポケモンのにげるが0になります。タケルライコexはにげるが3のたねポケモンなので、これが無いと動けません。"]}], "まとめ": ["上限がない── 5枚捨てて350ダメージ", "数えるのは場全体──ベンチのエネルギーもダメージになる", "メガガルーラexは、たまを置いておく場所", "3色なのはアカマツを働かせるため", "弱点がない──半分のダメージで倒される抜け道がない", "事故に強い──手札を全部捨てて引き直せる"], "しめ": "1〜2か月前は2.8%でしたが、直近1週では7.2%まで増えています。上限の高さと事故への強さが、メガレックウザexの登場で速くなった環境に合ってきたのだと思います。", "弱点": ["大きく殴った次の番は、捨てたぶん場のエネルギーが減っています。ダメージが落ちます。", "毎ターン並べ直す必要があるので、エネルギーを引けないと止まります。", "オーガポンみどりのめんexの弱点は炎×2 です。エンジン役をここで折られると回らなくなります。", "非ルールのポケモンで攻撃してくる相手に弱いです。 1ターンに1匹しか倒せないので、相手が非ルールばかりだとサイド6枚とるのに6ターンかかります。一方こちらのexは倒されるとサイド2枚渡すので、相手は3ターンで終わります。殴り合った回数は同じなのに、進み方が倍ちがいます。"], "対面": ["大きく殴られた次の番が攻め時です。相手のダメージが一番低い瞬間です。", "オーガポンみどりのめんexを先に倒すと、エネルギーの補充が止まります。", "ベンチのメガガルーラexにエネルギーがたまっていたら、それはたまです。ボスの指令で呼び出して倒すと、たまごと持っていけます。", "こちらもスタジアムを出しておくと、ゼロの大空洞を押しのけられます。ベンチが5匹に戻れば、置ける場所も減ります。"]}, "groups": [{"label": "かならず入っている", "cards": [{"name": "ハイパーボール", "n": 4, "avg": 3.9, "decks": 134, "total": 134, "img": "SVLN/046219_T_HAIPABORU.jpg"}, {"name": "アカマツ", "n": 4, "avg": 3.9, "decks": 134, "total": 134, "img": "SV8a/046824_T_AKAMATSU.jpg"}, {"name": "基本闘エネルギー", "n": 3, "avg": 3.0, "decks": 134, "total": 134, "img": "ENE/046121_E_KIHONTOUENERUGI.jpg"}, {"name": "基本草エネルギー", "n": 8, "avg": 8.1, "decks": 133, "total": 134, "img": "ENE/046116_E_KIHONKUSAENERUGI.jpg"}, {"name": "オーガポン みどりのめんex", "n": 3, "avg": 3.3, "decks": 133, "total": 134, "img": "SV6/045707_P_OGAPONMIDORINOMENEX.jpg"}, {"name": "基本雷エネルギー", "n": 3, "avg": 2.9, "decks": 133, "total": 134, "img": "ENE/046119_E_KIHONKAMINARIENERUGI.jpg"}, {"name": "タケルライコex", "n": 2, "avg": 2.5, "decks": 133, "total": 134, "img": "MC/049270_P_TAKERURAIKOEX.jpg"}, {"name": "キチキギスex", "n": 1, "avg": 1.0, " ら」という条件があります。", "そして【パンクアップ】でつけられるのは「自分のマリィのポケモン」だけです。マシマシラはマリィのポケモンではないので、ここからはもらえません。", "つまりマシマシラを動かすには、1つの番に1回しかできない手札からのエネルギーづけを、そこに使うしかありません。殴る用のエネルギーを1回あきらめる、という代金を払っています。", "それでも100%、平均3.7枚も入っています。1匹に悪エネルギーを1個つければ、毎ターン自分の場のダメカン3個を相手に押しつけられるからです。払う価値があると、みんなが判断しているということです。"]}, {"見出し": "ダメカンが1個のっていることが、条件になる", "引用": "イベルタル   むしばむかぜ   悪エネルギー1個\n  ダメカンがのっている相手のポケモン全員に、それぞれダメカンを2個のせる\n", "本文": ["85%が入れています。ダメージの数字が書いていないワザです。", "効くのは「ダメカンがのっている」相手だけです。きれいなポケモンには何も起きません。ふつうなら使いどころが難しいワザです。", "ところがこのデッキにはユキメノコがいます。ポケモンチェックのたびに、特性を持つポケモン全員にダメカンが1個ずつのります。", "今のデッキは特性を持つポケモンだらけです。 1回ポケモンチェックが来るだけで、相手の場のほとんどにダメカンが1個ずつのった状態になります。", "そこにむしばむかぜを撃つと、その全員にさらにダメカン2個(20ダメージ)です。相手の場全体が、いっぺんに削れます。", "ユキメノコが条件を作って、イベルタルがその条件を刈り取る。このデッキの本当の攻撃は、シャドーバレットではなくこちらかもしれません。", "ダークベルを48%が入れています。「おたがいのバトルポケモン(悪ポケモンをのぞく)をこんらんにする」カードです。このデッキのポケモンはほとんど悪タイプなので、こちらは何ともなく、相手だけがこんらんします。おたがいと書いてあるのに、片側にしか効かないカードです。"]}], "まとめ": ["準備が1回で終わる──パンクアップでエネルギー5枚", "殴らずに削る──ユキメノコで作って、マシマシラで押しつける", "ユキメノコが条件を作り、イベルタルが場全体を刈り取る", "ダークベルは、悪タイプのこちらには効かないこんらん", "弱点草×2 ── 160ダメージで倒れる"], "しめ": "速さでは環境でも上のほうです。ただし草タイプに弱いことがはっきりしているので、環境に草が増えると一気に苦しくなります。強さが環境に左右されるデッキです。", "弱点": ["弱点は草×2 です。160ダメージで倒れます。", "【パンクアップ】は「進化したとき」の1回だけです。進化させる前に止められると、エネルギーが並びません。", "マリィのベロバーはHP70しかありません。先に倒されると進化先がなくなります。", "キチキギスexの採用率は7%しかありません。ドラパルトexは98%です。ベンチが5枠しかなく、マシマシラ2匹・ユキメノコ2匹・次のアタッカーのベロバーで埋まってしまうので、入れる場所がありません。", "しかもユキメノコのダメカンは自分の場にも乗ります。マシマシラで相手に返せる量にはかぎりがあるので、キチキギスexにダメカンがたまると、ボスの指令で呼ばれてサイドを2枚持っていかれます。枠が空いていても入れにくいカードです。", "ユキメノコが出てこないと、そもそもダメージが足りません。 2匹のうち片方が欠けると、デッキの形が崩れます。"], "対面": ["進化する前のベロバー(HP70)を倒すのが一番効きます。", "草タイプで攻撃できるなら、HP320も160ダメージで倒せます。", "スパイクタウンジムを別のスタジアムで張り替えると、毎ターンのサーチが止まります。"]}, "groups": [{"label": "かならず入っている", "cards": [{"name": "基本悪エネルギー", "n": 9, "avg": 8.9, "decks": 128, "total": 128, "img": "ENE/046122_E_KIHONAKUENERUGI.jpg"}, {"name": "リーリエの決心", "n": 4, "avg": 4.0, "decks": 128, "total": 128, "img": "MA/047900_T_RIRIENOKESSHIN.jpg"}, {"name": "マシマシラ", "n": 4, "avg": 3.7, "decks": 128, "total": 12 ワザを置けます。2ターンぶんの予約ができます。", "夜のアカデミーは100%、平均3.9枚です。手札の1枚を山札の上にもどせるので、毎ターン上を作り直せます。", "4枚近く入れているのは、スタジアムが場に1枚しか置けないからです。相手に張り替えられても、その番のうちに張り直せるようにしてあります。", "気をつけるところが1つあります。リーリエの決心のように山札を切るカードを、上を作ったあとに使うと、せっかくの準備が消えます。引くカードを先に、上を作るカードを最後に使う。この順番が決まっているデッキです。"]}, {"見出し": "借りるときは、ヤドキングのエネルギーで考える", "引用": "メタグロス   メタリックハンマー   150＋\n  のぞむなら、このポケモンについている鋼エネルギーを3個トラッシュし、150ダメージ追加\n", "本文": ["ここがこのデッキで一番おもしろいところです。", "「このポケモン」は、ワザを使っているポケモンのことです。ヤドキングが借りて撃つので、「このポケモン」はヤドキングを指します。", "ヤドキングについているのは超エネルギーだけで、鋼エネルギーは1個もありません。それでも「のぞむなら」を選べます。トラッシュする鋼エネルギーが無いので何も減らず、追加の150ダメージだけが乗ります。", "合わせて300ダメージです。しかも払ったのは、ひらめきチャレンジのエネルギー2個だけです。", "借りたワザの文は、借りたポケモンではなく、いま使っているポケモンのことを言っている。これが分かると、どのポケモンを山札に入れておくべきかが変わってきます。"]}, {"見出し": "相手によって、借りるものを変える", "引用": "キュレム   トライフロスト   本来はエネルギー5個\n  このポケモンについているエネルギーをすべてトラッシュし、\n  相手のポケモン3匹に、それぞれ110ダメージ (ベンチは弱点・抵抗力を計算しない)\n\nコノヨザル  みちづれファイト   おたがいのバトルポケモンをきぜつさせる\nゼラオラ   サンダーブリッツ   相手のベンチの「ポケモンex」1匹に、210ダメージ\nレイスポス  ファントムビット   相手のポケモン1匹に、ダメカンを12個のせる\nギラティナ  カオスクローラー   120ダメージ、次の相手の番、このポケモンはワザのダメージを受けない\nデスカーン  めいふのおきて    おたがいの特性を持つポケモン全員に、それぞれダメカンを6個のせる\n", "本文": ["キュレムが100%です。トライフロストは本来エネルギー5個のワザで、相手のポケモン3匹に110ダメージずつ入ります。合計330ダメージぶんです。ベンチも巻き込むので、次の番にボスの指令で呼べば一気にサイドを取れます。", "コノヨザルが74%です。みちづれファイトは、おたがいのバトルポケモンがきぜつするワザです。一見すると相打ちですが、ヤドキングは非ルールなので相手が取るサイドは1枚、こちらは相手のポケモンexを倒してサイド2枚、メガシンカexなら3枚です。サイドの取り合いで、確実に得をする交換になります。", "レイスポスのファントムビットはダメカン12個(120ダメージ)です。ダメージではなくダメカンなので、「ワザのダメージを受けない」と書いてあるポケモンにも通ります。", "デスカーンは特性を持つポケモン全員にダメカン6個(60ダメージ)です。特性持ちを何匹も並べるデッキに当たったときだけ入れる枠で、採用率は14%です。", "借りる相手を選べるということは、当たった相手ごとに別のデッキになれるということです。ただし、それは山札の上を作れているあいだだけです。"]}, {"見出し": "使ったエネルギーが、戻ってくる", "引用": "ブーメランエネルギー\n  このカードをつけているポケモンが使うワザの効果で、このカードがトラッシュされたなら、\n  ワザのダメージや効果のあとに、もとのポケモンにつけなおす\n\nワンダーパッチ  自分のトラッシュから基本エネルギーを1枚選び、ベンチのポケモンにつける\nムチュール   るんるんキッス   自分の山札から基本エネルギーを2枚まで選び、\n                          ベンチポケモン1匹につける\n", "本文": ["トライフロストには「このポケモンについているエネルギーをすべてトラッシュし」と書いてあります。撃ったあと、ヤドキングはエネルギー0個になります。そのままでは次の番に何もできません。", "ブーメランエネルギーを69%が入れています。ワザの効果でトラッシュされたとき、そのまま戻って 「エネルギーを動かせる」の 3つがそろっているからです。", "節": [{"見出し": "色の問題が消えている", "引用": "プリズムエネルギー\n  このカードは、エネルギー1個ぶんとしてはたらく。\n  たねポケモンについているかぎり、すべてのタイプのエネルギー1個ぶんとしてはたらく\n", "本文": ["このデッキのアタッカーを並べると、草・水・炎・雷・闘・悪と、タイプがばらばらです。ふつうなら、色ごとにエネルギーを入れることになり、必要な色が手札に来ないという事故が起きます。", "プリズムエネルギーを97%が入れています。たねポケモンについているあいだ、どのタイプのエネルギーとしても使えるカードです。", "ここで、このデッキのアタッカーをもう一度見ます。メガガルーラex、オーガポン、ラティアスex、リーリエのピッピex、ファイヤー、イーユイ、ナゲツケサル、カプ・コケコex。採用率の高いポケモンは、そろってたねポケモンです。", "たねポケモンでそろえてあるのは、そのほうが早いからだけではありません。プリズムエネルギーを全員が使えるようにするためです。進化ポケモンを1匹入れるたびに、その1匹だけ色が合わなくなります。"]}, {"見出し": "入れ替えがただになる", "引用": "ラティアスex 【スカイライン】このポケモンがいるかぎり、\n           自分のたねポケモン全員のにげるためのエネルギーは、すべてなくなる\n\nエネルギーつけかえ  自分のポケモンの基本エネルギーを1個、自分の別のポケモンにつけ替える\nNの筋書き          自分のベンチポケモンについているエネルギーを2個まで選び、\n                 バトルポケモンにつけ替える\n", "本文": ["ラティアスexが100%入っています。たねポケモン全員のにげるエネルギーが 0になるので、毎ターンただで前のポケモンを替えられます。アタッカーが全員たねポケモンなので、全員が対象です。", "相手に合うアタッカーがベンチにいても、入れ替えに手間がかかるなら間に合いません。スカイラインはその手間を消しています。", "残るのは「そのアタッカーにエネルギーがついていない」という問題です。そこでエネルギーつけかえが100%・平均3.9枚、Nの筋書きが79%です。", "この3つがそろって、初めて「相手に合わせて出す」ができます。色が合う、入れ替えられる、エネルギーが移せる。どれか1つ欠けても、ベンチのアタッカーは飾りになってしまいます。"]}, {"見出し": "相手ごとに専用の1匹がいる", "引用": "ファイヤー       とうしのつばさ  20＋ 相手のバトルポケモンが「ポケモンex」なら90追加\nパルデア ケンタロス きあいタックル  90＋ 相手のバトルポケモンが1進化ポケモンなら90追加\nイーユイ        グラウンドメルト 60＋ 場にスタジアムが出ているなら60追加、そのスタジアムをトラッシュ\nパオジアン    【ゆきにしずめる】手札からベンチに出したとき、場のスタジアムをトラッシュする\n", "本文": ["ファイヤーはHP120の非ルールで、炎エネルギー1個で110ダメージを出します。ただし相手がポケモンexのときだけです。今はexだらけなので、ほぼ毎回110ダメージです。", "パルデアケンタロスは相手が1進化のときに180ダメージです。メガルカリオexもメガドリュウズexも1進化なので、ここに当たります。", "イーユイとパオジアンは、どちらもスタジアムをトラッシュするカードです。おまつりおんどのお祭り会場、ヤドキングの夜のアカデミー、カミツオロチexの活力の森は、どれも1枚外れると動きが止まります。そこを狙って用意された枠です。", "どれも採用率は20%から40%くらいです。全員が入れているわけではありません。大会でどのデッキが多いかを見て、その日に効く1匹を選んで入れる枠です。"]}, {"見出し": "ベンチ8匹の本当の意味", "引用": "ゼロの大空洞 (スタジアム)\n  自分の場に「テラスタル」のポケモンがいるプレイヤーが、\n  ベンチに出せるポケモンの数は8匹になる\n\nリーリエのピッピex   HP190  超タイプ\n【フェアリーゾーン】このポケモンがいるかぎり、相手の場の竜ポケモン全員の弱点は、\n                すべて超タイプになる (弱点は「×2」で計算する)\nフルムーンロンド   超エネルギー1個+無エネルギー1個 → 20ダメージ +\n                おたがいのベンチポケモンの数 × 20ダメージ\n", "本文": ["ゼロの大空洞は100%です。ベンチが8匹になるので、アタッカーを何種類も置いておけます。ここまでは分かりやすい話です。", "もう1つ意味があります。フルムーンロンドは「おたがいのベンチポケモンの数×20ダメージ」です。自分のベンチ8匹と相手のベンチ5匹で13匹なら、20＋260で280ダメージになります。", "そしてリーリエのピッピexは超タイプです。自分の特性で相手を超弱点にして、自分でそこを突く形になっています。280ダメージが2倍で560ダメージです。", "つまりゼロの大空洞は、置ける場所を増やすカードであると同時に、ベンチ1匹あたり40ダメージを足すカードでもあります。", "ただし特性の文をよく読むと、弱点が変わるのは「竜ポケモン」だけです。場の全員ではありません。", "それでも99%が入れているのは、竜タイプに今の環境の中心がいるからです。ドラパルトexは竜タイプで弱点がありませんが、これがあると弱点超×2 になり、 HP320が160ダメージで倒れます。タケルライコexも竜タイプです。", "あるデッキを止めるために作られたカードを、メタカードといいます。リーリエのピッピexは、ドラゴンだけを狙い撃ちにしたメタカードです。"]}], "まとめ": ["アタッカーが全員たねポケモン──だからプリズムエネルギーが全員に使える", "ラティアスexで入れ替えがただになる", "エネルギーつけかえとNの筋書きで、エネルギーが後から追いつく", "ゼロの大空洞は、置き場所であり、ダメージでもある", "リーリエのピッピexで、竜タイプの相手に弱点を作る"], "しめ": "1匹の強さで勝つデッキではありません。色・入れ替え・エネルギーの移動という3つの土台があって、その上に相手ごとの1匹を乗せていくデッキです。", "弱点": ["アタッカーの多くがポケモンexです。倒されるとサイドを2枚渡します。非ルールで戦ってくる相手には、サイドの進み方で不利になります。", "ベンチを8匹に広げるので、ドラパルトexがダメカンを置く相手が増えます。", "ゼロの大空洞は、テラスタルのポケモンが場からいなくなるとベンチが5匹に戻ります。オーガポンを先に倒されると、ベンチが縮んでダメージも下がります。", "オーガポンみどりのめんexの弱点炎×2 が、エネルギーを増やす役でもあります。ここを先に倒されると回らなくなります。"], "対面": ["こちらが竜タイプのデッキなら、リーリエのピッピexがいるあいだ弱点超×2 になります。まずこれを倒すか、超タイプが出てくる前に決めます。竜タイプがいないデッキなら、この特性は何も起きません。", "テラスタルのポケモンを倒すとベンチが5匹に戻ります。ベンチが減れば、フルムーンロンドのダメージも下がります。", "非ルールのポケモンで殴り合うと、サイドの進み方で勝てます。"]}, "groups": [{"label": "かならず入っている", "cards": [{"name": "基本草エネルギー", "n": 11, "avg": 9.7, "decks": 105, "total": 105, "img": "ENE/046116_E_KIHONKUSAENERUGI.jpg"}, {"name": "ハイパーボール", "n": 4, "avg": 4.0, "decks": 105, "total": 105, "img": "SVLN/046219_T_HAIPABORU.jpg"}, {"name": "エネルギーつけかえ", "n": 4, "avg": 3.9, "decks": 105, "total": 105, "img": "SVHM/045360_T_ENERUGITSUKEKAE.jpg"}, {"name": "オーガポン みどりのめんex", "n": 4, "avg": 3.6, "decks": 105, "total": 105, "img": "SV6/045707_P_OGAPONMIDORINOMENEX.jpg"}, {"name": "ボスの指令", "n": 3, "avg": 3.0, "decks": 105, "total": 105, "img": "SVLN/046227_T_BOSUNOSHIREI.jpg"}, {"name": "ゼロの大空洞", "n": 3, "avg": 2.7, "decks": 105, "total": 105, "img": "SV7/046041_T_ZERONODAIKUUDOU.jpg"}, {"name": "メガガルーラex", "n": 2, "avg": 2. の手札から\n             基本エネルギーを1枚選び、自分のポケモンにつける。\n             その後、つけたポケモンのHPを「30」回復する\n", "本文": ["オーガポンみどりのめんexが100%、平均3.9枚入っています。アタッカーとしてではなく、エネルギーを置く係として4匹並べています。", "【みどりのまい】にも「別のみどりのまいを使っていたなら使えない」という一文がありません。ベンチに4匹いれば、1つの番に4回使えます。", "ふつう、手札からエネルギーをつけられるのは1つの番に1回だけです。この特性はワザではなく特性なので、その決まりの外にあります。手札にエネルギーがあるだけ、場に置けてしまいます。", "つけ先は「このポケモン」なので、オーガポン自身にしかつきません。でもみつあめストームは自分のポケモン全員を数えるので、ベンチにたまっていくエネルギーもそのままダメージになります。", "カミツオロチexの【じゅくせいチャージ】は、つけた相手を30回復します。エネルギーを増やす動きが、そのまま回復にもなっています。 HP330に毎ターン30の回復が乗るので、相手は思ったより削りきれません。"]}, {"見出し": "出したその番に、3段階めまで進化する", "引用": "活力の森 (スタジアム)\n  おたがいのポケモン全員は、出したばかりの番(最初の自分の番をのぞく)でも\n  ポケモンに進化できる\n\nセレビィ   ときをめぐる   自分の山札からポケモンとスタジアムを合計3枚まで選び、\n                    手札に加える\nヒカリ    自分の山札から「たねポケモン」「1進化ポケモン」「2進化ポケモン」を\n        1枚ずつ選び、手札に加える\n", "本文": ["このデッキには2進化が2種類も入っています。カジッチュ→カミッチュ→カミツオロチexと、チコリータ→ベイリーフ→メガニウムです。ふつうに育てると、そろうのは4ターン目や5ターン目になります。", "活力の森が100%、平均3.3枚入っています。出したばかりのポケモンでもその番に進化できるスタジアムです。", "これがあると、カジッチュを出した番のうちにカミツオロチexまで進化できます。 2進化のデッキが2つ入っていても間に合うのは、このカードのおかげです。", "ヒカリが91%です。1枚でたね・1進化・2進化がそろうので、活力の森と合わせれば、1つの番で1本の線が完成します。", "セレビィが86%です。草ポケモンとスタジアムを合計3枚持ってこられるので、進化の材料と活力の森を同時に探せます。", "おたがいに効くスタジアムなので、相手にも進化を許してしまいます。それでも入れているのは、得をする量がこちらのほうが大きいからです。"]}], "まとめ": ["メガニウムでエネルギーが2個ぶんに数えられる", "オーガポンを4匹並べて、1つの番に何枚もエネルギーを置く", "数えるのは場のエネルギー全部──ベンチのぶんもダメージになる", "活力の森で、2進化が2種類あっても間に合う", "つけながら30回復するので、削り合いに強い"], "しめ": "メガレックウザexが一気に届かせるデッキだとすれば、こちらは数え方そのものを2倍に変えてしまうデッキです。同じ「エネルギーの数だけ強い」でも、作り方がまったく違います。", "弱点": ["弱点は炎×2 です。165ダメージで倒れます。", "メガニウムを倒されると、数える数が半分に戻ります。カミツオロチexより先に、こちらを狙われるのが一番つらいです。", "活力の森を張り替えられると、進化が1ターン以上遅れます。", "カジッチュはHP40、チコリータはHP70しかありません。出したばかりの番に倒されると育ちません。"], "対面": ["炎タイプで攻撃できるなら、HP330も165ダメージで倒せます。", "ベンチのメガニウムをボスの指令で呼んで倒すと、ダメージが半分近くまで落ちます。", "スタジアムを張り替えると、進化が遅れます。", "回復されるので、少しずつ削る戦い方は向きません。一撃で倒しきるほうが確実です。"]}, "groups": [{"label": "かならず入っている", "cards": [{"name": "基本草エネルギー", "n": 14, "avg": 13.7, "decks": 103, "total": 103, "img": "ENE/046116_E_KIHONKUSAENERUGI.jpg"}, {"name": "むしとりセット", "n": 4, "avg": 4.0, "decks":
