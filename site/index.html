<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#FFB703">
<title>きょうのポケカ</title>
</head>
<body>

<div class="wrap">
  <h1>きょうのポケカ</h1>
  <p class="updated" id="updated"></p>

  <div class="sample" id="sample" style="display:none">
    ⚠️ いまは練習用のサンプルデータです。
    本物の結果になるまで待ってね。
  </div>

  <div class="hero">
    <p class="cap" id="heroCap"></p>
    <p class="name" id="heroName"></p>
    <p class="note" id="heroNote"></p>
  </div>

  <div class="note-box" id="noNames" style="display:none">
    デッキの名前はまだ読みこめていません。
    カードをタップすると、本物のレシピ（60枚）が見られます。
  </div>

  <div class="section-title" id="eventTitle" style="display:none">どの大会？</div>
  <div class="grid3" id="eventRow" style="display:none">
    <button class="seg" data-value="all" aria-pressed="true">ぜんぶ</button>
    <button class="seg" data-value="city" aria-pressed="false">シティリーグ</button>
    <button class="seg" data-value="gym" aria-pressed="false">ジムバトル</button>
  </div>

  <div class="section-title" id="viewTitle">何を見る？</div>
  <div class="grid2" id="viewRow">
    <button class="seg" data-value="new" aria-pressed="true">新しい順</button>
    <button class="seg blue" data-value="rank" aria-pressed="false">強い順</button>
    <button class="seg span2" id="insideBtn" data-value="inside" aria-pressed="false"
            style="display:none">デッキの中身を調べる</button>
    <button class="seg span2" id="searchBtn" data-value="search" aria-pressed="false"
            style="display:none">カードでさがす</button>
  </div>

  <div class="grid2" id="rankRow" style="margin-top:10px">
    <button class="seg" data-value="1" aria-pressed="false">優勝</button>
    <button class="seg blue" data-value="2" aria-pressed="false">準優勝</button>
    <button class="seg span2" data-value="all" aria-pressed="true">ぜんぶ見る</button>
  </div>

  <div class="grid3" id="periodRow" style="margin-top:10px;display:none">
    <button class="seg" data-value="7d" aria-pressed="true">1週間</button>
    <button class="seg" data-value="30d" aria-pressed="false">1か月</button>
    <button class="seg" data-value="all" aria-pressed="false">ぜんぶ</button>
  </div>

  <div class="section-title" id="deckTitle">デッキでさがす</div>
  <div class="chips" id="deckRow"></div>

  <div id="list"></div>

  <footer>
    データの もとは
    <a href="https://pokecabook.com/" target="_blank" rel="noopener">ポケカブック</a> と
    <a href="https://players.pokemon-card.com/" target="_blank" rel="noopener">ポケモンカードゲーム プレイヤーズクラブ</a>
    です。デッキの中身はタップして元のページで見てね。<br>
    シティリーグのデッキ名は、中身をジムバトルのデッキとくらべて決めています。<br>
    このページは家族用の個人的なまとめです。記事や画像の転載はしていません。
  </footer>
</div>

<style>
:root{
  --bg:#FFF7EC; --card:#FFFFFF; --ink:#2B2118; --muted:#7A6A5A;
  --gold:#FFB703; --blue:#3A86FF; --line:#EFE1CE; --shadow:0 3px 0 #E8D6BE;
}
*{box-sizing:border-box}
/* 埋め込み表示のときに下の地色が透けないよう html にも背景を敷く */
html{background:var(--bg)}
body{
  margin:0; background:var(--bg); color:var(--ink);
  font-family:"Hiragino Maru Gothic ProN","ヒラギノ丸ゴ ProN","Yu Gothic",
    "Meiryo",system-ui,sans-serif;
  font-size:18px; line-height:1.7; -webkit-text-size-adjust:100%;
}
.wrap{max-width:760px;margin:0 auto;padding:16px 14px 64px}
h1{font-size:28px;margin:8px 0 2px;letter-spacing:.02em}
.updated{color:var(--muted);font-size:14px;margin:0 0 14px}
.sample{
  background:#FFE8E8;border:3px dashed #E63946;border-radius:14px;
  padding:12px 14px;margin:0 0 16px;font-size:16px;color:#B3242F;font-weight:700;
}
.note-box{
  background:#EAF2FF;border:3px solid #BBD4FF;border-radius:14px;
  padding:12px 14px;margin:0 0 16px;font-size:16px;color:#1F4E9C;
}
.hero{
  background:linear-gradient(135deg,#FFD166,#FFB703);
  border-radius:22px;padding:14px 18px;margin-bottom:14px;box-shadow:var(--shadow);
}
.hero .cap{font-size:16px;font-weight:700;margin:0 0 6px}
.hero .name{font-size:30px;font-weight:800;margin:0;line-height:1.3;word-break:break-word}
.hero .note{font-size:15px;margin:6px 0 0}
.section-title{font-size:15px;color:var(--muted);margin:16px 0 6px;font-weight:700}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.span2{grid-column:1 / -1}
button{font-family:inherit;font-size:19px;font-weight:700;cursor:pointer}
.seg{
  min-height:60px;padding:6px 4px;border-radius:16px;
  border:3px solid var(--line);background:var(--card);color:var(--ink);
  box-shadow:var(--shadow);line-height:1.3;
  /* ひらがなが単語の途中で折り返されると読みにくいので、
     文節の空白でだけ改行させる */
  word-break:keep-all;overflow-wrap:normal;
}
.grid3 .seg{font-size:17px}
.seg[aria-pressed="true"]{background:var(--gold);border-color:#E09B00}
.seg.blue[aria-pressed="true"]{background:var(--blue);border-color:#2668D8;color:#fff}
/* 横スクロールにすると、25個あるデッキ名のうち画面に入るのは3つだけで、
   残りは指でこすらないと出てこない。何があるのか分からないので折り返す。
   ただし全部出すと縦に長くなりすぎるので、はじめは少しだけ出す。 */
.chips{display:flex;flex-wrap:wrap;gap:6px;padding:4px 0 10px}
.chip{
  flex:0 0 auto;min-height:44px;padding:0 12px;border-radius:22px;
  border:2px solid var(--line);background:var(--card);color:var(--ink);font-size:15px;
  max-width:100%;overflow-wrap:anywhere;
}
.chip[aria-pressed="true"]{background:var(--ink);color:#fff;border-color:var(--ink)}
.chip.more{border-style:dashed;color:var(--muted);font-weight:800}
.card{
  display:block;background:var(--card);border:3px solid var(--line);
  border-radius:20px;padding:14px 16px;margin-bottom:12px;
  text-decoration:none;color:inherit;box-shadow:var(--shadow);
}
.card:active{transform:translateY(2px);box-shadow:none}
.badge{
  display:inline-block;border-radius:999px;padding:3px 14px;font-size:15px;
  font-weight:800;color:#fff;margin-bottom:6px;
}
.badge.r1{background:var(--gold);color:#4A3200}
.badge.r2{background:var(--blue)}
/* keep-all は「ゆうしょう」が途中で折り返されるのを防ぐためだが、
   それだけだと「ナンジャモのハラバリーex」のような長いデッキ名が
   はみ出して横スクロールが出る。anywhere を足して、収まらないときだけ折る。 */
.deck{
  font-size:25px;font-weight:800;line-height:1.35;margin:2px 0 6px;
  word-break:keep-all;overflow-wrap:anywhere;
}
.meta{font-size:15px;color:var(--muted);word-break:keep-all;overflow-wrap:anywhere}
.go{margin-top:8px;font-size:16px;font-weight:700;color:#1F6FEB}
/* デッキ画像。タップしなくても中身が見えるように一覧へ並べる。
   loading=lazy なので、画面に入ったぶんだけ読み込む。 */
.shot{
  display:block;width:100%;height:auto;margin:10px 0 4px;
  border-radius:12px;border:2px solid var(--line);background:#fff;
}
.rankrow{display:flex;align-items:center;gap:14px}
.num{
  flex:0 0 auto;width:52px;height:52px;border-radius:50%;display:grid;place-items:center;
  font-size:22px;font-weight:800;color:#fff;background:var(--muted);
}
.num.n1{background:var(--gold);color:#4A3200}
.num.n2{background:#B8C0CC;color:#2B2118}
.num.n3{background:#D9A066}
.count{font-size:16px;color:var(--muted);word-break:keep-all;overflow-wrap:anywhere}
.count span{display:inline-block;margin-right:12px}
/* flex の子は既定で内容より縮まないので、明示的に縮められるようにする */
.rankrow > div:last-child{min-width:0}
.empty{text-align:center;color:var(--muted);padding:36px 10px;font-size:17px;line-height:2}
/* ---- デッキの なかみ ---- */
.groupbar{
  display:flex;align-items:baseline;gap:10px;margin:20px 0 8px;
  font-size:20px;font-weight:800;
}
.groupbar .howmany{font-size:14px;color:var(--muted);font-weight:700}
/* ---- 確率のはなし ---- */
.odds{
  background:#EEF4FF;border:3px solid #BFD4FF;border-radius:16px;
  padding:12px 14px;margin-bottom:9px;
}
.odds .head{font-size:18px;font-weight:800;margin-bottom:2px}
.odds .why{font-size:14px;color:var(--muted);margin-bottom:8px}
.odds .pair{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:8px}
.odds .box{
  flex:1 1 130px;min-width:0;background:#fff;border:2px solid #BFD4FF;
  border-radius:12px;padding:8px 10px;
}
.odds .box.hi{border-color:var(--blue);background:#F4F8FF}
.odds .box .lbl{font-size:13px;color:var(--muted);line-height:1.5}
/* .num は順位バッジ (丸い背景) に使っているので、別の名前にする */
.odds .box .pc{font-size:26px;font-weight:800;line-height:1.2}
.odds .box.hi .pc{color:var(--blue)}
.odds .how{font-size:14px;line-height:1.9;margin:0;padding-left:1.1em}
.odds .how li{word-break:keep-all;overflow-wrap:anywhere}
/* 何枚入れていたか。順位バッジのとなりに並べる */
.badge.howmuch{background:var(--blue);margin-left:6px}
/* ---- カードでさがす ---- */
.search{
  background:var(--card);border:3px solid var(--line);border-radius:16px;
  padding:12px 14px;margin-bottom:10px;box-shadow:var(--shadow);
}
.search input{
  width:100%;box-sizing:border-box;font-size:19px;font-weight:700;
  padding:9px 12px;border:3px solid var(--line);border-radius:12px;
  background:#fff;color:var(--ink);font-family:inherit;
}
.search .hint{font-size:14px;color:var(--muted);line-height:1.8;margin-top:8px}
.hitcount{font-size:15px;color:var(--muted);margin:0 2px 8px}
.sec{
  flex:0 0 auto;font-size:12px;font-weight:800;color:var(--muted);
  border:2px solid var(--line);border-radius:8px;padding:1px 6px;margin-left:6px;
}
.usedby .why{font-size:15px;color:var(--muted);margin:12px 0 6px}
.usedby .why b{font-size:17px;color:var(--ink)}
.usedby .why:first-child{margin-top:0}
/* じぶんのデッキをしらべる計算機 */
.calc{
  background:var(--card);border:3px solid var(--line);border-radius:16px;
  padding:12px 14px;margin-bottom:9px;box-shadow:var(--shadow);
}
.calc label{display:block;font-size:15px;font-weight:700;margin:8px 0 3px}
.calc input{
  width:100%;box-sizing:border-box;font-size:19px;font-weight:800;
  padding:7px 10px;border:3px solid var(--line);border-radius:10px;
  background:#fff;color:var(--ink);font-family:inherit;
}
.calc .out{
  margin-top:12px;padding:10px 12px;border-radius:12px;background:#EEF4FF;
  border:2px solid #BFD4FF;font-size:17px;line-height:1.8;
}
.calc .out b{font-size:28px;color:var(--blue)}
/* カード1枚ぶん。押すと「このカードを つかう デッキ」が下に開く。 */
.cardline{
  display:flex;align-items:center;gap:12px;width:100%;text-align:left;
  background:var(--card);border:3px solid var(--line);border-radius:16px;
  padding:8px 12px;margin-bottom:8px;box-shadow:var(--shadow);color:inherit;
}
.cardline:active{transform:translateY(2px);box-shadow:none}
.thumb{
  flex:0 0 auto;width:52px;aspect-ratio:63/88;object-fit:cover;
  border-radius:6px;background:#EFE1CE;border:1px solid var(--line);
}
/* 中央だけ伸び縮みさせる。枚数の枠まで伸ばすと、画像が読めなかったときに
   枚数がやたら横長になってしまう。 */
.cbody{min-width:0;flex:1}
.cname{font-size:19px;font-weight:800;line-height:1.35;word-break:keep-all;overflow-wrap:anywhere}
.cmeta{font-size:14px;color:var(--muted);word-break:keep-all;overflow-wrap:anywhere}
/* 何枚入れるかが一番大事なので、右端に大きく置く */
.copies{
  flex:0 0 auto;width:62px;text-align:center;font-size:22px;font-weight:800;
  color:#B26A00;background:#FFF1D0;border-radius:12px;padding:4px 6px;line-height:1.2;
}
.copies small{display:block;font-size:12px;color:var(--muted);font-weight:700}
/* 押したときに開く「このカードを つかう デッキ」 */
.usedby{
  background:#F5FAFF;border:3px solid #CFE4FF;border-radius:14px;
  padding:10px 14px;margin:-4px 0 10px;font-size:16px;line-height:1.9;
}
.usedby b{font-size:17px}
.usedby ul{margin:6px 0 0;padding-left:1.2em}
/* 型の一覧 */
.variant{
  display:flex;align-items:center;gap:12px;background:var(--card);
  border:3px solid var(--line);border-radius:16px;padding:10px 14px;
  margin-bottom:8px;box-shadow:var(--shadow);
}
.variant .bar{flex:1;min-width:0}
.variant .vname{font-size:18px;font-weight:800;word-break:keep-all;overflow-wrap:anywhere}
.variant .track{height:10px;border-radius:6px;background:#F0E4D2;margin-top:6px;overflow:hidden}
.variant .fill{height:100%;background:var(--blue);border-radius:6px}
.variant .pct{flex:0 0 auto;font-size:19px;font-weight:800;min-width:56px;text-align:right}
.lead{
  background:#FFF3D6;border:3px solid #FFD98A;border-radius:14px;
  padding:12px 14px;margin:0 0 4px;font-size:16px;line-height:1.8;
}
/* デッキの読み方。数字の並びに埋もれないよう、色で役割を分ける。
   ヒーロー部分が .note を使っているので、別の名前にする。 */
.deckNote{margin:12px 0 4px}
.deckNote .oneline{
  /* ルビが上の行にぶつかるので、本文と同じくらい行間をあける */
  font-size:20px;font-weight:800;line-height:1.9;margin:0 0 10px;
  padding:12px 15px;border-radius:14px;background:var(--ink);color:#fff;
}
.deckNote > div{border-radius:14px;padding:11px 15px;margin-bottom:9px;font-size:17px;line-height:1.95}
.deckNote b{display:block;font-size:18px;margin-bottom:4px}
.deckNote p{margin:0 0 8px}
.deckNote p:last-child{margin-bottom:0}
.deckNote ul{margin:4px 0 0;padding-left:1.15em}
.deckNote li{margin-bottom:5px}
/* ルビ。行間を広めに取っておかないと上の行と重なる */
ruby{ruby-align:center}
rt{font-size:.5em;font-weight:400;opacity:.75;letter-spacing:0}
/* カードの原文。ここはルビを振らず、書いてあるとおりに見せる */
.cardtext{
  margin:6px 0 10px;padding:10px 12px;border-radius:10px;
  background:#FBF6EE;border:2px solid var(--line);
  font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  font-size:13.5px;line-height:1.7;white-space:pre-wrap;overflow-x:auto;
}
.sec{background:var(--card);border:3px solid var(--line)}
.sec b{color:var(--ink)}
.sec-sum{background:#FFF8E6;border:3px solid #FFD98A}
.sec-sum b{color:#8A5A00}
.sec-warn{background:#FFF1EC;border:3px solid #FFC9B5}
.sec-warn b{color:#B3441E}
.sec-vs{background:#EEF2FF;border:3px solid #C6D2FF}
.sec-vs b{color:#3A4FB5}
footer{margin-top:28px;font-size:13px;color:var(--muted);line-height:1.8}
footer a{color:var(--muted)}
</style>

 "deck_name": "ばけがくれ", "count": 34, "color": "#2A9D8F", "emoji": "⚡"}, {"deck_key": "ドラパルトex+バシャーモex", "deck_name": "ドラパルトex＋バシャーモex", "count": 33, "color": "#118AB2", "emoji": "⚡"}, {"deck_key": "メガレックウザex", "deck_name": "メガレックウザex", "count": 29, "color": "#2A9D8F", "emoji": "⚡"}, {"deck_key": "カミツオロチex", "deck_name": "カミツオロチex", "count": 28, "color": "#2A9D8F", "emoji": "⚡"}, {"deck_key": "シロナのガブリアスex", "deck_name": "シロナのガブリアスex", "count": 28, "color": "#06D6A0", "emoji": "⚡"}, {"deck_key": "プリズムバレット", "deck_name": "プリズムバレット", "count": 28, "color": "#F77F00", "emoji": "⚡"}, {"deck_key": "タケルライコex", "deck_name": "タケルライコex", "count": 26, "color": "#FFD166", "emoji": "🌩️"}, {"deck_key": "フーディン", "deck_name": "フーディン", "count": 24, "color": "#7209B7", "emoji": "⚡"}, {"deck_key": "メガドリュウズex", "deck_name": "メガドリュウズex", "count": 23, "color": "#FCBF49", "emoji": "⚡"}, {"deck_key": "メガフシギバナex", "deck_name": "メガフシギバナex", "count": 20, "color": "#06D6A0", "emoji": "⚡"}, {"deck_key": "メガサメハダーex", "deck_name": "メガサメハダーex", "count": 18, "color": "#06D6A0", "emoji": "⚡"}, {"deck_key": "メガスターミーex", "deck_name": "メガスターミーex", "count": 17, "color": "#4361EE", "emoji": "⚡"}, {"deck_key": "オリーヴァex", "deck_name": "オリーヴァex", "count": 16, "color": "#7209B7", "emoji": "⚡"}, {"deck_key": "メガミミロップex", "deck_name": "メガミミロップex", "count": 13, "color": "#F77F00", "emoji": "⚡"}, {"deck_key": "ロケット団のミュウツーex", "deck_name": "ロケット団のミュウツーex", "count": 11, "color": "#E63946", "emoji": "⚡"}, {"deck_key": "ソウブレイズex", "deck_name": "ソウブレイズex", "count": 10, "color": "#06D6A0", "emoji": "⚡"}, {"deck_key": "ロケット団のドンカラス", "deck_name": "ロケット団のドンカラス", "count": 10, "color": "#4361EE", "emoji": "⚡"}, {"deck_key": "マリィのオーロンゲex", "deck_name": "マリィのオーロンゲex", "count": 2, "color": "#7209B7", "emoji": "⚡"}], "contents": {"ドラパルトex": {"name": "ドラパルトex", "decks": 116, "odds": [{"card": "ドラメシヤ", "why": "2進化の1匹めを置く", "copies": 4, "effective": 16, "decks": 116, "p_plain": 44, "p_reach": 93, "draws": 8, "how": ["なかよしポフィン 4枚→ドラメシヤ", "ドラメシヤ 4枚", "ハイパーボール 4枚→ドラメシヤ", "ポケパッド 4枚→ドラメシヤ"]}, {"card": "ふしぎなアメ", "why": "ドロンチをとばして進化する", "copies": 2, "effective": 2, "decks": 93, "p_plain": 25, "p_reach": 25, "draws": 8, "how": ["ふしぎなアメ 2枚"]}], "note": {"結論": "倒されない体と、殴らずに削る手段が、ひとつのデッキに入っています。強いカードが1枚あるのではなく、組み合わせ方が強いデッキです。", "節": [{"見出し": "まず、倒されない", "引用": "ドラパルトex   HP320   竜タイプ   弱点なし   にげる1", "本文": ["ポケモン1097枚のうち、弱点が無いのは64枚だけです。そのうち58枚が竜タイプで、ドラパルトexもその1枚です。", "弱点があると、そのタイプで攻撃されたときにダメージが2倍になります。つまり半分のダメージで倒されてしまいます。ドラパルトexにはその抜け道がありません。相手はまともに320ダメージを出さないと倒せません。", "にげるが1なのも大きいです。大きなポケモンは、呼び出されると動けなくなって負けることがよくありますが、ドラパルトexはすぐ逃げられます。"]}, {"見出し": "殴らずに削る", "引用": "ファントムダイブ   炎エネルギー1個 + 超エネルギー1個 → 200ダメージ\n  ダメカン6個を、相手のベンチポケモンに好きなようにのせる\n", "本文": ["ふつうのポケモンは、目の前の1匹を殴るだけです。ドラパルトexは殴りながら、まだ出てきていない次の相手にもダメカンを置けます。", "なぜ強いのか。相手のHPを見ると分かります。キチキギスexはHP210、ラティアスexもHP210、タケルライコexはHP240です。ここに先にダメカンを置いておけば、次のターンの200ダメージで倒せるようになります。", "2ターン後に必要なダメージを、今のターンのうちに先払いしているわけです。相手は、準備しているだけのベンチポケモンが勝手に減っていきます。"]}, {"見出し": "ダメカンの置き方が自由", "本文": ["ここがこのデッキで一番おもしろいところです。ダメカン6個は、1匹にまとめて置く必要がありません。 1匹目に1個、2匹目に2個、3匹目に3個、というように配れます。", "よく使うのは、相手のHPをちょうど200にする置き方です。キチキギスexやラティアスexのようなHP210のポケモンにダメカンを1個だけ置くと、残りHPが200になります。次のターンにボスの指令で呼び出せば、ファントムダイブの200ダメージでちょうど倒しきれます。ベンチに置いたぶんと合わせて、1ターンで2匹倒せることもあります。", "残りHPを130にする置き方もあります。残りHP130ならヨノワールのカースドボム(ダメカン13個)がちょうど届くので、殴らずに倒せる状態になります。", "メガゲッコウガexも特性でダメカン6個を置けますが、あちらは1匹にまとめてです。自由に配れるドラパルトexのほうが、ダメージを細かく調整できます。", "ポケモンカードのHPとダメージは、とても細かく決められています。 HP330とHP340では、ドラパルトexが多い今の環境では大違いです。 HP330なら倒せて、HP340なら倒せない、ということが起きるからです。新しいカードのHPが10ちがうだけで、環境での立ち位置が変わります。"]}, {"見出し": "ダメージとダメカンは、別のもの", "引用": "シェイミ 【はなのカーテン】自分のベンチポケモン(ルールを持つポケモンをのぞく)全員は、\n                        相手のワザのダメージを受けない\nロック闘エネルギー  つけているポケモンは、相手のポケモンが使うワザの効果を受けない\n", "本文": ["ポケモンカードでは、この2つをはっきり分けて考えます。ワザで与えるのが「ダメージ」、あとから置くのが「ダメカン」です。ダメカンを置くのは、ワザや特性の「効果」のあつかいになります。", "だからシェイミがいても、ファントムダイブのダメカンは置けます。シェイミが防ぐのはダメージのほうだけだからです。", "逆にロック闘エネルギーをつけたポケモンには、ダメカンが置けません。こちらはワザの「効果」を受けないカードだからです。ダメージは通ります。", "カードのテキストに「ダメージ」と書いてあるか「ダメカン」と書いてあるかで、通るか通らないかが変わります。読むときに気をつけたいところです。"]}, {"見出し": "ダメカンを置く手段が、ほかにもある", "引用": "サマヨール 【カースドボム】自分をきぜつさせて、相手1匹にダメカン5個\nヨノワール 【カースドボム】自分をきぜつさせて、相手1匹にダメカン13個\nマシマシラ 【アドレナブレイン】自分の場のダメカン3個を、相手にのせ替える\n", "本文": ["ダメカンを置く手段が4種類もあります。採用率にも出ていて、マシマシラが93%、ヨマワル・サマヨール・ヨノワールが65%です。", "ヨノワールのダメカン13個(130ダメージ)とファントムダイブのダメカン6個(60ダメージ)を合わせると、殴らずに190ダメージぶんを置けます。そこにファントムダイブの200ダメージが乗ります。 HP320のポケモンでも届く計算になります。", "しかも安く済みます。カースドボムは自分のポケモンがきぜつしますが、サマヨールもヨノワールもexではないので、相手に渡すサイドは1枚だけです。サイド1枚で130ダメージぶんを置けるので、かなり割に合います。", "ダメージが無駄になりません。1発で倒しきれなくても、余ったぶんはベンチのポケモンに残ります。 330ダメージ出せるデッキがHP240のポケモンを倒すと90ダメージぶんが消えますが、ドラパルトexは消えません。"]}, {"見出し": "サイドの取られ方を決める", "引用": "非ルールのポケモン … 倒されると 相手はサイドを1枚とる\nポケモンex        … サイド2枚\nメガシンカex      … サイド3枚\n", "本文": ["勝つにはサイドを6枚とります。だから「何をどの順で倒して6枚にするか」を先に考えます。これをサイドプランといいます。", "自分がどう取られるかも同じくらい大事です。exを1匹倒されると2枚、メガシンカexなら3枚も進んでしまいます。渡すなら、なるべく安いポケモンで渡したいところです。", "ドラパルトexはここが上手です。カースドボムで自分からきぜつするサマヨールもヨノワールも非ルールなので、渡すサイドは1枚だけで済みます。"]}, {"見出し": "「倒す」と「倒される」は別の話", "引用": "アンフェアスタンプ  前の相手の番に「自分の」ポケモンがきぜつしていないと使えない\nキチキギスex 【さかてにとる】「自分の」ポケモンがきぜつしていたら、山札を3枚引く\n", "本文": ["どちらも「自分のポケモンが倒されたとき」に使えるカードです。相手を倒したかどうかは関係ありません。ここを読み違えると分からなくなります。", "つまり、話が2つあります。", "ひとつめ。相手を倒すと、相手のこれらが使えるようになってしまいます。だから、わざと倒さずに残しておくと、相手は立て直せません。ダメカンだけ置いておいて、終わりのほうでまとめて倒す、という戦い方ができます。", "ふたつめ。自分が倒されると、自分のこれらが使えます。ドラパルトexは、スボミーを安く差し出すことで、これを自分から起こしています。", "採用率にはっきり出ています。アンフェアスタンプが81%、キチキギスexが98%です。倒されることを前提に組まれています。"]}, {"見出し": "スボミーは、わざと倒させるカード", "引用": "スボミー   HP30   草タイプ   にげる0\nむずむずかふん   エネルギー0個 → 10ダメージ\n  次の相手の番、相手は手札からグッズを出して使えない\n", "本文": ["スボミーはHP30しかないので、前に出せばまず倒されます。でもそれでいいのです。倒されると、いいことが4つ同時に起きます。", "相手に渡すサイドは1枚だけです。exを渡すより安く済みます。", "むずむずかふんの10ダメージが相手に残ります。これが後で効いてきます。ファントムダイブの200ダメージとカースドボムの130ダメージを足すと330ダメージで、ここが上限です。でも10ダメージを1回入れておけば340ダメージ、 2回なら350ダメージになります。HP350のメガゲッコウガexにも届くようになります。", "グッズを止めるので、相手を1ターン遅らせられます。", "そして自分のポケモンが倒されたので、アンフェアスタンプが使えるようになります。", "倒されたあとも、夜のタンカでトラッシュから拾い直して、もう一度前に出せます。同じことを何度も繰り返せます。"]}, {"見出し": "攻撃する直前まで、ドロンチのままでいる", "本文": ["このデッキは、すぐにドラパルトexへ進化しません。攻撃するターンになって、はじめて進化します。", "ドロンチの【ていさつしれい】を使い続けたいからです。ベンチにドロンチを何匹も並べて、毎ターン手札を増やしながら準備します。進化してしまうと、その1匹はもう山札を見てくれません。", "エネルギーも、1匹に集めずに何匹かのドロンチに分けてつけます。エネルギーが2個ついたドロンチをボスの指令で呼ばれて倒されると、エネルギーの進みぐあいが大きく遅れてしまうからです。", "だから相手も、エネルギーのついたドロンチをねらってきます。倒せば【ていさつしれい】も止まり、エネルギーも遅れます。ここがこのデッキとの戦いの中心になります。", "相手がダメカンをばら撒くデッキのときは別です。 HP90のドロンチでは耐えられないので、先に進化することもあります。"]}, {"見出し": "サイドは、わざと先に取らせる", "本文": ["サポートは1ターンに1枚しか使えません。エネルギーが足りなくてアカマツを使うと、そのターンはボスの指令が使えず、ただ殴るだけになってしまいます。", "だから序盤は無理をしません。スボミーで相手を遅らせながら、ベンチにドロンチを並べて、余裕があるときにマシマシラやサマヨールを育てます。", "このあいだ、サイドはかなり先に取られます。でもそれでいいのです。ドラパルトexは1ターンに何匹も倒せるので、後から一気にひっくり返せます。最初から逆転するつもりで組まれているデッキです。"]}, {"見出し": "2進化なのに、事故りにくい", "引用": "ドラメシヤ4枚(100%)   ドロンチ4枚(100%)   ポケパッド4枚(100%)\nリーリエの決心4枚(100%)   ふしぎなアメ(81%)\n", "本文": ["2進化のデッキは「進化が間に合わない」のが弱点ですが、それを消すカードが確定枠に並んでいます。", "とくにドロンチです。【ていさつしれい】は自分の番に1回、山札の上2枚を見て 1枚を手札に加えられます。ふつう1進化は「2進化になるまでの通り道」でしかありませんが、ドロンチは場にいるだけで毎ターン手札が増えます。 1進化そのものがエンジンになっているところが、ほかの2進化デッキと違います。", "ポケパッドもよく合っています。「ルールを持たないポケモン」しか持ってこられませんが、このデッキのドラメシヤもヨマワルもマシマシラも全部その条件を満たします。制限が制限になっていません。", "エネルギーも軽いです。HP320のポケモンが、エネルギー2個で 200ダメージ+ダメカン6個を出します。炎と超の2色が必要ですが、アカマツ1枚でその両方が用意できます。"]}, {"見出し": "山札の下は、あとで使うカードの置き場所", "引用": "ドロンチ 【ていさつしれい】自分の番に1回使える。自分の山札を上から2枚見て、\n       どちらか1枚を選び、手札に加える。残りのカードは、山札の下にもどす\n", "本文": ["この特性は、1枚引けるカードとして見られがちです。でも大事なのは、選ばなかった1枚をどうするかのほうです。", "「山札の下にもどす」と書いてあります。切り直すのではなく、下です。つまり置き場所を自分で決められます。", "いま使わないけれど後で使うカードが出てきたら、下に置きます。それを毎ターンくり返すと、山札の下のほうに「後で使いたかったカード」が積み上がっていきます。", "山札は減っていくので、終盤にはその下の部分を引くことになります。つまり終盤の山札が、自分で選んだ当たりだらけになります。引き運がだんだん良くなっていく、という作りです。", "同じことができるカードはほかにもあります。ブルンゲルの【しんかいドロー】は1枚引いてから手札の1枚を下にもどせますし、ハイダイは手札2枚を好きな順番で下にもどして4枚引きます。推理セットは上3枚を見て、そのまま上に置くか、まとめて下に送るかを選べます。どれも「今と後で分ける」ためのカードです。"]}, {"見出し": "いらないカードを、先に使ってしまう", "引用": "なかよしポフィン  自分の山札から、HPが「70」以下のたねポケモンを2枚まで選び、\n              ベンチに出す\nリーリエの決心   自分の手札をすべて山札にもどして切る。その後、山札を6枚引く\n", "本文": ["なかよしポフィンは序盤にしか使いません。ベンチがそろったあとに引いても、ただの紙です。", "ここでリーリエの決心を見ます。手札を全部山札にもどして引き直すカードです。つまり、いらないカードを手札に持ったままこれを使うと、そのいらないカードを自分で山札に戻してしまいます。また引く可能性が出てきます。", "だから使ってしまいます。ベンチがもう埋まっていても、なかよしポフィンを使って「出すポケモンはいません」と言えます。「2枚まで」なので0枚でもいいからです。ハイパーボールも同じように使えます。", "こうすると、そのカードは山札に戻らずトラッシュに行きます。山札から1枚減り、いらないカードも1枚減ります。そのうえ山札の中身も見られるので、ほしいカードがまだ残っているかどうかまで分かります。", "使わないカードを使う、という変な動きに見えます。でも山札を薄くして、いらないものを外に出すためだと分かれば、とても理屈が通った動きです。"]}], "まとめ": ["倒されない── HP320・弱点なし・にげる1", "削る手段が多い── 200ダメージ + ダメカン6個 + カースドボム + のせ替え", "先回りできる──次のターンに倒すための準備を、今のターンにできる", "サイドが安い──自分から倒れるのは非ルール。渡すのはサイド1枚", "事故りにくい──ふしぎなアメ・ていさつしれい・ポケパッド・リーリエの決心", "山札の下に、あとで使うカードをためていける"], "しめ": "硬いから強いのでも、ダメージが大きいから強いのでもありません。硬さと先回りが同時にできるので、相手は「今の1匹を守ること」と「次の1匹を守ること」を一度に考えなければならなくなります。それが一番使われている理由です。", "弱点": ["スボミーを98%も入れているのは、グッズを止められると困るデッキがそれだけ多いということです。裏を返せば、ドラパルトex自身もふしぎなアメやボールに強く頼っています。同じことをやり返されると苦しくなります。", "ヨマワルはHP60、サマヨールはHP90しかありません。カースドボムを準備しているあいだは弱いので、ベンチをねらわれると計画が崩れます。", "ドロンチは手札を増やす役と、エネルギーの置き場という2つの役をしています。エネルギーのついたドロンチをボスの指令で倒されると、【ていさつしれい】も止まり、エネルギーも遅れます。2つ同時に痛いです。", "サポートは1ターンに1枚だけです。アカマツを使ったターンはボスの指令が使えず、ダメカンを置きたいところに置けません。", "事故率は低くありません。337件の平均で20.1%です。たねポケモンが8枚の構築だと34.6%になります。5回に1回は最初でつまずきます。", "弱点が無いことをひっくり返すカードが出てきています。リーリエのピッピexの【フェアリーゾーン】は、相手の場の竜ポケモン全員の弱点を超タイプにしてしまいます。ドラパルトexは竜タイプなので、弱点超×2 になり、ダダリンの170ダメージが340ダメージになってHP320が一撃で倒れます。効くのは竜タイプだけなので、これはドラパルトexとタケルライコexを名指しで止めにきているカードです。こういうふうに、あるデッキを止めるために作られたカードをメタカードと呼びます。"], "対面": ["ベンチを広げすぎないようにします。ダメカンを置く先が減ると、ファントムダイブの値打ちが下がります。", "HP210くらいのポケモンをベンチに並べると、ダメカンを1個置かれて残りHP200にされ、次のターンにまとめて倒されます。", "スボミーなどでグッズを止めると、ふしぎなアメが使えなくなって育ちません。", "エネルギーのついたドロンチをボスの指令で呼んで倒すのが一番効きます。【ていさつしれい】が止まり、エネルギーも遅れ、相手はアカマツなどエネルギーを増やすサポートしか使えなくなります。", "ロック闘エネルギーをつけたポケモンは、相手のワザの効果を受けません。ファントムダイブでダメカンを置くのはワザの「効果」なので、そのポケモンにはダメカンが置けなくなります。", "サイドを先に取れても油断できません。ドラパルトexは1ターンに何匹も倒せるので、最後にまとめて返されます。3枚差でも安心してはいけません。"]}, "groups": [{"label": "かならず入っている", "cards": [{"name": "ポケパッド", "n": 4, "avg": 4.0, "decks": 116, "total": 116, "img": "M3/049703_T_POKEPADDO.jpg"}, {"name": "ドラメシヤ", "n": 4, "avg": 3.9, "decks": 116, "total": 116, "img": "SV8a/046779_P_DORAMESHIYA.jpg"}, {"name": "ドロンチ", "n": 4, "avg": 3.9, "decks": 116, "tota  0.23}, {"cards": ["ジャッジマン"], "decks": 17, "share": 0.18}, {"cards": ["ファイヤー", "ジャッジマン", "スペシャルレッドカード"], "decks": 16, "share": 0.17}, {"cards": ["ファイヤー", "ジャッジマン"], "decks": 14, "share": 0.15}, {"cards": ["スペシャルレッドカード"], "decks": 12, "share": 0.13}, {"cards": ["ジャッジマン", "スペシャルレッドカード"], "decks": 12, "share": 0.13}], "other": 0}, "おまつりおんど": {"name": "おまつりおんど", "decks": 55, "odds": [{"card": "お祭り会場", "why": "これが無いと2回攻撃できない", "copies": 4, "effective": 5, "decks": 55, "p_plain": 44, "p_reach": 52, "draws": 8, "how": ["お祭り会場 4枚", "シークレットボックス 1枚→お祭り会場"]}, {"card": "サルノリ", "why": "バチンキーのもとを置く", "copies": 4, "effective": 16, "decks": 55, "p_plain": 44, "p_reach": 93, "draws": 8, "how": ["なかよしポフィン 4枚→サルノリ", "サルノリ 4枚", "ハイパーボール 4枚→サルノリ", "ポケパッド 4枚→サルノリ"]}], "note": {"結論": "HP80の小さなポケモンが、1ターンで400ダメージを超えます。そのかわり、スタジアムを1枚外されると全部止まります。", "節": [{"見出し": "2回攻撃には条件がある", "引用": "カミッチュ   HP80   草タイプ   弱点 炎×2\n【おまつりおんど】場に「お祭り会場」が出ているなら、このポケモンは、\n               持っているワザを2回連続で使える\nともだちのわ   草エネルギー1個 → 自分のベンチポケモンの数 × 20ダメージ\n", "本文": ["まず特性の文を最後まで読みます。「場に『お祭り会場』が出ているなら」という条件が先に書いてあります。", "お祭り会場が場に無いあいだ、カミッチュはただのHP80のポケモンです。ワザは1回しか使えず、ダメージは半分になります。", "スタジアムは場に1枚しか出せません。相手が別のスタジアムを出した瞬間に、このデッキの攻撃力は半分になります。", "だからお祭り会場を100%が入れていて、しかも平均4.0枚です。 4枚というのは入れられる上限です。張り替えられたら、その番のうちに張り直します。", "このデッキで一番大事なカードはカミッチュではなく、お祭り会場のほうだと言えます。"]}, {"見出し": "お祭り会場そのものも守ってくれる", "引用": "お祭り会場 (スタジアム)\n  エネルギーがついているおたがいのポケモン全員は、特殊状態にならず、\n  受けている特殊状態は、すべて回復する\n", "本文": ["お祭り会場は名前を呼ばれるだけのカードではありません。それ自身にも効果があります。", "エネルギーがついているポケモンは、どく・こんらん・ねむり・まひにならなくなります。カミッチュは草エネルギー1個をつけて戦うので、この守りをいつも受けています。", "毒でじわじわ削ってくるデッキや、こんらんで止めてくるデッキに対して、スタジアムを置いているだけで防げているわけです。", "おたがいに効くので、相手のポケモンも守られます。それでも、毒を使うのはたいてい相手のほうなので、得をするのはこちら側です。"]}, {"見出し": "ベンチの1匹が、ダメージ2回ぶん", "引用": "ともだちのわ    自分のベンチポケモンの数 × 20ダメージ\nグラジオの決戦  自分の手札がこのカード1枚だけのときにしか使えない。\n              この番、自分のポケモン(ルールを持つポケモンをのぞく)が使うワザの、\n              相手のバトルポケモンへのダメージは「+80」される\nブレイブバングル つけているポケモン(ルールを持つポケモンをのぞく)が使うワザの、\n              相手のバトル場の「ポケモンex」へのダメージは「+30」される\n", "本文": ["ともだちのわは、ベンチが5匹なら100ダメージです。それが2回で200ダメージです。", "ここにグラジオの決戦を86%が入れています。ダメージが80上がるサポートですが、 2回攻撃なので、上がるのも2回ぶんで160ダメージです。", "ブレイブバングルも99%が入れています。相手がポケモンexなら30上がり、これも2回ぶんで60ダメージです。", "全部そろうと、100＋80＋30が2回で420ダメージになります。 HP80のポケモンが、草エネルギー1個で420ダメージを出す計算です。", "ここが大事なところです。ダメージを上げるカードは、 2回攻撃のデッキでは効き目が2倍になります。同じ「＋80」でも、このデッキでは160の価値があります。", "ベンチの1匹も同じです。ふつうのデッキならベンチが1匹増えて20ダメージですが、このデッキでは40ダメージぶんになります。"]}, {"見出し": "ベンチが、そのまま手札を探す力になる", "引用": "バチンキー 【ドンドンだいこ】自分のバトルポケモンが特性「おまつりおんど」を\n          持つポケモンなら、自分の番に1回使える。\n          自分の山札から好きなカードを1枚選び、手札に加える\n\nアズマオウ 【おまつりおんど】持ち   クイックドロー 無エネルギー1個\n          60ダメージ、自分の山札を2枚引く\n", "本文": ["バチンキーが99%、平均3.7枚入っています。3枚以上入れているデッキがほとんどだということです。", "特性の文をよく読むと、「別のドンドンだいこを使っていたなら使えない」という一文がありません。同じ名前の特性でも、この一文が無いものは何匹ぶんでも使えます。ベンチに3匹いれば1つの番に3回、山札から好きなカードを3枚持ってこられます。", "ここでベンチの意味が2つになります。ベンチの数はともだちのわのダメージであり、同時にカードを探す回数でもあります。ベンチを1匹増やすと、ダメージが40上がって、探せる枚数も1枚増えることがあります。", "アズマオウも【おまつりおんど】持ちです。クイックドローを2回撃つと 120ダメージを与えながら山札を4枚引けます。殴るカードと引くカードが同じ1匹になっています。", "グラジオの決戦は手札が1枚のときしか使えません。探して、出して、使い切って、最後にグラジオの決戦だけを残す。この順番でカードを使うデッキです。"]}, {"見出し": "ドラパルトexを止めるカードが3種類入っている", "引用": "ベラカス 【スフィアシールド】このポケモンがいるかぎり、自分のベンチポケモン全員は、\n        相手のポケモンからワザのダメージや効果を受けない\nシェイミ 【はなのカーテン】このポケモンがいるかぎり、自分のベンチポケモン\n        (ルールを持つポケモンをのぞく)全員は、相手のワザのダメージを受けない\nコダック 【しめりけ】このポケモンがいるかぎり、おたがいのポケモン全員は、\n        そのポケモン自身をきぜつさせる効果の特性が、すべてなくなる\n", "本文": ["この3枚を並べて読むと、書いてある言葉が少しずつ違います。違いがそのまま役割の違いになっています。", "シェイミが防ぐのは「ワザのダメージ」だけです。ドラパルトexのファントムダイブがベンチに置くのはダメカンで、これはワザの効果のあつかいです。だからシェイミでは防げません。", "ベラカスは「ワザのダメージや効果」と書いてあります。効果まで防ぐので、ファントムダイブのダメカンが置けなくなります。シガロコとベラカスがどちらも68%で、そろって入っているのはこのためです。", "コダックは「自分自身をきぜつさせる効果の特性」を消します。サマヨールとヨノワールのカースドボムが、これに当てはまります。ドラパルトexのデッキは、殴らずにダメカンを置く手段を何種類も持っていますが、コダックはそのうちの1つを丸ごと止めます。", "ベンチのポケモンがHP70前後ばかりのデッキなので、ベンチを削る攻め方が一番こわいです。そこを3枚がかりで防いでいます。"]}], "まとめ": ["2回攻撃はお祭り会場が場にあるときだけ──無いと半分になる", "ダメージを上げるカードは効き目が2倍──＋80が160になる", "ベンチの数は、ダメージであり、探せる枚数でもある", "ベラカスとコダックで、ドラパルトexのダメカンを止める"], "しめ": "HP80のポケモンが420ダメージを出せるのは、 2回攻撃だからです。そしてその2回攻撃は、スタジアム1枚に乗っています。強さの全部が1枚のカードに乗っているデッキです。", "弱点": ["お祭り会場を張り替えられると、ダメージが半分になります。ここが最大の弱点です。", "カミッチュはHP80、弱点は炎×2 です。40ダメージで倒れます。", "グラジオの決戦は手札が1枚のときしか使えません。相手にジャッジマンなどで手札を配られると、その番は使えなくなります。", "ベンチの数でダメージが決まるので、ベンチを減らされると弱くなります。"], "対面": ["スタジアムを張り替えるのが一番効きます。ダメージが半分になります。", "炎タイプなら、カミッチュもバチンキーも一撃で倒せます。", "手札を増やすカードを相手に使わせると、グラジオの決戦が止まります。", "ベラカスがいるあいだは、こちらのワザでベンチにダメカンを置けません。先にベラカスをボスの指令で呼び出して倒すのが早道です。"]}, "groups": [{"label": "かならず入っている", "cards": [{"name": "お祭り会場", "n": 4, "avg": 4.0, "decks": 55, "total": 55, "img": "SV8a/046841_T_OMATSURIKAIJIXYOU.jpg"}, {"name": "なかよしポフィン", "n": 4, "avg": 4.0, "decks": 55, "total": 55, "img": "MC/049364_T_NAKAYOSHIPOFUIN.jpg"}, {"name": "サルノリ", "n": 4, "avg": 4.0, "decks": 55, "total": 55, "img": "SV8a/046853_P_SARUNORI.jpg"}, {"name": "ポケパッド", "n": 4, "avg": 3.9, "decks": 55, "total": 55, "img": "MEZ/050444_T_POKEPADDO.jpg"}, {"name": "リーリエの決心", "n": 4, "avg": 3.9, "decks": 55, "total": 55, "img": "M1L/048443_T_RIRIENOKESSHIN.jpg"}, {"name": "バチンキー", "n": 4, "avg": 3.9, "decks": 55, "total": 55, "img": "SV8a/046854_P_BACHINKI.jpg"}, {"name": "トサキント", "n": 2, "avg": 2.5, "decks": 55, "total": 55, "img": "SV8a/046868_P_TOSAKINTO.jpg"}, {"name": "ブレイブバングル", "n": 2, "avg": 2.1, "decks": 55, "total": 55, "img": "MC/049405_T_BUREIBUBANGURU.jpg"}, {"name": "ボスの指令", "n": 2, "avg": 2.0, "decks": 55, "total": 55, "img": "S2/038062_T_BOSUNOSHIREISAKAKI.jpg"}, {"name": "アズマオウ", "n": 1, "avg": 1.6, "decks": 55, "total": 55, "img": "SV8a/046869_P_AZUMAOU.jpg"}, {"name": "カジッチュ", "n": 4, "avg": 3.3, "decks": 54, "total": 55, "img": "SV8a/046855_P_KAJITCHIXYU.jpg"}, {"name": "カミッチュ", "n": 4, "avg": 3.2, "decks": 54, "total": 55, "img": "SV8a/046856_P_KAMITCHIXYU.jpg"}, {"name": "ハイパーボール", "n": 4, "avg": 3.0, "decks": 54, "total": 55, "img": "MEM/050461_T_HAIPABORU.jpg"}, {"name": "グラジオの決戦", "n": 2, "avg": 2.4, "decks": 54, "total": 55, "img": "M5/050336_T_GURAJIONOKESSEN.jpg"}, {"name": "ふうせん", "n": 2, "avg": 1.8, "decks": 54, "total": 55, "img": "MEM/050464_T_FUUSEN.jpg"}, {" ", "節": [{"見出し": "止まるのは1つのワザだけ", "引用": "メガルカリオex   HP340   闘タイプ   弱点 超×2   にげる2\n\nはどうづき   闘エネルギー1個 → 130ダメージ\n  自分のトラッシュから「基本闘エネルギー」を3枚まで選び、\n  ベンチポケモンに好きなようにつける\nメガブレイブ 闘エネルギー2個 → 270ダメージ\n  次の自分の番、このポケモンは「メガブレイブ」が使えない\n", "本文": ["まずメガブレイブの一番下の行を、そのままの言葉で読みます。「このポケモンはワザが使えない」ではなく、「このポケモンは『メガブレイブ』が使えない」と書いてあります。", "止まるのはメガブレイブだけです。はどうづきはふつうに使えます。つまり270ダメージの次の番は、休みではなく130ダメージの番です。", "しかもそのはどうづきが、トラッシュから闘エネルギーを3枚も配ります。 270 → 130＋エネルギー3枚→ 270 → 130＋エネルギー3枚、という2番ひとまとまりのくり返しになります。", "同じ「次の番は使えない」でも、 Nのゼクロムのランページサンダーは「ワザが使えない」なので本当に止まります。 1文字ちがうだけで、デッキの回り方がまるごと変わります。"]}, {"見出し": "つけ先はベンチ、つまり次の1匹", "本文": ["はどうづきの文には「ベンチポケモンに」と書いてあります。自分自身にはつけられません。", "だからこのワザは、いま戦っている1匹のためではなく、次に出す1匹のために撃つワザです。", "メガルカリオexは平均3.0枚入っています。1匹が倒されるころには、ベンチにエネルギーがそろった2匹めが待っている形になります。", "ミツルの思いやりを54%が入れています。メガシンカexのHPをすべて回復して、ついているエネルギーを手札にもどすカードです。 HP340がまるごと戻るうえ、エネルギーもトラッシュではなく手札に帰ってきます。手札から1枚つけ直し、残りははどうづきで配る、という流れになります。"]}, {"見出し": "270ダメージを、どこまで伸ばせるか", "引用": "パワープロテイン (グッズ)  この番、自分の闘ポケモンが使うワザの、\n                       相手のバトルポケモンへのダメージは「+30」される\nマキシマムベルト (どうぐ)  このカードをつけているポケモンが使うワザの、\n                       相手のバトル場の「ポケモンex」へのダメージは「+50」される\nグラビティーマウンテン     おたがいの場の2進化ポケモン全員の最大HPは「-30」される\n", "本文": ["パワープロテインは100%、平均3.9枚入っています。サポートではなくグッズなので、 1つの番に何枚でも使えます。2枚使えば270ダメージが330ダメージです。", "マキシマムベルトを42%が入れています。相手のバトル場がポケモンexなら50上がるので、 270＋50＋30で350ダメージになります。", "グラビティーマウンテンを78%が入れています。 2進化ポケモンのHPを30下げるスタジアムです。メガルカリオexは1進化なので、自分は下がりません。", "下がる相手を並べると意味が分かります。ドラパルトexはHP320からHP290、メガゲッコウガexはHP350からHP320、メガリザードンexはHP360からHP330です。 270ダメージにパワープロテイン2枚を足せば、ここまで全部届きます。", "自分のダメージを上げるだけでなく、相手のHPを下げてすり合わせる。この2方向から数字を寄せていくのが、このデッキの考え方です。"]}, {"見出し": "相手のワザの効果を、まるごと無効にするエネルギー", "引用": "ロック闘エネルギー\n  このカードは、ポケモンについているかぎり、闘エネルギー1個ぶんとしてはたらく。\n  このカードをつけている闘ポケモンは、相手のポケモンが使うワザの効果を受けない\n", "本文": ["47%が入れています。エネルギーとしても数えられて、そのうえワザの効果を受けなくなるカードです。", "ここでダメージと効果のちがいが効いてきます。ドラパルトexのファントムダイブは、200ダメージのあとにダメカン6個を相手のベンチに置きます。このダメカンはワザの「効果」です。", "ロック闘エネルギーをつけたメガルカリオexには、そのダメカンが置けません。どくにもなりませんし、「にげられない」も効きません。通るのはダメージだけになります。", "守れるのは闘ポケモンだけなので、どのデッキでも使えるカードではありません。闘タイプで組んでいるこのデッキだけが受け取れる特典です。"]}, {"見出し": "引くしくみと、呼び出すしくみ", "引用": "ルナトーン 【ルナサイクル】自分の場に「ソルロック」がいて、自分の番に、\n         自分の手札から「基本闘エネルギー」を1枚トラッシュするなら、1回使える。\n         自分の山札を3枚引く\nハリテヤマ 【どすこいキャッチャー】自分の番に、このカードを手札から出して\n         進化させたとき、1回使える。\n         相手のベンチポケモンを1匹選び、バトルポケモンと入れ替える\n", "本文": ["ソルロックが99%、ルナトーンも99%です。ルナサイクルはソルロックが場にいないと使えないので、 2匹そろって初めて1つの特性になります。", "手札の闘エネルギーを捨てて3枚引きます。捨てたエネルギーは無駄になりません。はどうづきがトラッシュから拾ってくるからです。引くために捨てる動きと、エネルギーを並べる動きが同じ場所でつながっています。", "ハリテヤマを51%、平均1.8枚が入れています。マクノシタを手札から進化させたとき、相手のベンチポケモンを引きずり出せます。", "ボスの指令と同じことができて、しかもサポートを使いません。サポートは1つの番に1枚だけなので、ハリテヤマで呼び出した番は、サポートをリーリエの決心に回せます。 1つの番にできることが1つ増える、という重い意味を持っています。", "ファイトゴングを100%、平均4.0枚が入れています。闘タイプのたねポケモンか基本闘エネルギーのどちらかを持ってこられるので、リオルもソルロックもルナトーンもマクノシタも、この1枚で届きます。"]}], "まとめ": ["止まるのはメガブレイブだけ──次の番も130ダメージが出る", "はどうづきがつけるのはベンチ──次の1匹を裏で育てている", "パワープロテインはグッズなので何枚でも重ねられる", "グラビティーマウンテンで、相手のHPのほうを下げにいく", "ロック闘エネルギーで、ファントムダイブのダメカンが乗らなくなる", "ハリテヤマは、サポートを使わないボスの指令"], "しめ": "派手ではありませんが、攻撃と準備と手札の補充が、たがいに支え合っています。 1〜2か月前は4.4%でしたが、直近1週では7.5%まで増えています。序盤から大きなダメージを出せるので、立ち上がりの遅いデッキには先にサイドを取って押し切れます。", "弱点": ["弱点は超×2 です。170ダメージで倒れます。HP340が実質HP170になってしまいます。 HP340という数字は今の環境でも上のほうですが、超タイプの前では何の意味も持ちません。", "メガブレイブを撃った次の番は130ダメージしか出ません。 130ダメージで倒せる相手がいないと、その番はダメージが無駄になります。", "リオル(HP70)から育てる必要があります。育つ前をねらわれると遅れます。", "メガシンカexなので、倒されるとサイドを3枚渡します。1匹で試合が決まりかねません。", "ソルロックとルナトーンは2匹そろわないと働きません。片方だけベンチに残ると、引く手段がまるごと消えます。"], "対面": ["超タイプで攻撃できるなら、HP340も170ダメージで倒せます。ここが一番はっきりした答えです。", "メガブレイブを撃たれた次の番に攻め返します。130ダメージなら耐えられるHPで前に立っておくと、その番をまるごと無駄にできます。", "リオル(HP70)のうちに倒せると、そもそも育ちません。", "ベンチのソルロックかルナトーンを1匹倒すと、手札が増えなくなります。", "サイドを3枚渡すメガルカリオexは最後に残しておいて、先に非ルールとexで3枚取っておくと、一気に決められます。"]}, "groups": [{"label": "かならず入っている", "cards": [{"name": "基本闘エネルギー", "n": 10, "avg": 9.8, "decks": 52, "total": 52, "img": "SVI/045513_P_KIHONTOUENERUGI.jpg"}, {"name": "パワープロテイン", "n": 4, "avg": 4.0, "decks": 52, "total": 52, "img": "M1L/048438_T_PAWAPUROTEIN.jpg"}, {"name": "ファイトゴング", "n": 4, "avg": 4.0, "decks": 52, "total" ンダー   250ダメージ (次の自分の番、このポケモンはワザが使えない)\nNのレシラム  パワーレイジ        このポケモンにのっているダメカンの数 × 20ダメージ\nモモワロウex イライラバースト     相手がすでにとったサイドの枚数 × 60ダメージ\n", "本文": ["借りられるワザで一番大きいのがランページサンダーの250ダメージです。つまりこのデッキの素の上限が250ダメージだということです。", "今よく使われているポケモンのHPを並べると、ドラパルトexがHP320、メガルカリオexがHP340、メガドリュウズexがHP340、メガゲッコウガexがHP350です。250ダメージではどれにも届きません。", "中くらいのダメージしか出ないというのが、このデッキの一番の弱点です。強いカードが足りないのではなく、上限が決まっているのが問題です。", "だから足りない80ダメージを、別のカードで作りにいきます。"]}, {"見出し": "自分から毒になる", "引用": "くさりもち        このカードをつけているどくのポケモンが使うワザの、\n                相手のバトルポケモンへのダメージは「+40」される\nアンズの秘技      自分の悪ポケモンを2匹まで選び、\n                自分の山札から「基本悪エネルギー」を1枚ずつつける。\n                バトルポケモンにつけた場合、そのポケモンをどくにする\nモモワロウex 【しはいのくさり】自分のベンチの悪ポケモンを1匹バトル場と入れ替え、\n                その新しいバトルポケモンをどくにする\n", "本文": ["くさりもちを88%が入れています。ダメージが40上がる道具ですが、上がる条件は「つけているポケモンが毒であること」です。相手が毒なのではなく、自分が毒でないといけません。", "ふつう、毒は受けたくないものです。このデッキはその逆で、自分のゾロアークexをわざと毒にしにいきます。", "毒にする手段が2つ入っています。アンズの秘技が64%、モモワロウexが95%です。どちらも自分のバトルポケモンを毒にする書き方をしています。", "毒になると、自分の番の終わりにダメカンが1個(10ダメージ)のっていきます。それを払って、ワザのダメージを40上げているわけです。 250ダメージが290ダメージになります。", "もう1枚、からておうの稽古を66%が入れています。この番、相手のバトル場のポケモンexへのダメージが40上がります。合わせると250＋40＋40で330ダメージです。ここでようやくドラパルトexのHP320に届きます。", "数字の作り方が細かいところが、このデッキの面白さです。大きな1枚で殴るのではなく、40ずつ足して届かせています。"]}, {"見出し": "削られた体が、そのまま攻撃力になる", "引用": "Nのレシラム  パワーレイジ   このポケモンにのっているダメカンの数 × 20ダメージ\nヒーローマント (ACE SPEC)   このカードをつけているポケモンの最大HPは「＋100」される\n", "本文": ["パワーレイジの「このポケモン」は、ワザを使っているポケモン、つまりゾロアークex自身のことです。ベンチのレシラムではありません。", "だからゾロアークexが受けたダメージが、そのままダメージに変わります。ダメカン10個(100ダメージ)をのせられていれば200ダメージ、ダメカン13個(130ダメージ)なら260ダメージになります。", "ここでヒーローマントが効いてきます。最大HPが100増えるので、 HP280のゾロアークexがHP380になります。", "数えてみると差がはっきりします。メガレックウザexの350ダメージを受けたとき、マントが無いゾロアークex(HP280)はきぜつします。マントがあると(HP380)残りHP30で生き残り、ダメカン35個がのった状態になります。そのままパワーレイジを撃つと700ダメージです。", "つまりこのマントは、HPを増やす道具ではなく、「一撃で倒されないようにして、受けたダメージを回収する」道具です。倒されなければ、殴られるほど強くなります。", "ただしヒーローマントはACE SPECなので、デッキに1枚しか入れられません。採用率も10%です。まだ多くの人が試している段階の組み方です。"]}, {"見出し": "非ルールを2匹まとめて倒す", "引用": "Nのヒヒダルマ  ひだるまキャノン   90ダメージ\n  このポケモンについているエネルギーをすべてトラッシュし、\n  相手のベンチポケモン1匹にも、90ダメージ\n\nNのポイントアップ   自分のトラッシュから基本エネルギーを1枚選び、\n                 ベンチの「Nのポケモン」につける\n", "本文": ["NのダルマッカとNのヒヒダルマが、どちらもちょうど57%です。同じデッキに一緒に入っている組です。", "ひだるまキャノンを借りると、相手のバトル場に90ダメージ、さらに相手のベンチ1匹にも90ダメージが入ります。", "相手の非ルールのポケモンは、HP70から90くらいのものが多いです。そこを2匹同時に倒せます。1ターンでサイド2枚です。", "非ルールのポケモンは1匹倒してもサイド1枚しか取れません。そこが遅れる原因になりますが、まとめて2匹倒せば追いつけます。", "ただし「このポケモンについているエネルギーをすべてトラッシュ」します。この「このポケモン」もゾロアークex自身なので、撃ったあとゾロアークexはエネルギー0個になります。", "だからNのポイントアップが100%、平均3.0枚入っています。トラッシュから基本エネルギーを、ベンチのNのポケモンにつけ直せます。つけられるのはベンチだけなので、次に出すゾロアークexを準備するカードです。"]}, {"見出し": "撃てなくなった番を、逃げてしのぐ", "引用": "Nの城 (スタジアム)\n  おたがいの場の「Nのポケモン」全員のにげるためのエネルギーは、すべてなくなる\n", "本文": ["ランページサンダーには「次の自分の番、このポケモンはワザが使えない」と書いてあります。250ダメージを撃った次の番、そのゾロアークexは動けません。", "ここでNの城です。Nのポケモンのにげるエネルギーが0になるので、動けなくなったゾロアークexを、ベンチのもう1匹とただで入れ替えられます。", "ゾロアークexが平均4.0枚も入っているのは、このためです。 1匹が休んでいる間に、もう1匹が殴ります。", "Nの城は95%が入れていて、平均2.0枚です。相手にスタジアムを張り替えられても、すぐ張り直せるようにしてあります。"]}], "まとめ": ["借りるワザのエネルギーは要らない──悪エネルギー2個だけで撃てる", "上限は250ダメージ──足りないぶんは毒と稽古で40ずつ足す", "受けたダメージがパワーレイジに変わる", "ひだるまキャノンで非ルールを2匹まとめて倒せる", "Nの城で、撃てない番を無かったことにする"], "しめ": "借りたワザで戦うところが目立ちますが、本当に考えられているのは250ダメージの埋め方のほうです。毒もマントも稽古も、全部その40ダメージのために入っています。", "弱点": ["弱点は草×2 です。140ダメージで倒れます。", "ベンチにNのポケモンがいないと、ナイトジョーカーで選べるワザがありません。ベンチを先に倒されると、殴る手段そのものが消えます。", "自分から毒になるので、放っておくとこちらのHPも減っていきます。殴り合いが長引くほど、この10ダメージが効いてきます。", "ゾロアークexは倒されるとサイドを2枚渡します。借りる元のポケモンも並べるので、ベンチが埋まりやすいです。"], "対面": ["草タイプで攻撃できるなら、HP280も140ダメージで倒せます。", "HP340以上のポケモンで前に立つと、250ダメージでも290ダメージでも倒されません。相手は稽古まで使わないと届かなくなります。", "ベンチのNのゼクロムをボスの指令で呼んで倒すと、250ダメージが消えます。ワザの見本を減らすのが、このデッキへの一番の攻め方です。", "サイドを一気に取りすぎると、イライラバーストのダメージが上がります。取る順番を考える必要があります。"]}, "groups": [{"label": "かならず入っている", "cards": [{"name": "基本悪エネルギー", "n": 8, "avg": 8.2, "decks": 43, "total": 43, "img": "M6a/050751_E_KIHONAKUENERUGI.jpg"}, {"name": "Nのゾロア", "n": 4, "avg": 4.0, "decks": 43, "total": 43, "img": "SV9/047228_P_NNOZOROA.jpg"}, {"name": "Nのゾロアークex", "n": 4, "avg": 4.0, "decks": 43, "total": 43, "img": "SV9/047069_P_NNOZOROAKUEX.jpg"}, {"name": "なかよしポフィン デッキが15%もあるのに、非メガを抜いているのは5%しかありません。つまりメガのほうが、抜いてもいい枠として見られています。", "どちらもケロマツ→ゲコガシラから進化するので、2進化の線は1本で足ります。同じ1本の線から、性格のちがう2匹を選べるということです。", "このあとの話は全部ここにつながります。エネルギーの選び方も、自由枠の選び方も、「どっちを主役にするか」で変わります。"]}, {"見出し": "３．詰まっているのはポケモンではなく「ふしぎなアメ」", "引用": "最初の7枚にたどりつく確率 (たどりつけるカードも数えたもの)\n\n  ケロマツ           実質15枚 →  88%\n  ゲッコウガex        実質 9枚 →  70%\n  メガゲッコウガex     実質 9枚 →  70%\n  ふしぎなアメ        実質 3枚 →  32%\n", "本文": ["「2進化だから遅い」で終わらせずに、どこで止まっているのかを数えました。", "ケロマツは88%です。なかよしポフィン4枚・ハイパーボール・ポケパッドと、どこからでも当たるので、ここは全然詰まっていません。", "詰まっているのはふしぎなアメです。100%のデッキが平均2.7枚も入れているのに、このデッキには、アメを持ってこられるカードが1枚も入っていません。", "グッズを探せるのはロケット団のラムダのようなカードですが、水のデッキなので当然入っていません。3枚が3枚のままです。", "32%ということは、3回に2回は最初の手札にありません。ケロマツは88%で立つのに、その上に乗せるアメが32%。このデッキの詰まりどころは、ポケモンではなくアメ1枚です。"]}, {"見出し": "４．「偉大な大樹」がその答えかもしれません", "引用": "偉大な大樹 (ACE SPEC / スタジアム)\n  おたがいのプレイヤーは、自分の番ごとに1回、\n  自分の場のたねポケモン1匹から進化する1進化ポケモンを、\n  自分の山札から1枚選び、そのポケモンにのせて進化させてよい。\n  進化したなら、続けて2進化ポケモンを1枚選び、進化させてよい。\n", "本文": ["山札から、2段階、手札を1枚も使わずに進化できます。採用率36.7%。", "アメが32%しか来ないなら、手札を通らない道をもう1本ふやすのは理屈が通っています。しかもゲコガシラも手札に要らなくなるので、実質2枚ぶん手札が浮きます。", "ただしACE SPECなので1枚だけです。 ACE SPECは、同じ名前を4枚まで入れられる決まりの外にあって、デッキに1枚しか入れられないかわりに、1枚で試合が動くくらい強く作られています。", "ここでスタジアムの枠がぶつかります。偉大な大樹が36.7%、なみのりビーチが53.0%で、両方入れているデッキは11%しかありません。きれいに割れています。", "偉大な大樹のよいところは、進化の道が増えること。悪いところは、相手も使えることと、1枚しかないので張り替えられたら終わりなことです。", "なみのりビーチのよいところは、1.8枚入るので張り直せること。そして【ひっさつしゅりけん】はバトル場にいないと使えないので、傷ついた1匹を下げて、元気な1匹で特性を続けられることです。", "進化を早めたいのか、特性を止めたくないのか。結論どっちもどっちです。お好みで。", "もう1つ、気になる数字があります。 ACE SPECをそもそも入れていないデッキが51%もあります。半分です。ほかのデッキではまず見ない数字で、「このデッキの困りごとを解決してくれるACE SPECが無い」ということでもあります。"]}, {"見出し": "５．攻め方は2つ", "引用": "①メガゲッコウガex (HP350・水)\n  【ひっさつしゅりけん】バトル場にいて、手札から「基本水エネルギー」を\n    1枚トラッシュするなら、自分の番に1回使える。\n    相手のポケモン1匹に、ダメカンを6個のせる\n  ニンジャスピナー   水2個 → 120ダメージ\n    のぞむなら、ついている水エネルギーを1個手札にもどし、80ダメージ追加\n\n②ゲッコウガex (HP310・闘)\n  ぶんしんれんだ   水1個+無2個\n    エネルギーを2個トラッシュし、相手のポケモン2匹に、それぞれ120ダメージ\n    ［ベンチは弱点・抵抗力を計算しない］\n", "本文": ["①は1つの番で260ダメージぶん出ます。ニンジャスピナーの200と、【ひっさつしゅりけん】のダメカン6個(60ダメージ)です。", "しかも手札にもどした水エネルギーが、次の番の【ひっさつしゅりけん】のえさになります。実質ただで毎ターン60ダメージを置き続けられます。", "②は相手2匹に120ずつ。ここで大事なのは、ゲッコウガexが闘タイプだということです。バトル場の相手が闘弱点なら120が240になります。", "今の環境で闘弱点は、ニャースexがHP170、キチキギスexがHP210、テラパゴスexがHP230。全部一撃で倒せます。", "ただしベンチのほうは弱点を計算しません。「2匹に240ずつ」ではなく「前に240、うしろに120」です。ここ間違えやすいので注意。"]}, {"見出し": "６．エネルギーの選び方が、そのまま主役の選び方です", "引用": "イグニッションエネルギー  無1個ぶん。進化ポケモンなら 無3個ぶん。番の終わりにトラッシュ\nネオアッパーエネルギー   無1個ぶん。2進化ポケモンなら すべてのタイプのエネルギー2個ぶん\n\nイグニッション 86.7%  /  ネオアッパー 51.2%\nネオアッパーを入れているデッキの イグニッション平均 … 1.5枚\nネオアッパーを入れていないデッキの イグニッション平均 … 2.2枚\n", "本文": ["この2枚は同じ枠を食い合っています。片方を入れると、もう片方が減ります。", "食い合う理由は、払える先がちがうからです。", "ぶんしんれんだは水1個+無2個。イグニッション(無3個ぶん)と水エネルギー1枚で撃てます。", "ニンジャスピナーは水2個。無は水にならないので、イグニッションでは払えません。ネオアッパーなら、2進化についているとき全タイプ2個ぶんになるので、1枚で払えます。", "つまりイグニッションはゲッコウガex用、ネオアッパーはメガゲッコウガex用です。", "エネルギーの枚数を見れば、その人がどちらを主役に見ているかが分かります。さっきの「メガを入れていないデッキが15%」と合わせると、今のこのデッキは、思ったよりゲッコウガex寄りに組まれています。"]}, {"見出し": "７．自由枠──相手を見て入れかえるところ", "引用": "ノコッチ・ノココッチ  41.0%   スボミー 58.4%\nユキワラシ・メガユキメノコex 21.7%   ヨマワル〜ヨノワール 19.3%\n", "本文": ["ここから先は差し替え枠です。相手に多いデッキを見て決めます。", "ノココッチの【にげあしドロー】は、3枚引いて自分ごと山札に帰ります。このデッキの一番の弱点は「ドロンチのように手札を増やしてくれる1進化がいない」ことなので、そこを外から埋める枠です。帰るのでベンチも空きます。一番よく入っている自由枠です。", "スボミーは、次の相手の番にグッズを使えなくします。アメが32%しか来ないデッキなので、相手のアメやボールも止めて「遅いどうし」に持ちこむのは理屈が通っています。", "メガユキメノコexの「うらみぶし」は、相手の手札の枚数×50ダメージです。今はどのデッキもリーリエの決心を4枚入れていて、手札を全部もどして6枚引き直します。つまり相手の手札はしょっちゅう6枚です。 6枚なら300ダメージ。水エネルギー1個で出ます。", "撃つのは、相手が引き直した直後です。相手が手札を使い切った番に撃つと0ダメージなので、そこは我慢します。", "ヨマワルからのヨノワールは、カースドボム(ダメカン13個)です。【ひっさつしゅりけん】のダメカン6個と足すと、殴らずにダメカン19個(190ダメージ)。ただしベンチが3枠うまるので、ノココッチと一緒には入れにくいです。", "私が今組むなら、ノココッチとスボミーを固定して、メガユキメノコexを1匹だけ入れます。理由は次の対面の話につながります。"]}, {"見出し": "８．小ネタ", "本文": ["ミツルの思いやり(23.5%)は、メガシンカexのHPを全部回復したあと、ついているエネルギーが手札にもどります。トラッシュではありません。", "だから、もどったエネルギーをそのまま【ひっさつしゅりけん】のえさにできます。回復しながらダメカン6個を置いているようなもので、地味に得をしています。", "もう1つ。ゲコガシラは平均2.4枚しか入っていません。ふしぎなアメでとばす前提なので、4枚も要らないという判断です。ただし偉大な大樹を使うときは山札から出すので、 0枚にはできません。ここのバランスがこのデッキの組みどころです。"]}], "まとめ": ["3週間で3.9%→7.4%。ただし今週は204件と少ないので、ぶれています", "名前とちがって、確実に入っているのは非メガのゲッコウガexのほう", "詰まっているのはポケモンではなく、ふしぎなアメ1枚 (実質3枚・32%)", "偉大な大樹は、手札を通らない進化の道をもう1本ふやすカード", "イグニッションはゲッコウガex用、ネオアッパーはメガゲッコウガex用", "1つの番に260ダメージ。もどした水エネルギーが次のえさになる"], "しめ": "このデッキは「カードは強いのに手札が続かない」のではありません。ケロマツは88%で立つのに、アメが32%しか来ない。詰まりどころはその一点です。だから足すべきは打点でも回復でもなく、アメを通らない進化の道か、手札を増やす外づけのエンジンか、そもそも相手を遅くする札です。よく入っている自由枠が全部そこに集まっているのは、たぶん偶然ではないと思っています。", "弱点": ["ケロマツはHP60、ゲコガシラはHP90しかありません。育つ前がとても弱いです。", "弱点が2種類あります。メガゲッコウガexは雷×2 で175ダメージ、ゲッコウガexは超×2 で155ダメージ。1つのデッキなのに2方向から刺されます。", "ふしぎなアメが最初の7枚に来るのは32%です。ここが一番のブレどころです。", "メガシンカexは倒されるとサイドを3枚わたします。展開に出したニャースexで1枚、キチキギスexで2枚、最後にメガで3枚。ちょうど6枚で終わってしまいます。", "シェイミの【はなのカーテン】がいると、ベンチの非ルールポケモンはワザのダメージを受けません。ぶんしんれんだが通らなくなります。ただし【ひっさつしゅりけん】のダメカンは置けます。ダメージとダメカンは別のものです。"], "対面": ["タケルライコex(今週1位・9.8%)。HP240で弱点がないので、素で240けずる必要があります。ニンジャスピナー200と【ひっさつしゅりけん】60で260。1つの番で届きます。向こうもきょくらいごうでエネルギー5枚をトラッシュすれば350出るので、先に殴ったほうが勝つ競争になります。1番めからしゅりけんを置いておくこと。", "ドラパルトex。ファントムダイブの200ダメージより、いっしょに置かれるダメカン6個(60ダメージ)のほうが痛いです。ベンチのケロマツ(HP60)がそのまま消えます。ケロマツ4枚は事故を減らすためだけでなく、削られる前提の枚数です。", "ドラパルトexへの詰め方は決まっています。 1番めに【ひっさつしゅりけん】でダメカン6個(60ダメージ)。 2番めにニンジャスピナー200とダメカン6個で260。合わせて320でちょうど倒せます。殴るのは2回でいいので、1番めからしゅりけんを置くのをサボらないこと。", "相手側から見ると、ケロマツとゲコガシラのうちに倒すのが一番効きます。育ってからでは硬いです。グッズを止めるのもよく効きます。"]}, "groups": [{"label": "かならず入っている", "cards": [{"name": "基本水エネルギー", "n": 7, "avg": 6.8, "decks": 41, "total": 41, "img": "ENE/034668_E_KIHONMIZUENERUGI.jpg"}, {"name": "ケロマツ", "n": 4, "avg": 3.9, "decks": 41, "total": 41, "img": "M4/050104_P_KEROMATSU.jpg"}, {"name": "ふしぎなアメ", "n": 3, "avg": 3.0, "decks": 41, "total": 41, "img": "MEM/050462_T_FUSHIGINAAME.jpg"}, {"name": "ゲッコウガex", "n": 2, "avg": 2.4, "decks": 41, "total": 41, "img": "SV5a/045621_P_GEKKOUGAEX.jpg"}, {"name": "ゲコガシラ", "n": 2, "avg": 2.2, "decks": 41, "total": 41, "img": "M4/050105_P_GEKOGASHIRA.jpg"}, {"name": "ボスの指令", "n": 2, "avg": 2.0, "decks": 41, "total": 41, "img": "MEM/050467_T_BOSUNOSHIREI.jpg"}, {"name": "ハイパーボール", "n": 4, "avg": 3.7, "decks": 40, "total": 41, "img": "MEM/050461_T_HAIPABORU.jpg"}, {"name": "リーリエの決心", "n": 4, "avg": 3.4, "decks": ギー2個だけです。", "借りたワザの文は、借りたポケモンではなく、いま使っているポケモンのことを言っている。これが分かると、どのポケモンを山札に入れておくべきかが変わってきます。"]}, {"見出し": "相手によって、借りるものを変える", "引用": "キュレム   トライフロスト   本来はエネルギー5個\n  このポケモンについているエネルギーをすべてトラッシュし、\n  相手のポケモン3匹に、それぞれ110ダメージ (ベンチは弱点・抵抗力を計算しない)\n\nコノヨザル  みちづれファイト   おたがいのバトルポケモンをきぜつさせる\nゼラオラ   サンダーブリッツ   相手のベンチの「ポケモンex」1匹に、210ダメージ\nレイスポス  ファントムビット   相手のポケモン1匹に、ダメカンを12個のせる\nギラティナ  カオスクローラー   120ダメージ、次の相手の番、このポケモンはワザのダメージを受けない\nデスカーン  めいふのおきて    おたがいの特性を持つポケモン全員に、それぞれダメカンを6個のせる\n", "本文": ["キュレムが100%です。トライフロストは本来エネルギー5個のワザで、相手のポケモン3匹に110ダメージずつ入ります。合計330ダメージぶんです。ベンチも巻き込むので、次の番にボスの指令で呼べば一気にサイドを取れます。", "コノヨザルが74%です。みちづれファイトは、おたがいのバトルポケモンがきぜつするワザです。一見すると相打ちですが、ヤドキングは非ルールなので相手が取るサイドは1枚、こちらは相手のポケモンexを倒してサイド2枚、メガシンカexなら3枚です。サイドの取り合いで、確実に得をする交換になります。", "レイスポスのファントムビットはダメカン12個(120ダメージ)です。ダメージではなくダメカンなので、「ワザのダメージを受けない」と書いてあるポケモンにも通ります。", "デスカーンは特性を持つポケモン全員にダメカン6個(60ダメージ)です。特性持ちを何匹も並べるデッキに当たったときだけ入れる枠で、採用率は14%です。", "借りる相手を選べるということは、当たった相手ごとに別のデッキになれるということです。ただし、それは山札の上を作れているあいだだけです。"]}, {"見出し": "使ったエネルギーが、戻ってくる", "引用": "ブーメランエネルギー\n  このカードをつけているポケモンが使うワザの効果で、このカードがトラッシュされたなら、\n  ワザのダメージや効果のあとに、もとのポケモンにつけなおす\n\nワンダーパッチ  自分のトラッシュから基本エネルギーを1枚選び、ベンチのポケモンにつける\nムチュール   るんるんキッス   自分の山札から基本エネルギーを2枚まで選び、\n                          ベンチポケモン1匹につける\n", "本文": ["トライフロストには「このポケモンについているエネルギーをすべてトラッシュし」と書いてあります。撃ったあと、ヤドキングはエネルギー0個になります。そのままでは次の番に何もできません。", "ブーメランエネルギーを69%が入れています。ワザの効果でトラッシュされたとき、そのまま戻ってくるカードです。", "つまりトライフロストを撃っても、ブーメランエネルギーは残ります。大きいワザの代金だけが消えるようにしてあるわけです。", "ワンダーパッチが97%・平均3.0枚、ムチュールが62%入っています。どちらもベンチのポケモンにエネルギーをつけるカードで、次のヤドキングを裏で準備する役です。", "撃ったら壊れるワザを毎ターン撃つために、エネルギーが戻る仕組みが3種類も用意されています。"]}], "まとめ": ["山札の上は作れる──暗号マニアの解読で2ターンぶん予約できる", "借りたワザの「このポケモン」はヤドキングのこと", "鋼エネルギーが無くても、のぞめば300ダメージが出る", "みちづれファイトは、サイド1枚と2枚以上の交換になる", "ブーメランエネルギーで、撃った代金が戻ってくる"], "しめ": "めくり運のデッキに見えて、実は運の部分をほとんど消してあります。そして借りたワザの文を、自分のポケモンのこととして読み直せる人ほど、このデッキから引き出せるダメージが増えます。", "弱点": ["夜のアカデミーを張り替えられると、上を作る手段が減ります。", "ヤドキングはHP120で弱点悪×2 です。60ダメージで倒れます。", "借りたいポケモンがサイドに落ちていると、そのワザは一生使えません。", "にげるが3もあります。ボスの指令で呼び出されると動けません。", "ヤドンか 入っています。", "【アドレナブレイン】には「このポケモンに悪エネルギーがついているなら」と書いてあります。マシマシラは超タイプのポケモンなのに、動かすのに要るのは悪エネルギーです。カードの文をよく読まないと気づけません。", "悪エネルギーは殴るのには1ミリも使いません。それでも100%のデッキが 2枚だけ入れています。ダメカンを3個動かせることに、エネルギー2枚ぶんの価値があるということです。", "【たぎるとうし】はトラッシュから「基本エネルギー」を1枚つけるので、この悪エネルギーも拾い直せます。 2枚しか入っていなくても、使い回せる形になっています。"]}, {"見出し": "相手の特性を、タイプごと消すスタジアム", "引用": "ロケット団の監視塔 (スタジアム)\n  おたがいの場の無ポケモン全員の特性は、すべてなくなる\n", "本文": ["55%が入れています。特性を消すスタジアムですが、消えるのは無タイプだけです。", "このデッキで無タイプなのはニャースexくらいです。ニャースexの特性はベンチに出したときに1回使うものなので、使ったあとに張れば、こちらはほとんど困りません。", "消したい相手ははっきりしています。メガガルーラexの【おつかいダッシュ】、ファイアローexの【エキサイトダイブ】、ノココッチの【にげあしドロー】。どれも無タイプのポケモンの特性です。", "メガレックウザexのデッキは、ほとんどのポケモンが無タイプです。このスタジアム1枚で、相手の動きがまとめて止まります。", "タイプで区切って効くカードは、当たる相手と当たらない相手がはっきり分かれます。どのデッキが多いかを見て入れる枠です。"]}, {"見出し": "そのかわり弱点が増える", "本文": ["ドラパルトexは弱点がありません。ここが最大の強みでした。ところがバシャーモexは弱点水×2 です。160ダメージで倒れます。", "つまり、弱点で崩される道を自分から作っていることになります。水タイプの相手には、バシャーモexだけが狙われます。", "デッキの枠も食います。アチャモとバシャーモexで4枚ぶん使うので、ドロンチやサマヨールに回せる枠が減ります。ふしぎなアメを2.3枚入れて、ワカシャモを1枚に減らしているのは、少しでも枠を空けるためです。"]}], "まとめ": ["エネルギーの悩みが消える──サポートを使わずに毎ターン1枚", "アタッカーが2匹になる── HP320が2種類", "悪エネルギー2枚は、マシマシラを動かすためだけに入っている", "ロケット団の監視塔で、無タイプの特性をまとめて消せる", "弱点ができる──バシャーモexは水×2"], "しめ": "1〜2か月前は9.3%ありましたが、直近2週では5.3%まで減っています。素のドラパルトexのほうが11.3%と多く、いまは「エネルギーを足すより、弱点なしのまま戦ったほうがよい」と考える人が増えているようです。", "弱点": ["バシャーモexの弱点水×2 が唯一のはっきりした穴です。", "バーニングソルトは次のターン使えないので、続けて撃てません。", "ドラパルトexの部分の弱点は、そのまま全部残っています。"], "対面": ["水タイプで攻撃できるなら、バシャーモexだけをねらいます。", "バーニングソルトを撃たれた次のターンが攻め時です。", "ドラパルトex単体のときと同じで、エネルギーのついたドロンチをねらうのが効きます。"]}, "groups": [{"label": "かならず入っている", "cards": [{"name": "なかよしポフィン", "n": 4, "avg": 4.0, "decks": 33, "total": 33, "img": "SV8a/046958_T_NAKAYOSHIPOFUIN.jpg"}, {"name": "リーリエの決心", "n": 4, "avg": 4.0, "decks": 33, "total": 33, "img": "M1L/048443_T_RIRIENOKESSHIN.jpg"}, {"name": "ドラメシヤ", "n": 4, "avg": 4.0, "decks": 33, "total": 33, "img": "SV8a/046936_P_DORAMESHIYA.jpg"}, {"name": "ドロンチ", "n": 4, "avg": 4.0, "decks": 33, "total": 33, "img": "SV8a/046937_P_DORONCHI.jpg"}, {"name": "ハイパーボール", "n": 4, "avg": 3.8 ます。事故率も14.5%で、ドラパルトexの20.1%より低いです。"]}, {"見出し": "ダメージが階段になっている", "引用": "エネルギー4個 → 200ダメージ   何も倒せない (キチキギスexのHP210に10足りない)\nエネルギー5個 → 250ダメージ   HP210〜240を一撃\nエネルギー6個 → 300ダメージ   HP280までを一撃\nエネルギー7個 → 350ダメージ   今の環境のアタッカーを全部一撃\n", "本文": ["エネルギー7個が完成形です。ここまで来ると、今の環境で一撃で倒せない相手がいなくなります。", "逆にエネルギー4個以下では、何も倒せません。この立ち上がりの空白が、このデッキの弱いところです。", "ダメージが50ずつしか上がらないのも大事な性質です。 250ダメージでHP210のポケモンを倒すと、40ダメージぶんが消えてしまいます。ドラパルトexのように、余ったぶんをベンチに回すことができません。無駄が出るのは、このデッキの仕組み上どうしようもありません。", "そのかわり上限がありません。HP320〜350を一撃で倒せるのは、今のところこのデッキだけです。効率は悪いけれど、届く高さと速さで押し切る形です。"]}, {"見出し": "心配なのは、最初の1回目の攻撃", "本文": ["序盤の攻撃が、特性【はしゃのほうこう】が当たるかどうかで決まります。山札の上4枚を見て基本エネルギーを探すので、外れることがあります。外したときの出遅れが痛いです。", "中盤から後はヒビキのホウオウexでエネルギーがどんどん増えるので、ダメージに困ることはなくなります。つまりこのデッキの心配は、最初の1回に集まっています。", "その最初の1回を引き受けるカードが、別に用意されています。"]}, {"見出し": "手札からそのままベンチに出る2進化", "引用": "ファイアローex   HP280   無タイプ   2進化\n【エキサイトダイブ】自分の番に、このカードが手札にあり、\n                自分の場に無タイプの「メガシンカex」がいるなら、1回使える。\n                このカードをベンチに出す\nかぎづめハント   無エネルギー2個 → 150ダメージ\n  のぞむなら、自分の山札から好きなカードを2枚まで選び、手札に加える\n", "本文": ["82%が入れています。2進化ポケモンなのに、たねポケモンから育てません。手札からそのままベンチに出てきます。", "条件は「自分の場に無タイプのメガシンカexがいる」ことです。メガレックウザexは無タイプのメガシンカexなので、そこにいるだけで条件がそろいます。", "つまりこのカードは、無タイプのメガシンカexを使うデッキだけが受け取れる特典です。ほかのデッキに入れても、ただの重い2進化になります。", "HP280のポケモンが1枚から出てきて、エネルギー2個で150ダメージを出しながら山札から2枚持ってこられます。立ち上がりが不安なこのデッキにとって、最初の1回を任せられる相手になっています。"]}, {"見出し": "1つの番に2枚つけられる", "引用": "ヒビキのホウオウex   HP230   炎タイプ\n【こんじきのほのお】自分の番に1回使える。自分の手札から「基本炎エネルギー」を\n                2枚まで選び、ベンチの「ヒビキのポケモン」1匹につける\nシャイニングフェザー   炎エネルギー4個 → 160ダメージ\n  自分のポケモン全員のHPを、それぞれ「50」回復する\n", "本文": ["86%が入れていて、平均2.0枚です。2枚というのが大事です。", "【こんじきのほのお】がつけられる先は「ベンチのヒビキのポケモン」だけです。自分自身にはつけられないので、ベンチにもう1匹ヒビキのホウオウexが要ります。だから2枚なのです。1枚では働きません。", "つけられるのは1つの番に2枚です。手札からのエネルギーづけはふつう1つの番に1回だけなので、この特性だけで3倍近い速さになります。", "そしてつけた先はベンチです。ストームエメラルダは場の炎と雷を全部数えるので、ベンチにたまった炎エネルギーは、そのままダメージになります。", "エネルギー4個で200ダメージのところが、この特性1回で300ダメージまで届きます。立ち上がりの空白を、2番ぶんも縮めていることになります。"]}, {"見出し": "エネルギーが減ると、弱くなる", "引用": "エネルギーつけかえ  自分のポケモンの基本エネルギーを1個、自分の別のポケモンにつけ替える\n                 (91%・平均3.4枚)\nガラスのラッパ     自分の場に「テラスタル」のポケモンがいるときにしか使えない。\n                 自分のベンチの無ポケモンを2匹まで選び、\n                 トラッシュから基本エネルギーを1枚ずつつける (74%)\n", "本文": ["ふつうのデッキは、ポケモンを倒されてもエネルギーさえ残っていれば戦えます。このデッキは違います。エネルギーのついたポケモンを倒されると、そのぶんダメージが50ずつ落ちていきます。", "エネルギーつけかえは、倒されそうなポケモンからエネルギーを逃がすカードです。ガラスのラッパはトラッシュから拾い直すカードです。採用率がこれだけ高いのは、それだけ困るということです。", "ここでガラスのラッパの文を読み直してみます。つけられるのは「ベンチの無ポケモン」だけです。", "このデッキのポケモンを見ると、メガレックウザex、メガガルーラex、ニャースex、ファイアローex、テラパゴスexが無タイプです。ほとんど全員が対象になります。", "たまたま無タイプが多いのではなく、ガラスのラッパが使えるように無タイプでそろえてあると考えたほうが自然です。", "もう1つ条件があります。ガラスのラッパもゼロの大空洞も、自分の場に「テラスタル」のポケモンがいないと働きません。テラパゴスexを60%が入れているのは、その条件をみたす役だからです。"]}], "まとめ": ["速い──たねポケモン。事故率14.5%", "上限が高い──エネルギー7個で350ダメージ。全アタッカーが射程内", "無駄は出る── 50ずつしか上がらず、余りをベンチに回せない", "減ると弱る──エネルギーを失うたびにダメージが50下がる"], "しめ": "ドラパルトexが無駄なく削るデッキだとすれば、こちらは一気に届かせるデッキです。正反対の作りの2つが、同じ環境の上位に並んでいます。", "弱点": ["ベンチを広げるほど、ドラパルトexにダメカンを置かれる相手が増えます。ラティアスexがHP210、キチキギスexがHP210、テラパゴスexがHP230、ヒビキのホウオウexがHP230です。この帯のexが横に並ぶ形は、ファントムダイブとカースドボムが一番効く形でもあります。強くするための行動が、そのまま弱点を広げてしまっています。", "グッズに頼りすぎています。ハイパーボールが98%(平均3.9枚)、ぼうけんのランタンが93%、エネルギーつけかえが91%、ガラスのラッパが74%です。それなのにスボミーは入っていません。ドラパルトexは98%入れています。", "弱点は雷×2 です。今のところ罰されていません。雷タイプのアタッカーはメガライボルトex(HP330)やメガシビルドンex(HP350)がいますが、どちらも上位のデッキに入っていません。眠っている弱点です。環境が雷に傾くと、140ダメージで倒れるようになります。", "HP280は、今のメガシンカの中ではやや低いです。メガルカリオexがHP340、メガゲッコウガexがHP350、メガガルーラexがHP300です。", "メガシンカexは倒されるとサイドを3枚も渡します。だから「展開に使った非ルールで1枚、exで2枚、最後にメガレックウザexで3枚」という順で、ちょうど6枚取られてしまいます。事故を許せる余裕が、ほかのデッキより1ターン短いということです。"], "対面": ["エネルギーのついたベンチをねらいます。1匹倒すごとに、相手のダメージが50下がります。", "グッズを止めるのがよく効きます。相手はスボミーを入れていません。", "弱点は、攻撃するポケモンのタイプで決まります。メガレックウザexは無タイプなので、雷エネルギーを使っていても同じメガレックウザex同士で弱点2倍にはなりません。突けるのは雷タイプだけです。"]}, "groups": [{"label": "かならず入っている", "cards": [{"name": "基本炎エネルギー", "n": 10, "avg": 9.6, "decks": 29, "total": 29, "img": "S12a/042945_E_KIHONHONOOENERUGI.jpg"}, {"name": "基本雷エネルギー", "n": 5, "avg": 4.7, "decks": 29, "total": 29, "img": "S12a/042947_E_KIHONKAMINARIENERUGI.jpg"}, {"name": "ハイパーボール", "n": 4, "avg": 4.0, "decks": 29 だけでなく、ベンチについているエネルギーも全部足されます。", "この特性は「重ならない」と書いてあるので、メガニウムが2匹いても4倍にはなりません。2匹入っているのは、 1匹目を倒されたときに続けられるようにするためです。"]}, {"見出し": "場にエネルギーを置く係が4匹いる", "引用": "オーガポン みどりのめんex 【みどりのまい】自分の番に1回使える。自分の手札から\n                      基本エネルギーを1枚選び、このポケモンにつける。\n                      その後、自分の山札を1枚引く\n\nカミツオロチex 【じゅくせいチャージ】自分の番に1回使える。自分の手札から\n             基本エネルギーを1枚選び、自分のポケモンにつける。\n             その後、つけたポケモンのHPを「30」回復する\n", "本文": ["オーガポンみどりのめんexが100%、平均3.9枚入っています。アタッカーとしてではなく、エネルギーを置く係として4匹並べています。", "【みどりのまい】にも「別のみどりのまいを使っていたなら使えない」という一文がありません。ベンチに4匹いれば、1つの番に4回使えます。", "ふつう、手札からエネルギーをつけられるのは1つの番に1回だけです。この特性はワザではなく特性なので、その決まりの外にあります。手札にエネルギーがあるだけ、場に置けてしまいます。", "つけ先は「このポケモン」なので、オーガポン自身にしかつきません。でもみつあめストームは自分のポケモン全員を数えるので、ベンチにたまっていくエネルギーもそのままダメージになります。", "カミツオロチexの【じゅくせいチャージ】は、つけた相手を30回復します。エネルギーを増やす動きが、そのまま回復にもなっています。 HP330に毎ターン30の回復が乗るので、相手は思ったより削りきれません。"]}, {"見出し": "出したその番に、3段階めまで進化する", "引用": "活力の森 (スタジアム)\n  おたがいのポケモン全員は、出したばかりの番(最初の自分の番をのぞく)でも\n  ポケモンに進化できる\n\nセレビィ   ときをめぐる   自分の山札からポケモンとスタジアムを合計3枚まで選び、\n                    手札に加える\nヒカリ    自分の山札から「たねポケモン」「1進化ポケモン」「2進化ポケモン」を\n        1枚ずつ選び、手札に加える\n", "本文": ["このデッキには2進化が2種類も入っています。カジッチュ→カミッチュ→カミツオロチexと、チコリータ→ベイリーフ→メガニウムです。ふつうに育てると、そろうのは4ターン目や5ターン目になります。", "活力の森が100%、平均3.3枚入っています。出したばかりのポケモンでもその番に進化できるスタジアムです。", "これがあると、カジッチュを出した番のうちにカミツオロチexまで進化できます。 2進化のデッキが2つ入っていても間に合うのは、このカードのおかげです。", "ヒカリが91%です。1枚でたね・1進化・2進化がそろうので、活力の森と合わせれば、1つの番で1本の線が完成します。", "セレビィが86%です。草ポケモンとスタジアムを合計3枚持ってこられるので、進化の材料と活力の森を同時に探せます。", "おたがいに効くスタジアムなので、相手にも進化を許してしまいます。それでも入れているのは、得をする量がこちらのほうが大きいからです。"]}], "まとめ": ["メガニウムでエネルギーが2個ぶんに数えられる", "オーガポンを4匹並べて、1つの番に何枚もエネルギーを置く", "数えるのは場のエネルギー全部──ベンチのぶんもダメージになる", "活力の森で、2進化が2種類あっても間に合う", "つけながら30回復するので、削り合いに強い"], "しめ": "メガレックウザexが一気に届かせるデッキだとすれば、こちらは数え方そのものを2倍に変えてしまうデッキです。同じ「エネルギーの数だけ強い」でも、作り方がまったく違います。", "弱点": ["弱点は炎×2 です。165ダメージで倒れます。", "メガニウムを倒されると、数える数が半分に戻ります。カミツオロチexより先に、こちらを狙われるのが一番つらいです。", "活力の森を張り替えられると、進化が1ターン以上遅れます。", "カジッチュはHP40、チコリータはHP70しかありません。出したばかりの番に倒されると育ちません。"], "対面": ["炎タイプで攻撃できるなら、HP330も165ダメージで倒せます。", "ベンチの ン全員のにげるためのエネルギーは、すべてなくなる\n\nエネルギーつけかえ  自分のポケモンの基本エネルギーを1個、自分の別のポケモンにつけ替える\nNの筋書き          自分のベンチポケモンについているエネルギーを2個まで選び、\n                 バトルポケモンにつけ替える\n", "本文": ["ラティアスexが100%入っています。たねポケモン全員のにげるエネルギーが 0になるので、毎ターンただで前のポケモンを替えられます。アタッカーが全員たねポケモンなので、全員が対象です。", "相手に合うアタッカーがベンチにいても、入れ替えに手間がかかるなら間に合いません。スカイラインはその手間を消しています。", "残るのは「そのアタッカーにエネルギーがついていない」という問題です。そこでエネルギーつけかえが100%・平均3.9枚、Nの筋書きが79%です。", "この3つがそろって、初めて「相手に合わせて出す」ができます。色が合う、入れ替えられる、エネルギーが移せる。どれか1つ欠けても、ベンチのアタッカーは飾りになってしまいます。"]}, {"見出し": "相手ごとに専用の1匹がいる", "引用": "ファイヤー       とうしのつばさ  20＋ 相手のバトルポケモンが「ポケモンex」なら90追加\nパルデア ケンタロス きあいタックル  90＋ 相手のバトルポケモンが1進化ポケモンなら90追加\nイーユイ        グラウンドメルト 60＋ 場にスタジアムが出ているなら60追加、そのスタジアムをトラッシュ\nパオジアン    【ゆきにしずめる】手札からベンチに出したとき、場のスタジアムをトラッシュする\n", "本文": ["ファイヤーはHP120の非ルールで、炎エネルギー1個で110ダメージを出します。ただし相手がポケモンexのときだけです。今はexだらけなので、ほぼ毎回110ダメージです。", "パルデアケンタロスは相手が1進化のときに180ダメージです。メガルカリオexもメガドリュウズexも1進化なので、ここに当たります。", "イーユイとパオジアンは、どちらもスタジアムをトラッシュするカードです。おまつりおんどのお祭り会場、ヤドキングの夜のアカデミー、カミツオロチexの活力の森は、どれも1枚外れると動きが止まります。そこを狙って用意された枠です。", "どれも採用率は20%から40%くらいです。全員が入れているわけではありません。大会でどのデッキが多いかを見て、その日に効く1匹を選んで入れる枠です。"]}, {"見出し": "ベンチ8匹の本当の意味", "引用": "ゼロの大空洞 (スタジアム)\n  自分の場に「テラスタル」のポケモンがいるプレイヤーが、\n  ベンチに出せるポケモンの数は8匹になる\n\nリーリエのピッピex   HP190  超タイプ\n【フェアリーゾーン】このポケモンがいるかぎり、相手の場の竜ポケモン全員の弱点は、\n                すべて超タイプになる (弱点は「×2」で計算する)\nフルムーンロンド   超エネルギー1個+無エネルギー1個 → 20ダメージ +\n                おたがいのベンチポケモンの数 × 20ダメージ\n", "本文": ["ゼロの大空洞は100%です。ベンチが8匹になるので、アタッカーを何種類も置いておけます。ここまでは分かりやすい話です。", "もう1つ意味があります。フルムーンロンドは「おたがいのベンチポケモンの数×20ダメージ」です。自分のベンチ8匹と相手のベンチ5匹で13匹なら、20＋260で280ダメージになります。", "そしてリーリエのピッピexは超タイプです。自分の特性で相手を超弱点にして、自分でそこを突く形になっています。280ダメージが2倍で560ダメージです。", "つまりゼロの大空洞は、置ける場所を増やすカードであると同時に、ベンチ1匹あたり40ダメージを足すカードでもあります。", "ただし特性の文をよく読むと、弱点が変わるのは「竜ポケモン」だけです。場の全員ではありません。", "それでも99%が入れているのは、竜タイプに今の環境の中心がいるからです。ドラパルトexは竜タイプで弱点がありませんが、これがあると弱点超×2 になり、 HP320が160ダメージで倒れます。タケルライコexも竜タイプです。", "あるデッキを止めるために作られたカードを、メタカードといいます。リーリエのピッピexは、ドラゴンだけを狙い撃ちにしたメタカードです。"]}], "まとめ": ["アタッカーが全員たねポケモン──だからプリズムエネルギーが全員に使える", "ラティアスexで入れ替えがただになる", "エネルギーつけかえとNの筋書きで、エネルギーが後から追いつく", "ゼロの大空洞は、置き場所であり、ダメージでもある", "リーリエのピッピexで、竜タイプの相手に弱点を作る"], "しめ": "1匹の強さで勝つデッキではありません。色・入れ替え・エネルギーの移動という3つの土台があって、その上に相手ごとの1匹を乗せていくデッキです。", "弱点": ["アタッカーの多くがポケモンexです。倒されるとサイドを2枚渡します。非ルールで戦ってくる相手には、サイドの進み方で不利になります。", "ベンチを8匹に広げるので、ドラパルトexがダメカンを置く相手が増えます。", "ゼロの大空洞は、テラスタルのポケモンが場からいなくなるとベンチが5匹に戻ります。オーガポンを先に倒されると、ベンチが縮んでダメージも下がります。", "オーガポンみどりのめんexの弱点炎×2 が、エネルギーを増やす役でもあります。ここを先に倒されると回らなくなります。"], "対面": ["こちらが竜タイプのデッキなら、リーリエのピッピexがいるあいだ弱点超×2 になります。まずこれを倒すか、超タイプが出てくる前に決めます。竜タイプがいないデッキなら、この特性は何も起きません。", "テラスタルのポケモンを倒すとベンチが5匹に戻ります。ベンチが減れば、フルムーンロンドのダメージも下がります。", "非ルールのポケモンで殴り合うと、サイドの進み方で勝てます。"]}, "groups": [{"label": "かならず入っている", "cards": [{"name": "基本草エネルギー", "n": 10, "avg": 8.9, "decks": 28, "total": 28, "img": "S12a/042944_E_KIHONKUSAENERUGI.jpg"}, {"name": "ハイパーボール", "n": 4, "avg": 4.0, "decks": 28, "total": 28, "img": "M6a/050742_T_HAIPABORU.jpg"}, {"name": "エネルギーつけかえ", "n": 4, "avg": 4.0, "decks": 28, "total": 28, "img": "L1-Bhg/025117_T_ENERUGITSUKEKAE.jpg"}, {"name": "オーガポン みどりのめんex", "n": 4, "avg": 3.4, "decks": 28, "total": 28, "img": "MC/048798_P_OGAPONMIDORINOMENEX.jpg"}, {"name": "ゼロの大空洞", "n": 3, "avg": 3.0, "decks": 28, "total": 28, "img": "SV8a/046989_T_ZERONODAIKUUDOU.jpg"}, {"name": "ボスの指令", "n": 3, "avg": 2.9, "decks": 28, "total": 28, "img": "SV1a/043300_T_BOSUNOSHIREIGECHISU.jpg"}, {"name": "メガガルーラex", "n": 2, "avg": 2.4, "decks": 28, "total": 28, "img": "M1S/048466_P_MGARURAEX.jpg"}, {"name": "ニャースex", "n": 2, "avg": 2.1, "decks": 28, "total": 28, "img": "M3/050067_P_NIXYASUEX.jpg"}, {"name": "ラティアスex", "n": 2, "avg": 2.0, "decks": 28, "total": 28, "img": "SV7a/046324_P_RATEIASUEX.jpg"}, {"name": "リーリエのピッピex", "n": 2, "avg": 2.0, "decks": 28, "total": 28, "img": "SV9/047235_P_RIRIENOPIPPIEX.jpg"}, {"name": "オーガポン いどのめんex", "n": 1, "avg": 1.0, "decks": 28, "total": 28, "img": "MC/048940_P_OGAPONIDONOMENEX.jpg"}, {"name": "キチキギスex", "n": 1, "avg": 1.0, "decks": 28, "total": 28, "img": "M2a/050004_P_KICHIKIGISUEX.jpg"}, { のエネルギーは、基本草8.3枚・基本闘3.1枚・基本雷3.0枚の3色です。ふつう、色を増やすと必要な色が来ない事故が増えます。", "ところがアカマツの文には「それぞれちがうタイプの」と書いてあります。 2色以上入っていないと、そもそも2枚選べません。つまり3色なのは事故のもとではなく、アカマツを働かせるための形です。", "色の役割もはっきり分かれています。きょくらいごうを撃つのに要るのは雷1個と闘1個だけです。だから雷と闘は3枚ずつで足ります。", "草が8.3枚も入っているのは、オーガポンみどりのめんexの【みどりのまい】が「基本草エネルギー」しかつけられないからです。毎ターン確実に1枚つけるために、草だけ厚くしてあります。", "ラティアスexを95%が入れています。たねポケモンのにげるが0になります。タケルライコexはにげるが3のたねポケモンなので、これが無いと動けません。"]}], "まとめ": ["上限がない── 5枚捨てて350ダメージ", "数えるのは場全体──ベンチのエネルギーもダメージになる", "メガガルーラexは、たまを置いておく場所", "3色なのはアカマツを働かせるため", "弱点がない──半分のダメージで倒される抜け道がない", "事故に強い──手札を全部捨てて引き直せる"], "しめ": "1〜2か月前は2.8%でしたが、直近1週では7.2%まで増えています。上限の高さと事故への強さが、メガレックウザexの登場で速くなった環境に合ってきたのだと思います。", "弱点": ["大きく殴った次の番は、捨てたぶん場のエネルギーが減っています。ダメージが落ちます。", "毎ターン並べ直す必要があるので、エネルギーを引けないと止まります。", "オーガポンみどりのめんexの弱点は炎×2 です。エンジン役をここで折られると回らなくなります。", "非ルールのポケモンで攻撃してくる相手に弱いです。 1ターンに1匹しか倒せないので、相手が非ルールばかりだとサイド6枚とるのに6ターンかかります。一方こちらのexは倒されるとサイド2枚渡すので、相手は3ターンで終わります。殴り合った回数は同じなのに、進み方が倍ちがいます。"], "対面": ["大きく殴られた次の番が攻め時です。相手のダメージが一番低い瞬間です。", "オーガポンみどりのめんexを先に倒すと、エネルギーの補充が止まります。", "ベンチのメガガルーラexにエネルギーがたまっていたら、それはたまです。ボスの指令で呼び出して倒すと、たまごと持っていけます。", "こちらもスタジアムを出しておくと、ゼロの大空洞を押しのけられます。ベンチが5匹に戻れば、置ける場所も減ります。"]}, "groups": [{"label": "かならず入っている", "cards": [{"name": "基本闘エネルギー", "n": 2, "avg": 3.1, "decks": 26, "total": 26, "img": "M-P/050482_E_KIHONTOUENERUGI.jpg"}, {"name": "基本雷エネルギー", "n": 2, "avg": 2.7, "decks": 26, "total": 26, "img": "M-P/050480_E_KIHONKAMINARIENERUGI.jpg"}, {"name": "タケルライコex", "n": 2, "avg": 1.8, "decks": 26, "total": 26, "img": "MC/049270_P_TAKERURAIKOEX.jpg"}, {"name": "基本草エネルギー", "n": 7, "avg": 7.5, "decks": 25, "total": 26, "img": "ENE/047903_E_KIHONKUSAENERUGI.jpg"}, {"name": "ハイパーボール", "n": 4, "avg": 4.0, "decks": 25, "total": 26, "img": "M-P/049600_T_HAIPABORU.jpg"}, {"name": "アカマツ", "n": 4, "avg": 3.7, "decks": 25, "total": 26, "img": "SV7/046171_T_AKAMATSU.jpg"}, {"name": "エネルギーつけかえ", "n": 4, "avg": 3.4, "decks": 25, "total": 26, "img": "L1-Bhg/025117_T_ENERUGITSUKEKAE.jpg"}, {"name": "オーガポン みどりのめんex", "n": 3, "avg": に勝つためです。相手が別のスタジアムを出したら、こちらもすぐ張り直します。"]}, {"見出し": "逃げられるHP40", "引用": "ケーシィ 【テレポーター】このポケモンがバトル場にいるなら、自分の番に1回使える。\n        このポケモンと、ついているすべてのカードを、自分の山札にもどして切る\nノココッチ【にげあしドロー】自分の番に1回使える。自分の山札を3枚引く。その後、\n        このポケモンと、ついているすべてのカードを、山札にもどして切る\n", "本文": ["ボスの指令でケーシィを呼び出されると、ふつうはそこで1匹取られます。", "ところがケーシィは、バトル場にいるとき自分ごと山札にもどれます。サイドを渡さずに逃げられるということです。呼び出された意味が消えます。", "ノココッチも同じ形です。3枚引いてから山札にもどるので、ベンチに残って狙われることがありません。96%が入れています。", "弱いポケモンを場に置かずに済ませる、という考え方でそろえられています。"]}, {"見出し": "相手のカードを減らして、時間を作る", "引用": "ビワ       相手の手札を見て、その中からグッズを2枚まで選び、トラッシュする\n改造ハンマー  相手の場のポケモンについている特殊エネルギーを、1個トラッシュする\nヒカリ      自分の山札から「たねポケモン」「1進化ポケモン」「2進化ポケモン」を\n          1枚ずつ選び、手札に加える\n", "本文": ["ヒカリが99%、平均3.4枚です。1枚でケーシィ・ユンゲラー・フーディンの 3枚がそろいます。育てるのに一番大事なカードなので、3枚以上入っています。", "ビワと改造ハンマーは、相手を遅らせるカードです。 2進化が育つまでの1〜2ターンを買うために入っています。", "改造ハンマーには考えどころがあります。相手のエネルギーを減らすと、サイコキネシスのダメージも50下がります。それでも入れるのは、特殊エネルギーが無いと動けないデッキがあるからです。 50ダメージを捨てて、相手の攻撃を1ターン止めるほうが得な場面があります。", "どちらを取るかを自分で決める。こういうカードが入っているデッキは、使う人の判断で強さが変わります。"]}], "まとめ": ["相手のエネルギー1個につき50ダメージ", "バトルコロシアムで、ベンチにダメカンをのせられなくなる", "ケーシィもノココッチも、狙われる前に山札へ逃げられる", "ヒカリ1枚で進化の3枚がそろう"], "しめ": "相手の強みをそのまま弱点に変えるデッキです。ただし自分のポケモンは細いので、ベンチを守るスタジアムが無いと、育つ前に終わってしまいます。", "弱点": ["相手がエネルギーをあまりつけないデッキだと、ダメージが出ません。ドラパルトexはエネルギー2個で戦うので、サイコキネシスは110ダメージにしかなりません。", "フーディンはHP140、ケーシィはHP40です。弱点は悪×2 なので、フーディンでも70ダメージで倒れます。", "2進化なので、育つまでに時間がかかります。", "バトルコロシアムを張り替えられると、ベンチが守れなくなります。"], "対面": ["エネルギーをバトル場に集めないようにします。ベンチに分けてつければダメージが下がります。", "悪タイプならフーディンを70ダメージで倒せます。", "スタジアムを張り替えてから、ベンチのケーシィを攻めます。", "ワザのダメージはバトルコロシアムでも防げません。ベンチを直接殴れるワザは通ります。"]}, "groups": [{"label": "かならず入っている", "cards": [{"name": "なかよしポフィン", "n": 4, "avg": 4.0, "decks": 24, "total": 24, "img": "SV8a/046958_T_NAKAYOSHIPOFUIN.jpg"}, {"name": "ケーシィ", "n": 4, "avg": 4.0, "decks": 24, "total": 24, "img": "M1S/047832_P_KESHII.jpg"}, {"name": "ポケパッド", "n": 4, "avg": 4.0, "decks": 24, "total": 24, "img": "MC/049573_T_POKEPADDO.jpg"}, {"name": "ユンゲラー", "n": 4, "avg": 4.0, "decks": 24, "total": 24, "img": "M1S/047833_P_YUNGERA.jpg" .0, "decks": 2, "total": 24, "img": "MC/049025_P_SAMAYORU.jpg"}, {"name": "ネオアッパーエネルギー", "n": 1, "avg": 1.0, "decks": 2, "total": 24, "img": "SV5K/045217_E_NEOAPPAENERUGI.jpg"}, {"name": "ヨノワール", "n": 1, "avg": 1.0, "decks": 2, "total": 24, "img": "MC/049026_P_YONOWARU.jpg"}, {"name": "シガロコ", "n": 2, "avg": 2.0, "decks": 1, "total": 24, "img": "SV8a/046859_P_SHIGAROKO.jpg"}]}], "variants": [{"cards": ["ふうせん", "ゲノセクト"], "decks": 7, "share": 0.29}, {"cards": ["スペシャルレッドカード"], "decks": 7, "share": 0.29}, {"cards": ["ふうせん", "ゲノセクト", "スペシャルレッドカード"], "decks": 4, "share": 0.17}, {"cards": [], "decks": 4, "share": 0.17}], "other": 2}, "メガドリュウズex": {"name": "メガドリュウズex", "decks": 23, "odds": [{"card": "プレシャスキャリー", "why": "1番めにベンチを5匹そろえる", "copies": 1, "effective": 7, "decks": 21, "p_plain": 13, "p_reach": 65, "draws": 8, "how": ["ロケット団のラムダ 4枚→プレシャスキャリー", "ロケット団のレシーバー 2枚→ロケット団のラムダ→プレシャスキャリー", "プレシャスキャリー 1枚"]}, {"card": "ゲノセクトex", "why": "進化ポケモンを2枚持ってくる", "copies": 2, "effective": 10, "decks": 22, "p_plain": 25, "p_reach": 79, "draws": 8, "how": ["ロケット団のラムダ 4枚→ハイパーボール→ゲノセクトex", "ゲノセクトex 2枚", "タケシのスカウト 1枚→ゲノセクトex", "ハイパーボール 1枚→ゲノセクトex", "プレシャスキャリー 1枚→ゲノセクトex"]}], "note": {"結論": "330ダメージを毎ターン撃ち続けられます。そのためにデッキの4枚に1枚がエネルギーで、さらにエネルギーを山札とトラッシュの間で行き来させています。", "節": [{"見出し": "エネルギー5個が条件", "引用": "メガドリュウズex   HP340   鋼タイプ   弱点 炎×2   にげる4\n\nマキシマムドリル   鋼エネルギー3個 → 200ダメージ +\n  このワザを使うためのエネルギーより2個多くエネルギーがついているなら、\n  130ダメージ追加 (合計330ダメージ)\n", "本文": ["条件は「ワザに必要な3個より2個多い」なので、エネルギー5個です。 1匹に5個も集めるのは、ふつうなら何ターンもかかります。", "そのかわり、撃ってもエネルギーをトラッシュしません。一度5個そろえば、そのまま330ダメージを毎ターン撃ち続けられます。", "タケルライコexは殴るたびにエネルギーを捨てるので毎ターン並べ直しですが、こちらは並べ直しが要りません。時間をかけた見返りがここにあります。"]}, {"見出し": "デッキの4枚に1枚がエネルギー", "引用": "メタング 【メタルメーカー】自分の番に1回使える。自分の山札を上から4枚見て、\n        その中から基本エネルギーを好きなだけ選び、自分のポケモンに好きなようにつける。\n        残りのカードはすべてウラにして切り、山札の下にもどす\n", "本文": ["このデッキは基本鋼エネルギーを平均15.6枚入れています。 60枚のうち約26%、4枚に1枚がエネルギーという計算です。ふつうのデッキは8枚から10枚くらいなので、かなり多い部類です。", "多い理由は【メタルメーカー】にあります。山札の上4枚を見て、その中にあるエネルギーを場につけるので、山札にエネルギーが濃く入っているほど、当たる数が増えます。", "26%なら、上4枚に1枚もエネルギーが無い確率はおよそ30%です。逆に言えば7割の確率で1枚以上あり、平均すると1枚ちょっと当たります。", "メタングは平均4.0枚、ダンバルも平均4.0枚入っています。ベンチにメタングを3匹並べれば、【メタルメーカー】が1つの番に3回使えます。手札からつける1個と合わせて、2ターンで5個に届きます。", "つまりこのデッキのエネルギー15.6枚は、手札につけるためではなく、山札の上4枚に当てるための枚数です。", "終盤になると、この作りが裏目に出ます。エネルギーはどんどん場に出ていくので、山札に残るエネルギーが減り、【メタルメーカー】が当たらなくなります。", "そこでエネルギーリサイクルを94%が入れています。トラッシュの基本エネルギーを5枚まとめて山札にもどすカードです。 5枚というのは、メガドリュウズex1匹ぶんとちょうど同じ数です。", "メガドリュウズexが倒されると、ついていたエネルギー5個はトラッシュに行きます。それを山札にもどして、また【メタルメーカー】で拾い直す。エネルギーが場とトラッシュと山札をぐるぐる回るようにできています。"]}, {"見出し": "1枚しか入れられないカード", "引用": "プレシャスキャリー (ACE SPEC)\n  自分の山札からたねポケモンを好きなだけ選び、ベンチに出す。そして山札を切る\n", "本文": ["同じ名前のカードは、ふつうデッキに4枚まで入れられます (エネルギーは別です)。でもカードのすみに「ACE SPEC」と書いてあるものは、デッキに1枚までしか入れられません。", "そのかわり、1枚で試合が動くくらい強く作られています。プレシャスキャリーもその1枚です。たねポケモンを好きなだけ、山札からベンチに出せます。ベンチは5匹までなので、1枚で5匹まとめて並ぶということです。", "ACE SPECは1枚までなので、デッキはその1枚に何を選ぶかを決めます。そして何を選んだかを見ると、そのデッキが何に困っているかが分かります。ドラパルトexは81%がアンフェアスタンプ、おまつりおんどは85%がシークレットボックス、ヤドキングは50%がプライムキャッチャーです。", "メガドリュウズexは85%がプレシャスキャリーを選びました。つまりこのデッキが一番ほしいのは、ダメージでも回復でもなく、「1番めに盤面がそろうこと」だということです。"]}, {"見出し": "1枚のカードを、実質13枚にする", "引用": "ロケット団のラムダ (サポート)   自分の山札からトレーナーズを1枚選び、手札に加える\nロケット団のレシーバー (グッズ)  自分の山札から、名前に「ロケット団」とつく\n                           サポートを1枚選び、手札に加える\nニャースex 【おくのてキャッチ】このカードを手札からベンチに出したとき、\n                        自分の山札からサポートを1枚選び、手札に加える\nハイパーボール (グッズ)       自分の山札からポケモンを1枚選び、手札に加える\n", "本文": ["ここが、このデッキで一番おもしろいところです。", "プレシャスキャリーは1枚しか入れられません。 60枚の山札から最初の8枚を引いたとき、その1枚が入っている確率は13%です。 8回に1回くらいしか来ません。それでは作戦になりません。", "ところが実際はちがいます。ロケット団のラムダはトレーナーズなら何でも持ってこられるので、ラムダを引けばプレシャスキャリーが手に入ります。ラムダは4枚入っています。", "ロケット団のレシーバーを引けば、ラムダが手に入ります。これも4枚です。", "ニャースexを引けば、ベンチに出したときの特性でラムダが手に入ります。", "ハイパーボールを引けば、ニャースexが手に入ります。", "つまり「プレシャスキャリーになれるカード」は、プレシャスキャリー1枚だけではありません。実際の優勝デッキを数えると、まん中あたりの形で9枚、一番多い形では13枚ありました。", "最初の8枚で引ける確率は、9枚なら75%、13枚なら87%です。 13%が75%や87%になります。", "これがポケモンカードの本当の数え方です。「何枚入れたか」ではなく「何枚が、そのカードになれるか」で考えます。上に出ている「1番めに引けるかな？」の数字も、この数え方で出しています。"]}, {"見出し": "だからじゃんけんに勝ったら後攻を選ぶ", "本文": ["先攻の1番めは、サポートが使えない決まりです。ロケット団のラムダはサポートなので、先攻だと1番めに使えません。", "ラムダが使えないと、レシーバーもニャースexもラムダにつながらないので意味がなくなります。さっきの実質9枚や13枚が、いきなり1枚に戻ります。確率も75%から12%まで落ちます。", "後攻なら1番めからサポートが使えます。そのうえ後攻は最初に1枚多く引けるので、見られるカードは8枚です。", "だからこのデッキは、じゃんけんに勝ったら後攻を選びます。先に殴れることより、1番めに盤面をそろえることのほうが大事だからです。", "どちらを選ぶかはデッキによって変わります。自分のデッキが1番めに何をしたいのかで決まります。"]}, {"見出し": "モグリューのワザは保険", "引用": "モグリュー (M5 044/081)   HP70   闘タイプ\nなかまをよぶ   無エネルギー1個\n  自分の山札からたねポケモンを2枚まで選び、ベンチに出す。そして山札を切る\n", "本文": ["モグリューは100%、平均2.9枚入っています。メガドリュウズexはモグリューから進化するので、入っているのは当たり前です。", "ただ、モグリューという名前のカードは何種類も出ていて、ワザも特性もそれぞれちがいます。調べてみると、178デッキの全部が同じ1枚を使っていました。メガドリュウズexと同じ弾に入っている、M5の044番です。", "選ばれている理由は「なかまをよぶ」です。エネルギー1個で、山札からたねポケモンを2枚ベンチに出せます。", "ただしこれは、プレシャスキャリーにたどりつけなかったときの保険です。ワザなので、撃つには1つの番をまるごと使います。プレシャスキャリーなら1番めに5匹並ぶところを、こちらは2匹ずつしか並びません。", "それでも入れておく意味はあります。 13%を87%にしても、10回に1回は失敗するからです。失敗した番に何もできないデッキと、2匹並べられるデッキでは、立て直せるかどうかが変わります。", "おまけもあります。なかまをよぶのためにモグリューにつけたエネルギーは、進化しても場に残ります。そのままメガドリュウズexのエネルギー5個の1個めになります。"]}, {"見出し": "1枚で何枚ぶん動くか", "本文": ["終盤になると、山札は薄くなります。薄いほうが、ほしいカードを引く確率は上がります。 30枚の山札から4枚のカードを引くほうが、 60枚から引くよりずっと当たりやすいからです。", "だから強いデッキは、序盤にわざと山札を減らします。", "ここで「1枚で何枚ぶん動くか」が効いてきます。プレシャスキャリー1枚で山札が5枚減ります。なかよしポフィン1枚なら2枚減ります。ふつうのカードは1枚で1枚です。", "山札が減れば、残りの山札は「まだ使っていない、必要なカード」の割合が上がっていきます。よく回るデッキというのは、こうやって後半になるほど当たりが濃くなるデッキのことです。"]}, {"見出し": "相手のHPを30下げる", "引用": "グラビティーマウンテン (スタジアム)\n  おたがいの場の2進化ポケモン全員の最大HPは、それぞれ「-30」される\n", "本文": ["72%が入れています。おたがいの2進化ポケモンのHPが30下がるスタジアムです。", "メガドリュウズexは1進化なので、自分は影響を受けません。片側だけが得をする形になっています。", "効く相手を並べると理由が分かります。ドラパルトexは2進化でHP320、メガゲッコウガexは2進化でHP350、メガリザードンexとメガサーナイトexは2進化でHP360です。 30下がると、それぞれHP290・HP320・HP330になります。", "マキシマムドリルは330ダメージなので、ここまで下がれば全部一撃で倒せます。このスタジアムは、HP350や360の相手を射程に入れるためのカードです。", "一方でメガルカリオexは1進化のHP340です。スタジアムが効かないので、 330ダメージでは10だけ足りません。HP340とHP330の差がそのまま出ます。", "カードのHPが10違うだけで倒せるかどうかが変わる。ポケモンカードの数字は、そこまで細かく決められています。"]}, {"見出し": "好きなトレーナーズを毎ターン持ってくる", "引用": "ロケット団のラムダ    自分の山札からトレーナーズを1枚選び、手札に加える\nロケット団のレシーバー  自分の山札から、名前に「ロケット団」とつくサポートを1枚選び、\n                   手札に加える\n", "本文": ["ロケット団のラムダが99%・平均3.9枚、ロケット団のレシーバーが95%・平均3.8枚入っています。合わせて8枚近くです。", "ラムダはトレーナーズなら何でも持ってこられます。レシーバーはそのラムダを持ってこられます。", "つまりこの8枚は、全部が「好きなカード1枚」に化けます。エネルギーを大量に積んで手札が偏りやすいデッキなので、どこから引いても必要なカードにたどり着けるようにしてあります。"]}], "まとめ": ["エネルギー5個で330ダメージ、撃ってもエネルギーは減らない", "エネルギー15.6枚は、メタルメーカーを当てるための枚数", "ACE SPECの1枚にプレシャスキャリーを選んでいる", "実質9枚から13枚にして、1番めに75%から87%でたどりつく", "じゃんけんに勝ったら後攻を選ぶ──先攻はサポートが使えないから", "グラビティーマウンテンで、HP350や360の相手を330の射程に入れる", "ロケット団の8枚が、全部「好きなカード」になる"], "しめ": "準備に時間がかかるかわり、そろってからは毎ターン同じ330ダメージが出ます。そして相手のHPを30下げるカードまで入れて、 330で届く相手を自分から増やしにいっています。", "弱点": ["弱点は炎×2 です。170ダメージで倒れます。HP340が実質HP170になってしまいます。", "にげるが4もあります。エネルギーがそろう前にボスの指令で呼び出されると、前に立ったまま何もできません。", "メガシンカexなので、倒されるとサイドを3枚渡します。", "エネルギー5個をつけるまでに時間がかかります。育つ前が一番弱いです。", "モグリューは弱点草×2 です。スボミーの10ダメージが20ダメージになります。"], "対面": ["炎タイプで攻撃できるなら、HP340も170ダメージで倒せます。", "ダンバル(HP70)やモグリュー(HP70)のうちに倒すと育ちません。", "育ちきる前に攻めるのが基本です。育ってからでは止まりません。", "HP340以上で、しかも1進化か、たねポケモンで前に立つと、330ダメージで倒されません。"]}, "groups": [{"label": "かならず入っている", "cards": [{"name": "基本鋼エネルギー", "n": 16, "avg": 16.2, "decks": 23, "total": 23, "img": "ENE/046123_E_KIHONHAGANEENERUGI.jpg"}, {"name": "ダンバル", "n": 4, "avg": 4.0, "decks": 23, "total": 23, "img": "MC/049212_P_DANBARU.jpg"}, {"name": "メタング", "n": 4, "avg": 4.0, "decks": 23, "total": 23, "img": "SV5M/045264_P_METANGU.jpg"}, {"name": "モグリュー", "n": 3, "avg": 2.6, "decks": 23, "total": 23, "img": "M5/050263_P_MOGURIXYU.jpg"}, {"name": "メガドリュウズex", "n": 2, "avg": 2.0, "decks": 23, "total": 23, "img": "M5/050282_P_MDORIXYUUZUEX.jpg"}, {"name": "ロケット団のラムダ", "n": 4, "avg": 3.9, "decks": 22, "total": 23, "img": "MC/049450_T_ROKETTODANNORAMUDA.jpg"}, {"name": "なかよしポフィン", "n": 4, "avg": 2.8, "decks": 22, "total": 23, "img": "MC/049570_T_NAKAYOSHIPOFUIN.jpg"}, {"name": "ボスの指令", "n": 3, "avg": 2.6, "decks": 22, "total": 23, "img": "S8b/040307_T_BOSUNOSHIREIFURADARI.jpg"}, {"name": "ゲノセクトex", "n": 2, "avg": 2.0, "decks": 22, "total": 23, "img": "MC/049546_P_GENOSEKUTOEX.jpg"}, {"name": "ポケギア3.0", "n": 3, "avg": 2.7, "decks": 21, "total": 23, "img": "MC/049376_T_POKEGIA30.jpg"}, {"name function thumbFail(img){

  img.replaceWith(box);

function cardLineHtml(c){

    : '<span class="thumb"></span>';

  var meta = pct + "%";
  if (known && known.decks > c.decks){

  }

function usedByHtml(name){
  var d = DATA.cardDecks[name];
  if (!d) return "";
  var items = d.top.map(function(pair){
    // pair = [デッキ名, このカードを入れていた件数, そのデッキの全件数]
    var pct = pair[2] ? Math.round(pair[1] / pair[2] * 100) + "%" : "";
    return "<li>" + esc(pair[0]) + "　" + pair[1] + "個" +
      (pct ? '<span style="color:var(--muted)">　' + pct + "</span>" : "") + "</li>";
  }).join("");
