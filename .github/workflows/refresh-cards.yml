name: Refresh card text

# カードの効果文を取り直す。
#
# エネルギーやタイプのマークは絵で書かれているので、読み取り方を直す前に
# 取ったカードは、マークの場所が空白のまま残っている。
#   「自分のベンチの ポケモン」← 本当は「自分のベンチの[悪]ポケモン」
# この状態だと、どのタイプを指す文なのか分からず、解説を書き間違える。
#
# 全部で2000枚以上あるが、すき間のあるカードだけなら数百枚で済む。
# 1件1.5秒あけるので10〜15分ほど。
#
# このリポジトリのページ以外には何も触らない。
#
# 使い方: .github/refresh-cards.trigger を書き換えて push する
# (workflow_dispatch はこの環境から叩けないので、pushで起こす)

on:
  push:
    branches: [main]
    paths:
      - ".github/refresh-cards.trigger"

permissions:
  contents: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Refresh cards with missing marks
        run: python -m src.pokeca.cli fetch-cards --gaps --limit 0

      - name: Commit and push
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/pokeca/cards.json
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore: カードの効果文からマークが落ちていたので取り直す [skip ci]"
            git push
          fi
