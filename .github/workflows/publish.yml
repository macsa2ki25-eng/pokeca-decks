name: Publish page

# 子ども向けページを GitHub Pages に反映する。
#
# 収集 (collect.yml) の最後にも反映しているが、そちらは1日1回しか動かない。
# コードを直したのにページが変わらない、という状態を無くすため、
# ページに関わるものを push したときにも反映する。
#
# ⚠️ このワークフローが触るのは **このリポジトリの Pages だけ**。
#    https://macsa2ki25-eng.github.io/pokeca-decks/
#    英単語学習サイト (SpecialAigent リポジトリ) とは別物で、影響しない。
#
# 収集が自動でコミットするときは [skip ci] が付いているので、
# ここは動かない。二重に反映されることはない。

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "src/pokeca/**"
      - "data/pokeca/**"
      - ".github/workflows/publish.yml"

permissions:
  contents: read
  pages: write
  id-token: write

# Pages への反映は1つずつ。
#
# 以前は group を "pages" にして cancel-in-progress: false にしていたが、
# その組にした実行が 8/27 から一度も始まらないまま pending で止まり、
# 新しい push が来るたびに前のものを cancelled にして順番待ちに入る、
# という状態が2週間続いた (ジョブが1つも作られないまま)。
# 結果、コードを直してもページに出るのは翌日の収集のときだけになっていた。
#
# 名前を変えて組を作り直す。
# あとから来た push を優先する (最新のページさえ出れば、途中は要らない)。
concurrency:
  group: publish-page
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      # 出来上がりのHTMLをそのまま使わず、その場で作り直す。
      # コミットし忘れたHTMLが公開され続けるのを防ぐため。
      - name: Build kids page
        run: python -m src.pokeca.cli build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
